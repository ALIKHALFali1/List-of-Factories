        function listToolbar(scope, { companyFilter = false, addAction = null, extra = '' } = {}) {
            const companyOpts = companyFilter
                ? `<select id="${scope}Company" onchange="renderListsFor('${scope}')" aria-label="فلترة حسب الشركة" class="text-sm border border-slate-200 rounded-lg px-3 py-2.5 sm:py-2 bg-white">
                       <option value="">كل الشركات</option>
                       ${appData.companies.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
                   </select>` : '';
            return `
                <div class="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:justify-between">
                        <div class="grid grid-cols-2 sm:flex gap-2">
                            <select id="${scope}Status" onchange="renderListsFor('${scope}')" aria-label="الحالة" class="text-sm border border-slate-200 rounded-lg px-3 py-2.5 sm:py-2 bg-white">
                            <option value="ALL">كل الحالات</option>
                            <option value="ACTIVE">النشطة</option>
                            <option value="EXPIRING">تنتهي قريباً</option>
                            <option value="EXPIRED">المنتهية</option>
                        </select>
                            <select id="${scope}Sort" onchange="renderListsFor('${scope}')" aria-label="ترتيب" class="text-sm border border-slate-200 rounded-lg px-3 py-2.5 sm:py-2 bg-white">
                            <option value="default">ترتيب: الأحدث إضافةً</option>
                            <option value="startDesc">الأحدث بداية</option>
                            <option value="startAsc">الأقدم بداية</option>
                            <option value="endAsc">الأقرب انتهاءً</option>
                            <option value="discountDesc">أعلى صافي خصم</option>
                            <option value="nameAsc">الاسم (أ - ي)</option>
                        </select>
                        </div>
                        <div class="flex gap-2 justify-end">
                            ${can('lists.export') ? `<button type="button" onclick="exportScope('${scope}')" class="text-sm bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-file-excel"></i> تصدير</button>` : ''}
                            ${extra}
                            ${addAction ? `<button type="button" onclick="${addAction}" class="${BTN_PRIMARY} whitespace-nowrap"><i class="fa-solid fa-plus"></i> إضافة لستة</button>` : ''}
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <div class="relative flex-1 min-w-0">
                            <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            <input type="search" id="${scope}Search" oninput="renderListsFor('${scope}')" placeholder="بحث باسم اللستة أو رقمها..." class="${INPUT_CLS} pr-9">
                        </div>
                        ${companyOpts}
                    </div>
                </div>`;
        }

        function listContainers(scope, showCompany) {
            return `
                <div id="${scope}Wrap">
                    <div class="hidden lg:block bg-white rounded-2xl shadow-lg shadow-slate-300/60 border-2 border-slate-300 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right border-collapse">
                                <thead id="${scope}Thead" class="bg-slate-50 text-slate-600 text-xs font-bold border-b border-slate-200"></thead>
                                <tbody id="${scope}Tbody" class="divide-y-2 divide-slate-200 text-sm"></tbody>
                            </table>
                        </div>
                    </div>
                    <div id="${scope}Cards" class="lg:hidden space-y-3"></div>
                </div>
                <div id="${scope}Empty" class="hidden text-center py-10 px-4 bg-white rounded-2xl border border-dashed border-slate-300">
                    <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
                    <p class="text-slate-500 text-sm">لا توجد لستات مطابقة</p>
                </div>`;
        }

        function viewLists() {
            return {
                title: 'كل اللستات',
                actions: '',
                html: listToolbar('ls', {
                    companyFilter: true,
                    addAction: can('lists.manage') ? 'openListModal({})' : null,
                    extra: can('lists.import') ? `<button type="button" onclick="el('excelFileInput').click()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-file-import"></i> استيراد</button>` : ''
                }) + listContainers('ls', true),
                after: () => renderListsFor('ls')
            };
        }

        function filteredItems(scope) {
            const isAll = scope === 'ls';
            const pool = isAll ? appData.companies : [findCompany(currentCompanyId())].filter(Boolean);
            let items = [];
            pool.forEach(c => c.lists.forEach(l => items.push({ c, l })));

            const companySel = isAll ? el('lsCompany')?.value : '';
            if (companySel) items = items.filter(x => x.c.id === companySel);

            const q = (el(scope + 'Search')?.value || '').trim().toLowerCase();
            if (q) {
                items = items.filter(({ c, l }) => l.name.toLowerCase().includes(q)
                    || l.id.toLowerCase().includes(q)
                    || (isAll && c.name.toLowerCase().includes(q)));
            }

            const status = el(scope + 'Status')?.value || 'ALL';
            items = items.filter(({ l }) => {
                const s = listState(l);
                return status === 'ALL'
                    || (status === 'ACTIVE' && s.active)
                    || (status === 'EXPIRING' && s.expiring)
                    || (status === 'EXPIRED' && !s.active);
            });

            const sorter = SORTERS[el(scope + 'Sort')?.value || 'default'];
            if (sorter) items.sort((a, b) => sorter(a.l, b.l));
            return items;
        }

        const SORTERS = {
            default: null,
            startDesc: (a, b) => String(b.startDate).localeCompare(String(a.startDate)),
            startAsc: (a, b) => String(a.startDate).localeCompare(String(b.startDate)),
            endAsc: (a, b) => (a.endDate ? 0 : 1) - (b.endDate ? 0 : 1) || String(a.endDate || '').localeCompare(String(b.endDate || '')),
            discountDesc: (a, b) => effValue(b) - effValue(a),
            nameAsc: (a, b) => a.name.localeCompare(b.name, 'ar')
        };

        function listActionsHtml(listId) {
            const id = esc(listId);
            return `<div class="flex items-center justify-center gap-1 shrink-0">
                ${can('lists.manage') ? `<button type="button" onclick="openListModal({ listId: '${id}' })" title="تعديل" aria-label="تعديل" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-pen-to-square"></i></button>` : ''}
                <button type="button" data-menu-btn onclick="openRowMenu(this, '${id}')" title="المزيد" aria-label="المزيد" class="${BTN_ICON} text-slate-500 hover:text-slate-800 hover:bg-slate-100"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>`;
        }

        function pdfButtonHtml(l, block) {
            if (!l.pdfFile && !l.hasPdf) return `<span class="text-xs text-slate-300">لا يوجد</span>`;
            const label = esc(l.pdfFile || 'ملف مرفق');
            return `<button type="button" onclick="openPdfFile('${esc(l.id)}')" title="${label}"
                        class="text-xs bg-slate-100 hover:bg-brand-50 text-slate-700 hover:text-brand-600 border border-slate-200 px-2.5 py-2 rounded-lg inline-flex items-center gap-1.5 transition-colors min-w-0 max-w-full ${block ? 'w-full' : ''}">
                        <i class="fa-solid fa-file-pdf text-rose-500 shrink-0"></i>
                        <span class="truncate-name ${block ? 'flex-1 text-start' : 'max-w-[130px]'}">${label}</span>
                    </button>`;
        }

        function statusBadgeHtml(state) {
            if (!state.active) return `<span class="inline-flex items-center text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 font-medium whitespace-nowrap">منتهية</span>`;
            if (state.expiring) return `<span class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-semibold whitespace-nowrap"><i class="fa-solid fa-hourglass-half text-[10px]"></i> ${statusLabel(state)}</span>`;
            return `<span class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> نشطة</span>`;
        }

        function renderListsFor(scope) {
            const items = filteredItems(scope);
            const showCompany = scope === 'ls';

            el(scope + 'Thead').innerHTML = `<tr>
                <th class="py-3.5 px-4">م</th>
                ${showCompany ? '<th class="py-3.5 px-4">الشركة</th>' : ''}
                <th class="py-3.5 px-4">اسم اللستة</th>
                <th class="py-3.5 px-4 text-center">خصم 1</th>
                <th class="py-3.5 px-4 text-center">خصم 2</th>
                <th class="py-3.5 px-4 text-center">خصم 3</th>
                <th class="py-3.5 px-4 text-center">خصم قطعي</th>
                <th class="py-3.5 px-4 text-center bg-slate-100/70">الصافي الفعلي</th>
                <th class="py-3.5 px-4 whitespace-nowrap">البداية</th>
                <th class="py-3.5 px-4 whitespace-nowrap">النهاية</th>
                <th class="py-3.5 px-4 text-center">الحالة</th>
                <th class="py-3.5 px-4 text-center">المرفق</th>
                <th class="py-3.5 px-4 text-center">إجراءات</th></tr>`;

            el(scope + 'Tbody').innerHTML = items.map(({ c, l }, i) => {
                const st = listState(l);
                return `<tr class="hover:bg-slate-50 transition-colors">
                    <td class="py-3.5 px-4 text-xs text-slate-400 font-mono">${i + 1}</td>
                    ${showCompany ? `<td class="py-3.5 px-4"><button type="button" onclick="navigate('companies/${esc(c.id)}')" class="flex items-center gap-2 text-start">${companyLogoHtml(c, 'w-7 h-7 text-[10px]')}<span class="font-semibold hover:text-brand-600 whitespace-nowrap">${esc(c.name)}</span></button></td>` : ''}
                    <td class="py-3.5 px-4 font-bold text-slate-800">${esc(l.name)}</td>
                    <td class="py-3.5 px-4 text-center font-bold">${pct(l.discount1)}</td>
                    <td class="py-3.5 px-4 text-center font-bold">${pct(l.discount2)}</td>
                    <td class="py-3.5 px-4 text-center font-bold">${pct(l.discount3)}</td>
                    <td class="py-3.5 px-4 text-center font-bold">${pct(l.flatDiscount)}</td>
                    <td class="py-3.5 px-4 text-center font-bold text-emerald-600 bg-emerald-50/50 whitespace-nowrap">${calculateEffectiveDiscount(l.discount1, l.discount2, l.discount3, l.flatDiscount)}%</td>
                    <td class="py-3.5 px-4 text-xs font-mono font-bold text-slate-700 whitespace-nowrap">${esc(l.startDate)}</td>
                    <td class="py-3.5 px-4 text-xs font-mono font-bold text-slate-700 whitespace-nowrap">${listEndText(l)}</td>
                    <td class="py-3.5 px-4 text-center">${statusBadgeHtml(st)}</td>
                    <td class="py-3.5 px-4 text-center">${pdfButtonHtml(l, false)}</td>
                    <td class="py-3.5 px-4 text-center">${listActionsHtml(l.id)}</td>
                </tr>`;
            }).join('');

            el(scope + 'Cards').innerHTML = items.map(({ c, l }, i) => {
                const st = listState(l);
                const net = calculateEffectiveDiscount(l.discount1, l.discount2, l.discount3, l.flatDiscount);
                return `<article class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg shadow-slate-300/60 p-4 space-y-4">
                    <div class="flex items-start justify-between gap-3">
                        <div class="min-w-0 flex items-center gap-3">
                            ${showCompany ? companyLogoHtml(c, 'w-10 h-10 text-xs') : ''}
                            <div class="min-w-0">
                                ${showCompany ? `<p class="text-xs text-brand-600 font-bold truncate">${esc(c.name)}</p>` : ''}
                                <h4 class="font-extrabold text-slate-800 break-words">${esc(l.name)}</h4>
                                <p class="text-xs text-slate-400 font-bold font-mono">#${i + 1}</p>
                            </div>
                        </div>
                        <div class="shrink-0">${statusBadgeHtml(st)}</div>
                    </div>
                    <div class="grid grid-cols-4 gap-2 text-center">
                        ${[l.discount1, l.discount2, l.discount3, l.flatDiscount].map((d, k) => `<div class="bg-slate-50 rounded-lg py-2 border border-slate-100"><p class="text-xs font-bold text-slate-500">${k === 3 ? 'خصم قطعي' : 'خصم ' + (k + 1)}</p><p class="font-extrabold text-slate-800">${pct(d)}</p></div>`).join('')}
                    </div>
                    <div class="flex items-center justify-between gap-2 bg-emerald-50 rounded-lg px-3 py-2.5">
                        <span class="text-sm font-bold text-slate-700">صافي الخصم الفعلي</span>
                        <span class="text-lg font-extrabold text-emerald-600">${net}%</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div class="bg-slate-50 rounded-lg px-3 py-2"><span class="block text-xs font-bold text-slate-500">البداية</span><span class="font-bold font-mono text-slate-800">${esc(l.startDate)}</span></div>
                        <div class="bg-slate-50 rounded-lg px-3 py-2"><span class="block text-xs font-bold text-slate-500">النهاية</span><span class="font-bold font-mono text-slate-800">${listEndText(l)}</span></div>
                    </div>
                    <div class="flex items-center gap-2 pt-3 border-t border-slate-100">
                        <div class="flex-1 min-w-0">${pdfButtonHtml(l, true)}</div>
                        ${listActionsHtml(l.id)}
                    </div>
                </article>`;
            }).join('');

            el(scope + 'Empty').classList.toggle('hidden', items.length > 0);
            el(scope + 'Wrap').classList.toggle('hidden', items.length === 0);
        }

        // ---------- Users & roles ----------
        function viewUsers() {
            const tabs = `
                <div class="inline-flex bg-white p-1 rounded-xl border border-slate-200">
                    <button type="button" onclick="setUsersTab('users')" class="px-4 py-2 rounded-lg text-sm font-semibold ${usersTab === 'users' ? 'bg-brand-600 text-white' : 'text-slate-600 hover:bg-slate-100'}">
                        <i class="fa-solid fa-users me-1"></i> المستخدمون (${appData.users.length})
                    </button>
                    <button type="button" onclick="setUsersTab('roles')" class="px-4 py-2 rounded-lg text-sm font-semibold ${usersTab === 'roles' ? 'bg-brand-600 text-white' : 'text-slate-600 hover:bg-slate-100'}">
                        <i class="fa-solid fa-shield-halved me-1"></i> الأدوار والصلاحيات (${Object.keys(appData.roles).length})
                    </button>
                </div>`;

            const body = usersTab === 'users' ? usersTableHtml() : rolesHtml();
            const action = usersTab === 'users'
                ? (can('users.manage') ? btn('openUserModal()', 'إضافة مستخدم', 'fa-user-plus') : '')
                : (can('users.manage') ? btn('openRoleModal()', 'إضافة دور', 'fa-plus') : '');

            return {
                title: 'المستخدمون والصلاحيات',
                actions: '',
                html: `<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">${tabs}${action}</div>${body}`
            };
        }

        function setUsersTab(tab) {
            usersTab = tab;
            render();
        }

        function usersTableHtml() {
            const me = currentUser();
            const rows = appData.users.map(u => `
                <tr class="hover:bg-slate-50">
                    <td class="py-3 px-4"><div class="flex items-center gap-3">${avatarHtml(u.name, 'w-9 h-9')}<div class="min-w-0"><p class="font-bold truncate">${esc(u.name)}${u.id === me?.id ? ' <span class="text-[10px] bg-brand-100 text-brand-700 px-1.5 py-0.5 rounded-full">أنت</span>' : ''}</p></div></div></td>
                    <td class="py-3 px-4 font-mono text-xs" dir="ltr">${esc(u.email)}</td>
                    <td class="py-3 px-4"><span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-semibold">${esc(roleName(u.roleId))}</span></td>
                    <td class="py-3 px-4">${u.active ? '<span class="text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold">فعّال</span>' : '<span class="text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 font-semibold">موقوف</span>'}</td>
                    <td class="py-3 px-4 text-xs text-slate-500 whitespace-nowrap">${u.lastLoginAt ? fmtDateTime(u.lastLoginAt) : 'لم يسجل دخول'}</td>
                    <td class="py-3 px-4"><div class="flex justify-center gap-1">
                        <button type="button" onclick="openUserModal('${esc(u.id)}')" title="تعديل" aria-label="تعديل" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-pen-to-square"></i></button>
                        ${u.id !== me?.id ? `<button type="button" onclick="toggleUser('${esc(u.id)}')" title="${u.active ? 'إيقاف' : 'تفعيل'}" aria-label="${u.active ? 'إيقاف' : 'تفعيل'}" class="${BTN_ICON} text-slate-500 hover:text-amber-600 hover:bg-amber-50"><i class="fa-solid ${u.active ? 'fa-user-lock' : 'fa-user-check'}"></i></button>
                        <button type="button" onclick="deleteUser('${esc(u.id)}')" title="حذف" aria-label="حذف" class="${BTN_ICON} text-slate-500 hover:text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </div></td>
                </tr>`).join('');
            return `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto"><table class="w-full text-right text-sm">
                    <thead class="bg-slate-50 text-slate-600 text-xs font-bold border-b border-slate-200">
                        <tr><th class="py-3 px-4">المستخدم</th><th class="py-3 px-4">اسم الدخول</th><th class="py-3 px-4">الدور</th><th class="py-3 px-4">الحالة</th><th class="py-3 px-4">آخر دخول</th><th class="py-3 px-4 text-center">إجراءات</th></tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">${rows || '<tr><td colspan="6" class="py-8 text-center text-slate-400">لا يوجد مستخدمون</td></tr>'}</tbody>
                </table></div></div>`;
        }

        function rolesHtml() {
            const cards = Object.values(appData.roles).map(r => {
                const users = appData.users.filter(u => u.roleId === r.id).length;
                return `<article class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col gap-3">
                    <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0">
                            <h3 class="font-bold text-lg truncate">${esc(r.name)}</h3>
                            <p class="text-xs text-slate-500">${users} مستخدم · ${r.permissions.length} صلاحية</p>
                        </div>
                        ${r.locked ? '<span class="text-[11px] px-2 py-1 rounded-full bg-violet-100 text-violet-700 font-semibold shrink-0"><i class="fa-solid fa-lock"></i> أساسي</span>' : ''}
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        ${r.permissions.slice(0, 6).map(p => `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${esc(PERM_LABELS[p] || p)}</span>`).join('')}
                        ${r.permissions.length > 6 ? `<span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100 text-slate-500">+${r.permissions.length - 6}</span>` : ''}
                    </div>
                    ${can('users.manage') ? `<div class="mt-auto pt-3 border-t border-slate-100 flex gap-2">
                        ${btnSmall(`openRoleModal('${esc(r.id)}')`, r.locked ? 'عرض الصلاحيات' : 'تعديل الصلاحيات', 'fa-shield-halved', BTN_SECONDARY)}
                        ${!r.locked ? btnSmall(`deleteRole('${esc(r.id)}')`, 'حذف', 'fa-trash-can', 'px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-sm font-medium flex items-center gap-2') : ''}
                    </div>` : ''}
                </article>`;
            }).join('');
            return `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4">${cards}</div>`;
        }

        function btnSmall(onclick, label, icon, cls) {
            return `<button type="button" onclick="${onclick}" class="${cls} text-sm"><i class="fa-solid ${icon}"></i> ${label}</button>`;
        }

        function permCheckboxes(selected, disabled) {
            return PERMISSION_GROUPS.map(g => `
                <fieldset class="border border-slate-200 rounded-xl p-3">
                    <legend class="px-1 text-xs font-bold text-slate-700">${g.title}</legend>
                    <div class="grid sm:grid-cols-2 gap-2 mt-1">
                        ${g.items.map(([k, label]) => `
                            <label class="flex items-center gap-2 text-sm cursor-pointer">
                                <input type="checkbox" name="perm" value="${k}" ${selected.includes(k) ? 'checked' : ''} ${disabled ? 'disabled' : ''} class="w-4 h-4 accent-brand-600">
                                ${label}
                            </label>`).join('')}
                    </div>
                </fieldset>`).join('');
        }

        function openRoleModal(roleId = null) {
            if (!can('users.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const role = roleId ? appData.roles[roleId] : null;
            if (roleId && !role) return;
            const locked = !!(role && role.locked);
            openModal({
                title: role ? (locked ? 'صلاحيات مدير النظام' : 'تعديل الدور') : 'إضافة دور جديد',
                size: 'lg',
                submitText: 'حفظ الدور',
                onSubmit: locked ? null : (fd) => {
                    const name = String(fd.get('name') || '').trim();
                    if (!name) return toast('اكتب اسم الدور', 'error'), false;
                    const perms = fd.getAll('perm').filter(p => ALL_PERMS.includes(p));
                    const roles = JSON.parse(JSON.stringify(appData.roles));
                    if (role) roles[role.id].permissions = perms;
                    const nextRoles = { ...roles };
                    if (role) {
                        nextRoles[role.id] = { ...nextRoles[role.id], name, permissions: perms };
                        if (countUsersWithPerm(appData.users, nextRoles, 'users.manage') === 0) {
                            return toast('لازم يفضل مستخدم واحد على الأقل يقدر يدير المستخدمين', 'error'), false;
                        }
                        appData.roles[role.id].name = name;
                        appData.roles[role.id].permissions = perms;
                        log('تعديل دور', name);
                    } else {
                        const id = uid('role-');

            if (!can('users.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const idx = appData.users.findIndex(u => u.id === userId);
            if (idx < 0 || userId === currentUser()?.id) return;
            const u = appData.users[idx];
            const hypothetical = appData.users.filter(x => x.id !== userId);

        function restoreBackup(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file || !can('backup.manage')) return;

            const reader = new FileReader();
            reader.onload = () => {
                let companies;
                let settings;
                let partners = null;
                let checks = null;
                let orders = null;
                try {
                    const parsed = JSON.parse(reader.result);
                    const src = parsed && parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed;
                    companies = src && (Array.isArray(src.companies) ? src.companies : (Array.isArray(src.factories) ? src.factories : null));
                    if (!companies) throw new Error('invalid');
                    settings = src.settings || {};
                    // checks and partners come back only if the backup has them and this user may manage checks
                    if (can('checks.manage')) {
                        partners = Array.isArray(src.partners) ? src.partners : null;
                        checks = Array.isArray(src.checks) ? src.checks : null;
                    }
                    // orders come back only with orders.create and orders.delete (the database refuses the write otherwise)
                    if (can('orders.create') && can('orders.delete')) orders = Array.isArray(src.orders) ? src.orders : null;
                } catch (err) {
                    return toast('ملف النسخة الاحتياطية غير صالح', 'error');
                }
                const count = companies.reduce((n, c) => n + (Array.isArray(c.lists) ? c.lists.length : 0), 0);
                const checksNote = (partners || checks) ? ' والشيكات والمستفيدين' : '';
                if (!confirm(`سيتم استبدال كل الشركات واللستات${checksNote} والإعدادات بالنسخة المختارة (${companies.length} شركة، ${count} لستة).\nالمستخدمين والصلاحيات وسجل النشاط لا يتغيروا.\nهل تريد المتابعة؟`)) return;

                finalizePendingUndo();
                const restored = normalizeData({ settings, companies, partners: partners || [], checks: checks || [], orders: orders || [], roles: {}, users: [], logs: [] });
                appData.companies = restored.companies;
                if (partners) appData.partners = restored.partners;
                if (checks) appData.checks = restored.checks;
                if (orders) appData.orders = restored.orders;
                appData.settings = restored.settings;
                saveState();
                log('استعادة نسخة احتياطية', `${companies.length} شركة، ${count} لستة`);
                toast('تمت استعادة البيانات بنجاح', 'success');
                render();
            };
            reader.readAsText(file);
        }

        async function onPdfPicked(event) {
            const file = event.target.files && event.target.files[0];
            event.target.value = '';
            if (!file) return;
            if (!(file.type === 'application/pdf' || /\.pdf$/i.test(file.name))) return toast('من فضلك اختر ملف PDF فقط', 'error');
            if (file.size > PDF_COMPRESS_MAX_BYTES) return toast('الملف أكبر من 100 ميجا. ارفعه على Google Drive وحط الرابط', 'error', null, 8000);
            // a real PDF always starts with "%PDF-"
            try {
                const head = new Uint8Array(await file.slice(0, 5).arrayBuffer());
                if (String.fromCharCode(...head) !== '%PDF-') return toast('الملف ده مش PDF سليم. جرّب تصدّره تاني من البرنامج', 'error', null, 6000);
            } catch (e) {
                return toast('تعذر قراءة الملف. جرّب تاني', 'error');
            }
            if (file.size > PDF_MAX_BYTES) {
                // too big to upload as-is: keep it aside until the user compresses it
                pendingBigPdf = file;
                pendingPdfFile = null;
                pendingRemovePdf = false;
                toast('الملف أكبر من 8 ميجا. اضغطه بزر "ضغط الملف" وبعدين احفظ', 'info', null, 6000);
                refreshPdfPreview();
                return;
            }
            pendingBigPdf = null;
            pendingPdfFile = file;
            pendingRemovePdf = false;
            refreshPdfPreview();
        }

        async function compressPendingPdf() {
            const file = pendingBigPdf;
            if (!file) return;
            const btn = el('pdfCompressBtn');
            const nameEl = el('pdfSelectedName');
            if (btn) { btn.disabled = true; btn.classList.add('opacity-60', 'cursor-wait'); }
            try {
                const result = await compressPdfFile(file, (msg) => { if (nameEl) nameEl.textContent = msg; });
                const before = (file.size / 1048576).toFixed(1);
                const after = (result.bytes.length / 1048576).toFixed(1);
                if (result.bytes.length > PDF_MAX_BYTES) {
                    toast(`بعد الضغط الملف لسه ${after} ميجا والحد 8 ميجا. ارفعه على Google Drive وحط الرابط`, 'error', null, 9000);
                    return;
                }
                pendingPdfFile = new File([result.bytes], file.name.replace(/\.pdf$/i, '') + ' (مضغوط).pdf', { type: 'application/pdf' });
                pendingBigPdf = null;
                toast(`تم الضغط من ${before} إلى ${after} ميجا. اضغط حفظ عشان يترفع`, 'success', null, 6000);
            } catch (err) {
                console.error(err);
                const reason = String((err && err.message) || err);
                if (/Content.Security|CSP/i.test(reason)) {
                    toast('أداة الضغط متقفلة في الصفحة دي بسبب إعدادات أمان الموقع (CSP). افتح الملف مباشرة من الجهاز في متصفح عادي، أو ارفعه على Google Drive', 'error', null, 12000);
                } else {
                    toast(`تعذر ضغط الملف (${reason.slice(0, 160)}). اتأكد من الإنترنت وجرّب تاني، أو ارفعه على Google Drive`, 'error', null, 10000);
                }
            } finally {
                if (btn) { btn.disabled = false; btn.classList.remove('opacity-60', 'cursor-wait'); }
                refreshPdfPreview();
            }
        }

        async function saveListFromForm(fd) {
            if (!can('lists.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return false; }
            const target = findCompany(String(fd.get('companyId') || ''));
            if (!target) return toast('اختر شركة صحيحة', 'error'), false;

            const name = String(fd.get('name') || '').trim();
            const discounts = [1, 2, 3, 4].map(n => parseFloat(fd.get('d' + n)) || 0);
            const startDate = String(fd.get('start') || '');
            const endDate = String(fd.get('end') || '');
            const urlValue = String(fd.get('pdfUrl') || '').trim();

            if (pendingBigPdf) return toast('الملف لسه أكبر من 8 ميجا. اضغطه الأول أو امسحه', 'error', null, 6000), false;
            if (!name) return toast('اكتب اسم اللستة', 'error'), false;
            if (discounts.some(d => d < 0 || d > 100)) return toast('نسب الخصم لازم تكون بين 0 و 100', 'error'), false;
            if (!startDate) return toast('حدد تاريخ البداية', 'error'), false;
            if (endDate && endDate < startDate) return toast('تاريخ النهاية لازم يكون بعد تاريخ البداية أو نفس اليوم', 'error'), false;

            const found = editingListId ? findList(editingListId) : null;
            const listId = found ? found.l.id : uid('LST-');

            let pdfState;
            try {
                if (pendingPdfFile) {
                    toast('جارٍ رفع ملف PDF...', 'info', null, 2500);
                    await pdfUpload(listId, pendingPdfFile);
                    pdfState = { hasPdf: true, pdfFile: pendingPdfFile.name };
                } else if (pendingRemovePdf) {
                    await pdfRemove(listId);
                    pdfState = { hasPdf: false, pdfFile: urlValue };
                } else if (found && found.l.hasPdf) {
                    pdfState = { hasPdf: true, pdfFile: found.l.pdfFile };
                } else {
                    pdfState = { hasPdf: false, pdfFile: urlValue };
                }
            } catch (err) {
                console.error(err);
                const msg = err && err.message === 'pdf empty'
                    ? 'الملف فاضي. اختر ملف تاني'
                    : 'تعذر رفع ملف PDF. اتأكد من الإنترنت وحاول تاني، ولو المشكلة مستمرة جرّب تاني مرة بعد دقيقة';
                toast(msg, 'error', null, 7000);
                return false;
            }

            const data = { id: listId, name, discount1: discounts[0], discount2: discounts[1], discount3: discounts[2], flatDiscount: discounts[3], startDate, endDate, ...pdfState };

            if (found) {
                if (found.c.id !== target.id) {
                    found.c.lists = found.c.lists.filter(x => x.id !== listId);
                    target.lists.unshift(data);
                } else {
                    Object.assign(found.l, data);
                }
                log('تعديل لستة', `${name} - ${target.name}`);
                toast('تم تحديث اللستة', 'success');
            } else {
                target.lists.unshift(data);
                log('إضافة لستة', `${name} - ${target.name}`);
                toast('تمت إضافة اللستة', 'success');
            }

            pendingPdfFile = null;
            pendingBigPdf = null;
            pendingRemovePdf = false;
            saveState();
            editingListId = null;
            navigate(currentRouteName());
            return true;
        }

            if (!source.endDate) return { start: todayISO(), end: '' };
            const duration = daysBetween(source.startDate, source.endDate);
            const start = addDays(source.endDate, 1) || todayISO();
            const end = duration !== null && duration >= 0 ? addDays(start, duration) : addDays(start, 365);
            return { start, end: end || '' };
        }

        function calcUpdate() {
            const found = calcListId ? findList(calcListId) : null;
            if (!found || !el('calcRows')) return;
            const price = parseFloat(el('calcPriceInput').value) || 0;
            let current = price;
            const rows = [];
            [found.l.discount1, found.l.discount2, found.l.discount3, found.l.flatDiscount].forEach((d, i) => {
                const v = parseFloat(d) || 0;
                if (!v) return;
                current = current * (1 - v / 100);
                rows.push(`<div class="flex justify-between items-center gap-2 text-sm">
                    <span class="text-slate-500">${i === 3 ? 'بعد الخصم القطعي' : 'بعد خصم ' + (i + 1)} (${v}%)</span>
                    <span class="font-semibold text-slate-700 whitespace-nowrap">${fmtMoney(current)}</span></div>`);
            });
            const saving = price - current;
            const savingPct = price ? (saving / price) * 100 : 0;
            el('calcRows').innerHTML = rows.length ? rows.join('') : '<p class="text-sm text-slate-400 text-center">لا توجد خصومات في هذه اللستة</p>';
            el('calcFinal').textContent = fmtMoney(current);
            el('calcSaving').textContent = `${fmtMoney(saving)} (${savingPct.toFixed(2)}%)`;
        }

        // ============ COPY SUMMARY / PDF ============
        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                toast('تم نسخ الملخص، تقدر تلصقه في واتساب', 'success');
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                ta.remove();
                toast(ok ? 'تم نسخ الملخص، تقدر تلصقه في واتساب' : 'تعذر النسخ تلقائياً من هذا المتصفح', ok ? 'success' : 'error');
            }
        }

        function copyListSummary(listId) {
            const found = findList(listId);
            if (!found) return;
            const { c, l } = found;
            const st = listState(l);
            const discounts = [l.discount1, l.discount2, l.discount3, l.flatDiscount].map(d => parseFloat(d) || 0).filter(d => d > 0).map(d => `${d}%`);
            const lines = [
                `*${c.name}*${c.agent ? ` - ${c.agent}` : ''}`,
                `اللستة: ${l.name}`,
                `الخصومات: ${discounts.length ? discounts.join(' + ') : 'بدون خصم'}`,
                `صافي الخصم الفعلي: ${calculateEffectiveDiscount(l.discount1, l.discount2, l.discount3, l.flatDiscount)}%`,
                l.endDate ? `الفترة: من ${l.startDate} إلى ${l.endDate}` : `الفترة: من ${l.startDate} (بدون تاريخ انتهاء)`,
                `الحالة: ${statusLabel(st)}`
            ];
            if (l.pdfFile) lines.push(`${l.hasPdf ? 'الملف' : 'الرابط'}: ${l.pdfFile}`);
            copyText(lines.join('\n'));
        }


        // ============ EXCEL EXPORT / IMPORT ============
        function exportItems(items, filename) {
            if (!can('lists.export')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            if (typeof XLSX === 'undefined') return toast('مكتبة الإكسيل غير متاحة. تأكد من الإنترنت', 'error', null, 5000);
            if (!items.length) return toast('لا توجد لستات لتصديرها', 'error');
            const rows = items.map(({ c, l }) => ({
                'المصنع': c.name,
                'الوكيل': c.agent,
                'اسم اللستة': l.name,
                'خصم 1': parseFloat(l.discount1) || 0,
                'خصم 2': parseFloat(l.discount2) || 0,
                'خصم 3': parseFloat(l.discount3) || 0,
                'خصم قطعي': parseFloat(l.flatDiscount) || 0,
                'تاريخ البداية': l.startDate,
                'تاريخ النهاية': l.endDate,
                'الحالة': statusLabel(listState(l)),
                'صافي الخصم الفعلي %': parseFloat(calculateEffectiveDiscount(l.discount1, l.discount2, l.discount3, l.flatDiscount)),
                'الملف': l.pdfFile || ''
            }));
            const ws = XLSX.utils.json_to_sheet(rows);
            ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(14, k.length + 4) }));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'اللستات');
            wb.Workbook = { Views: [{ RTL: true }] };
            XLSX.writeFile(wb, filename);
            log('تصدير إكسيل', `${rows.length} لستة`);
            toast(`تم تصدير ${rows.length} لستة`, 'success');
        }

        function exportScope(scope) {
            const items = filteredItems(scope);
            const name = scope === 'ls' ? 'كل-اللستات' : `لستات-${findCompany(currentCompanyId())?.name || ''}`;
            exportItems(items, `${name}-${todayISO()}.xlsx`);
        }

        function exportAll() {
            const items = [];
            appData.companies.forEach(c => c.lists.forEach(l => items.push({ c, l })));
            exportItems(items, `كل-اللستات-${todayISO()}.xlsx`);
        }

        function pickValue(row, keys) {
            for (const k of keys) {
                if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') return row[k];
            }
            return '';
        }

        function parsePercent(v) {
            if (v === '' || v === null || v === undefined) return 0;
            if (typeof v === 'number') return (v > 0 && v < 1) ? +(v * 100).toFixed(4) : v;
            const n = parseFloat(String(v).replace('%', '').replace(',', '.'));
            return isNaN(n) ? 0 : n;
        }

        function normalizeDate(v, fallback) {
            if (Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v)) return toISODate(v);
            if (typeof v === 'number' && window.XLSX && XLSX.SSF) {
                const d = XLSX.SSF.parse_date_code(v);
                if (d) return `${d.y}-${pad2(d.m)}-${pad2(d.d)}`;
            }
            if (typeof v === 'string') {
                const s = v.trim();
                let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
                if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
                m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
                if (m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
            }
            return fallback;
        }

        function handleExcelImport(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            if (!can('lists.import')) return toast('ليس لديك صلاحية الاستيراد', 'error');
            if (typeof XLSX === 'undefined') return toast('تعذر تحميل مكتبة الإكسيل. تأكد من الإنترنت', 'error', null, 5000);

            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
                    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
                    if (rows.length) processImportedExcel(rows);
                    else toast('الملف لا يحتوي على بيانات قابلة للقراءة', 'error');
                } catch (err) {
                    console.error(err);
                    toast('حدث خطأ أثناء قراءة ملف الإكسيل: ' + err.message, 'error', null, 5000);
                }
            };
            reader.onerror = () => toast('تعذر قراءة الملف', 'error');
            reader.readAsArrayBuffer(file);
        }

        function processImportedExcel(rows) {
            const today = todayISO();
            const oneYearLater = addDays(today, 365);
            let imported = 0, skipped = 0, newCompanies = 0;

            rows.forEach(rawRow => {
                const row = {};
                Object.keys(rawRow).forEach(k => { row[String(k).trim()] = rawRow[k]; });

                const companyName = String(pickValue(row, ['المصنع', 'اسم المصنع', 'Factory', 'مصنع', 'الشركة'])).trim();
                if (!companyName) { skipped++; return; }

                const agentName = String(pickValue(row, ['الوكيل', 'التاجر', 'الوكالة', 'Agent'])).trim();
                const listName = String(pickValue(row, ['اسم اللستة', 'اللستة', 'List Name'])).trim() || 'لستة مستوردة';
                const d1 = parsePercent(pickValue(row, ['خصم 1', 'نسبة الخصم 1', 'Discount 1']));
                const d2 = parsePercent(pickValue(row, ['خصم 2', 'نسبة الخصم 2', 'Discount 2']));
                const d3 = parsePercent(pickValue(row, ['خصم 3', 'نسبة الخصم 3', 'Discount 3']));
                const d4 = parsePercent(pickValue(row, ['خصم قطعي', 'نسبة الخصم القطعي', 'خصم قطعي %', 'Flat Discount']));
                const startDate = normalizeDate(pickValue(row, ['تاريخ البداية', 'البداية', 'Start Date']), today);
                const endDate = normalizeDate(pickValue(row, ['تاريخ النهاية', 'النهاية', 'End Date']), '');

                let company = appData.companies.find(c => c.name.trim() === companyName);
                if (!company) {
                    company = { id: uid('FAC-'), name: companyName, agent: agentName || 'وكيل عام', notes: 'تم الاستيراد من ملف إكسيل', logo: '', lists: [] };
                    appData.companies.push(company);
                    newCompanies++;
                }
                company.lists.push({
                    id: uid('LST-'), name: listName, discount1: d1, discount2: d2, discount3: d3, flatDiscount: d4,
                    startDate, endDate, pdfFile: '', hasPdf: false
                });
                imported++;
            });

            log('استيراد إكسيل', `${imported} لستة`);
            saveState();
            navigate('lists');
            let msg = `تم استيراد ${imported} لستة بنجاح${newCompanies ? ` (وإضافة ${newCompanies} شركة جديدة)` : ''}.`;
            if (skipped) msg += `\nتم تجاهل ${skipped} صف لأن اسم الشركة فارغ.`;
            toast(msg, 'success', null, 5000);
        }

        // ============ BACKUP / RESTORE ============
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }



        // ============ KEYBOARD ============
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeRowMenu();
                closeModal();
                toggleSidebar(false);
                return;
            }
            const a = document.activeElement;
            const typing = a && (['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName) || a.isContentEditable);
            if (e.key === '/' && !typing && sessionUserId && el('modalHost').classList.contains('hidden')) {
                const search = document.querySelector('#content input[type=search]');
                if (search) { e.preventDefault(); search.focus(); }
            }
        });

        window.addEventListener('beforeunload', () => finalizePendingUndo());

        // ============ INIT ============
        document.addEventListener('DOMContentLoaded', async () => {
            appData = normalizeData(defaultData());   // placeholder until the first sync
            window.addEventListener('hashchange', render);

            if (!firebaseReady()) {
                showAuth('login');
                el('authSubmit').disabled = true;
                el('authHint').textContent = typeof firebase === 'undefined'
                    ? 'تعذر تحميل مكتبة Firebase. تأكد من الاتصال بالإنترنت'
                    : 'Firebase لم يُعد بعد: ضع إعدادات المشروع في FIREBASE_CONFIG';
                return;
            }

            try {
                fbApp = firebase.initializeApp(FIREBASE_CONFIG);
                fbAuth = firebase.auth();
                rtdb = firebase.database();
                fbDb = fbDbApi;
                if (FIREBASE_EMULATORS) {
                    fbAuth.useEmulator(FIREBASE_EMULATORS.auth);
                    rtdb.useEmulator(...FIREBASE_EMULATORS.database);
                }
            } catch (err) {
                console.error(err);
                showAuth('login');
                el('authSubmit').disabled = true;
                el('authHint').textContent = 'تعذر تشغيل Firebase في هذا المتصفح: ' + (err && err.message ? err.message : err);
                return;
            }

            // show a spinner while the server is asked (bounded by the timeout below), then login or setup
            setAuthLoading('جاري الاتصال بالسيرفر...');
            fbAuth.onAuthStateChanged(user => { handleFbUser(user); });

            // public information: does the admin exist yet, and the system name/logo for the login screen.
            // A slow or blocked network must not block the screen, so this has a timeout.
            const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
            try {
                const [init, cfg] = await withTimeout(Promise.all([
                    fbDb.collection('system').doc('init').get(),
                    fbDb.collection('settings').doc('main').get()
                ]), 10000);
                initExists = init.exists;
                if (cfg.exists) appData.settings = Object.assign(defaultData().settings, cfg.data());
            } catch (err) {
                console.error(err);
                initExists = null;
                const why = (err && (err.code || err.message)) || 'unknown';
                const msg = 'تعذر الاتصال بقاعدة البيانات (' + why + '). تأكد من الإنترنت، وإن Realtime Database متعملة وقواعدها متنشرة';
                toast(msg, 'error', null, 9000);
                el('authHint').textContent = msg;
            }
            serverChecked = true;
            // now the mode is known: show login or setup unless a session has started
            if (!fbUser && !appEntered) showAuth(initExists === false ? 'setup' : 'login');
        });
    </script>
