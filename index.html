        function savePeriodicSchedule() {
            if (!can('checks.view')) return;
            const prev = loadCheckReport();
            const frequency = document.getElementById('prFreq').value;
            const weekdays = [...document.querySelectorAll('input[name=prWd]:checked')].map(i => Number(i.value));
            const dayOfMonth = Math.round(Number(document.getElementById('prDom').value));
            const everyDays = Math.round(Number(document.getElementById('prEvery').value));
            const windowDays = Math.round(Number(document.getElementById('prWindow').value));
            const startDate = document.getElementById('prStart').value;
            const s = {
                ...prev,
                enabled: document.getElementById('prEnabled').checked,
                frequency, weekdays, dayOfMonth, everyDays, windowDays,
                includeOverdue: document.getElementById('prOverdue').checked
            };
            if (!(windowDays >= 1 && windowDays <= 365)) return toast('اكتب عدد أيام بين 1 و 365', 'error');
            if (frequency === 'weekly' && !weekdays.length) return toast('اختار يوم أو أكتر للتقرير الأسبوعي', 'error');
            if (frequency === 'monthly' && !(dayOfMonth >= 1 && dayOfMonth <= 28)) return toast('اكتب يوم في الشهر بين 1 و 28', 'error');
            if (frequency === 'custom' && !(everyDays >= 1 && everyDays <= 365)) return toast('اكتب عدد أيام بين 1 و 365', 'error');
            if (s.enabled) {
                s.nextRun = frequency === 'custom'
                    ? (startDate || todayISO())
                    : checkReportFirstRun(s, todayISO());
            } else {
                s.nextRun = '';
            }
            s.dismissedOn = '';
            saveCheckReport(s);
            toast(s.enabled ? 'تم حفظ التقرير الدوري' : 'التقرير الدوري متوقف', 'success');
            render();
        }

                if (c.cashed) g.cashed = r2(g.cashed + amt); else g.open = r2(g.open + amt);
                map.set(k, g);
            });
            return [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'ar'));

                return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-8 text-center text-slate-600 font-bold">مفيش نتايج للبحث ده</div>`;

            return `<div class="hidden md:block bg-white rounded-2xl border-2 border-slate-300 shadow-lg overflow-x-auto">

                            <th class="py-3 px-4 text-start">الحد والمفتوح</th>
                            <th class="py-3 px-4 text-start">عدد الشيكات</th>

                    </thead>
                    <tbody class="divide-y divide-slate-200">

                            <td class="py-3 px-4">${limitCell(p)}</td>
                            <td class="py-3 px-4 font-semibold">${countOf(p.id)}</td>
                            <td class="py-3 px-4"><div class="flex justify-center gap-1">${actions(p)}</div></td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
            <div class="md:hidden space-y-3">
                ${rows.map(p => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4">
                    <div class="flex items-start justify-between gap-2">

                        <span class="text-xs font-bold text-slate-600 whitespace-nowrap">${countOf(p.id)} شيك</span>
                    </div>
                    <div class="mt-2">${limitCell(p)}</div>

                    <div class="flex justify-end gap-1 mt-2">${actions(p)}</div>
                </div>`).join('')}
            </div>`;
        }

        // statement of one partner: totals, limit, all of their checks
        function viewStatement(id) {
            const p = appData.partners.find(x => x.id === id);
            const back = `<button type="button" onclick="navigate('checks/partners')" class="text-sm font-bold text-brand-700 hover:underline"><i class="fa-solid fa-arrow-right"></i> رجوع للمستفيدين</button>`;
            if (!p) {
                return { title: 'كشف المستفيد', actions: '', html: `<div class="space-y-4">${back}<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-8 text-center font-bold text-slate-600">المستفيد ده مش موجود</div></div>` };
            }
            const rows = appData.checks.filter(c => c.payeeId === p.id).sort(byDue);
            const total = sumAmt(rows), openT = sumAmt(rows.filter(isOpen));
            const over = partnerOver(p);
            return {
                title: 'كشف المستفيد',
                actions: '',
                html: `<div class="space-y-4">
                    ${back}
                    <div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-5 space-y-4">
                        <div class="flex flex-wrap items-start justify-between gap-3">
                            <div><h2 class="text-xl font-bold text-slate-800">${esc(p.name)}</h2>${p.notes ? `<p class="text-sm text-slate-600">${esc(p.notes)}</p>` : ''}</div>
                            <div class="flex flex-wrap gap-2">
                                ${btn(`printStatement('${esc(p.id)}')`, 'طباعة الكشف', 'fa-print', BTN_SECONDARY)}
                                ${btn(`exportStatementXlsx('${esc(p.id)}')`, 'تصدير Excel', 'fa-file-excel', BTN_SECONDARY)}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                            <div class="rounded-xl bg-slate-50 border-2 border-slate-200 p-3"><p class="text-xs font-bold text-slate-600">عدد الشيكات</p><p class="text-lg font-bold">${rows.length}</p></div>
                            <div class="rounded-xl bg-slate-50 border-2 border-slate-200 p-3"><p class="text-xs font-bold text-slate-600">الإجمالي</p><p class="text-lg font-bold">${fmtMoney(total)}</p></div>
                            <div class="rounded-xl bg-amber-50 border-2 border-amber-200 p-3"><p class="text-xs font-bold text-amber-800">المفتوح</p><p class="text-lg font-bold text-amber-800">${fmtMoney(openT)}</p></div>
                            <div class="rounded-xl bg-emerald-50 border-2 border-emerald-200 p-3"><p class="text-xs font-bold text-emerald-800">المصروف</p><p class="text-lg font-bold text-emerald-800">${fmtMoney(r2(total - openT))}</p></div>
                        </div>
                        <div>${limitCell(p)}</div>
                        ${over ? '<p class="text-sm font-bold text-rose-700"><i class="fa-solid fa-triangle-exclamation"></i> المفتوح تجاوز الحد المسموح للمستفيد ده</p>' : ''}
                    </div>
                    ${checksTableHtml(rows)}
                </div>`
            };
        }

        // ---- check modal (with live warning when the partner limit would be passed) ----
        function updateCheckWarning() {
            const box = document.getElementById('checkWarn');
            if (!box) return;
            const payeeId = document.querySelector('#modalForm select[name=payeeId]')?.value || '';
            const amount = Number(document.querySelector('#modalForm input[name=amount]')?.value);
            const p = appData.partners.find(x => x.id === payeeId);
            const editing = checkModalId ? appData.checks.find(x => x.id === checkModalId) : null;
            const counts = !(editing && editing.cashed);
            if (!p || !(p.limit > 0) || !(amount > 0) || !counts) {
                box.classList.add('hidden'); box.textContent = ''; return;
            }
            const after = r2(partnerOpenTotal(p.id, checkModalId) + amount);
            if (after > p.limit + 1e-9) {
                box.classList.remove('hidden');
                box.textContent = `تنبيه: المفتوح للمستفيد ده هيبقى ${fmtMoney(after)} والحد ${fmtMoney(p.limit)} — هيتجاوز الحد بـ ${fmtMoney(r2(after - p.limit))}`;
            } else {
                box.classList.add('hidden'); box.textContent = '';
            }
        }

        function openCheckModal(id = null, opts = {}) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const c = id ? appData.checks.find(x => x.id === id) : null;
            if (id && !c) return;
            if (!appData.partners.length) {
                toast('أضف مستفيد الأول من تبويب المستفيدين', 'info', null, 5000);
                navigate('checks/partners');
                return;
            }
            const copy = !!(opts && opts.copy) && !!c;   // copy mode: a new check with the same data
            const editing = copy ? null : c;
            checkModalId = copy ? null : id;
            const partners = [...appData.partners].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            const payeeOptions = partners.map(p => `<option value="${esc(p.id)}" ${c && c.payeeId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
            const banks = [...new Set(appData.checks.map(x => x.bank).filter(Boolean))].sort();

            openModal({
                title: editing ? 'تعديل الشيك' : (copy ? 'نسخة شيك جديد' : 'شيك جديد'),
                submitText: editing ? 'حفظ التعديلات' : 'إضافة الشيك',
                body: `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${field('رقم الشيك *', `<input name="number" required value="${esc(copy ? '' : c?.number)}" placeholder="مثال: 004512" dir="ltr" class="${INPUT_CLS} font-mono">`)}
                        ${field('البنك *', `<input name="bank" required list="bankList" value="${esc(c?.bank)}" placeholder="مثال: البنك الأهلي" class="${INPUT_CLS}"><datalist id="bankList">${banks.map(b => `<option value="${esc(b)}"></option>`).join('')}</datalist>`)}
                        ${field('المبلغ (جنيه) *', `<input name="amount" type="number" step="0.01" min="0.01" required value="${c ? esc(c.amount) : ''}" oninput="updateAmountWords(this.value); updateCheckWarning()" dir="ltr" class="${INPUT_CLS} font-mono">`)}
                        ${field('تاريخ الاستحقاق *', `<div class="space-y-2"><input name="dueDate" type="date" required value="${esc(copy ? addDaysISO(c.dueDate || todayISO(), 30) : (c?.dueDate || todayISO()))}" class="${INPUT_CLS}"><div class="flex flex-wrap gap-2">${[7, 15, 30].map(n => `<button type="button" onclick="setCheckDueOffset(${n})" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">بعد ${n} يوم</button>`).join('')}</div></div>`)}
                    </div>
                    <div id="amountWords" class="rounded-xl bg-slate-50 border-2 border-slate-200 p-3 text-sm font-bold text-slate-700"></div>
                    ${field('المستفيد *', `<select name="payeeId" required onchange="updateCheckWarning()" class="${INPUT_CLS}"><option value="">— اختر المستفيد —</option>${payeeOptions}</select>`)}
                    <div id="checkWarn" class="hidden rounded-xl bg-rose-50 border-2 border-rose-300 p-3 text-sm font-bold text-rose-800"></div>`,
                onOpen: () => { updateAmountWords(c ? c.amount : ''); updateCheckWarning(); },
                onSubmit: fd => {
                    const number = String(fd.get('number') || '').trim();
                    const bank = String(fd.get('bank') || '').trim();
                    const amount = r2(Number(fd.get('amount')));
                    const dueDate = String(fd.get('dueDate') || '');
                    const payee = appData.partners.find(p => p.id === String(fd.get('payeeId') || ''));
                    if (!number || !bank || !dueDate) return toast('اكتب رقم الشيك والبنك والتاريخ', 'error'), false;
                    if (!(amount > 0) || amount > CHECK_MAX_AMOUNT) return toast('اكتب مبلغ صحيح أكبر من صفر', 'error'), false;
                    if (!payee) return toast('اختر المستفيد', 'error'), false;
                    if (appData.checks.some(x => x.id !== id && x.number === number && x.bank === bank)) {
                        return toast('الشيك ده متسجل قبل كده بنفس الرقم والبنك', 'error'), false;
                    }
                    const data = { number, bank, amount, dueDate, payeeId: payee.id, payeeName: payee.name };
                    if (editing) {
                        Object.assign(editing, data);
                        log('تعديل شيك', `${number} — ${payee.name}`);
                        toast('تم حفظ التعديلات', 'success');
                    } else {
                        appData.checks.push({ id: uid('CHK-'), ...data, cashed: false });
                        log('إضافة شيك', `${number} — ${payee.name}`);
                        toast('تمت إضافة الشيك', 'success');
                    }
                    checkModalId = null;
                    if (payee.limit > 0 && partnerOver(payee)) {
                        toast(`تنبيه: المفتوح للمستفيد "${payee.name}" تجاوز الحد المسموح`, 'info', null, 7000);
                    }
                    render();
                }
            });
        }

        function openPartnerModal(id = null) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const p = id ? appData.partners.find(x => x.id === id) : null;
            if (id && !p) return;
            openModal({
                title: p ? 'تعديل المستفيد' : 'مستفيد جديد',
                submitText: p ? 'حفظ التعديلات' : 'إضافة المستفيد',
                body: `
                    ${field('اسم المستفيد *', `<input name="name" required value="${esc(p?.name)}" placeholder="مثال: شركة الخليج للتوزيع" class="${INPUT_CLS}">`)}
                    ${field('الحد المسموح (جنيه)', `<input name="limit" type="number" step="0.01" min="0" value="${p && p.limit > 0 ? esc(p.limit) : ''}" placeholder="فاضي = مفيش حد" dir="ltr" class="${INPUT_CLS} font-mono">`, 'لو مجموع الشيكات المفتوحة للمستفيد عدّى الحد، التطبيق بيحذّرك')}
                    ${field('ملاحظات', `<textarea name="notes" rows="3" class="${INPUT_CLS}" placeholder="أي تفاصيل إضافية...">${esc(p?.notes)}</textarea>`)}`,
                onSubmit: fd => {
                    const name = String(fd.get('name') || '').trim();
                    const notes = String(fd.get('notes') || '').trim();
                    const limitRaw = String(fd.get('limit') || '').trim();
                    const limit = limitRaw === '' ? 0 : r2(Number(limitRaw));
                    if (!name) return toast('اكتب اسم المستفيد', 'error'), false;
                    if (!(limit >= 0) || limit > CHECK_MAX_AMOUNT) return toast('اكتب حد صحيح أو سيبه فاضي', 'error'), false;
                    if (appData.partners.some(x => x.id !== id && x.name.trim() === name)) {
                        return toast('الاسم ده موجود قبل كده', 'error'), false;
                    }
                    if (p) {
                        Object.assign(p, { name, notes, limit });
                        // keep the payee name on the checks in step with the partner's name
                        appData.checks.forEach(x => { if (x.payeeId === p.id) x.payeeName = name; });
                        log('تعديل مستفيد', name);
                        toast('تم حفظ التعديلات', 'success');
                    } else {
                        appData.partners.push({ id: uid('PAY-'), name, notes, limit });
                        log('إضافة مستفيد', name);
                        toast('تمت إضافة المستفيد', 'success');
                    }
                    render();
                }
            });
        }

        // mark a check as cashed (تم الصرف) or open again
        function toggleCashed(id) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const c = appData.checks.find(x => x.id === id);
            if (!c) return;
            c.cashed = !c.cashed;
            log(c.cashed ? 'صرف شيك' : 'إلغاء صرف شيك', `${c.number} — ${c.payeeName}`);
            toast(c.cashed ? 'تم تسجيل الصرف' : 'تم إلغاء الصرف', 'success');
            render();
        }

        // Soft delete (with undo), same as companies
        function deleteCheck(id) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const idx = appData.checks.findIndex(c => c.id === id);
            if (idx < 0) return;
            finalizePendingUndo();
            const c = appData.checks[idx];
            appData.checks.splice(idx, 1);
            log('حذف شيك', `${c.number} — ${c.payeeName}`);
            render();
            scheduleUndo(`تم حذف الشيك رقم ${c.number}`, () => {
                appData.checks.splice(Math.min(idx, appData.checks.length), 0, c);
                log('استعادة شيك', `${c.number} — ${c.payeeName}`);
                render();
            }, () => {});
        }

        function deletePartner(id) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const idx = appData.partners.findIndex(p => p.id === id);
            if (idx < 0) return;
            finalizePendingUndo();
            const p = appData.partners[idx];
            appData.partners.splice(idx, 1);
            log('حذف مستفيد', p.name);
            render();
            scheduleUndo(`تم حذف "${p.name}"`, () => {
                appData.partners.splice(Math.min(idx, appData.partners.length), 0, p);
                log('استعادة مستفيد', p.name);
                render();
            }, () => {});
        }

        // ---- printing and Excel ----
        // a hidden frame prints one HTML document (no pop-up window)
        function printHtml(html) {
            const frame = document.createElement('iframe');
            frame.setAttribute('aria-hidden', 'true');
            frame.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0;';
            frame.onload = () => {
                try {
                    frame.contentWindow.focus();
                    frame.contentWindow.print();
                } catch (err) {
                    console.error(err);
                    toast('تعذر فتح نافذة الطباعة', 'error');
                }
                setTimeout(() => frame.remove(), 2000);
            };
            frame.srcdoc = html;
            document.body.appendChild(frame);
        }

        // report (summary per partner + list of checks), used for the report tab and for statements
        function reportPrintHtml(title, meta, rows) {

        function exportChecksXlsx(rows, fileName, label) {
            if (!can('checks.view')) return;

            const wb = XLSX.utils.book_new();
            const detail = [['رقم الشيك', 'البنك', 'المستفيد', 'المبلغ', 'تاريخ الاستحقاق', 'الحالة']]
                .concat(rows.map(c => [c.number, c.bank, c.payeeName, Number(c.amount) || 0, c.dueDate,
                    c.cashed ? 'مصروف' : (isOverdue(c) ? 'متأخر' : 'مفتوح')]));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detail), 'الشيكات');
            const summary = [['المستفيد', 'عدد الشيكات', 'الإجمالي', 'المفتوح', 'المصروف', 'الحد']]
                .concat(partnerSummaryRows(rows).map(g => [g.name, g.count, g.total, g.open, g.cashed,
                    g.partner && g.partner.limit > 0 ? g.partner.limit : '']));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'ملخص المستفيدين');
            XLSX.writeFile(wb, `${fileName}-${todayISO()}.xlsx`);

            toast('تم تنزيل ملف Excel', 'success');

        // ============ AUTH & PERMISSIONS ============
        function currentUser() {
            return appData.users.find(u => u.id === sessionUserId) || null;
        }

        function roleHas(roleId, perm) {
            const r = appData.roles[roleId];
            return !!r && (r.locked || r.permissions.includes(perm));
        }

        function can(perm) {
            const u = currentUser();
            return !!u && u.active && roleHas(u.roleId, perm);
        }

        function countUsersWithPerm(users, roles, perm) {
            return users.filter(u => u.active && roles[u.roleId] && (roles[u.roleId].locked || roles[u.roleId].permissions.includes(perm))).length;
        }

        function canAccessRoute(name) {
            if (name === 'settings') return can('settings.manage') || can('backup.manage');
            const r = ROUTES[name];
            return !!r && can(r.perm);
        }

        function firstAllowedRoute() {

        async function handleAuth(e) {
            e.preventDefault();
            if (!fbAuth) return toast('Firebase غير مُعد بعد', 'error');
            const btn = el('authSubmit');
            const mode = el('authMode').value;
            const fd = new FormData(el('authForm'));
            const email = String(fd.get('email') || '').trim().toLowerCase();
            const password = String(fd.get('password') || '');
            btn.disabled = true;
            try {
                if (mode === 'setup') {
                    await runSetup(fd, email, password);
                } else {
                    if (!EMAIL_RE.test(email)) throw userError('اكتب بريد إلكتروني صحيح');
                    await runLogin(email, password);
                }
            } catch (err) {
                console.error(err);
                toast(authErrorMessage(err), 'error', null, 5000);
            } finally {
                btn.disabled = false;
            }
        }

        async function runLogin(email, password) {
            fbBusy = true;
            try {
                const cred = await fbAuth.signInWithEmailAndPassword(email, password);
                const snap = await fbDb.collection('users').doc(cred.user.uid).get();
                if (!snap.exists) {
                    await fbAuth.signOut();
                    throw userError('حسابك غير مفعّل داخل النظام. تواصل مع مدير النظام');
                }
                if (snap.data().active === false) {
                    await fbAuth.signOut();
                    throw userError('هذا الحساب موقوف. تواصل مع مدير النظام');
                }
                fbUser = cred.user;
                pendingLoginLog = true;
            } finally {
                fbBusy = false;
            }
            startSync(fbUser.uid);
        }

        // First run: creates the admin account, the roles and settings, then uploads the local data (if any)
        async function runSetup(fd, email, password) {
            const name = String(fd.get('name') || '').trim();
            if (!name) throw userError('اكتب الاسم الكامل');
            if (!EMAIL_RE.test(email)) throw userError('اكتب بريد إلكتروني صحيح');
            if (password.length < 6) throw userError('كلمة المرور لازم تكون 6 أحرف على الأقل');
            if (password !== String(fd.get('password2') || '')) throw userError('كلمتا المرور غير متطابقتين');

            fbBusy = true;
            let cred = null;
            try {
                cred = await fbAuth.createUserWithEmailAndPassword(email, password);
                fbUser = cred.user;
                const uid = cred.user.uid;
                const now = new Date().toISOString();

                const local = readLocalSeed();
                const seed = local || normalizeData(defaultData());
                const docs = [...desiredDocs(seed).entries()].map(([key, data]) => ({ key, data }));

                // step 1: the marker, the admin profile, roles and settings (allowed only while bootstrapping)
                await commitChunks([
                    { key: 'system/init', data: { createdAt: now, createdBy: uid } },
                    { key: 'users/' + uid, data: { name, email, roleId: 'admin', active: true, createdAt: now, lastLoginAt: now } },
                    ...docs.filter(o => o.key.startsWith('roles/') || o.key === 'settings/main')
                ]);
                initExists = true;

                // step 2: local PDFs go to Realtime Database (pdfs/{listId}), then the companies and lists
                for (const id of seed.localPdfIds || []) {
                    const blob = await readLocalPdf(id);
                    if (!blob) continue;
                    try {
                        await pdfUpload(id, blob);
                        seed.companies.forEach(c => c.lists.forEach(l => { if (l.id === id) l.hasPdf = true; }));
                    } catch (err) { console.error('pdf upload', id, err); }
                }
                await commitChunks([...desiredDocs(seed).entries()]
                    .filter(([key]) => key.startsWith('companies/') || key.startsWith('lists/'))
                    .map(([key, data]) => ({ key, data })));

                const logId = 'LOG-' + Date.now().toString(36);
                await fbDb.collection('logs').doc(logId).set({
                    id: logId, t: now, user: name, action: 'إنشاء حساب مدير النظام',
                    detail: local ? 'مع نقل البيانات من المتصفح' : ''
                });

                fbBusy = false;
                startSync(uid);
                toast(local ? 'تم إنشاء الحساب ونقل البيانات إلى Firebase' : 'تم إنشاء حساب مدير النظام', 'success', null, 5000);
            } catch (err) {
                // roll back a half-created account so setup can be retried
                if (cred && cred.user) { try { await cred.user.delete(); } catch (e) { console.error(e); } }
                if (fbAuth.currentUser) { try { await fbAuth.signOut(); } catch (e) { console.error(e); } }
                throw err;
            } finally {
                fbBusy = false;
            }
        }

        async function logout(silent = false) {
            if (!silent && currentUser()) log('تسجيل خروج');
            // stop listeners first: signing out makes them fail with permission-denied,
            // which must not be reported as "account not activated"
            fbUser = null;
            stopSync();
            try { await fbAuth.signOut(); } catch (err) { console.error(err); }
            if (silent) toast('انتهت الجلسة. سجّل الدخول من جديد', 'info');
        }

        async function submitModal(e) {

            const form = e.target;

                toast('حدث خطأ غير متوقع: ' + err.message, 'error', null, 5000);

        // ============ ROUTER & SHELL ============
        function parseRoute() {
            const h = location.hash.replace(/^#\/?/, '');
            const [name, ...rest] = h.split('/');
            return { name: name || 'dashboard', param: rest.join('/') || null };
        }

        function navigate(route) {
            const target = '#/' + route;
            if (location.hash === target) render();
            else location.hash = target;
        }

        function render() {
            if (orderFormKeep && parseRoute().name !== 'orders') orderFormKeep = null;
            if (!sessionUserId) return;
            const user = currentUser();
            if (!user || !user.active) {
                logout(true);
                return;
            }
            let { name, param } = parseRoute();

            if (!ROUTES[name]) name = 'dashboard';
            if (!canAccessRoute(name)) {
                const first = firstAllowedRoute();
                if (first) return navigate(first);
                renderNoAccess();
                return;
            }
            if (name === 'companies' && param && !findCompany(param)) return navigate('companies');

            const view = VIEWS[name](param);
            el('pageTitle').textContent = view.title;
            el('topActions').innerHTML = view.actions || '';
            el('content').innerHTML = view.html;
            el('content').insertAdjacentHTML('afterbegin', checkReportBanner());
            renderChrome(name);
            if (view.after) view.after();
            closeRowMenu();
            toggleSidebar(false);
        }

        function renderNoAccess() {
            el('pageTitle').textContent = 'لا توجد صلاحيات';

        const ordIsActive = o => o.status !== 'cancelled';
        const ordIsOpen = o => o.status !== 'cancelled' && o.status !== 'delivered';
        const numOr0 = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
        function nextOrderNo() { return Math.max(0, ...appData.orders.map(o => Number(o.no) || 0)) + 1; }

        // ---- totals (per item, then per order) ----
        const priceOf = (o, itemId) => ((o.prices || {})[itemId]) || { unitPrice: 0, discount: 0 };
        function lineCalc(it, pr) {
            const q = numOr0(it.qty), price = numOr0(pr.unitPrice);
            const disc = Math.min(100, Math.max(0, numOr0(pr.discount)));
            const subtotal = r2(q * price), discount = r2(subtotal * disc / 100);
            const m2 = it.unit === 'م²' ? q : (it.unit === 'كرتونة' ? q * numOr0(it.m2PerBox) : 0);
            return {
                subtotal, discount, net: r2(subtotal - discount), m2: r2(m2),
                boxes: it.unit === 'كرتونة' ? q : 0, pieces: it.unit === 'قطعة' ? q : 0,
                kg: r2(it.unit === 'طن' ? q * 1000 : (it.unit === 'كجم' ? q : q * numOr0(it.weightPerUnit)))
            };
        }
        function orderTotals(o) {
            const t = { subtotal: 0, discount: 0, net: 0, m2: 0, boxes: 0, pieces: 0, kg: 0 };
            (o.items || []).forEach(it => {
                const l = lineCalc(it, priceOf(o, it.id));
                Object.keys(t).forEach(k => { t[k] = r2(t[k] + l[k]); });
            });
            return t;
        }
        const orderBalance = o => r2(orderTotals(o).net - numOr0(o.payment && o.payment.paid));

        // ---- warnings: shown, never blocking ----
        function timeOverlap(a, b) {
            if (!a.timeFrom || !a.timeTo || !b.timeFrom || !b.timeTo) return true;   // no hours = whole day
            return a.timeFrom < b.timeTo && b.timeFrom < a.timeTo;
        }
        function orderWarnings(o, all) {
            const w = [];
            const s = o.schedule || {}, t = o.transport || {};
            if (ordIsOpen(o) && !s.plannedDate) w.push('بدون تاريخ جدولة');
            if (ordIsOpen(o) && s.plannedDate && s.plannedDate < todayISO() && ['draft', 'confirmed', 'loading'].includes(o.status)) w.push('متأخرة عن موعدها');
            if (s.timeFrom && s.timeTo && s.timeFrom >= s.timeTo) w.push('ساعة النهاية قبل البداية');
            if (s.arrivalDate && s.plannedDate && s.arrivalDate < s.plannedDate) w.push('الوصول قبل الشحن');
            if (numOr0(t.capacityKg) > 0 && orderTotals(o).kg > numOr0(t.capacityKg)) w.push('الحمولة أكبر من السعة');
            return w;
        }

        // ---- required data before a status move (blocking; these are not warnings) ----
        function orderProblem(o, to) {
            if (to === 'confirmed') {
                if (!o.items || !o.items.length) return 'ضيف أصناف للطلبية الأول';
                if (o.kind === 'supply' && !o.factoryId) return 'اختار المصنع الأول';
                if (o.kind === 'delivery' && !o.customerName) return 'اكتب اسم العميل الأول';
                if (!orderDateOf(o)) return 'حدد تاريخ الجدولة الأول';
            }
            return '';
        }

        // ---- list ----
        function filteredOrders() {
            const f = ordersFilter, q = f.q.trim().toLowerCase();
            return appData.orders.filter(o => {
                if (f.status !== 'all' && o.status !== f.status) return false;
                if (f.kind !== 'all' && o.kind !== f.kind) return false;
                if (f.factoryId && o.factoryId !== f.factoryId) return false;
                const d = orderDateOf(o);
                if (f.from && (!d || d < f.from)) return false;
                if (f.to && (!d || d > f.to)) return false;
                if (q) {
                    const hay = [orderNoLabel(o), o.customerName, o.factoryName, o.ref,
                        ...(o.items || []).map(i => `${i.code} ${i.name}`)].join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            }).sort((a, b) => (b.no || 0) - (a.no || 0));
        }

        function ordersSummaryCards(rows) {
            const act = rows.filter(ordIsActive);
            const sum = k => r2(rows.reduce((s, o) => s + orderTotals(o)[k], 0));

            const card = (label, value, cls = 'text-slate-800') => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-3">

            return `<div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
                ${card('طلبيات نشطة', act.length)}
                ${canOrd('prices') ? card('صافي القيمة', fmtMoney(r2(act.reduce((s, o) => s + orderTotals(o).net, 0))), 'text-emerald-700') : ''}
                ${card('مجدولة النهارده', act.filter(o => orderDateOf(o) === today).length, 'text-brand-700')}
                ${card('متأخرة عن موعدها', rows.filter(o => orderWarnings(o, appData.orders).includes('متأخرة عن موعدها')).length, 'text-rose-700')}
                ${card('م² / كرتونة / كجم', `${fmtDigits(sum('m2'))} / ${fmtDigits(sum('boxes'))} / ${fmtDigits(sum('kg'))}`)}
            </div>`;

                    ${field('تاريخ الجدولة', `<div class="flex gap-1"><input type="date" value="${esc(f.from)}" onchange="ordersFilter.from = this.value; updateOrdersBody()" class="${INPUT_CLS}"><input type="date" value="${esc(f.to)}" onchange="ordersFilter.to = this.value; updateOrdersBody()" class="${INPUT_CLS}"></div>`)}

        // transport details show only for the vehicle types the user may see (orders.transport_truck / _car / _other)

                    <div class="flex flex-wrap gap-1 mt-1">${orderWarnBadges(o)}</div>

        function updateOrdersBody() {

        // ---- schedule board: one card per day, open orders without a date at the bottom ----
        function setOrdersSched(date, days) {

        const WEEKDAY_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

                const rows = list.length ? list.map(o => {

                    return `<div class="rounded-xl border-2 border-slate-200 bg-white p-3 flex flex-wrap items-center justify-between gap-2">

                </div>`;

        // ---- add / edit form (its own page: orders/new, orders/edit/<id>) ----
        // Fields the user cannot change are disabled. Prices are not rendered at all without orders.prices.
        const ORDER_TRANSPORT_FIELDS = {
            truck: [],
            car: ['capacityKg'],

        };

        function ordIn(name, label, value, ok = true, type = 'text', extra = '') {

        const ordCard = (title, icon, body) => `<section class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 sm:p-5 space-y-4">

        function orderItemRowHtml(it, pr, canEdit, canPrice) {

        function addOrderItemRow() {
            const holder = el('orderItems');
            if (!holder) return;
            const it = { id: uid('it-'), product: ORDER_PRODUCTS[0], code: '', name: '', size: '', shade: '', unit: 'م²', qty: '', m2PerBox: '', weightPerUnit: '' };
            holder.insertAdjacentHTML('beforeend', orderItemRowHtml(it, { unitPrice: '', discount: '' }, true, canOrd('prices')));
            recalcOrderTotals();
        }
        function removeOrderItemRow(b) {
            b.closest('[data-item-row]').remove();
            recalcOrderTotals();
        }

        // Read the item rows from the page. Prices are kept from the saved order when the user cannot see them.
        function readOrderItems(existing) {
            const items = [], prices = {};
            document.querySelectorAll('#orderItems [data-item-row]').forEach(row => {
                const g = n => { const x = row.querySelector(`[data-f="${n}"]`); return x ? x.value : ''; };
                const it = {
                    id: row.dataset.iid, product: g('product'), code: g('code').trim(), name: g('name').trim(), size: g('size').trim(),
                    shade: g('shade').trim(), unit: g('unit'), qty: numOr0(g('qty')), m2PerBox: numOr0(g('m2PerBox')), weightPerUnit: numOr0(g('weightPerUnit'))
                };
                if (!it.code && !it.name && !it.qty) return;
                items.push(it);
                if (canOrd('prices')) prices[it.id] = { unitPrice: numOr0(g('unitPrice')), discount: Math.min(100, Math.max(0, numOr0(g('discount')))) };
                else if (existing && existing.prices && existing.prices[it.id]) prices[it.id] = existing.prices[it.id];
            });
            return { items, prices };
        }

        function recalcOrderTotals() {
            const box = el('orderTotals');
            if (!box) return;
            const { items, prices } = readOrderItems({ prices: {} });
            const t = { subtotal: 0, discount: 0, net: 0, m2: 0, boxes: 0, pieces: 0, kg: 0 };
            items.forEach(it => { const l = lineCalc(it, prices[it.id] || { unitPrice: 0, discount: 0 }); Object.keys(t).forEach(k => { t[k] = r2(t[k] + l[k]); }); });
            const cell = (label, value, cls = '') => `<div class="rounded-xl bg-white border border-slate-200 p-2"><p class="text-[11px] font-bold text-slate-500">${label}</p><p class="font-bold ${cls}">${value}</p></div>`;
            box.innerHTML = `${cell('م²', fmtDigits(t.m2))}${cell('كرتونة', fmtDigits(t.boxes))}${cell('قطعة', fmtDigits(t.pieces))}${cell('كجم', fmtDigits(t.kg))}`
                + (canOrd('prices') ? `${cell('الإجمالي', fmtMoney(t.subtotal))}${cell('الخصم', fmtMoney(t.discount))}${cell('الصافي', fmtMoney(t.net), 'text-emerald-700')}` : '');
        }

        function transportTypeChanged(sel) {
            const type = sel.value;
            document.querySelectorAll('#orderForm [data-ttype]').forEach(x => { x.classList.toggle('hidden', !x.dataset.ttype.split(' ').includes(type)); });
            const ok = canOrd(type === 'truck' ? 'truck' : type === 'car' ? 'car' : 'other');
            document.querySelectorAll('#orderForm [data-tfield]').forEach(x => { x.disabled = !ok; });
        }

        function keptOrderDraft(key) {
            if (!orderFormKeep) return null;
            if (orderFormKeep.key !== key) { orderFormKeep = null; return null; }
            return orderFormKeep.draft;
        }

        // Opens the factory / supplier modal from the order form. The unsaved order is kept and the new one is selected.
        function openSupplierFromOrder() {
            if (!canOrd('addSupplier')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const param = parseRoute().param || '';
            const isNew = param === 'new';
            const id = param.startsWith('edit/') ? param.slice(5) : '';
            const base = isNew ? { id: '', no: 0, status: 'draft', createdAt: '', createdBy: '', items: [], prices: {}, history: [] }
                : appData.orders.find(x => x.id === id);
            if (!base) return toast('افتح الطلبية الأول', 'error');
            orderFormKeep = { key: isNew ? 'new' : 'edit/' + id, draft: readOrderForm(base) };
            openCompanyModal(null, true);
        }

        function ordersFormHtml(o, isNew) {
            const canContent = isNew ? canOrd('create') : canOrd('edit');
            const canSched = canOrd('schedule');
            const canPay = canOrd('payment');
            const t = o.transport || {};
            const type = t.type || 'truck';
            const s = o.schedule || {};
            const p = o.payment || {};
            const tOk = canOrd(type === 'truck' ? 'truck' : type === 'car' ? 'car' : 'other');
            const tf = (name, label, value, ttype = '', type2 = 'text') => {

                return ttype ? `<div data-ttype="${ttype}" class="${ttype.split(' ').includes(type) ? '' : 'hidden'}">${wrap}</div>` : wrap;
            };
            const headerCard = ordCard('بيانات الطلبية', 'fa-file-lines', `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${ordSel('kind', 'نوع الطلبية', Object.entries(ORDER_KIND), o.kind || 'supply', canContent)}
                    ${field('المصنع / المورد (للتوريد)', `<select name="factoryId" ${canContent ? '' : 'disabled'} class="${INPUT_CLS}">${[['', '—'], ...appData.companies.map(c => [c.id, companyOptionLabel(c)])].map(([v, l]) => `<option value="${esc(v)}" ${String(o.factoryId || '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${canContent && canOrd('addSupplier') ? `<button type="button" onclick="openSupplierFromOrder()" class="${BTN_SECONDARY} w-full mt-2"><i class="fa-solid fa-plus"></i> إضافة مصنع / مورد جديد</button>` : ''}`)}
                    ${ordIn('ref', 'رقم المرجع / الفاتورة', o.ref, canContent)}
                    ${ordIn('customerName', 'اسم العميل (للتسليم)', o.customerName, canContent)}
                    ${ordIn('customerPhone', 'تليفون العميل', o.customerPhone, canContent, 'tel')}
                    ${ordIn('customerAddress', 'عنوان التسليم', o.customerAddress, canContent)}
                </div>
                ${field('ملاحظات', `<textarea name="notes" rows="2" ${canContent ? '' : 'disabled'} class="${INPUT_CLS}">${esc(o.notes || '')}</textarea>`)}`);
            const schedCard = ordCard('الجدولة', 'fa-calendar-days', `
                <p class="text-xs text-slate-600">للتوريد: تاريخ الشحن من المصنع وتاريخ الوصول لمخزنك. للتسليم: تاريخ التسليم ونافذة الساعات والمسار.</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${ordIn('plannedDate', 'تاريخ الشحن / التسليم المخطط', s.plannedDate, canSched, 'date')}
                    ${ordIn('timeFrom', 'من الساعة', s.timeFrom, canSched, 'time')}
                    ${ordIn('timeTo', 'إلى الساعة', s.timeTo, canSched, 'time')}
                    ${ordIn('arrivalDate', 'تاريخ الوصول للمخزن (توريد)', s.arrivalDate, canSched, 'date')}
                    ${ordIn('route', 'المسار / المنطقة (تسليم)', s.route, canSched)}
                    ${ordIn('actualDate', 'تاريخ التنفيذ الفعلي', s.actualDate, canSched, 'date')}
                </div>`);
            const transportCard = ordCard('الوسيلة والنقل', 'fa-truck', `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${ordSel('transportType', 'نوع الوسيلة', Object.entries(ORDER_TRANSPORT), type, true).replace('<select ', '<select onchange="transportTypeChanged(this)" ')}
                    ${tf('capacityKg', 'السعة (كجم)', t.capacityKg, 'car other', 'number')}
                    ${tf('company', 'شركة النقل', t.company, 'other')}
                    ${tf('description', 'وصف الوسيلة', t.description, 'other')}
                    ${tf('cost', 'تكلفة النقل', t.cost, 'other', 'number')}
                </div>
                <p class="text-xs text-slate-500">الحقول بتتغير حسب نوع الوسيلة. كل نوع ليه صلاحية تعديل منفصلة.</p>`);
            const itemsCard = ordCard('الأصناف', 'fa-boxes-stacked', `
                <div id="orderItems" class="space-y-3">${(o.items || []).map(it => orderItemRowHtml(it, priceOf(o, it.id), canContent, canOrd('prices'))).join('')}</div>
                ${canContent ? btn('addOrderItemRow()', 'إضافة صنف', 'fa-plus', BTN_SECONDARY) : ''}
                <div id="orderTotals" class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-2 text-sm"></div>`);
            const payCard = canOrd('payment') ? ordCard('الدفع', 'fa-wallet', `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    ${ordSel('terms', 'شروط الدفع', ORDER_TERMS, p.terms || 'نقدي', canPay)}
                    ${ordIn('paid', 'المدفوع', p.paid, canPay, 'number')}
                    ${ordIn('dueDate', 'تاريخ الاستحقاق', p.dueDate, canPay, 'date')}
                </div>`) : '';
            return `<form id="orderForm" onsubmit="saveOrderForm(event, ${isNew ? "''" : `'${esc(o.id)}'`})" class="space-y-4">
                ${headerCard}${schedCard}${transportCard}${itemsCard}${payCard}
                <div class="flex flex-wrap gap-2 justify-end sticky bottom-2">
                    ${btn("navigate('orders')", 'رجوع', 'fa-arrow-right', BTN_SECONDARY)}
                    <button type="submit" class="${BTN_PRIMARY} whitespace-nowrap"><i class="fa-solid fa-floppy-disk"></i><span>${isNew ? 'حفظ الطلبية' : 'حفظ التعديلات'}</span></button>
                </div>
            </form>`;
        }

        // Build the order from the form. Keeps everything the user cannot change.
        function readOrderForm(o) {
            const f = el('orderForm');
            const v = n => (f.elements[n] ? f.elements[n].value : '');
            const type = v('transportType') || 'truck';
            const { items, prices } = readOrderItems(o);
            const transport = { type };
            ORDER_TRANSPORT_FIELDS[type].forEach(k => { transport[k] = v(k).trim(); });
            transport.capacityKg = type === 'truck' ? 0 : numOr0(v('capacityKg'));
            if (type === 'other') transport.cost = numOr0(v('cost'));
            return {
                ...o,
                kind: v('kind') || 'supply',
                factoryId: v('factoryId'),
                factoryName: (appData.companies.find(c => c.id === v('factoryId')) || {}).name || '',
                customerName: v('customerName').trim(), customerPhone: v('customerPhone').trim(), customerAddress: v('customerAddress').trim(),
                ref: v('ref').trim(), notes: v('notes').trim(),
                schedule: {
                    plannedDate: v('plannedDate'), timeFrom: v('timeFrom'), timeTo: v('timeTo'), arrivalDate: v('arrivalDate'),
                    route: v('route').trim(), actualDate: v('actualDate')
                },
                transport,
                payment: canOrd('payment') ? { terms: v('terms') || 'نقدي', paid: numOr0(v('paid')), dueDate: v('dueDate') } : (o.payment || { terms: 'نقدي', paid: 0, dueDate: '' }),
                items,
                prices
            };
        }

        // Which permission groups a change touches. Used to block a save the user is not allowed to make.
        // A new order is compared with an empty order, so only the parts that were filled in need permissions.
        const EMPTY_ORDER = {
            kind: 'supply', factoryId: '', customerName: '', customerPhone: '', customerAddress: '', ref: '', notes: '',
            items: [], prices: {}, schedule: {}, transport: { type: 'truck' }, payment: { terms: 'نقدي', paid: 0, dueDate: '' }
        };
        const nonEmpty = obj => Object.fromEntries(Object.entries(obj || {}).filter(([, v]) => v !== '' && v !== null && v !== undefined && v !== 0 && v !== false));
        function orderChangedGroups(before, after) {
            const base = before || EMPTY_ORDER;
            const groups = [];
            const contentKeys = ['kind', 'factoryId', 'customerName', 'customerPhone', 'customerAddress', 'ref', 'notes', 'items'];
            if (canon(contentKeys.map(k => base[k] ?? '')) !== canon(contentKeys.map(k => after[k] ?? ''))) groups.push('edit');
            if (canon(base.prices || {}) !== canon(after.prices || {})) groups.push('prices');
            if (canon(nonEmpty(base.schedule)) !== canon(nonEmpty(after.schedule))) groups.push('schedule');
            if (canon(nonEmpty(base.payment)) !== canon(nonEmpty(after.payment))) groups.push('payment');
            const bt = nonEmpty(base.transport), at = nonEmpty(after.transport);
            if (canon(bt) !== canon(at)) {
                // a transport change needs the permission of the new type, and of the old type when the type changed
                [...new Set([bt.type, at.type].filter(Boolean))].forEach(tp => groups.push(tp));
            }
            return groups;
        }
        const missingOrderPerms = (before, after) => orderChangedGroups(before, after)
            .map(g => ORDER_PERM[g]).filter(p => !can(p));

        function saveOrderForm(e, id) {
            e.preventDefault();
            const isNew = !id;
            if (isNew && !canOrd('create')) return toast('ليس لديك صلاحية إنشاء طلبيات', 'error');
            const before = isNew ? null : appData.orders.find(x => x.id === id);
            if (!isNew && !before) return navigate('orders');
            const base = before || { id: uid('ord-'), no: nextOrderNo(), status: 'draft', createdAt: new Date().toISOString(), createdBy: orderUserName(), items: [], prices: {}, history: [] };
            const draft = readOrderForm(base);
            const denied = missingOrderPerms(before, draft);
            if (denied.length) {
                const names = denied.map(p => PERM_LABELS[p] || p).join('، ');
                return toast(`ليس لديك صلاحية لتعديل: ${names}`, 'error', null, 6000);
            }
            if (draft.kind === 'supply' && !draft.factoryId && !draft.customerName) return toast('اختار المصنع للتوريد', 'error');
            if (draft.kind === 'delivery' && !draft.customerName) return toast('اكتب اسم العميل للتسليم', 'error');
            if (draft.schedule.timeFrom && draft.schedule.timeTo && draft.schedule.timeFrom >= draft.schedule.timeTo) return toast('ساعة النهاية لازم تكون بعد البداية', 'error');
            draft.history = [...(base.history || []), { at: new Date().toISOString(), by: orderUserName(), text: isNew ? 'إنشاء الطلبية' : 'تعديل البيانات' }];
            if (isNew) appData.orders.push(draft);
            else Object.assign(before, draft);
            saveState();
            log(isNew ? 'إضافة طلبية' : 'تعديل طلبية', orderNoLabel(draft));
            toast(isNew ? 'تم حفظ الطلبية' : 'تم حفظ التعديلات', 'success');
            navigate(`orders/${draft.id}`);
        }

        // ---- status moves ----
        function changeOrderStatus(id, to) {
            const o = appData.orders.find(x => x.id === id);
            if (!o) return;
            const move = (ORDER_NEXT[o.status] || []).find(m => m[0] === to);
            if (!move) return toast('الحركة دي مش مسموحة من الحالة الحالية', 'error');
            if (!canOrd(move[1])) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const problem = orderProblem(o, to);
            if (problem) return toast(problem, 'error', null, 5000);
            o.status = to;
            o.history = [...(o.history || []), { at: new Date().toISOString(), by: orderUserName(), text: `الحالة: ${ORDER_STATUS[to]}` }];
            saveState();
            log('حالة طلبية', `${orderNoLabel(o)} — ${ORDER_STATUS[to]}`);
            toast(`تم تغيير الحالة إلى ${ORDER_STATUS[to]}`, 'success');
            render();
        }

        function deleteOrder(id) {
            if (!canOrd('delete')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const idx = appData.orders.findIndex(x => x.id === id);
            if (idx < 0) return;
            finalizePendingUndo();
            const o = appData.orders[idx];
            appData.orders.splice(idx, 1);
            log('حذف طلبية', orderNoLabel(o));
            render();
            scheduleUndo(`تم حذف ${orderNoLabel(o)}`, () => {
                appData.orders.splice(Math.min(idx, appData.orders.length), 0, o);
                log('استعادة طلبية', orderNoLabel(o));
                render();
            }, () => {});
        }

        // A copy starts as a new draft: same parties, items and prices; dates and history are cleared.
        function copyOrder(id) {
            if (!canOrd('create')) return toast('ليس لديك صلاحية إنشاء طلبيات', 'error');
            const src = appData.orders.find(x => x.id === id);
            if (!src) return;
            const items = (src.items || []).map(it => ({ ...it, id: uid('it-') }));
            const prices = {};
            (src.items || []).forEach((it, i) => { if (src.prices && src.prices[it.id]) prices[items[i].id] = { ...src.prices[it.id] }; });
            const copy = {
                ...src, id: uid('ord-'), no: nextOrderNo(), status: 'draft', items, prices,
                schedule: { route: (src.schedule || {}).route || '' }, createdAt: new Date().toISOString(), createdBy: orderUserName(),
                history: [{ at: new Date().toISOString(), by: orderUserName(), text: `نسخة من ${orderNoLabel(src)}` }]
            };
            if (!canOrd('payment')) copy.payment = { terms: 'نقدي', paid: 0, dueDate: '' };
            appData.orders.push(copy);
            saveState();
            log('نسخ طلبية', `${orderNoLabel(src)} → ${orderNoLabel(copy)}`);
            navigate(`orders/edit/${copy.id}`);
        }
        // ---- pages: list (with tabs), schedule, reports, form, detail ----
        function ordersTabs(tab) {
            const tabBtn = (route, label, icon, key) => `<button type="button" onclick="navigate('${route}')" class="px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 ${tab === key ? 'bg-brand-600 text-white' : 'bg-white text-slate-700 border-2 border-slate-300 hover:bg-slate-50'}"><i class="fa-solid ${icon}"></i>${label}</button>`;
            return `<div class="flex flex-wrap gap-2">
                ${tabBtn('orders', 'الطلبيات', 'fa-list', 'list')}
                ${tabBtn('orders/schedule', 'لوحة الجدولة', 'fa-calendar-days', 'schedule')}
                ${canOrd('reports') ? tabBtn('orders/reports', 'التقارير', 'fa-chart-column', 'reports') : ''}
            </div>`;
        }

        function ordersTabBody(tab) {
            if (tab === 'schedule') return scheduleBoardHtml();
            if (tab === 'reports') return ordersReportsHtml();
            return `${ordersFilterBar()}${ordersListHtml()}`;
        }

        function viewOrders(param) {
            const parts = String(param || '').split('/');
            if (parts[0] === 'new') {
                if (!canOrd('create')) return { title: 'طلبية جديدة', html: noOrderAccessHtml() };
                const o = keptOrderDraft('new') || { kind: 'supply', items: [], prices: {}, schedule: {}, transport: { type: 'truck' }, payment: { terms: 'نقدي', paid: 0, dueDate: '' } };
                return { title: 'طلبية جديدة', actions: btn("navigate('orders')", 'رجوع', 'fa-arrow-right', BTN_SECONDARY), html: ordersFormHtml(o, true), after: addFirstItemIfEmpty };
            }
            if (parts[0] === 'edit' && parts[1]) {
                const o = keptOrderDraft('edit/' + parts[1]) || appData.orders.find(x => x.id === parts[1]);
                if (!o) return { title: 'الطلبيات', html: notFoundOrderHtml() };
                return { title: `تعديل ${orderNoLabel(o)}`, actions: btn(`navigate('orders/${esc(o.id)}')`, 'رجوع', 'fa-arrow-right', BTN_SECONDARY), html: ordersFormHtml(o, false) };
            }
            if (parts[0] && !['schedule', 'reports'].includes(parts[0])) {
                const o = appData.orders.find(x => x.id === parts[0]);
                if (!o) return { title: 'الطلبيات', html: notFoundOrderHtml() };
                return { title: orderNoLabel(o), actions: orderDetailActions(o), html: orderDetailHtml(o) };
            }
            const tab = parts[0] === 'schedule' ? 'schedule' : (parts[0] === 'reports' ? 'reports' : 'list');
            if (tab === 'reports' && !canOrd('reports')) return { title: 'التقارير', html: noOrderAccessHtml() };

            return {
                title: titles[tab],
                actions: canOrd('create') ? btn("navigate('orders/new')", 'طلبية جديدة', 'fa-plus') : '',
                html: `${ordersTabs(tab)}<div id="ordersBody" class="space-y-4 mt-4">${ordersTabBody(tab)}</div>`
            };
        }
        function addFirstItemIfEmpty() {
            if (el('orderItems') && !el('orderItems').children.length) addOrderItemRow();
            recalcOrderTotals();
        }
        const noOrderAccessHtml = () => `<div class="bg-white rounded-2xl border-2 border-slate-300 p-8 text-center"><i class="fa-solid fa-lock text-4xl text-slate-300 mb-3"></i><p class="text-slate-600 font-bold">ليس لديك صلاحية لهذه الصفحة</p></div>`;
        const notFoundOrderHtml = () => `<div class="bg-white rounded-2xl border-2 border-slate-300 p-8 text-center"><p class="text-slate-600 font-bold mb-4">الطلبية دي مش موجودة (ممكن تكون اتحذفت)</p>${btn("navigate('orders')", 'رجوع للطلبيات', 'fa-arrow-right', BTN_SECONDARY)}</div>`;

        // ---- detail page ----
        function orderDetailActions(o) {
            const acts = [];
            if (canOrd('print')) acts.push(btn(`printOrderDoc('${esc(o.id)}')`, 'طباعة', 'fa-print', BTN_SECONDARY));
            if (canOrd('print')) acts.push(btn(`printLoadingSlip('${esc(o.id)}')`, 'إذن تحميل', 'fa-file-signature', BTN_SECONDARY));
            if (canOrd('edit') || canOrd('schedule') || canOrd('payment') || canOrd('prices') || ['truck', 'car', 'other'].some(k => can(ORDER_PERM[k]))) {
                acts.push(btn(`navigate('orders/edit/${esc(o.id)}')`, 'تعديل', 'fa-pen', BTN_SECONDARY));
            }
            return `<div class="flex flex-wrap gap-2">${acts.join('')}</div>`;
        }

        function orderDetailHtml(o) {
            const t = orderTotals(o);
            const s = o.schedule || {}, tr = o.transport || {}, pay = o.payment || {};
            const moves = (ORDER_NEXT[o.status] || []).filter(m => canOrd(m[1]));
            const moveBtns = moves.map(([to, perm, label]) => `<button type="button" onclick="changeOrderStatus('${esc(o.id)}', '${to}')" class="${to === 'cancelled' ? 'px-4 py-2 rounded-lg text-sm font-bold bg-rose-600 hover:bg-rose-700 text-white' : BTN_PRIMARY} whitespace-nowrap">${label}</button>`).join('');
            const warn = orderWarnBadges(o);
            const row = (label, value) => `<div class="flex justify-between gap-3 py-2 border-b border-slate-200 text-sm"><span class="text-slate-600 font-bold">${label}</span><span class="text-slate-900 text-end">${value || '—'}</span></div>`;
            const card = (title, icon, body) => `<section class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 sm:p-5"><h3 class="font-bold text-slate-800 mb-2"><i class="fa-solid ${icon} text-brand-600"></i> ${title}</h3>${body}</section>`;
            const itemRows = (o.items || []).map((it, i) => {
                const l = lineCalc(it, priceOf(o, it.id));
                return `<tr class="border-t border-slate-200">

        // ---- reports (tab): by status, by party, by product ----
        function ordersReportRows() {
            const f = ordersRepFilter;
            return appData.orders.filter(o => {
                const d = orderDateOf(o);
                if (f.from && (!d || d < f.from)) return false;
                if (f.to && (!d || d > f.to)) return false;
                return true;
            });
        }
        function groupRows(rows, keyOf, labelOf) {
            const map = new Map();
            rows.forEach(o => {
                const k = keyOf(o);
                if (!map.has(k)) map.set(k, { label: labelOf(o, k), count: 0, m2: 0, boxes: 0, kg: 0, net: 0 });
                const g = map.get(k), t = orderTotals(o);
                g.count++; g.m2 = r2(g.m2 + t.m2); g.boxes = r2(g.boxes + t.boxes); g.kg = r2(g.kg + t.kg); g.net = r2(g.net + t.net);
            });
            return [...map.values()].sort((a, b) => b.count - a.count);
        }
        function reportTables(rows) {
            const showPrice = canOrd('prices');
            const table = (title, groups) => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 overflow-x-auto">
                <h3 class="font-bold text-slate-800 mb-2">${title}</h3>
                <table class="w-full text-sm"><thead class="bg-slate-50 font-bold"><tr><th class="py-2 px-2 text-start">البند</th><th class="py-2 px-2 text-start">عدد</th>
                <th class="py-2 px-2 text-start">م²</th><th class="py-2 px-2 text-start">كرتونة</th><th class="py-2 px-2 text-start">كجم</th>${showPrice ? '<th class="py-2 px-2 text-start">الصافي</th>' : ''}</tr></thead>
                <tbody>${groups.map(g => `<tr class="border-t border-slate-200"><td class="py-2 px-2">${esc(g.label)}</td><td class="py-2 px-2">${g.count}</td>
                <td class="py-2 px-2">${fmtDigits(g.m2)}</td><td class="py-2 px-2">${fmtDigits(g.boxes)}</td><td class="py-2 px-2">${fmtDigits(g.kg)}</td>
                ${showPrice ? `<td class="py-2 px-2 font-bold">${fmtMoney(g.net)}</td>` : ''}</tr>`).join('') || '<tr><td colspan="6" class="py-2 px-2 text-slate-500">لا توجد بيانات</td></tr>'}</tbody></table></div>`;
            return table('حسب الحالة', groupRows(rows, o => o.status, (o, k) => ORDER_STATUS[k] || k))
                + table('حسب المصنع / العميل', groupRows(rows, o => (o.kind === 'supply' ? 'f:' + (o.factoryName || '—') : 'c:' + (o.customerName || '—')), (o, k) => (o.kind === 'supply' ? 'مصنع: ' : 'عميل: ') + k.slice(2)))
                + table('حسب نوع الصنف', groupRows(rows.flatMap(o => (o.items || []).map(it => ({ ...o, items: [it], prices: { [it.id]: priceOf(o, it.id) } }))), o => o.items[0].product, (o, k) => k));
        }

        // ---- Excel ----
        function orderExportRow(o) {
            const t = orderTotals(o), s = o.schedule || {};
            const row = {
                'الرقم': orderNoLabel(o), 'النوع': ORDER_KIND[o.kind] || '', 'المصنع': o.factoryName || '', 'العميل': o.customerName || '',
                'تاريخ الجدولة': s.plannedDate || '', 'من': s.timeFrom || '', 'إلى': s.timeTo || '', 'تاريخ الوصول': s.arrivalDate || '',
                'الوسيلة': o.transport && o.transport.type ? ORDER_TRANSPORT[o.transport.type] : '', 'الحالة': ORDER_STATUS[o.status] || '',
                'م²': t.m2, 'كرتونة': t.boxes, 'قطعة': t.pieces, 'كجم': t.kg
            };
            if (canOrd('prices')) { row['الإجمالي'] = t.subtotal; row['الخصم'] = t.discount; row['الصافي'] = t.net; }
            if (canOrd('payment')) { row['المدفوع'] = numOr0(o.payment && o.payment.paid); row['المتبقي'] = orderBalance(o); }
            return row;
        }
        function writeXlsx(sheets, fileName) {
            if (typeof XLSX === 'undefined') return toast('مكتبة الإكسيل غير متاحة. تأكد من الإنترنت', 'error', null, 5000);
            const wb = XLSX.utils.book_new();
            sheets.forEach(([name, rows]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ ملاحظة: 'لا توجد بيانات' }]), name));
            XLSX.writeFile(wb, `${fileName}-${todayISO()}.xlsx`);
        }
        function exportOrdersXlsx() {
            if (!canOrd('export')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const rows = filteredOrders();
            const items = rows.flatMap(o => (o.items || []).map(it => {
                const l = lineCalc(it, priceOf(o, it.id));
                const r = { 'الرقم': orderNoLabel(o), 'النوع': it.product, 'الكود': it.code, 'الاسم': it.name, 'المقاس': it.size, 'الدرجة': it.shade, 'الوحدة': it.unit, 'الكمية': numOr0(it.qty), 'م²': l.m2, 'كجم': l.kg };
                if (canOrd('prices')) { r['السعر'] = numOr0(priceOf(o, it.id).unitPrice); r['خصم %'] = numOr0(priceOf(o, it.id).discount); r['الصافي'] = l.net; }

            }));

            if (!canOrd('export')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');

            writeXlsx([
                ['الطلبيات', rows.map(orderExportRow)],
                ['حسب الحالة', sheet(groupRows(rows, o => o.status, (o, k) => ORDER_STATUS[k] || k), 'الحالة')],
                ['حسب الطرف', sheet(groupRows(rows, o => (o.kind === 'supply' ? 'f:' + (o.factoryName || '—') : 'c:' + (o.customerName || '—')), (o, k) => k.slice(2)), 'المصنع / العميل')],
                ['حسب الصنف', sheet(groupRows(rows.flatMap(o => (o.items || []).map(it => ({ ...o, items: [it], prices: { [it.id]: priceOf(o, it.id) } }))), o => o.items[0].product, (o, k) => k), 'الصنف')]
            ], `تقرير-الطلبيات-${f.from || 'من-البداية'}`);
        }

        // ---- storage: one database node per part of the order, so each part has its own permission ----
        // orders/{id}            header: no, kind, parties, notes (orders.edit)
        // orderStatus/{id}       { status } (orders.confirm / orders.execute)
        // orderItems/{id}        { items }  (orders.edit)
        // orderPrices/{id}       { prices } (orders.prices)
        // orderSchedule/{id}     { schedule } (orders.schedule)
        // orderPayment/{id}      { payment } (orders.payment)
        // orderHistory/{id}      { history } (anyone who can view)
        // orderTransport/{type}/{id}  { transport } (orders.transport_<type>)
        // A part is written only if its listener has loaded (ready) and the user may write it, so a partial load or
        // a missing permission can never overwrite or delete data the user did not see.
        const ORD_GROUPS = [
            ['orders', 'orders.view'], ['orderStatus', 'orders.view'], ['orderItems', 'orders.view'], ['orderSchedule', 'orders.view'],
            ['orderHistory', 'orders.view'], ['orderPrices', 'orders.prices'], ['orderPayment', 'orders.payment'],
            ['orderTransport/truck', 'orders.transport_truck'], ['orderTransport/car', 'orders.transport_car'], ['orderTransport/other', 'orders.transport_other']
        ];
        function orderDocsFor(list, out) {
            const ready = coll => !!(fbCache && fbCache.ord && fbCache.ord[coll] !== undefined);
            const usable = (coll, perm) => ready(coll) && can(perm);
            const nz = obj => Object.keys(obj || {}).some(k => obj[k] !== '' && obj[k] !== null && obj[k] !== undefined && obj[k] !== 0 && obj[k] !== false);
            list.forEach(o => {
                if (usable('orders', 'orders.view')) out.set('orders/' + o.id, {
                    id: o.id, no: o.no, kind: o.kind, factoryId: o.factoryId || '', factoryName: o.factoryName || '',
                    customerName: o.customerName || '', customerPhone: o.customerPhone || '', customerAddress: o.customerAddress || '',
                    ref: o.ref || '', notes: o.notes || '', createdAt: o.createdAt || '', createdBy: o.createdBy || ''
                });
                if (usable('orderStatus', 'orders.view')) out.set('orderStatus/' + o.id, { status: o.status });
                if (usable('orderItems', 'orders.view') && (o.items || []).length) out.set('orderItems/' + o.id, { items: o.items });
                if (usable('orderHistory', 'orders.view') && (o.history || []).length) out.set('orderHistory/' + o.id, { history: o.history });
                if (usable('orderPrices', 'orders.prices') && nz(o.prices)) out.set('orderPrices/' + o.id, { prices: o.prices });
                if (usable('orderSchedule', 'orders.schedule') && nz(o.schedule)) out.set('orderSchedule/' + o.id, { schedule: o.schedule });
                if (usable('orderPayment', 'orders.payment') && nz(o.payment)) out.set('orderPayment/' + o.id, { payment: o.payment });
                const t = o.transport || {};
                if (t.type && usable('orderTransport/' + t.type, ORDER_PERM[t.type])) out.set(`orderTransport/${t.type}/${o.id}`, { transport: t });
            });
        }
        // rebuild the in-memory orders from the parts that have loaded
        function buildOrdersFromCache(c) {
            const ord = c.ord || {};
            const part = (coll, key) => { const m = {}; Object.values(ord[coll] || {}).forEach(d => { m[d.id] = d[key]; }); return m; };
            const headers = Object.values(ord.orders || {});
            const status = part('orderStatus', 'status'), items = part('orderItems', 'items'), prices = part('orderPrices', 'prices'),
                sched = part('orderSchedule', 'schedule'), pay = part('orderPayment', 'payment'), hist = part('orderHistory', 'history');
            const transport = {};
            ['truck', 'car', 'other'].forEach(tp => Object.values(ord['orderTransport/' + tp] || {}).forEach(d => { transport[d.id] = d.transport; }));
            return headers.map(h => {
                const { pos, ...rest } = h;
                return {
                    ...rest, status: status[h.id], items: items[h.id] || [], prices: prices[h.id] || {}, schedule: sched[h.id] || {},
                    payment: pay[h.id] || {}, history: hist[h.id] || [], transport: transport[h.id] || { type: 'truck' }
                };
            });
        }

        // Permission-gated listeners. Nothing is subscribed without its permission (a denied listener would sign the user out).
        function syncOrdersListener() {
            if (!fbCache || !fbUser) return;
            let changed = false;
            ORD_GROUPS.forEach(([coll, perm]) => {
                const want = can(perm), live = fbOrdLive.has(coll);
                if (want && !live) {
                    const unsub = fbDb.collection(coll).onSnapshot(snap => {
                        if (!fbCache) return;
                        fbCache.ord = fbCache.ord || {};
                        fbCache.ord[coll] = mapDocs(snap);
                        onCacheChanged();
                    }, err => console.error('orders listener ' + coll, err));
                    fbOrdLive.set(coll, unsub);
                } else if (!want && live) {
                    try { fbOrdLive.get(coll)(); } catch (e) { /* already closed */ }
                    fbOrdLive.delete(coll);
                    if (fbCache && fbCache.ord) delete fbCache.ord[coll];
                    fbBaseline.forEach((b, key) => { if (key.startsWith(coll + '/')) fbBaseline.delete(key); });
                    changed = true;
                }
            });
            if (changed) onCacheChanged();
        }

            let effSum = 0, effCount = 0;
            appData.companies.forEach(c => c.lists.forEach(l => {
                s.totalLists++;
                const st = listState(l);
                if (!st.active) s.expired++;
                else {
                    s.active++;
                    effSum += effValue(l);
                    effCount++;
                    if (st.expiring) { s.expiring++; s.expItems.push({ c, l, days: st.days }); }
                    else s.activeOnly++;
                }
            }));
            s.avgEff = effCount ? effSum / effCount : 0;
            s.expItems.sort((a, b) => a.days - b.days);
            s.perCompany = appData.companies.map(c => {
                const total = c.lists.length;
                const active = c.lists.filter(l => listState(l).active).length;
                const eff = total ? c.lists.reduce((a, l) => a + effValue(l), 0) / total : 0;
                return { c, total, active, eff };
            }).sort((a, b) => b.total - a.total || a.c.name.localeCompare(b.c.name, 'ar'));
            return s;
        }
