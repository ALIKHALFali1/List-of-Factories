        let checksQuery = '';
        let partnersQuery = '';
        let scheduleDays = 7;                       // alert window in days
        let reportFilter = { from: '', to: '', partnerId: '', status: 'all' };
        let checkModalId = null;
        let checksFilter = { status: 'all', payee: '', from: '', to: '', sort: 'due' };
        let checkSelection = new Set();      // ids of checks ticked in the list
        let lastVisibleCheckIds = [];        // ids shown in the last list (for select-all)
        const CHECK_MAX_AMOUNT = 999999999999.99;

        const AR_ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة'];
        const AR_TEENS = ['عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
        const AR_TENS = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
        const AR_HUNDREDS = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
        const AR_THOUSANDS = { one: 'ألف', two: 'ألفان', plural: 'آلاف', sing: 'ألف', acc: 'ألفاً' };
        const AR_MILLIONS = { one: 'مليون', two: 'مليونان', plural: 'ملايين', sing: 'مليون', acc: 'مليوناً' };
        const AR_BILLIONS = { one: 'مليار', two: 'ملياران', plural: 'مليارات', sing: 'مليار', acc: 'ملياراً' };
        const AR_PIASTERS = { one: 'قرش', two: 'قرشان', plural: 'قروش', sing: 'قرش', acc: 'قرشاً' };

        // 1..999 in words
        function arabicUnder1000(n) {
            const h = Math.floor(n / 100), r = n % 100;
            const parts = [];
            if (h) parts.push(AR_HUNDREDS[h]);
            if (r) {
                if (r < 10) parts.push(AR_ONES[r]);
                else if (r < 20) parts.push(AR_TEENS[r - 10]);
                else if (r % 10 === 0) parts.push(AR_TENS[r / 10]);
                else parts.push(AR_ONES[r % 10] + ' و' + AR_TENS[Math.floor(r / 10)]);
            }
            return parts.join(' و');
        }

        // a count with its unit (ألف / مليون / قرش ...), c = 1..999
        function arabicScaled(c, s) {
            if (c === 1) return s.one;
            if (c === 2) return s.two;
            const r = c % 100;
            const noun = (r >= 3 && r <= 10) ? s.plural : (c < 100 ? s.acc : s.sing);
            return arabicUnder1000(c) + ' ' + noun;
        }

        // whole number in Arabic words, 0 .. 999,999,999,999
        function arabicInteger(n) {
            if (n === 0) return 'صفر';
            const groups = [[1e9, AR_BILLIONS], [1e6, AR_MILLIONS], [1e3, AR_THOUSANDS]];
            const parts = [];
            let rest = n;
            groups.forEach(([size, unit]) => {
                const c = Math.floor(rest / size);
                if (c) parts.push(arabicScaled(c, unit));
                rest %= size;
            });
            if (rest) parts.push(arabicUnder1000(rest));
            return parts.reduce((acc, p) => acc === '' ? p : acc + ' و' + p, '');
        }

        // 1250.5 -> "ألف ومائتان وخمسون جنيه مصري وخمسون قرشاً"
        function amountToArabicWords(amount) {
            const cents = Math.round(Number(amount) * 100);
            if (!(cents >= 0)) return '';
            const pounds = Math.floor(cents / 100), piasters = cents % 100;
            let text = arabicInteger(pounds) + ' جنيه مصري';
            if (piasters) text += ' و' + arabicScaled(piasters, AR_PIASTERS);
            return text;
        }

        function fmtDateAr(iso) {
            const [y, m, d] = String(iso || '').split('-');
            return (y && m && d) ? `${d}/${m}/${y}` : '';
        }

        function fmtDigits(n) {
            return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function updateAmountWords(value) {
            const box = document.getElementById('amountWords');
            if (!box) return;
            const n = Number(value);
            box.textContent = (n > 0 && n <= CHECK_MAX_AMOUNT)
                ? 'بالحروف: فقط ' + amountToArabicWords(n) + ' لا غير'
                : 'اكتب المبلغ عشان يظهر بالحروف';
        }

        const MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        const r2 = n => Math.round(n * 100) / 100;
        const sumAmt = rows => r2(rows.reduce((s, c) => s + (Number(c.amount) || 0), 0));
        const byDue = (a, b) => (a.dueDate || '').localeCompare(b.dueDate || '') || String(a.number).localeCompare(String(b.number));
        const isOpen = c => !c.cashed;
        const isOverdue = c => !c.cashed && !!c.dueDate && c.dueDate < todayISO();

        function monthLabel(ym) {
            const [y, m] = String(ym || '').split('-');
            return (y && m && MONTHS_AR[Number(m) - 1]) ? `${MONTHS_AR[Number(m) - 1]} ${y}` : 'بدون تاريخ';
        }

        function addDaysISO(iso, n) {
            const d = new Date(iso + 'T00:00:00');
            d.setDate(d.getDate() + n);
            return toISODate(d);
        }

        // open amount of one partner (cashed checks do not count); exceptId leaves one check out
        function partnerOpenTotal(partnerId, exceptId = null) {
            return r2(appData.checks
                .filter(c => c.payeeId === partnerId && !c.cashed && c.id !== exceptId)
                .reduce((s, c) => s + (Number(c.amount) || 0), 0));
        }
        function partnerOver(p) {
            return !!p && p.limit > 0 && partnerOpenTotal(p.id) > p.limit + 1e-9;
        }

        function alertsSummary() {
            const today = todayISO(), upto = addDaysISO(today, scheduleDays);
            const open = appData.checks.filter(isOpen);
            return {
                overdue: open.filter(c => c.dueDate && c.dueDate < today).sort(byDue),
                soon: open.filter(c => c.dueDate >= today && c.dueDate <= upto).sort(byDue)
            };
        }

        function alertBanner() {
            const { overdue, soon } = alertsSummary();
            if (!overdue.length && !soon.length) return '';
            return `<div class="rounded-2xl border-2 border-amber-300 bg-amber-50 p-4 flex flex-wrap items-center justify-between gap-2">
                <p class="font-bold text-amber-900"><i class="fa-solid fa-bell"></i> ${overdue.length} شيك متأخر، و${soon.length} شيك قرب ميعاده</p>
                <a href="#/checks/schedule" class="text-sm font-bold text-brand-700 underline">عرض التنبيهات</a>
            </div>`;
        }

        function statusBadge(c) {
            if (c.cashed) return '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 whitespace-nowrap">مصروف</span>';
            if (isOverdue(c)) return '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 whitespace-nowrap">متأخر</span>';
            return '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 whitespace-nowrap">مفتوح</span>';
        }

        // limit cell: open amount against the limit, with a bar; red when over
        function limitCell(p) {
            if (!(p.limit > 0)) return '<span class="text-sm text-slate-500">بدون حد</span>';
            const open = partnerOpenTotal(p.id);
            const pct = Math.min(100, Math.round(open / p.limit * 100));
            const over = open > p.limit + 1e-9;
            return `<div class="min-w-[160px]">
                <div class="text-xs font-bold ${over ? 'text-rose-700' : 'text-slate-700'}">${fmtMoney(open)} من ${fmtMoney(p.limit)}${over ? ' — تجاوز الحد' : ''}</div>
                <div class="h-2 rounded-full bg-slate-200 mt-1 overflow-hidden"><div class="h-full ${over ? 'bg-rose-600' : (pct >= 80 ? 'bg-amber-500' : 'bg-brand-600')}" style="width:${pct}%"></div></div>
            </div>`;
        }

        function checksTab(route, label, icon, active) {
            return `<button type="button" onclick="navigate('${route}')" class="px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border-2 ${active ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}"><i class="fa-solid ${icon}"></i>${label}</button>`;
        }

        function viewChecks(param) {
            if (param && param.startsWith('partners/')) return viewStatement(param.slice('partners/'.length));
            const tab = ['schedule', 'reports', 'partners'].includes(param) ? param : 'checks';
            const titles = { checks: 'الشيكات', schedule: 'الجدول الشهري', reports: 'تقارير الشيكات', partners: 'المستفيدون' };
            const tabs = `<div class="flex flex-wrap gap-2">
                ${checksTab('checks', 'الشيكات', 'fa-money-check-dollar', tab === 'checks')}
                ${checksTab('checks/schedule', 'الجدول الشهري', 'fa-calendar-days', tab === 'schedule')}
                ${checksTab('checks/reports', 'التقارير', 'fa-chart-column', tab === 'reports')}
                ${checksTab('checks/partners', 'المستفيدون', 'fa-handshake', tab === 'partners')}
            </div>`;
            let tools = '';
            if (tab === 'checks' || tab === 'partners') {
                const isP = tab === 'partners';
                const addBtn = can('checks.manage')
                    ? btn(isP ? 'openPartnerModal()' : 'openCheckModal()', isP ? 'مستفيد جديد' : 'شيك جديد', 'fa-plus')
                    : '';
                tools = `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
                    <div class="relative flex-1 max-w-md">
                        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="search" value="${esc(isP ? partnersQuery : checksQuery)}"
                               oninput="${isP ? 'partnersQuery' : 'checksQuery'} = this.value; updateChecksBody()"
                               placeholder="${isP ? 'ابحث باسم المستفيد' : 'ابحث برقم الشيك أو البنك أو المستفيد'}"
                               class="${INPUT_CLS} pr-9">
                    </div>
                    ${addBtn}
                </div>${isP ? '' : checksFilterBar()}`;
            } else if (tab === 'reports') {
                tools = reportFilterHtml();
            }
            return {
                title: titles[tab],
                actions: '',
                html: `<div class="space-y-4">${tabs}${tools}<div id="checksBody">${checksBodyFor(tab)}</div></div>`
            };
        }

        function updateChecksBody() {
            const body = document.getElementById('checksBody');
            if (body) body.innerHTML = checksBodyFor(parseRoute().param);
        }

        function checksBodyFor(tab) {
            if (tab === 'partners') return partnersBodyHtml();
            if (tab === 'schedule') return scheduleBodyHtml();
            if (tab === 'reports') return reportsBodyHtml();
            return checksListHtml();
        }

        function checkRowActions(c) {
            const manage = can('checks.manage');
            const id = esc(c.id);
            return `<button type="button" onclick="printCheck('${id}')" title="طباعة الشيك" aria-label="طباعة الشيك" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-print"></i></button>`
                + (manage ? `<button type="button" onclick="toggleCashed('${id}')" title="${c.cashed ? 'إلغاء الصرف' : 'تم الصرف'}" aria-label="${c.cashed ? 'إلغاء الصرف' : 'تم الصرف'}" class="${BTN_ICON} ${c.cashed ? 'text-emerald-600 hover:bg-emerald-50' : 'text-slate-500 hover:text-emerald-600 hover:bg-emerald-50'}"><i class="fa-solid ${c.cashed ? 'fa-rotate-left' : 'fa-circle-check'}"></i></button>`
                    + `<button type="button" onclick="openCheckModal('${id}', { copy: true })" title="نسخ كشيك جديد" aria-label="نسخ كشيك جديد" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-copy"></i></button>`
                    + `<button type="button" onclick="openCheckModal('${id}')" title="تعديل" aria-label="تعديل" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-pen-to-square"></i></button>`
                    + `<button type="button" onclick="deleteCheck('${id}')" title="حذف" aria-label="حذف" class="${BTN_ICON} text-slate-400 hover:text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>` : '');
        }

        // one table (desktop) or cards (phone) for any list of checks; select = show checkboxes
        function checksTableHtml(rows, select = false) {
            if (!rows.length) return '<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-6 text-center text-slate-600 font-bold">مفيش شيكات</div>';
            const box = c => select
                ? `<input type="checkbox" aria-label="تحديد الشيك ${esc(c.number)}" ${checkSelection.has(c.id) ? 'checked' : ''} onchange="toggleCheckSel('${esc(c.id)}', this.checked)" class="w-4 h-4 accent-brand-600">`
                : '';
            const allChecked = rows.every(c => checkSelection.has(c.id));
            return `<div class="hidden md:block bg-white rounded-2xl border-2 border-slate-300 shadow-lg overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 text-slate-700 font-bold border-b-2 border-slate-300">
                        <tr>
                            ${select ? `<th class="py-3 px-4"><input type="checkbox" aria-label="تحديد الكل" ${allChecked ? 'checked' : ''} onchange="toggleAllCheckSel(this.checked)" class="w-4 h-4 accent-brand-600"></th>` : ''}
                            <th class="py-3 px-4 text-start">رقم الشيك</th>
                            <th class="py-3 px-4 text-start">البنك</th>
                            <th class="py-3 px-4 text-start">المستفيد</th>
                            <th class="py-3 px-4 text-start">المبلغ</th>
                            <th class="py-3 px-4 text-start">تاريخ الاستحقاق</th>
                            <th class="py-3 px-4 text-start">الحالة</th>
                            <th class="py-3 px-4 text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        ${rows.map(c => `<tr class="hover:bg-slate-50 ${checkSelection.has(c.id) ? 'bg-brand-50/60' : ''}">
                            ${select ? `<td class="py-3 px-4">${box(c)}</td>` : ''}
                            <td class="py-3 px-4 font-mono font-bold">${esc(c.number)}</td>
                            <td class="py-3 px-4 font-semibold">${esc(c.bank)}</td>
                            <td class="py-3 px-4 font-semibold">${esc(c.payeeName)}</td>
                            <td class="py-3 px-4 font-bold whitespace-nowrap">${fmtMoney(c.amount)}</td>
                            <td class="py-3 px-4 whitespace-nowrap">${esc(fmtDateAr(c.dueDate))}</td>
                            <td class="py-3 px-4">${statusBadge(c)}</td>
                            <td class="py-3 px-4"><div class="flex justify-center gap-1">${checkRowActions(c)}</div></td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
            <div class="md:hidden space-y-3">
                ${rows.map(c => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 ${checkSelection.has(c.id) ? 'ring-2 ring-brand-400' : ''}">
                    <div class="flex items-start justify-between gap-2">
                        <div class="flex items-start gap-2 min-w-0">
                            ${box(c)}
                            <div class="min-w-0">
                                <p class="font-mono font-bold text-slate-800">${esc(c.number)}</p>
                                <p class="font-semibold text-slate-700 truncate">${esc(c.bank)}</p>
                            </div>
                        </div>
                        <div class="text-end">
                            <p class="font-bold text-brand-700 whitespace-nowrap">${fmtMoney(c.amount)}</p>
                            ${statusBadge(c)}
                        </div>
                    </div>
                    <p class="text-sm text-slate-700 mt-2"><span class="font-bold">المستفيد:</span> ${esc(c.payeeName)}</p>
                    <p class="text-sm text-slate-700"><span class="font-bold">تاريخ الاستحقاق:</span> ${esc(fmtDateAr(c.dueDate))}</p>
                    <div class="flex justify-end gap-1 mt-2">${checkRowActions(c)}</div>
                </div>`).join('')}
            </div>`;
        }

        // ---- list filters, sorting and summary (الشيكات tab) ----
        const CHECKS_FILTER_DEFAULT = { status: 'all', payee: '', from: '', to: '', sort: 'due' };

        function filteredChecksList() {
            const q = checksQuery.trim().toLowerCase(), f = checksFilter;
            const rows = appData.checks.filter(c => {
                if (q && !`${c.number} ${c.bank} ${c.payeeName}`.toLowerCase().includes(q)) return false;
                if (f.status === 'open' && c.cashed) return false;
                if (f.status === 'cashed' && !c.cashed) return false;
                if (f.status === 'overdue' && !isOverdue(c)) return false;
                if (f.payee && c.payeeId !== f.payee) return false;
                if (f.from && c.dueDate < f.from) return false;
                if (f.to && c.dueDate > f.to) return false;
                return true;
            });
            const amt = c => Number(c.amount) || 0;
            const sorters = {
                due: byDue,
                due_desc: (a, b) => -byDue(a, b),
                amount_desc: (a, b) => amt(b) - amt(a) || byDue(a, b),
                amount_asc: (a, b) => amt(a) - amt(b) || byDue(a, b),
                payee: (a, b) => String(a.payeeName).localeCompare(String(b.payeeName), 'ar') || byDue(a, b)
            };
            return rows.sort(sorters[f.sort] || byDue);
        }

        function checksFilterDescription() {
            const f = checksFilter;
            const status = { all: 'الكل', open: 'مفتوح', overdue: 'متأخر', cashed: 'مصروف' };
            const parts = ['الحالة: ' + (status[f.status] || 'الكل')];
            if (f.from || f.to) parts.push(`الاستحقاق من ${f.from || 'البداية'} إلى ${f.to || 'النهاية'}`);
            if (f.payee) { const p = appData.partners.find(x => x.id === f.payee); if (p) parts.push('المستفيد: ' + p.name); }
            return parts.join(' — ');
        }

        function checksFilterBar() {
            const f = checksFilter;
            const payees = [...appData.partners].sort((a, b) => a.name.localeCompare(b.name, 'ar'))
                .map(p => `<option value="${esc(p.id)}" ${f.payee === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
            const opt = (cur, v, l) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`;
            return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 space-y-3">
                <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
                    ${field('الحالة', `<select onchange="setChecksFilter('status', this.value)" class="${INPUT_CLS}">${opt(f.status, 'all', 'الكل')}${opt(f.status, 'open', 'مفتوح')}${opt(f.status, 'overdue', 'متأخر')}${opt(f.status, 'cashed', 'مصروف')}</select>`)}
                    ${field('المستفيد', `<select onchange="setChecksFilter('payee', this.value)" class="${INPUT_CLS}"><option value="">كل المستفيدين</option>${payees}</select>`)}
                    ${field('استحقاق من', `<input type="date" value="${esc(f.from)}" onchange="setChecksFilter('from', this.value)" class="${INPUT_CLS}">`)}
                    ${field('استحقاق إلى', `<input type="date" value="${esc(f.to)}" onchange="setChecksFilter('to', this.value)" class="${INPUT_CLS}">`)}
                    ${field('الترتيب', `<select onchange="setChecksFilter('sort', this.value)" class="${INPUT_CLS}">${opt(f.sort, 'due', 'الأقرب استحقاقاً')}${opt(f.sort, 'due_desc', 'الأبعد استحقاقاً')}${opt(f.sort, 'amount_desc', 'المبلغ الأكبر')}${opt(f.sort, 'amount_asc', 'المبلغ الأصغر')}${opt(f.sort, 'payee', 'اسم المستفيد')}</select>`)}
                </div>
                <div class="flex flex-wrap gap-2 justify-end">
                    ${btn('clearChecksFilter()', 'مسح الفلاتر', 'fa-filter-circle-xmark', BTN_SECONDARY)}
                    ${btn('printChecksList()', 'طباعة القائمة', 'fa-print', BTN_SECONDARY)}
                    ${btn('exportChecksList()', 'تصدير Excel', 'fa-file-excel', BTN_SECONDARY)}
                </div>
            </div>`;
        }

        function checksSummaryCards(rows) {
            const today = todayISO(), upto = addDaysISO(today, 7);
            const open = rows.filter(isOpen), overdue = rows.filter(isOverdue);
            const soon = open.filter(c => c.dueDate >= today && c.dueDate <= upto);
            const cashedRows = rows.filter(c => !isOpen(c));
            const card = (label, value, cls) => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-3">
                <p class="text-xs font-bold text-slate-600">${label}</p><p class="text-base font-bold ${cls} whitespace-nowrap">${value}</p></div>`;
            return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                ${card('المفتوح', `${open.length} شيك — ${fmtMoney(sumAmt(open))}`, 'text-amber-700')}
                ${card('متأخر', `${overdue.length} شيك — ${fmtMoney(sumAmt(overdue))}`, 'text-rose-700')}
                ${card('يستحق خلال 7 أيام', `${soon.length} شيك — ${fmtMoney(sumAmt(soon))}`, 'text-brand-700')}
                ${card('المصروف', `${cashedRows.length} شيك — ${fmtMoney(sumAmt(cashedRows))}`, 'text-emerald-700')}
            </div>`;
        }

        function checksBulkBar() {
            if (!checkSelection.size) return '';
            const manage = can('checks.manage');
            return `<div class="rounded-2xl border-2 border-brand-400 bg-brand-50 p-3 flex flex-wrap items-center justify-between gap-2 shadow">
                <p class="font-bold text-brand-900">محدد ${checkSelection.size} شيك</p>
                <div class="flex flex-wrap gap-2">
                    ${manage ? btn('bulkSetCashed(true)', 'تم الصرف للمحدد', 'fa-circle-check') : ''}
                    ${manage ? btn('bulkSetCashed(false)', 'إلغاء الصرف للمحدد', 'fa-rotate-left', BTN_SECONDARY) : ''}
                    ${btn('exportSelectedChecks()', 'تصدير المحدد', 'fa-file-excel', BTN_SECONDARY)}
                    <button type="button" onclick="clearCheckSelection()" class="${BTN_SECONDARY}">إلغاء التحديد</button>
                </div>
            </div>`;
        }

        function checksListHtml() {
            if (!appData.checks.length) {
                return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-8 text-center">
                    <i class="fa-solid fa-money-check-dollar text-4xl text-slate-300 mb-3"></i>
                    <p class="text-slate-700 font-bold mb-4">مفيش شيكات مسجلة لسه</p>
                    ${can('checks.manage') ? btn('openCheckModal()', 'شيك جديد', 'fa-plus') : ''}
                </div>`;
            }
            const rows = filteredChecksList();
            lastVisibleCheckIds = rows.map(c => c.id);
            const body = rows.length
                ? checksTableHtml(rows, true)
                : '<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-8 text-center text-slate-600 font-bold">مفيش نتايج للفلاتر دي</div>';
            return `${alertBanner()}${checksSummaryCards(rows)}${checksBulkBar()}${body}`;
        }

        function setChecksFilter(key, value) {

        // ---- periodic checks report (التقرير الدوري): settings are kept on this browser ----
        const CHECK_REPORT_KEY = 'factoryChecksReportSchedule';
        const WEEKDAYS_AR = [['السبت', 6], ['الأحد', 0], ['الاثنين', 1], ['الثلاثاء', 2], ['الأربعاء', 3], ['الخميس', 4], ['الجمعة', 5]];

        function loadCheckReport() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(CHECK_REPORT_KEY) || '{}') || {}; } catch (e) { saved = {}; }
            return Object.assign({ enabled: false, frequency: 'weekly', weekdays: [4], dayOfMonth: 1, everyDays: 14, windowDays: 7, includeOverdue: true, nextRun: '', dismissedOn: '' }, saved);
        }

        function saveCheckReport(s) {
            try { localStorage.setItem(CHECK_REPORT_KEY, JSON.stringify(s)); }
            catch (e) { toast('تعذر حفظ إعدادات التقرير على المتصفح', 'error'); }
        }

        // the given day of a month (day clamped to 1..28 so every month has it)
        function monthlyDate(iso, dom) {
            const [y, m] = iso.split('-').map(Number);
            return toISODate(new Date(y, m - 1, Math.min(Math.max(Number(dom) || 1, 1), 28)));
        }

        // first run on or after fromISO
        function checkReportFirstRun(s, fromISO) {
            if (s.frequency === 'weekly') {
                const days = (s.weekdays && s.weekdays.length) ? s.weekdays : [4];
                let d = fromISO;
                for (let i = 0; i < 7; i++) {
                    if (days.includes(new Date(d + 'T00:00:00').getDay())) return d;
                    d = addDaysISO(d, 1);
                }
                return fromISO;
            }
            if (s.frequency === 'monthly') {
                const cand = monthlyDate(fromISO, s.dayOfMonth);
                if (cand >= fromISO) return cand;
                const [y, m] = fromISO.split('-').map(Number);
                return monthlyDate(toISODate(new Date(y, m, 1)), s.dayOfMonth);
            }
            return fromISO;
        }

        // the run that comes after runISO
        function checkReportAdvance(s, runISO) {
            if (s.frequency === 'weekly') return checkReportFirstRun(s, addDaysISO(runISO, 1));
            if (s.frequency === 'monthly') {
                const [y, m] = runISO.split('-').map(Number);
                return monthlyDate(toISODate(new Date(y, m, 1)), s.dayOfMonth);
            }
            return addDaysISO(runISO, Math.max(1, Number(s.everyDays) || 14));
        }

        // after a report is marked done: the next run strictly after today (missed runs are skipped)
        function checkReportSkipTo(s, fromISO) {
            let next = checkReportAdvance(s, fromISO), guard = 0;
            while (next <= todayISO() && guard++ < 1000) next = checkReportAdvance(s, next);
            return next;
        }

        function checkReportDue(s) {
            return !!s.enabled && !!s.nextRun && todayISO() >= s.nextRun;
        }

        function periodicReportRows(s) {
            const today = todayISO(), upto = addDaysISO(today, Number(s.windowDays) || 7);
            return appData.checks
                .filter(c => !c.cashed && c.dueDate && c.dueDate <= upto
                    && (c.dueDate >= today || (s.includeOverdue && c.dueDate < today)))
                .sort(byDue);
        }

        function periodicReportMeta(s) {
            return `الشيكات خلال ${s.windowDays} يوم${s.includeOverdue ? ' + المتأخرة' : ''}`;
        }

        // banner shown on every page when a report is due (only for users who can see checks)

        function savePeriodicSchedule() {
            if (!can('checks.view')) return;
            const prev = loadCheckReport();
            const frequency = document.getElementById('prFreq').value;
            const weekdays = [...document.querySelectorAll('input[name=prWd]:checked')].map(i => Number(i.value));
            const dayOfMonth = Math.round(Number(document.getElementById('prDom').value));
            const everyDays = Math.round(Number(document.getElementById('prEvery').value));
            const windowDays = Math.round(Number(document.getElementById('prWindow').value));
            const startDate = document.getElementById('prStart').value;
            const s = {
                ...prev,
                enabled: document.getElementById('prEnabled').checked,
                frequency, weekdays, dayOfMonth, everyDays, windowDays,
                includeOverdue: document.getElementById('prOverdue').checked
            };
            if (!(windowDays >= 1 && windowDays <= 365)) return toast('اكتب عدد أيام بين 1 و 365', 'error');
            if (frequency === 'weekly' && !weekdays.length) return toast('اختار يوم أو أكتر للتقرير الأسبوعي', 'error');
            if (frequency === 'monthly' && !(dayOfMonth >= 1 && dayOfMonth <= 28)) return toast('اكتب يوم في الشهر بين 1 و 28', 'error');
            if (frequency === 'custom' && !(everyDays >= 1 && everyDays <= 365)) return toast('اكتب عدد أيام بين 1 و 365', 'error');
            if (s.enabled) {
                s.nextRun = frequency === 'custom'
                    ? (startDate || todayISO())
                    : checkReportFirstRun(s, todayISO());
            } else {
                s.nextRun = '';
            }
            s.dismissedOn = '';
            saveCheckReport(s);
            toast(s.enabled ? 'تم حفظ التقرير الدوري' : 'التقرير الدوري متوقف', 'success');
            render();
        }

        function viewStatement(id) {
            const p = appData.partners.find(x => x.id === id);
            const back = `<button type="button" onclick="navigate('checks/partners')" class="text-sm font-bold text-brand-700 hover:underline"><i class="fa-solid fa-arrow-right"></i> رجوع للمستفيدين</button>`;

                title: 'كشف المستفيد',

                        </div>
                        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">

                            <div class="rounded-xl bg-slate-50 border-2 border-slate-200 p-3"><p class="text-xs font-bold text-slate-600">الإجمالي</p><p class="text-lg font-bold">${fmtMoney(total)}</p></div>
                            <div class="rounded-xl bg-amber-50 border-2 border-amber-200 p-3"><p class="text-xs font-bold text-amber-800">المفتوح</p><p class="text-lg font-bold text-amber-800">${fmtMoney(openT)}</p></div>
                            <div class="rounded-xl bg-emerald-50 border-2 border-emerald-200 p-3"><p class="text-xs font-bold text-emerald-800">المصروف</p><p class="text-lg font-bold text-emerald-800">${fmtMoney(r2(total - openT))}</p></div>

        // ---- check modal (with live warning when the partner limit would be passed) ----
        function updateCheckWarning() {
            const box = document.getElementById('checkWarn');
            if (!box) return;
            const payeeId = document.querySelector('#modalForm select[name=payeeId]')?.value || '';
            const amount = Number(document.querySelector('#modalForm input[name=amount]')?.value);
            const p = appData.partners.find(x => x.id === payeeId);
            const editing = checkModalId ? appData.checks.find(x => x.id === checkModalId) : null;
            const counts = !(editing && editing.cashed);
            if (!p || !(p.limit > 0) || !(amount > 0) || !counts) {
                box.classList.add('hidden'); box.textContent = ''; return;
            }
            const after = r2(partnerOpenTotal(p.id, checkModalId) + amount);
            if (after > p.limit + 1e-9) {
                box.classList.remove('hidden');
                box.textContent = `تنبيه: المفتوح للمستفيد ده هيبقى ${fmtMoney(after)} والحد ${fmtMoney(p.limit)} — هيتجاوز الحد بـ ${fmtMoney(r2(after - p.limit))}`;
            } else {
                box.classList.add('hidden'); box.textContent = '';
            }
        }

        function openCheckModal(id = null, opts = {}) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const c = id ? appData.checks.find(x => x.id === id) : null;
            if (id && !c) return;
            if (!appData.partners.length) {
                toast('أضف مستفيد الأول من تبويب المستفيدين', 'info', null, 5000);
                navigate('checks/partners');
                return;
            }
            const copy = !!(opts && opts.copy) && !!c;   // copy mode: a new check with the same data
            const editing = copy ? null : c;
            checkModalId = copy ? null : id;
            const partners = [...appData.partners].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            const payeeOptions = partners.map(p => `<option value="${esc(p.id)}" ${c && c.payeeId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
            const banks = [...new Set(appData.checks.map(x => x.bank).filter(Boolean))].sort();

            openModal({
                title: editing ? 'تعديل الشيك' : (copy ? 'نسخة شيك جديد' : 'شيك جديد'),
                submitText: editing ? 'حفظ التعديلات' : 'إضافة الشيك',
                body: `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${field('رقم الشيك *', `<input name="number" required value="${esc(copy ? '' : c?.number)}" placeholder="مثال: 004512" dir="ltr" class="${INPUT_CLS} font-mono">`)}
                        ${field('البنك *', `<input name="bank" required list="bankList" value="${esc(c?.bank)}" placeholder="مثال: البنك الأهلي" class="${INPUT_CLS}"><datalist id="bankList">${banks.map(b => `<option value="${esc(b)}"></option>`).join('')}</datalist>`)}
                        ${field('المبلغ (جنيه) *', `<input name="amount" type="number" step="0.01" min="0.01" required value="${c ? esc(c.amount) : ''}" oninput="updateAmountWords(this.value); updateCheckWarning()" dir="ltr" class="${INPUT_CLS} font-mono">`)}
                        ${field('تاريخ الاستحقاق *', `<div class="space-y-2"><input name="dueDate" type="date" required value="${esc(copy ? addDaysISO(c.dueDate || todayISO(), 30) : (c?.dueDate || todayISO()))}" class="${INPUT_CLS}"><div class="flex flex-wrap gap-2">${[7, 15, 30].map(n => `<button type="button" onclick="setCheckDueOffset(${n})" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">بعد ${n} يوم</button>`).join('')}</div></div>`)}
                    </div>
                    <div id="amountWords" class="rounded-xl bg-slate-50 border-2 border-slate-200 p-3 text-sm font-bold text-slate-700"></div>
                    ${field('المستفيد *', `<select name="payeeId" required onchange="updateCheckWarning()" class="${INPUT_CLS}"><option value="">— اختر المستفيد —</option>${payeeOptions}</select>`)}
                    <div id="checkWarn" class="hidden rounded-xl bg-rose-50 border-2 border-rose-300 p-3 text-sm font-bold text-rose-800"></div>`,
                onOpen: () => { updateAmountWords(c ? c.amount : ''); updateCheckWarning(); },
                onSubmit: fd => {
                    const number = String(fd.get('number') || '').trim();
                    const bank = String(fd.get('bank') || '').trim();
                    const amount = r2(Number(fd.get('amount')));
                    const dueDate = String(fd.get('dueDate') || '');
                    const payee = appData.partners.find(p => p.id === String(fd.get('payeeId') || ''));
                    if (!number || !bank || !dueDate) return toast('اكتب رقم الشيك والبنك والتاريخ', 'error'), false;
                    if (!(amount > 0) || amount > CHECK_MAX_AMOUNT) return toast('اكتب مبلغ صحيح أكبر من صفر', 'error'), false;
                    if (!payee) return toast('اختر المستفيد', 'error'), false;
                    if (appData.checks.some(x => x.id !== id && x.number === number && x.bank === bank)) {
                        return toast('الشيك ده متسجل قبل كده بنفس الرقم والبنك', 'error'), false;
                    }
                    const data = { number, bank, amount, dueDate, payeeId: payee.id, payeeName: payee.name };
                    if (editing) {
                        Object.assign(editing, data);
                        log('تعديل شيك', `${number} — ${payee.name}`);
                        toast('تم حفظ التعديلات', 'success');
                    } else {
                        appData.checks.push({ id: uid('CHK-'), ...data, cashed: false });
                        log('إضافة شيك', `${number} — ${payee.name}`);
                        toast('تمت إضافة الشيك', 'success');
                    }
                    checkModalId = null;
                    if (payee.limit > 0 && partnerOver(payee)) {
                        toast(`تنبيه: المفتوح للمستفيد "${payee.name}" تجاوز الحد المسموح`, 'info', null, 7000);
                    }
                    render();
                }
            });
        }

        function openPartnerModal(id = null) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const p = id ? appData.partners.find(x => x.id === id) : null;
            if (id && !p) return;
            openModal({
                title: p ? 'تعديل المستفيد' : 'مستفيد جديد',
                submitText: p ? 'حفظ التعديلات' : 'إضافة المستفيد',
                body: `
                    ${field('اسم المستفيد *', `<input name="name" required value="${esc(p?.name)}" placeholder="مثال: شركة الخليج للتوزيع" class="${INPUT_CLS}">`)}
                    ${field('الحد المسموح (جنيه)', `<input name="limit" type="number" step="0.01" min="0" value="${p && p.limit > 0 ? esc(p.limit) : ''}" placeholder="فاضي = مفيش حد" dir="ltr" class="${INPUT_CLS} font-mono">`, 'لو مجموع الشيكات المفتوحة للمستفيد عدّى الحد، التطبيق بيحذّرك')}
                    ${field('ملاحظات', `<textarea name="notes" rows="3" class="${INPUT_CLS}" placeholder="أي تفاصيل إضافية...">${esc(p?.notes)}</textarea>`)}`,
                onSubmit: fd => {
                    const name = String(fd.get('name') || '').trim();
                    const notes = String(fd.get('notes') || '').trim();
                    const limitRaw = String(fd.get('limit') || '').trim();
                    const limit = limitRaw === '' ? 0 : r2(Number(limitRaw));
                    if (!name) return toast('اكتب اسم المستفيد', 'error'), false;
                    if (!(limit >= 0) || limit > CHECK_MAX_AMOUNT) return toast('اكتب حد صحيح أو سيبه فاضي', 'error'), false;
                    if (appData.partners.some(x => x.id !== id && x.name.trim() === name)) {
                        return toast('الاسم ده موجود قبل كده', 'error'), false;
                    }
                    if (p) {
                        Object.assign(p, { name, notes, limit });
                        // keep the payee name on the checks in step with the partner's name
                        appData.checks.forEach(x => { if (x.payeeId === p.id) x.payeeName = name; });
                        log('تعديل مستفيد', name);
                        toast('تم حفظ التعديلات', 'success');
                    } else {
                        appData.partners.push({ id: uid('PAY-'), name, notes, limit });
                        log('إضافة مستفيد', name);
                        toast('تمت إضافة المستفيد', 'success');
                    }
                    render();
                }
            });
        }

        // mark a check as cashed (تم الصرف) or open again
        function toggleCashed(id) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const c = appData.checks.find(x => x.id === id);
            if (!c) return;
            c.cashed = !c.cashed;
            log(c.cashed ? 'صرف شيك' : 'إلغاء صرف شيك', `${c.number} — ${c.payeeName}`);
            toast(c.cashed ? 'تم تسجيل الصرف' : 'تم إلغاء الصرف', 'success');
            render();
        }

        // Soft delete (with undo), same as companies
        function deleteCheck(id) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const idx = appData.checks.findIndex(c => c.id === id);
            if (idx < 0) return;
            finalizePendingUndo();
            const c = appData.checks[idx];
            appData.checks.splice(idx, 1);
            log('حذف شيك', `${c.number} — ${c.payeeName}`);
            render();
            scheduleUndo(`تم حذف الشيك رقم ${c.number}`, () => {
                appData.checks.splice(Math.min(idx, appData.checks.length), 0, c);
                log('استعادة شيك', `${c.number} — ${c.payeeName}`);
                render();
            }, () => {});
        }

        function deletePartner(id) {
            if (!can('checks.manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return; }
            const idx = appData.partners.findIndex(p => p.id === id);
            if (idx < 0) return;
            finalizePendingUndo();
            const p = appData.partners[idx];
            appData.partners.splice(idx, 1);
            log('حذف مستفيد', p.name);
            render();
            scheduleUndo(`تم حذف "${p.name}"`, () => {
                appData.partners.splice(Math.min(idx, appData.partners.length), 0, p);
                log('استعادة مستفيد', p.name);
                render();
            }, () => {});
        }

        // ---- printing and Excel ----
        // a hidden frame prints one HTML document (no pop-up window)
        function printHtml(html) {
            const frame = document.createElement('iframe');
            frame.setAttribute('aria-hidden', 'true');
            frame.style.cssText = 'position:fixed;width:0;height:0;border:0;right:0;bottom:0;';
            frame.onload = () => {
                try {
                    frame.contentWindow.focus();
                    frame.contentWindow.print();
                } catch (err) {
                    console.error(err);
                    toast('تعذر فتح نافذة الطباعة', 'error');
                }
                setTimeout(() => frame.remove(), 2000);
            };
            frame.srcdoc = html;
            document.body.appendChild(frame);
        }

        function exportChecksXlsx(rows, fileName, label) {
            if (!can('checks.view')) return;
            if (typeof XLSX === 'undefined') { toast('تعذر تحميل مكتبة إكسيل', 'error'); return; }
            const wb = XLSX.utils.book_new();
            const detail = [['رقم الشيك', 'البنك', 'المستفيد', 'المبلغ', 'تاريخ الاستحقاق', 'الحالة']]
                .concat(rows.map(c => [c.number, c.bank, c.payeeName, Number(c.amount) || 0, c.dueDate,
                    c.cashed ? 'مصروف' : (isOverdue(c) ? 'متأخر' : 'مفتوح')]));
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detail), 'الشيكات');

        // ============ AUTH & PERMISSIONS ============
        function currentUser() {
            return appData.users.find(u => u.id === sessionUserId) || null;

        function roleHas(roleId, perm) {
            const r = appData.roles[roleId];
            return !!r && (r.locked || r.permissions.includes(perm));
        }

        function can(perm) {
            const u = currentUser();
            return !!u && u.active && roleHas(u.roleId, perm);
        }

        function countUsersWithPerm(users, roles, perm) {
            return users.filter(u => u.active && roles[u.roleId] && (roles[u.roleId].locked || roles[u.roleId].permissions.includes(perm))).length;
        }

        function canAccessRoute(name) {
            if (name === 'home') return true;
            if (name === 'settings') return true;   // every signed-in user; each card checks its own permission
            const r = ROUTES[name];
            return !!r && can(r.perm);
        }

        async function handleAuth(e) {
            e.preventDefault();
            if (!fbAuth) return toast('Firebase غير مُعد بعد', 'error');
            const btn = el('authSubmit');
            const mode = el('authMode').value;
            const fd = new FormData(el('authForm'));

            btn.disabled = true;
            try {
                if (mode === 'setup') {
                    await runSetup(fd, email, password);
                } else {
                    const loginAddr = loginAddressFor(email);
                    if (!EMAIL_RE.test(loginAddr)) throw userError('اكتب بريد إلكتروني أو اسم دخول صحيح');
                    await runLogin(loginAddr, password);
                }
            } catch (err) {
                console.error(err);
                toast(authErrorMessage(err), 'error', null, 5000);
            } finally {

        async function runLogin(email, password) {
            fbBusy = true;
            try {
                const cred = await fbAuth.signInWithEmailAndPassword(email, password);
                const snap = await fbDb.collection('users').doc(cred.user.uid).get();
                if (!snap.exists) {
                    await fbAuth.signOut();
                    throw userError('حسابك غير مفعّل داخل النظام. تواصل مع مدير النظام');
                }
                if (snap.data().active === false) {
                    await fbAuth.signOut();
                    throw userError('هذا الحساب موقوف. تواصل مع مدير النظام');
                }
                fbUser = cred.user;
                pendingLoginLog = true;
            } finally {
                fbBusy = false;
            }
            startSync(fbUser.uid);
        }

        // First run: creates the admin account, the roles and settings, then uploads the local data (if any)
        async function runSetup(fd, email, password) {
            const name = String(fd.get('name') || '').trim();
            if (!name) throw userError('اكتب الاسم الكامل');
            if (!EMAIL_RE.test(email)) throw userError('اكتب بريد إلكتروني صحيح');
            if (password.length < 6) throw userError('كلمة المرور لازم تكون 6 أحرف على الأقل');
            if (password !== String(fd.get('password2') || '')) throw userError('كلمتا المرور غير متطابقتين');

            fbBusy = true;
            let cred = null;
            try {
                cred = await fbAuth.createUserWithEmailAndPassword(email, password);
                fbUser = cred.user;
                const uid = cred.user.uid;
                const now = new Date().toISOString();

                const local = readLocalSeed();
                const seed = local || normalizeData(defaultData());
                const docs = [...desiredDocs(seed).entries()].map(([key, data]) => ({ key, data }));

                // step 1: the marker, the admin profile, roles and settings (allowed only while bootstrapping)
                await commitChunks([
                    { key: 'system/init', data: { createdAt: now, createdBy: uid } },
                    { key: 'users/' + uid, data: { name, email, roleId: 'admin', active: true, createdAt: now, lastLoginAt: now } },
                    ...docs.filter(o => o.key.startsWith('roles/') || o.key === 'settings/main')
                ]);
                initExists = true;

                // step 2: local PDFs go to Realtime Database (pdfs/{listId}), then the companies and lists
                for (const id of seed.localPdfIds || []) {
                    const blob = await readLocalPdf(id);
                    if (!blob) continue;
                    try {
                        await pdfUpload(id, blob);
                        seed.companies.forEach(c => c.lists.forEach(l => { if (l.id === id) l.hasPdf = true; }));
                    } catch (err) { console.error('pdf upload', id, err); }
                }
                await commitChunks([...desiredDocs(seed).entries()]
                    .filter(([key]) => key.startsWith('companies/') || key.startsWith('lists/'))
                    .map(([key, data]) => ({ key, data })));

                const logId = 'LOG-' + Date.now().toString(36);
                await fbDb.collection('logs').doc(logId).set({
                    id: logId, t: now, user: name, action: 'إنشاء حساب مدير النظام',
                    detail: local ? 'مع نقل البيانات من المتصفح' : ''
                });

                fbBusy = false;
                startSync(uid);
                toast(local ? 'تم إنشاء الحساب ونقل البيانات إلى Firebase' : 'تم إنشاء حساب مدير النظام', 'success', null, 5000);
            } catch (err) {
                // roll back a half-created account so setup can be retried
                if (cred && cred.user) { try { await cred.user.delete(); } catch (e) { console.error(e); } }
                if (fbAuth.currentUser) { try { await fbAuth.signOut(); } catch (e) { console.error(e); } }
                throw err;
            } finally {
                fbBusy = false;
            }
        }

        // ============ ROUTER & SHELL ============
        function parseRoute() {
            const h = location.hash.replace(/^#\/?/, '');
            const [name, ...rest] = h.split('/');
            return { name: name || 'home', param: rest.join('/') || null };
        }

        function navigate(route) {
            const target = '#/' + route;
            if (location.hash === target) render();
            else location.hash = target;
        }

        // The new "home.personal" permission is given to every existing role once (settings.permsVersion 2).
        // After that the admin's choices are kept, even when a role is unticked.
        const PERMS_VERSION_NOW = 2;
        function ensureHomePersonalPerm() {
            if (!appData || !fbSynced || !sessionUserId) return;
            if ((appData.settings.permsVersion || 1) >= PERMS_VERSION_NOW) return;
            if (!can('settings.manage') || !can('users.manage')) return;
            Object.values(appData.roles).forEach(r => {
                if (!r.locked && !r.permissions.includes('home.personal')) r.permissions = [...r.permissions, 'home.personal'];
            });
            appData.settings.permsVersion = PERMS_VERSION_NOW;
            saveState();
        }

        function render() {
            if (orderFormKeep && parseRoute().name !== 'orders') orderFormKeep = null;
            if (pendingNewOrderImages.length && parseRoute().param !== 'new') pendingNewOrderImages = [];
            if (!sessionUserId) return;
            const user = currentUser();
            if (!user || !user.active) {
                logout(true);
                return;
            }
            ensureHomePersonalPerm();
            if (!(parseRoute().name === 'shipping' && parseRoute().param === 'screen')) shipLeaveScreen();
            let { name, param } = parseRoute();

            if (!ROUTES[name]) name = 'dashboard';
            if (!canAccessRoute(name)) {
                const first = firstAllowedRoute();
                if (first) return navigate(first);
                renderNoAccess();
                return;
            }
            if (name === 'companies' && param && !findCompany(param)) return navigate('companies');

            const view = VIEWS[name](param);
            el('pageTitle').textContent = view.title;
            el('topActions').innerHTML = view.actions || '';
            el('content').innerHTML = view.html;
            el('content').insertAdjacentHTML('afterbegin', checkReportBanner());
            renderChrome(name);
            if (view.after) view.after();
            closeRowMenu();
            toggleSidebar(false);
        }

        // Ceramics, porcelain and sanitary ware: supply from a factory to the store, or delivery to a customer.

        const ORDER_PERM = {

        let orderFormKeep = null;

        let ordersSchedDays = 7;

        const fbOrdLive = new Map();          // collection -> unsubscribe (only collections the user may read)
        let lastVisibleOrderIds = [];

            draft: 'bg-slate-100 text-slate-700', confirmed: 'bg-sky-100 text-sky-800', loading: 'bg-amber-100 text-amber-800',

        };

        const ORDER_PRODUCTS = ['سيراميك', 'بورسلين', 'أدوات صحية', 'مكملات', 'أخرى'];
        const ORDER_UNITS = ['م²', 'كرتونة', 'قطعة', 'طن', 'كجم', 'طقم', 'متر طولي', 'كيس', 'أخرى'];
        // the quantity label follows the unit (form only: one table can hold rows with different units)
        const ORDER_QTY_LABEL = { 'م²': 'عدد الأمتار المربعة', 'متر طولي': 'عدد الأمتار الطولية', 'كرتونة': 'عدد الكراتين', 'قطعة': 'عدد القطع', 'طن': 'عدد الأطنان', 'كجم': 'عدد الكيلوجرامات', 'طقم': 'عدد الأطقم', 'كيس': 'عدد الأكياس', 'أخرى': 'الكمية' };

        // Orders saved before this change have no basis and keep the old per-box price.
        const M2_BASIS = 'm2';
        const ORDER_TRANSPORT = { truck: 'جرار / تريلا', car: 'عربية نقل', other: 'وسيلة أخرى' };
        const ORDER_TERMS = ['نقدي', 'شيك', 'أجل', 'تحويل بنكي', 'مختلط'];
        // allowed moves: from -> [to, permission key, button label]
        const ORDER_NEXT = {
            draft: [['confirmed', 'confirm', 'تأكيد الطلبية'], ['cancelled', 'confirm', 'إلغاء الطلبية']],
            confirmed: [['loading', 'execute', 'بدء التحميل'], ['cancelled', 'confirm', 'إلغاء الطلبية']],
            loading: [['transit', 'execute', 'خروج للطريق']],
            transit: [['delivered', 'execute', 'تسجيل التسليم']],
            delivered: [],
            cancelled: [['draft', 'confirm', 'إعادة فتح كمسودة']]
        };

        // ---- order status: stages (loading, transit, delivered) keep a date and a note ----
        const ORDER_STAGES = ['loading', 'transit', 'delivered'];
        const stageDateOf = (o, st) => (((o.stages || {})[st]) || {}).date || '';
        const deliveredDateOf = o => stageDateOf(o, 'delivered') || (o.schedule || {}).actualDate || '';
        const stageValueOf = (o, st) => (st === 'delivered' ? deliveredDateOf(o) : stageDateOf(o, st));
        const stagesText = o => ORDER_STAGES.filter(st => stageValueOf(o, st))
            .map(st => `${ORDER_STATUS[st]}: ${fmtDateAr(stageValueOf(o, st))}`).join(' · ');
        // stage dates need the matching flow permission; the status override covers every status
        const stageAllowed = (st) => canOrd('status_override') || canOrd(ORDER_STAGES.includes(st) ? 'execute' : 'confirm');
        const canAnyStatusAction = () => canOrd('status_override') || canOrd('confirm') || canOrd('execute');

        function openOrderStatusModal(id, presetTo = '') {
            const o = appData.orders.find(x => x.id === id);
            if (!o) return;
            if (!canAnyStatusAction()) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const cur = presetTo || o.status;
            const opts = Object.keys(ORDER_STATUS).map(k => `<option value="${k}" ${k === cur ? 'selected' : ''}>${ORDER_STATUS[k]}</option>`).join('');
            const dateFor = st => stageValueOf(o, st) || (ORDER_STAGES.includes(st) ? todayISO() : '');
            openModal({
                title: `حالة ${orderNoLabel(o)}`,
                submitText: 'حفظ',
                body: `<label class="block text-xs font-bold text-slate-600 mb-1">الحالة
                        <select name="to" onchange="orderStatusPick(this, '${esc(id)}')" class="${INPUT_CLS}">${opts}</select></label>
                    <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ المرحلة
                        <input name="date" type="date" value="${esc(dateFor(cur))}" class="${INPUT_CLS}"></label>
                    <label class="block text-xs font-bold text-slate-600 mb-1">ملاحظة المرحلة
                        <textarea name="note" rows="2" class="${INPUT_CLS}">${esc(((o.stages || {})[cur] || {}).note || '')}</textarea></label>
                    <label class="block text-xs font-bold text-slate-600 mb-1">سبب تغيير الحالة (مطلوب لو الحالة اتغيرت)
                        <textarea name="reason" rows="2" class="${INPUT_CLS}"></textarea></label>
                    <p class="text-xs text-slate-500">التاريخ والملاحظة بيتحفظوا للمراحل بس (جاري التحميل، في الطريق، تم التسليم).</p>`,
                onSubmit: fd => submitOrderStatus(id, fd)
            });
        }

        // picking a stage in the modal shows that stage's saved date and note
        function orderStatusPick(sel, id) {
            const o = appData.orders.find(x => x.id === id);
            const form = sel.form;
            if (!o || !form) return;
            const st = sel.value;
            form.elements.date.value = ORDER_STAGES.includes(st) ? (stageValueOf(o, st) || todayISO()) : '';
            form.elements.note.value = ((o.stages || {})[st] || {}).note || '';
        }

        function submitOrderStatus(id, fd) {
            const o = appData.orders.find(x => x.id === id);
            if (!o) return false;
            const to = String(fd.get('to') || o.status);
            const date = String(fd.get('date') || '').trim() || todayISO();
            const note = String(fd.get('note') || '').trim();
            const reason = String(fd.get('reason') || '').trim();
            const changed = to !== o.status;
            if (changed) {
                if (!canOrd('status_override')) { toast('ليس لديك صلاحية تعديل الحالة بحرية', 'error'); return false; }
                if (!reason) { toast('اكتب سبب تغيير الحالة', 'error'); return false; }
            } else if (!ORDER_STAGES.includes(to)) {
                toast('الحالة دي مالهاش مراحل تتعدل', 'info');
                return false;
            }
            if (ORDER_STAGES.includes(to) && !stageAllowed(to)) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return false; }
            const from = o.status;
            if (changed) o.status = to;
            if (ORDER_STAGES.includes(to)) o.stages = { ...(o.stages || {}), [to]: { date, note } };
            const text = changed ? `تعديل الحالة من ${ORDER_STATUS[from]} إلى ${ORDER_STATUS[to]} — السبب: ${reason}` : `تعديل مرحلة ${ORDER_STATUS[to]}`;
            o.history = [...(o.history || []), { at: new Date().toISOString(), by: orderUserName(), text }];
            saveState();
            log('تعديل حالة طلبية', `${orderNoLabel(o)} — ${text}`);
            toast('تم حفظ التعديل', 'success');
            render();
            return true;
        }

        const orderNoLabel = o => `طلبية ${String(o.no).padStart(4, '0')}`;
        const orderDateOf = o => (o.schedule && o.schedule.plannedDate) || '';
        const ordIsActive = o => o.status !== 'cancelled';
        const ordIsOpen = o => o.status !== 'cancelled' && o.status !== 'delivered';
        const numOr0 = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
        function nextOrderNo() { return Math.max(0, ...appData.orders.map(o => Number(o.no) || 0)) + 1; }

        // ---- totals (per item, then per order) ----
        const priceOf = (o, itemId) => ((o.prices || {})[itemId]) || { unitPrice: 0, discount: 0 };
        function lineCalc(it, pr, basis) {
            const q = numOr0(it.qty), price = numOr0(pr.unitPrice);
            const disc = Math.min(100, Math.max(0, numOr0(pr.discount)));
            const m2 = it.unit === 'م²' ? q : (it.unit === 'كرتونة' ? q * numOr0(it.m2PerBox) : 0);
            const priced = basis === M2_BASIS && it.unit === 'كرتونة' ? m2 : q;
            const subtotal = r2(priced * price), discount = r2(subtotal * disc / 100);
            return {
                subtotal, discount, net: r2(subtotal - discount), m2: r2(m2),
                boxes: it.unit === 'كرتونة' ? q : 0, pieces: it.unit === 'قطعة' ? q : 0
            };
        }
        function orderTotals(o) {
            const t = { subtotal: 0, discount: 0, net: 0, m2: 0, boxes: 0, pieces: 0 };
            (o.items || []).forEach(it => {
                const l = lineCalc(it, priceOf(o, it.id), o.priceBasis);
                Object.keys(t).forEach(k => { t[k] = r2(t[k] + l[k]); });
            });
            return t;
        }
        const orderBalance = o => r2(orderTotals(o).net - numOr0(o.payment && o.payment.paid));

        // ---- warnings: shown, never blocking ----
        function timeOverlap(a, b) {
            if (!a.timeFrom || !a.timeTo || !b.timeFrom || !b.timeTo) return true;   // no hours = whole day
            return a.timeFrom < b.timeTo && b.timeFrom < a.timeTo;
        }
        function orderWarnings(o, all) {
            const w = [];
            const s = o.schedule || {}, t = o.transport || {};
            if (ordIsOpen(o) && !s.plannedDate) w.push('بدون تاريخ جدولة');
            if (ordIsOpen(o) && s.plannedDate && s.plannedDate < todayISO() && ['draft', 'confirmed', 'loading'].includes(o.status)) w.push('متأخرة عن موعدها');
            if (s.timeFrom && s.timeTo && s.timeFrom >= s.timeTo) w.push('ساعة النهاية قبل البداية');
            if (s.arrivalDate && s.plannedDate && s.arrivalDate < s.plannedDate) w.push('الوصول قبل الشحن');
            return w;
        }

        // ---- required data before a status move (blocking; these are not warnings) ----
        function orderProblem(o, to) {
            if (to === 'confirmed') {
                if (!o.items || !o.items.length) return 'ضيف أصناف للطلبية الأول';
                if (o.kind === 'supply' && !o.factoryId) return 'اختار المصنع الأول';
                if (o.kind === 'delivery' && !o.customerName) return 'اكتب اسم العميل الأول';
            }
            return '';
        }

        // ---- list ----
        function filteredOrders() {
            const f = ordersFilter, q = f.q.trim().toLowerCase();
            return appData.orders.filter(o => {
                if (f.status !== 'all' && o.status !== f.status) return false;
                if (f.kind !== 'all' && o.kind !== f.kind) return false;
                if (f.factoryId && o.factoryId !== f.factoryId) return false;
                const d = orderDateOf(o);
                if (f.from && (!d || d < f.from)) return false;
                if (f.to && (!d || d > f.to)) return false;
                if (q) {
                    const hay = [orderNoLabel(o), o.customerName, o.factoryName, o.ref,
                        ...(o.items || []).map(i => `${i.code} ${i.name}`)].join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            }).sort((a, b) => (b.no || 0) - (a.no || 0));
        }

        function ordersSummaryCards(rows) {
            const act = rows.filter(ordIsActive);
            const sum = k => r2(rows.reduce((s, o) => s + orderTotals(o)[k], 0));
            const today = todayISO();
            const card = (label, value, cls = 'text-slate-800') => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-3">
                <p class="text-xs font-bold text-slate-600">${label}</p><p class="text-base font-bold ${cls} whitespace-nowrap">${value}</p></div>`;
            return `<div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
                ${card('طلبيات نشطة', act.length)}
                ${canOrd('prices') ? card('صافي القيمة', fmtMoney(r2(act.reduce((s, o) => s + orderTotals(o).net, 0))), 'text-emerald-700') : ''}
                ${card('مجدولة النهارده', act.filter(o => orderDateOf(o) === today).length, 'text-brand-700')}
                ${card('متأخرة عن موعدها', rows.filter(o => orderWarnings(o, appData.orders).includes('متأخرة عن موعدها')).length, 'text-rose-700')}
                ${card('م² / كرتونة', `${fmtDigits(sum('m2'))} / ${fmtDigits(sum('boxes'))}`)}
            </div>`;
        }

        function ordersFilterBar() {
            const f = ordersFilter;
            const opt = (cur, v, l) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`;
            const factories = [...appData.companies].sort((a, b) => a.name.localeCompare(b.name, 'ar'))
                .map(c => opt(f.factoryId, c.id, companyOptionLabel(c))).join('');
            return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div class="sm:col-span-2">${field('بحث', `<input type="search" value="${esc(f.q)}" oninput="ordersFilter.q = this.value; updateOrdersBody()" placeholder="رقم، عميل، مصنع / مورد، مرجع، كود صنف" class="${INPUT_CLS}">`)}</div>
                    ${field('الحالة', `<select onchange="ordersFilter.status = this.value; updateOrdersBody()" class="${INPUT_CLS}">${opt(f.status, 'all', 'الكل')}${Object.entries(ORDER_STATUS).map(([k, v]) => opt(f.status, k, v)).join('')}</select>`)}
                    ${field('النوع', `<select onchange="ordersFilter.kind = this.value; updateOrdersBody()" class="${INPUT_CLS}">${opt(f.kind, 'all', 'الكل')}${Object.entries(ORDER_KIND).map(([k, v]) => opt(f.kind, k, v)).join('')}</select>`)}
                    ${field('المصنع / المورد', `<select onchange="ordersFilter.factoryId = this.value; updateOrdersBody()" class="${INPUT_CLS}"><option value="">كل المصانع</option>${factories}</select>`)}
                    <div class="sm:col-span-2">${field('تاريخ الجدولة (من - إلى)', `<div class="grid grid-cols-2 gap-2 min-w-0"><input type="date" value="${esc(f.from)}" onchange="ordersFilter.from = this.value; updateOrdersBody()" class="${INPUT_CLS}"><input type="date" value="${esc(f.to)}" onchange="ordersFilter.to = this.value; updateOrdersBody()" class="${INPUT_CLS}"></div>`)}</div>
                </div>
                <div class="flex flex-wrap gap-2 justify-end">
                    ${btn('clearOrdersFilter()', 'مسح الفلاتر', 'fa-filter-circle-xmark', BTN_SECONDARY)}
                    ${canOrd('print') ? btn('printOrdersList()', 'طباعة القائمة', 'fa-print', BTN_SECONDARY) : ''}
                    ${canOrd('export') ? btn('exportOrdersXlsx()', 'تصدير Excel', 'fa-file-excel', BTN_SECONDARY) : ''}
                </div>
            </div>`;
        }

        const orderStatusBadge = o => `<span class="px-2 py-0.5 rounded-full text-xs font-bold whitespace-nowrap ${ORDER_STATUS_CLS[o.status] || ''}">${esc(ORDER_STATUS[o.status] || o.status)}</span>`;
        const pendingBadge = o => isPendingOrder(o) ? '<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300 whitespace-nowrap">لم تُحفظ بعد</span> ' : '';
        const orderWarnBadges = o => pendingBadge(o) + orderWarnings(o, appData.orders).map(w => `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-rose-50 text-rose-700 border border-rose-200 whitespace-nowrap">${esc(w)}</span>`).join(' ');
        const orderPartyText = o => (o.kind === 'supply' ? (o.factoryName || '—') : (o.customerName || '—'));
        const orderTimeText = o => { const s = o.schedule || {}; return s.timeFrom ? `${s.timeFrom} - ${s.timeTo || ''}` : ''; };
        // transport details show only for the vehicle types the user may see (orders.transport_truck / _car / _other)
        const canSeeVehicle = o => !!(o.transport && o.transport.type && can(ORDER_PERM[o.transport.type]));
        const vehicleText = o => {
            const t = o.transport || {};
            if (!t.type) return '<span class="text-slate-400">—</span>';
            return esc(ORDER_TRANSPORT[t.type] || '');
        };

        function orderActionsHtml(o) {
            const b = (fn, title, icon, cls = '') => `<button type="button" onclick="${fn}" title="${title}" aria-label="${title}" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50 ${cls}"><i class="fa-solid ${icon}"></i></button>`;
            const id = esc(o.id);
            return b(`navigate('orders/${id}')`, 'فتح', 'fa-eye')
                + (canOrd('print') ? b(`printOrderDoc('${id}')`, 'طباعة الطلبية', 'fa-print') : '')
                + (canOrd('create') ? b(`copyOrder('${id}')`, 'نسخ كطلبية جديدة', 'fa-copy') : '')
                + (canOrd('delete') ? b(`deleteOrder('${id}')`, 'حذف', 'fa-trash-can', 'hover:text-rose-600 hover:bg-rose-50') : '');
        }

        function ordersListHtml() {
            if (!appData.orders.length) {
                return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-8 text-center">
                    <i class="fa-solid fa-truck-ramp-box text-4xl text-slate-300 mb-3"></i>
                    <p class="text-slate-700 font-bold mb-4">مفيش طلبيات لسه</p>
                    ${canOrd('create') ? btn("navigate('orders/new')", 'طلبية جديدة', 'fa-plus') : ''}
                </div>`;
            }
            const rows = filteredOrders();
            lastVisibleOrderIds = rows.map(o => o.id);
            if (!rows.length) return `${ordersSummaryCards(appData.orders)}<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-8 text-center text-slate-600 font-bold">مفيش نتايج للفلاتر دي</div>`;
            return `${ordersSummaryCards(rows)}
            <div class="hidden md:block bg-white rounded-2xl border-2 border-slate-300 shadow-lg overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 text-slate-700 font-bold border-b-2 border-slate-300"><tr>
                        <th class="py-3 px-3 text-start">الرقم</th><th class="py-3 px-3 text-start">النوع</th>
                        <th class="py-3 px-3 text-start">المصنع / العميل</th><th class="py-3 px-3 text-start">الجدولة</th>
                        <th class="py-3 px-3 text-start">الوسيلة</th><th class="py-3 px-3 text-start">الكميات</th>
                        <th class="py-3 px-3 text-start">الصافي</th><th class="py-3 px-3 text-start">الحالة</th>
                        <th class="py-3 px-3 text-start">تنبيهات</th><th class="py-3 px-3 text-center">إجراءات</th>
                    </tr></thead>
                    <tbody class="divide-y divide-slate-200">
                        ${rows.map(o => { const t = orderTotals(o); return `<tr class="hover:bg-slate-50">
                            <td class="py-3 px-3 font-mono font-bold whitespace-nowrap"><button type="button" onclick="navigate('orders/${esc(o.id)}')" class="hover:text-brand-700 hover:underline">${orderNoLabel(o)}</button></td>
                            <td class="py-3 px-3">${esc(ORDER_KIND[o.kind] || '')}</td>
                            <td class="py-3 px-3 font-semibold">${esc(orderPartyText(o))}${o.kind === 'supply' && o.customerName ? `<br><span class="text-xs text-slate-500">${esc(o.customerName)}</span>` : ''}</td>
                            <td class="py-3 px-3 whitespace-nowrap">${esc(fmtDateAr(orderDateOf(o)) || '—')}<br><span class="text-xs text-slate-500">${esc(orderTimeText(o))}</span></td>
                            <td class="py-3 px-3">${vehicleText(o)}</td>
                            <td class="py-3 px-3 text-xs whitespace-nowrap">${t.m2 ? fmtDigits(t.m2) + ' م²' : ''}${t.boxes ? ' · ' + fmtDigits(t.boxes) + ' كرتونة' : ''}${t.pieces ? ' · ' + fmtDigits(t.pieces) + ' قطعة' : ''}</td>
                            <td class="py-3 px-3 font-bold whitespace-nowrap">${canOrd('prices') ? fmtMoney(t.net) : '<span class="text-slate-400">—</span>'}</td>
                            <td class="py-3 px-3">${orderStatusBadge(o)}</td>
                            <td class="py-3 px-3">${orderWarnBadges(o)}</td>
                            <td class="py-3 px-3"><div class="flex justify-center gap-1">${orderActionsHtml(o)}</div></td>
                        </tr>`; }).join('')}
                    </tbody>
                </table>
            </div>
            <div class="md:hidden space-y-3">
                ${rows.map(o => { const t = orderTotals(o); return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4">
                    <div class="flex items-start justify-between gap-2">
                        <button type="button" onclick="navigate('orders/${esc(o.id)}')" class="text-start font-mono font-bold text-slate-800">${orderNoLabel(o)}</button>
                        ${orderStatusBadge(o)}
                    </div>
                    <p class="text-sm mt-1"><span class="font-bold">${esc(ORDER_KIND[o.kind] || '')}:</span> ${esc(orderPartyText(o))}</p>
                    <p class="text-sm"><span class="font-bold">الجدولة:</span> ${esc(fmtDateAr(orderDateOf(o)) || '—')} ${esc(orderTimeText(o))}</p>
                    <p class="text-sm">${vehicleText(o)}</p>
                    ${canOrd('prices') ? `<p class="text-sm font-bold text-emerald-700 mt-1">${fmtMoney(t.net)}</p>` : ''}
                    <div class="flex flex-wrap gap-1 mt-1">${orderWarnBadges(o)}</div>
                    <div class="flex justify-end gap-1 mt-2">${orderActionsHtml(o)}</div>
                </div>`; }).join('')}
            </div>`;
        }

        function updateOrdersBody() {
            const body = el('ordersBody');
            if (body) body.innerHTML = ordersTabBody(parseOrdersTab());
        }
        function parseOrdersTab() {
            const p = String(parseRoute().param || '').split('/')[0];
            return ['schedule', 'reports'].includes(p) ? p : 'list';
        }
        function clearOrdersFilter() {
            ordersFilter = { status: 'all', kind: 'all', factoryId: '', from: '', to: '', q: '' };
            render();
        }

        // ---- schedule board: one card per day, open orders without a date at the bottom ----
        function setOrdersSched(date, days) {
            ordersSchedDate = date || todayISO();
            ordersSchedDays = Number(days) || 7;
            updateOrdersBody();
        }
        const WEEKDAY_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        function scheduleBoardHtml() {
            const start = ordersSchedDate || todayISO();
            const days = [...Array(ordersSchedDays).keys()].map(i => addDaysISO(start, i));
            const open = appData.orders.filter(ordIsOpen);
            const dayCards = days.map(d => {
                const list = open.filter(o => orderDateOf(o) === d)
                    .sort((a, b) => ((a.schedule && a.schedule.timeFrom) || '99:99').localeCompare((b.schedule && b.schedule.timeFrom) || '99:99'));
                const rows = list.length ? list.map(o => {
                    const t = o.transport || {};
                    return `<div class="rounded-xl border-2 border-slate-200 bg-white p-3 flex flex-wrap items-center justify-between gap-2">
                        <div class="min-w-0">
                            <p class="font-bold text-slate-800"><span class="font-mono">${orderNoLabel(o)}</span> — ${esc(orderPartyText(o))}</p>
                            <p class="text-xs text-slate-600">${esc(orderTimeText(o) || 'طول اليوم')} · ${esc(ORDER_TRANSPORT[t.type] || 'بدون وسيلة')}</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-1">${orderStatusBadge(o)} ${orderWarnBadges(o)}
                            <button type="button" onclick="navigate('orders/${esc(o.id)}')" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50" aria-label="فتح"><i class="fa-solid fa-eye"></i></button></div>
                    </div>`;
                }).join('') : '<p class="text-sm text-slate-500">مفيش طلبيات في اليوم ده</p>';
                return `<section class="bg-slate-50 rounded-2xl border-2 border-slate-300 p-3 space-y-2">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <h3 class="font-bold text-slate-800">${esc(WEEKDAY_AR[new Date(d + 'T00:00:00').getDay()])} ${esc(fmtDateAr(d))}</h3>
                        <p class="text-xs font-bold text-slate-700">${list.length} طلبية</p>
                    </div>${rows}</section>`;
            }).join('');
            const unscheduled = open.filter(o => !orderDateOf(o));
            const unsRows = unscheduled.length ? unscheduled.map(o => `<div class="flex flex-wrap items-center justify-between gap-2 rounded-xl border-2 border-amber-200 bg-amber-50 p-2">

                <button type="button" onclick="navigate('orders/${esc(o.id)}')" class="text-sm font-bold text-brand-700 underline">حدد الجدولة</button></div>`).join('')
                : '<p class="text-sm text-slate-500">كل الطلبيات المفتوحة متجدولة</p>';
            return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-4 flex flex-wrap items-end gap-3">
                    ${field('من يوم', `<input type="date" value="${esc(start)}" onchange="setOrdersSched(this.value, ordersSchedDays)" class="${INPUT_CLS}">`)}
                    ${field('عدد الأيام', `<select onchange="setOrdersSched(ordersSchedDate, this.value)" class="${INPUT_CLS}">${[7, 14, 30].map(n => `<option value="${n}" ${n === ordersSchedDays ? 'selected' : ''}>${n} يوم</option>`).join('')}</select>`)}
                    ${btn(`setOrdersSched('${addDaysISO(start, -ordersSchedDays)}', ${ordersSchedDays})`, 'السابق', 'fa-chevron-right', BTN_SECONDARY)}
                    ${btn(`setOrdersSched('${addDaysISO(start, ordersSchedDays)}', ${ordersSchedDays})`, 'التالي', 'fa-chevron-left', BTN_SECONDARY)}
                    ${btn(`setOrdersSched('${todayISO()}', ${ordersSchedDays})`, 'النهارده', 'fa-calendar-day', BTN_SECONDARY)}
                </div>
                <div class="space-y-3">${dayCards}</div>
                <div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-4 space-y-2">
                    <h3 class="font-bold text-slate-800"><i class="fa-solid fa-circle-question text-amber-500"></i> طلبيات مفتوحة لسه مش متجدولة</h3>${unsRows}
                </div>`;
        }
        // ---- add / edit form (its own page: orders/new, orders/edit/<id>) ----
        // Fields the user cannot change are disabled. Prices are not rendered at all without orders.prices.
        const ORDER_TRANSPORT_FIELDS = {
            truck: [],
            car: [],
            other: ['company', 'description', 'cost']
        };

        function ordIn(name, label, value, ok = true, type = 'text', extra = '') {
            return field(label, `<input name="${name}" type="${type}" value="${esc(value ?? '')}" ${ok ? '' : 'disabled'} ${extra} class="${INPUT_CLS}">`);
        }
        function ordSel(name, label, options, value, ok = true) {
            return field(label, `<select name="${name}" ${ok ? '' : 'disabled'} class="${INPUT_CLS}">${options.map(o => {
                const [v, l] = Array.isArray(o) ? o : [o, o];
                return `<option value="${esc(v)}" ${String(value ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`;
            }).join('')}</select>`);
        }
        const ordCard = (title, icon, body) => `<section class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 sm:p-5 space-y-4">
            <h3 class="font-bold text-slate-800 text-base"><i class="fa-solid ${icon} text-brand-600"></i> ${title}</h3>${body}</section>`;

        function orderItemRowHtml(it, pr, canEdit, canPrice) {
            const dis = canEdit ? '' : 'disabled';

                <select data-f="unit" ${dis} onchange="syncQtyLabel(this); recalcOrderTotals()" class="${INPUT_CLS}">${ORDER_UNITS.map(u => `<option ${it.unit === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></label>`;
            const prices = canPrice ? `${f('unitPrice', 'سعر الوحدة', pr.unitPrice, 'number', 'text-start')}${f('discount', 'خصم %', pr.discount, 'number')}` : '';

                        <input data-f="qty" type="number" value="${esc(it.qty ?? '')}" ${dis} oninput="recalcOrderTotals()" class="${INPUT_CLS}"></label>
