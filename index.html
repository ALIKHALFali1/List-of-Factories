        function addOrderItemRow() {
            const holder = el('orderItems');
            if (!holder) return;
            const it = { id: uid('it-'), product: ORDER_PRODUCTS[0], code: '', name: '', size: '', shade: '', unit: 'م²', qty: '', m2PerBox: '' };
            holder.insertAdjacentHTML('beforeend', orderItemRowHtml(it, { unitPrice: '', discount: '' }, true, canOrd('prices')));
            recalcOrderTotals();
        }
        function removeOrderItemRow(b) {
            b.closest('[data-item-row]').remove();
            recalcOrderTotals();
        }

        // Read the item rows from the page. Prices are kept from the saved order when the user cannot see them.
        function readOrderItems(existing) {
            const items = [], prices = {};
            document.querySelectorAll('#orderItems [data-item-row]').forEach(row => {
                const g = n => { const x = row.querySelector(`[data-f="${n}"]`); return x ? x.value : ''; };
                const it = {
                    id: row.dataset.iid, product: g('product'), code: g('code').trim(), name: g('name').trim(), size: g('size').trim(),
                    shade: g('shade').trim(), unit: g('unit'), qty: numOr0(g('qty')), m2PerBox: numOr0(g('m2PerBox'))
                };
                if (!it.code && !it.name && !it.qty) return;
                items.push(it);
                if (canOrd('prices')) prices[it.id] = { unitPrice: numOr0(g('unitPrice')), discount: Math.min(100, Math.max(0, numOr0(g('discount')))) };
                else if (existing && existing.prices && existing.prices[it.id]) prices[it.id] = existing.prices[it.id];
            });
            return { items, prices };
        }

        function syncQtyLabel(unitSelect) {
            const row = unitSelect.closest('[data-item-row]');
            const span = row && row.querySelector('[data-qty-text]');
            if (span) span.textContent = qtyLabelFor(unitSelect.value);
        }

        function recalcOrderTotals() {
            const box = el('orderTotals');
            if (!box) return;
            const { items, prices } = readOrderItems({ prices: {} });
            const t = { subtotal: 0, discount: 0, net: 0, m2: 0, boxes: 0, pieces: 0 };
            items.forEach(it => { const l = lineCalc(it, prices[it.id] || { unitPrice: 0, discount: 0 }, M2_BASIS); Object.keys(t).forEach(k => { t[k] = r2(t[k] + l[k]); }); });
            const cell = (label, value, cls = '') => `<div class="rounded-xl bg-white border border-slate-200 p-2"><p class="text-[11px] font-bold text-slate-500">${label}</p><p class="font-bold ${cls}">${value}</p></div>`;
            box.innerHTML = `${cell('م²', fmtDigits(t.m2))}${cell('كرتونة', fmtDigits(t.boxes))}${cell('قطعة', fmtDigits(t.pieces))}`
                + (canOrd('prices') ? `${cell('الإجمالي', fmtMoney(t.subtotal))}${cell('الخصم', fmtMoney(t.discount))}${cell('الصافي', fmtMoney(t.net), 'text-emerald-700')}` : '');
        }

        function transportTypeChanged(sel) {
            const type = sel.value;
            document.querySelectorAll('#orderForm [data-ttype]').forEach(x => { x.classList.toggle('hidden', !x.dataset.ttype.split(' ').includes(type)); });
            const ok = canOrd(type === 'truck' ? 'truck' : type === 'car' ? 'car' : 'other');
            document.querySelectorAll('#orderForm [data-tfield]').forEach(x => { x.disabled = !ok; });
        }

        function keptOrderDraft(key) {
            if (!orderFormKeep) return null;
            if (orderFormKeep.key !== key) { orderFormKeep = null; return null; }
            return orderFormKeep.draft;
        }

        // Opens the factory / supplier modal from the order form. The unsaved order is kept and the new one is selected.
        function openSupplierFromOrder() {
            if (!canOrd('addSupplier')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const param = parseRoute().param || '';
            const isNew = param === 'new';
            const id = param.startsWith('edit/') ? param.slice(5) : '';
            const base = isNew ? { id: '', no: 0, status: 'draft', createdAt: '', createdBy: '', items: [], prices: {}, history: [] }
                : appData.orders.find(x => x.id === id);
            if (!base) return toast('افتح الطلبية الأول', 'error');
            orderFormKeep = { key: isNew ? 'new' : 'edit/' + id, draft: readOrderForm(base) };
            openCompanyModal(null, true);
        }

        function ordersFormHtml(o, isNew) {
            const canContent = isNew ? canOrd('create') : canOrd('edit');
            const canSched = canOrd('schedule');
            const canPay = canOrd('payment');
            const t = o.transport || {};
            const type = t.type || 'truck';
            const s = o.schedule || {};
            const p = o.payment || {};
            const tOk = canOrd(type === 'truck' ? 'truck' : type === 'car' ? 'car' : 'other');
            const tf = (name, label, value, ttype = '', type2 = 'text') => {
                const wrap = field(label, `<input name="${name}" data-tfield type="${type2}" value="${esc(value ?? '')}" ${tOk ? '' : 'disabled'} class="${INPUT_CLS}">`);
                return ttype ? `<div data-ttype="${ttype}" class="${ttype.split(' ').includes(type) ? '' : 'hidden'}">${wrap}</div>` : wrap;
            };
            const headerCard = ordCard('بيانات الطلبية', 'fa-file-lines', `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${ordSel('kind', 'نوع الطلبية', Object.entries(ORDER_KIND), o.kind || 'supply', canContent)}
                    ${field('المصنع / المورد (للتوريد)', `<select name="factoryId" ${canContent ? '' : 'disabled'} class="${INPUT_CLS}">${[['', '—'], ...appData.companies.map(c => [c.id, companyOptionLabel(c)])].map(([v, l]) => `<option value="${esc(v)}" ${String(o.factoryId || '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>${canContent && canOrd('addSupplier') ? `<button type="button" onclick="openSupplierFromOrder()" class="${BTN_SECONDARY} w-full mt-2"><i class="fa-solid fa-plus"></i> إضافة مصنع / مورد جديد</button>` : ''}`)}
                    ${ordIn('ref', 'رقم المرجع / الفاتورة', o.ref, canContent)}
                    ${ordIn('customerName', 'اسم العميل (للتسليم)', o.customerName, canContent)}
                    ${ordIn('customerPhone', 'تليفون العميل', o.customerPhone, canContent, 'tel')}
                    ${ordIn('customerAddress', 'عنوان التسليم', o.customerAddress, canContent)}
                </div>
                ${field('ملاحظات', `<textarea name="notes" rows="2" ${canContent ? '' : 'disabled'} class="${INPUT_CLS}">${esc(o.notes || '')}</textarea>`)}`);
            const schedCard = ordCard('الجدولة', 'fa-calendar-days', `
                <p class="text-xs text-slate-600">للتوريد: تاريخ الشحن من المصنع وتاريخ الوصول لمخزنك. للتسليم: تاريخ التسليم ونافذة الساعات والمسار.</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${ordIn('plannedDate', 'تاريخ الشحن / التسليم المخطط', s.plannedDate, canSched, 'date')}
                    ${ordIn('timeFrom', 'من الساعة', s.timeFrom, canSched, 'time')}
                    ${ordIn('timeTo', 'إلى الساعة', s.timeTo, canSched, 'time')}
                    ${ordIn('arrivalDate', 'تاريخ الوصول للمخزن (توريد)', s.arrivalDate, canSched, 'date')}
                    ${ordIn('route', 'المسار / المنطقة (تسليم)', s.route, canSched)}
                </div>`);
            const transportCard = ordCard('الوسيلة والنقل', 'fa-truck', `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${ordSel('transportType', 'نوع الوسيلة', Object.entries(ORDER_TRANSPORT), type, true).replace('<select ', '<select onchange="transportTypeChanged(this)" ')}
                    ${tf('company', 'شركة النقل', t.company, 'other')}
                    ${tf('description', 'وصف الوسيلة', t.description, 'other')}
                    ${tf('cost', 'تكلفة النقل', t.cost, 'other', 'number')}
                </div>
                <p class="text-xs text-slate-500">الحقول بتتغير حسب نوع الوسيلة. كل نوع ليه صلاحية تعديل منفصلة.</p>`);
            const itemsCard = ordCard('الأصناف', 'fa-boxes-stacked', `
                <div id="orderItems" class="space-y-3">${(o.items || []).map(it => orderItemRowHtml(it, priceOf(o, it.id), canContent, canOrd('prices'))).join('')}</div>
                ${canContent ? btn('addOrderItemRow()', 'إضافة صنف', 'fa-plus', BTN_SECONDARY) : ''}
                <div id="orderTotals" class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-2 text-sm"></div>`);
            const payCard = canOrd('payment') ? ordCard('الدفع', 'fa-wallet', `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    ${ordSel('terms', 'شروط الدفع', ORDER_TERMS, p.terms || 'نقدي', canPay)}
                    ${ordIn('paid', 'المدفوع', p.paid, canPay, 'number')}
                    ${ordIn('dueDate', 'تاريخ الاستحقاق', p.dueDate, canPay, 'date')}
                </div>`) : '';
            const imgEditable = canOrdImages();
            const imagesCard = ordCard('صورة الفاتورة والمرفقات', 'fa-file-image', `
                <p class="text-xs text-slate-600">ارفق صورة الفاتورة أو أي مستند (PNG، لحد ${ORDER_IMG_MAX} صور). التطبيق بيضغط الصورة تلقائياً.</p>
                <div id="orderImgBox" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">${isNew ? '' : '<p class="text-sm text-slate-500">جاري تحميل الصور...</p>'}</div>
                ${imgEditable ? `<label class="${BTN_PRIMARY} cursor-pointer w-fit"><i class="fa-solid fa-plus"></i> إضافة صورة الفاتورة<input type="file" accept="image/*" class="hidden" onchange="onOrderImagePicked(this, ${isNew ? "''" : `'${esc(o.id)}'`})"></label>` : ''}`);
            return `<form id="orderForm" onsubmit="saveOrderForm(event, ${isNew ? "''" : `'${esc(o.id)}'`})" class="space-y-4">
                ${imagesCard}${headerCard}${schedCard}${transportCard}${itemsCard}${payCard}
                <div class="flex flex-wrap gap-2 justify-end sticky bottom-2">
                    ${btn("navigate('orders')", 'رجوع', 'fa-arrow-right', BTN_SECONDARY)}
                    <button type="submit" class="${BTN_PRIMARY} whitespace-nowrap"><i class="fa-solid fa-floppy-disk"></i><span>${isNew ? 'حفظ الطلبية' : 'حفظ التعديلات'}</span></button>
                </div>
            </form>`;
        }

        // Build the order from the form. Keeps everything the user cannot change.
        function readOrderForm(o) {
            const f = el('orderForm');
            const v = n => (f.elements[n] ? f.elements[n].value : '');
            const type = v('transportType') || 'truck';
            const { items, prices } = readOrderItems(o);
            const transport = { type };
            ORDER_TRANSPORT_FIELDS[type].forEach(k => { transport[k] = v(k).trim(); });
            if (type === 'other') transport.cost = numOr0(v('cost'));
            return {
                ...o,
                kind: v('kind') || 'supply',
                factoryId: v('factoryId'),
                factoryName: (appData.companies.find(c => c.id === v('factoryId')) || {}).name || '',
                customerName: v('customerName').trim(), customerPhone: v('customerPhone').trim(), customerAddress: v('customerAddress').trim(),
                ref: v('ref').trim(), notes: v('notes').trim(),
                schedule: {
                    plannedDate: v('plannedDate'), timeFrom: v('timeFrom'), timeTo: v('timeTo'), arrivalDate: v('arrivalDate'),
                    route: v('route').trim(), actualDate: (o.schedule || {}).actualDate || ''
                },
                transport,
                payment: canOrd('payment') ? { terms: v('terms') || 'نقدي', paid: numOr0(v('paid')), dueDate: v('dueDate') } : (o.payment || { terms: 'نقدي', paid: 0, dueDate: '' }),
                items,
                prices,
                priceBasis: (canOrd('prices') || !appData.orders.some(x => x.id === o.id)) ? M2_BASIS : o.priceBasis
            };
        }

        // Which permission groups a change touches. Used to block a save the user is not allowed to make.
        // A new order is compared with an empty order, so only the parts that were filled in need permissions.
        const EMPTY_ORDER = {
            kind: 'supply', factoryId: '', customerName: '', customerPhone: '', customerAddress: '', ref: '', notes: '',
            items: [], prices: {}, schedule: {}, transport: { type: 'truck' }, payment: { terms: 'نقدي', paid: 0, dueDate: '' }
        };
        const nonEmpty = obj => Object.fromEntries(Object.entries(obj || {}).filter(([, v]) => v !== '' && v !== null && v !== undefined && v !== 0 && v !== false));
        function orderChangedGroups(before, after) {
            const base = before || EMPTY_ORDER;
            const groups = [];
            const contentKeys = ['kind', 'factoryId', 'customerName', 'customerPhone', 'customerAddress', 'ref', 'notes', 'items'];
            if (canon(contentKeys.map(k => base[k] ?? '')) !== canon(contentKeys.map(k => after[k] ?? ''))) groups.push('edit');
            if (canon(base.prices || {}) !== canon(after.prices || {})) groups.push('prices');
            if (canon(nonEmpty(base.schedule)) !== canon(nonEmpty(after.schedule))) groups.push('schedule');
            if (canon(nonEmpty(base.payment)) !== canon(nonEmpty(after.payment))) groups.push('payment');
            const bt = nonEmpty(base.transport), at = nonEmpty(after.transport);
            if (canon(bt) !== canon(at)) {
                // a transport change needs the permission of the new type, and of the old type when the type changed
                [...new Set([bt.type, at.type].filter(Boolean))].forEach(tp => groups.push(tp));
            }
            return groups;
        }
        const missingOrderPerms = (before, after) => orderChangedGroups(before, after)
            .map(g => ORDER_PERM[g]).filter(p => !can(p));

        function saveOrderForm(e, id) {
            e.preventDefault();
            const isNew = !id;
            if (isNew && !canOrd('create')) return toast('ليس لديك صلاحية إنشاء طلبيات', 'error');
            const before = isNew ? null : appData.orders.find(x => x.id === id);
            if (!isNew && !before) return navigate('orders');
            const base = before || { id: uid('ord-'), no: nextOrderNo(), status: 'draft', createdAt: new Date().toISOString(), createdBy: orderUserName(), items: [], prices: {}, history: [] };
            const draft = readOrderForm(base);
            const denied = missingOrderPerms(before, draft);
            if (denied.length) {
                const names = denied.map(p => PERM_LABELS[p] || p).join('، ');
                return toast(`ليس لديك صلاحية لتعديل: ${names}`, 'error', null, 6000);
            }
            if (draft.kind === 'supply' && !draft.factoryId && !draft.customerName) return toast('اختار المصنع للتوريد', 'error');
            if (draft.kind === 'delivery' && !draft.customerName) return toast('اكتب اسم العميل للتسليم', 'error');
            if (draft.schedule.timeFrom && draft.schedule.timeTo && draft.schedule.timeFrom >= draft.schedule.timeTo) return toast('ساعة النهاية لازم تكون بعد البداية', 'error');
            if (!ordersReady()) return toast(ordersBlockReason(), 'error', null, 8000);
            draft.history = [...(base.history || []), { at: new Date().toISOString(), by: orderUserName(), text: isNew ? 'إنشاء الطلبية' : 'تعديل البيانات' }];
            if (isNew) appData.orders.push(draft);
            else Object.assign(before, draft);
            pendingOrderCopies.set(draft.id, JSON.parse(JSON.stringify(draft)));
            pendingOrderError.delete(draft.id);
            savePendingLocal();
            saveState().then(ok => { if (ok) toast(isNew ? 'تم حفظ الطلبية على السيرفر' : 'تم حفظ التعديلات على السيرفر', 'success'); });
            if (isNew) commitPendingOrderImages(draft.id);
            log(isNew ? 'إضافة طلبية' : 'تعديل طلبية', orderNoLabel(draft));
            navigate(`orders/${draft.id}`);
        }

        // ---- status moves ----
        function changeOrderStatus(id, to) {
            const o = appData.orders.find(x => x.id === id);
            if (!o) return;
            const move = (ORDER_NEXT[o.status] || []).find(m => m[0] === to);
            if (!move) return toast('الحركة دي مش مسموحة من الحالة الحالية', 'error');
            if (!canOrd(move[1])) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const problem = orderProblem(o, to);
            if (problem) return toast(problem, 'error', null, 5000);
            o.status = to;
            if (ORDER_STAGES.includes(to)) o.stages = { ...(o.stages || {}), [to]: { date: todayISO(), note: (((o.stages || {})[to]) || {}).note || '' } };
            o.history = [...(o.history || []), { at: new Date().toISOString(), by: orderUserName(), text: `الحالة: ${ORDER_STATUS[to]}` }];
            saveState();
            log('حالة طلبية', `${orderNoLabel(o)} — ${ORDER_STATUS[to]}`);
            toast(`تم تغيير الحالة إلى ${ORDER_STATUS[to]}`, 'success');
            render();
        }

        function deleteOrder(id) {
            if (!canOrd('delete')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const idx = appData.orders.findIndex(x => x.id === id);
            if (idx < 0) return;
            finalizePendingUndo();
            const o = appData.orders[idx];
            appData.orders.splice(idx, 1);
            pendingOrderCopies.delete(id);
            pendingOrderError.delete(id);
            savePendingLocal();
            log('حذف طلبية', orderNoLabel(o));
            render();
            scheduleUndo(`تم حذف ${orderNoLabel(o)}`, () => {
                appData.orders.splice(Math.min(idx, appData.orders.length), 0, o);
                log('استعادة طلبية', orderNoLabel(o));
                render();
            }, () => dropOrderImages(o.id));
        }

        // A copy starts as a new draft: same parties, items and prices; dates and history are cleared.
        function copyOrder(id) {
            if (!canOrd('create')) return toast('ليس لديك صلاحية إنشاء طلبيات', 'error');
            const src = appData.orders.find(x => x.id === id);
            if (!src) return;
            const items = (src.items || []).map(it => ({ ...it, id: uid('it-') }));
            const prices = {};
            (src.items || []).forEach((it, i) => { if (src.prices && src.prices[it.id]) prices[items[i].id] = { ...src.prices[it.id] }; });
            const copy = {
                ...src, id: uid('ord-'), no: nextOrderNo(), status: 'draft', items, prices,
                schedule: { route: (src.schedule || {}).route || '' }, createdAt: new Date().toISOString(), createdBy: orderUserName(),
                history: [{ at: new Date().toISOString(), by: orderUserName(), text: `نسخة من ${orderNoLabel(src)}` }]
            };
            if (!canOrd('payment')) copy.payment = { terms: 'نقدي', paid: 0, dueDate: '' };
            appData.orders.push(copy);
            saveState();
            log('نسخ طلبية', `${orderNoLabel(src)} → ${orderNoLabel(copy)}`);
            navigate(`orders/edit/${copy.id}`);
        }
        // ---- order photos (PNG): one node per photo under orderImages/{orderId}/{photoId} ----
        const ORDER_IMG_MAX = 5;
        const ORDER_IMG_MAX_CHARS = 900000;     // one database node; the rules check the same limit
        let pendingNewOrderImages = [];         // photos of a new order: uploaded after the order is saved
        let orderImgView = [];                  // the photos on screen (for the viewer)
        const canOrdImages = () => canOrd('edit') || canOrd('create');

        // resize and convert to PNG until the data fits in one database node
        async function orderImageDataUrl(file) {
            if (!file.type.startsWith('image/')) throw userError('اختار ملف صورة');
            for (const max of [1600, 1200, 900, 700, 500]) {
                const url = await processImage(file, max);
                if (url.length <= ORDER_IMG_MAX_CHARS) return url;
            }
            throw userError('الصورة كبيرة قوي حتى بعد الضغط. اختار صورة أصغر');
        }

        async function loadOrderImages(orderId) {
            const v = (await rtdb.ref('orderImages/' + orderId).once('value')).val() || {};
            return Object.keys(v).map(k => ({ key: k, name: v[k].name || '', data: v[k].data || '' })).filter(x => x.data);
        }

        function paintOrderImageTiles(boxId, items, editable, removeFn) {
            const box = el(boxId);
            if (!box) return;
            orderImgView = items;
            box.innerHTML = items.length ? items.map((x, i) => `<div class="rounded-xl border-2 border-slate-200 bg-white p-1.5 space-y-1">
                    <button type="button" onclick="openOrderImageAt(${i})" class="block w-full" title="فتح الصورة">
                        <img src="${x.data}" alt="${esc(x.name)}" class="w-full h-28 object-contain rounded-lg bg-slate-50">
                    </button>
                    <div class="flex items-center justify-between gap-1">
                        <span class="text-[11px] text-slate-600 truncate">${esc(x.name)}</span>
                        ${editable ? `<button type="button" onclick="${removeFn(i, x)}" class="${BTN_ICON} w-8 h-8 text-rose-600 hover:bg-rose-50" aria-label="حذف الصورة"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                    </div>
                </div>`).join('') : '<p class="text-sm text-slate-500 col-span-full">مفيش صور مرفقة</p>';
        }

        async function paintOrderImages(boxId, orderId, editable) {
            let list;
            try {
                list = await loadOrderImages(orderId);
            } catch (err) {
                console.error(err);
                const box = el(boxId);
                if (box) box.innerHTML = '<p class="text-sm text-rose-600 col-span-full">تعذر تحميل الصور من السيرفر</p>';
                return;
            }
            paintOrderImageTiles(boxId, list, editable, (i, x) => `removeOrderImage('${esc(orderId)}', '${esc(x.key)}')`);
        }

        function paintPendingOrderImages() {
            paintOrderImageTiles('orderImgBox', pendingNewOrderImages, canOrdImages(), i => `removePendingOrderImage(${i})`);
        }

        function removePendingOrderImage(i) {
            pendingNewOrderImages.splice(i, 1);
            paintPendingOrderImages();
        }

        async function onOrderImagePicked(input, orderId) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            if (!canOrdImages()) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            try {
                const dataUrl = await orderImageDataUrl(file);
                const name = String(file.name || 'صورة').slice(0, 200);
                if (!orderId) {
                    if (pendingNewOrderImages.length >= ORDER_IMG_MAX) return toast(`الحد ${ORDER_IMG_MAX} صور للطلبية`, 'error');
                    pendingNewOrderImages.push({ name, data: dataUrl });
                    return paintPendingOrderImages();
                }
                const current = await loadOrderImages(orderId);
                if (current.length >= ORDER_IMG_MAX) return toast(`الحد ${ORDER_IMG_MAX} صور للطلبية`, 'error');
                await rtdb.ref('orderImages/' + orderId).push({ name, type: 'image/png', data: dataUrl });
                toast('تمت إضافة الصورة', 'success');
                paintOrderImages('orderImgBox', orderId, true);
            } catch (err) {
                console.error(err);
                toast(err.userMessage || 'تعذر حفظ الصورة على السيرفر. تأكد من الإنترنت، ولو المشكلة مستمرة اتأكد إن قواعد قاعدة البيانات متنشرة', 'error', null, 8000);
            }
        }

        async function removeOrderImage(orderId, key) {
            if (!canOrdImages()) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            if (!confirm('حذف الصورة من الطلبية؟')) return;
            try {
                await rtdb.ref(`orderImages/${orderId}/${key}`).remove();
                toast('تم حذف الصورة', 'success');
                paintOrderImages('orderImgBox', orderId, true);
            } catch (err) {
                console.error(err);
                toast('تعذر حذف الصورة من السيرفر', 'error');
            }
        }

        // opens the photo in a new tab (a blob address works where a data address is blocked)
        function openOrderImageAt(i) {
            const x = orderImgView[i];
            if (!x) return;
            const b64 = x.data.split(',')[1] || '';
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
            const url = URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
            window.open(url, '_blank');
            setTimeout(() => URL.revokeObjectURL(url), 120000);
        }

        // called right after a new order is saved (it has its id now)
        async function commitPendingOrderImages(orderId) {
            const list = pendingNewOrderImages.splice(0);
            if (!list.length) return;
            try {
                for (const x of list) {
                    await rtdb.ref('orderImages/' + orderId).push({ name: x.name, type: 'image/png', data: x.data });
                }
            } catch (err) {
                console.error(err);
                toast('الطلبية اتحفظت لكن تعذر رفع بعض الصور. ضيفها تاني من تعديل الطلبية', 'error', null, 8000);
            }
        }

        // a deleted order takes its photos with it (rules allow removing each photo node, not the whole folder)
        async function dropOrderImages(orderId) {
            try {
                const v = (await rtdb.ref('orderImages/' + orderId).once('value')).val() || {};
                await Promise.all(Object.keys(v).map(k => rtdb.ref(`orderImages/${orderId}/${k}`).remove()));
            } catch (err) {
                console.warn('order photos not removed:', err && err.code);
            }
        }

        // ---- pages: list (with tabs), schedule, reports, form, detail ----
        function ordersTabs(tab) {
            const tabBtn = (route, label, icon, key) => `<button type="button" onclick="navigate('${route}')" class="px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 ${tab === key ? 'bg-brand-600 text-white' : 'bg-white text-slate-700 border-2 border-slate-300 hover:bg-slate-50'}"><i class="fa-solid ${icon}"></i>${label}</button>`;
            return `<div class="flex flex-wrap gap-2">
                ${tabBtn('orders', 'الطلبيات', 'fa-list', 'list')}
                ${tabBtn('orders/schedule', 'لوحة الجدولة', 'fa-calendar-days', 'schedule')}
                ${canOrd('reports') ? tabBtn('orders/reports', 'التقارير', 'fa-chart-column', 'reports') : ''}
            </div>`;
        }

        function ordersTabBody(tab) {
            if (tab === 'schedule') return scheduleBoardHtml();
            if (tab === 'reports') return ordersReportsHtml();
            return `${ordersFilterBar()}${ordersListHtml()}`;
        }

        function viewOrders(param) {
            const parts = String(param || '').split('/');
            if (parts[0] === 'new') {
                if (!canOrd('create')) return { title: 'طلبية جديدة', html: noOrderAccessHtml() };
                const o = keptOrderDraft('new') || { kind: 'supply', items: [], prices: {}, schedule: {}, transport: { type: 'truck' }, payment: { terms: 'نقدي', paid: 0, dueDate: '' } };
                return { title: 'طلبية جديدة', actions: btn("navigate('orders')", 'رجوع', 'fa-arrow-right', BTN_SECONDARY), html: ordersFormHtml(o, true), after: () => { addFirstItemIfEmpty(); paintPendingOrderImages(); } };
            }
            if (parts[0] === 'edit' && parts[1]) {
                const o = keptOrderDraft('edit/' + parts[1]) || appData.orders.find(x => x.id === parts[1]);
                if (!o) return { title: 'الطلبيات', html: notFoundOrderHtml() };
                return { title: `تعديل ${orderNoLabel(o)}`, actions: btn(`navigate('orders/${esc(o.id)}')`, 'رجوع', 'fa-arrow-right', BTN_SECONDARY), html: ordersFormHtml(o, false), after: () => paintOrderImages('orderImgBox', o.id, canOrdImages()) };
            }
            if (parts[0] && !['schedule', 'reports'].includes(parts[0])) {
                const o = appData.orders.find(x => x.id === parts[0]);
                if (!o) return { title: 'الطلبيات', html: notFoundOrderHtml() };
                return { title: orderNoLabel(o), actions: orderDetailActions(o), html: pendingOrderBanner(o) + orderDetailHtml(o), after: () => paintOrderImages('ordDetailImgs', o.id, false) };
            }
            const tab = parts[0] === 'schedule' ? 'schedule' : (parts[0] === 'reports' ? 'reports' : 'list');
            if (tab === 'reports' && !canOrd('reports')) return { title: 'التقارير', html: noOrderAccessHtml() };
            const titles = { list: 'الطلبيات', schedule: 'لوحة الجدولة', reports: 'تقارير الطلبيات' };
            return {
                title: titles[tab],
                actions: canOrd('create') ? btn("navigate('orders/new')", 'طلبية جديدة', 'fa-plus') : '',
                html: `${ordersTabs(tab)}<div id="ordersBody" class="space-y-4 mt-4">${ordersTabBody(tab)}</div>`
            };
        }
        function addFirstItemIfEmpty() {
            if (el('orderItems') && !el('orderItems').children.length) addOrderItemRow();
            recalcOrderTotals();
        }
        const noOrderAccessHtml = () => `<div class="bg-white rounded-2xl border-2 border-slate-300 p-8 text-center"><i class="fa-solid fa-lock text-4xl text-slate-300 mb-3"></i><p class="text-slate-600 font-bold">ليس لديك صلاحية لهذه الصفحة</p></div>`;
        const notFoundOrderHtml = () => `<div class="bg-white rounded-2xl border-2 border-slate-300 p-8 text-center"><p class="text-slate-600 font-bold mb-4">الطلبية دي مش موجودة (ممكن تكون اتحذفت)</p>${btn("navigate('orders')", 'رجوع للطلبيات', 'fa-arrow-right', BTN_SECONDARY)}</div>`;

        // ---- detail page ----
        function orderDetailActions(o) {
            const acts = [];
            if (canOrd('print')) acts.push(btn(`printOrderDoc('${esc(o.id)}')`, 'طباعة', 'fa-print', BTN_SECONDARY));
            if (canOrd('print')) acts.push(btn(`printLoadingSlip('${esc(o.id)}')`, 'إذن تحميل', 'fa-file-signature', BTN_SECONDARY));
            if (canOrd('edit') || canOrd('schedule') || canOrd('payment') || canOrd('prices') || ['truck', 'car', 'other'].some(k => can(ORDER_PERM[k]))) {
                acts.push(btn(`navigate('orders/edit/${esc(o.id)}')`, 'تعديل', 'fa-pen', BTN_SECONDARY));
            }
            return `<div class="flex flex-wrap gap-2">${acts.join('')}</div>`;
        }

        function pendingOrderBanner(o) {
            if (!isPendingOrder(o)) return '';
            return `<div class="mb-4 rounded-2xl border-2 border-amber-300 bg-amber-50 p-4 flex flex-wrap items-center justify-between gap-3">
                <div class="text-sm text-amber-900 min-w-0">
                    <p class="font-bold"><i class="fa-solid fa-triangle-exclamation"></i> الطلبية دي لسه ما اتحفظتش على السيرفر</p>
                    <p class="text-xs mt-1">${esc(pendingOrderError.get(o.id) || 'جاري المحاولة تلقائياً')}. محفوظة على جهازك ومش هتتمسح.</p>
                </div>
                ${btn('retryPendingOrders()', 'إعادة المحاولة', 'fa-rotate', BTN_PRIMARY)}
            </div>`;
        }

        function orderDetailHtml(o) {
            const t = orderTotals(o);
            const s = o.schedule || {}, tr = o.transport || {}, pay = o.payment || {};
            const moves = (ORDER_NEXT[o.status] || []).filter(m => canOrd(m[1]));
            const moveBtns = moves.map(([to, perm, label]) => `<button type="button" onclick="changeOrderStatus('${esc(o.id)}', '${to}')" class="${to === 'cancelled' ? 'px-4 py-2 rounded-lg text-sm font-bold bg-rose-600 hover:bg-rose-700 text-white' : BTN_PRIMARY} whitespace-nowrap">${label}</button>`).join('');
            const warn = orderWarnBadges(o);
            const statusBtn = canAnyStatusAction() ? `<button type="button" onclick="openOrderStatusModal('${esc(o.id)}')" class="${BTN_SECONDARY} whitespace-nowrap"><i class="fa-solid fa-arrows-rotate"></i> الحالة والمراحل</button>` : '';
            const stagesBody = ORDER_STAGES.map(st => {
                const sd = stageValueOf(o, st), note = ((o.stages || {})[st] || {}).note || '';
                return `<div class="flex flex-wrap justify-between items-center gap-2 py-2 border-b border-slate-200 text-sm"><div class="min-w-0"><span class="font-bold text-slate-700">${ORDER_STATUS[st]}</span> <span class="text-slate-600">${sd ? esc(fmtDateAr(sd)) : '—'}</span>${note ? `<p class="text-xs text-slate-500">${esc(note)}</p>` : ''}</div>${stageAllowed(st) ? `<button type="button" onclick="openOrderStatusModal('${esc(o.id)}', '${st}')" class="${BTN_SECONDARY} text-xs">تعديل</button>` : ''}</div>`;
            }).join('');
            const row = (label, value) => `<div class="flex justify-between gap-3 py-2 border-b border-slate-200 text-sm"><span class="text-slate-600 font-bold">${label}</span><span class="text-slate-900 text-end">${value || '—'}</span></div>`;
            const card = (title, icon, body) => `<section class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 sm:p-5"><h3 class="font-bold text-slate-800 mb-2"><i class="fa-solid ${icon} text-brand-600"></i> ${title}</h3>${body}</section>`;
            const itemRows = (o.items || []).map((it, i) => {
                const l = lineCalc(it, priceOf(o, it.id), o.priceBasis);
                return `<tr class="border-t border-slate-200">
                    <td class="py-2 px-2">${i + 1}</td><td class="py-2 px-2">${esc(it.product)}</td><td class="py-2 px-2 font-mono">${esc(it.code)}</td>
                    <td class="py-2 px-2">${esc(it.name)}</td><td class="py-2 px-2">${esc(it.size)}</td><td class="py-2 px-2">${esc(it.shade)}</td>
                    <td class="py-2 px-2">${esc(it.unit)}</td><td class="py-2 px-2">${fmtDigits(numOr0(it.qty))}</td>

            const itemsTable = (o.items || []).length ? `<div class="overflow-x-auto"><table class="w-full text-sm">
                <thead class="bg-slate-50 font-bold text-slate-700"><tr>
                    <th class="py-2 px-2 text-start">م</th><th class="py-2 px-2 text-start">النوع</th><th class="py-2 px-2 text-start">الكود</th>
                    <th class="py-2 px-2 text-start">الاسم</th><th class="py-2 px-2 text-start">المقاس</th><th class="py-2 px-2 text-start">الدرجة</th>
                    <th class="py-2 px-2 text-start">الوحدة</th><th class="py-2 px-2 text-start">الكمية</th><th class="py-2 px-2 text-start">م² / كرتونة</th>
                    ${canOrd('prices') ? '<th class="py-2 px-2 text-start">السعر</th><th class="py-2 px-2 text-start">الخصم</th><th class="py-2 px-2 text-start">الصافي</th>' : ''}
                </tr></thead><tbody>${itemRows}</tbody>
                <tfoot class="bg-slate-50 font-bold"><tr><td colspan="9" class="py-2 px-2">الإجمالي</td>
                    ${canOrd('prices') ? `<td colspan="2"></td><td class="py-2 px-2 text-emerald-700">${fmtMoney(t.net)}</td>` : ''}</tr></tfoot>
            </table></div>` : '<p class="text-slate-500 text-sm">مفيش أصناف</p>';
            const schedBody = `${row(o.kind === 'supply' ? 'تاريخ الشحن المخطط' : 'تاريخ التسليم المخطط', fmtDateAr(s.plannedDate))}
                ${row('نافذة الساعات', orderTimeText(o))}
                ${o.kind === 'supply' ? row('تاريخ الوصول للمخزن', fmtDateAr(s.arrivalDate)) : row('المسار / المنطقة', esc(s.route))}
                ${row('تاريخ التسليم الفعلي', fmtDateAr(deliveredDateOf(o)))}`;
            const transportBody = canSeeVehicle(o) ? `${row('نوع الوسيلة', ORDER_TRANSPORT[tr.type])}
                ${tr.type === 'other' ? row('شركة النقل', esc(tr.company)) + row('وصف الوسيلة', esc(tr.description)) : ''}
                ${tr.type === 'other' && canOrd('prices') ? row('تكلفة النقل', tr.cost ? fmtMoney(numOr0(tr.cost)) : '') : ''}`
                : `<p class="text-sm text-slate-600">${tr.type ? 'نوع الوسيلة: ' + esc(ORDER_TRANSPORT[tr.type]) + ' — تفاصيلها مش متاحة لصلاحياتك' : 'لسه مش متسجلة وسيلة'}</p>`;
            const payBody = canOrd('payment') ? `${row('شروط الدفع', esc(pay.terms))}${row('المدفوع', fmtMoney(numOr0(pay.paid)))}${row('المتبقي', fmtMoney(orderBalance(o)))}${row('تاريخ الاستحقاق', fmtDateAr(pay.dueDate))}` : '';
            const histBody = (o.history || []).slice().reverse().map(h => `<li class="text-sm"><span class="font-mono text-xs text-slate-500">${esc(new Date(h.at).toLocaleString('ar-EG'))}</span> — ${esc(h.text)} <span class="text-slate-500">(${esc(h.by || '')})</span></li>`).join('');
            const summary = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">

                <div class="bg-white rounded-2xl border-2 border-slate-300 p-3"><p class="text-xs font-bold text-slate-600">الكميات</p><p class="font-bold text-sm">${fmtDigits(t.m2)} م² · ${fmtDigits(t.boxes)} كرتونة</p></div>
                ${canOrd('prices') ? `<div class="bg-white rounded-2xl border-2 border-slate-300 p-3"><p class="text-xs font-bold text-slate-600">الصافي</p><p class="font-bold text-emerald-700">${fmtMoney(t.net)}</p></div>` : ''}
                ${canOrd('payment') ? `<div class="bg-white rounded-2xl border-2 border-slate-300 p-3"><p class="text-xs font-bold text-slate-600">المتبقي</p><p class="font-bold text-rose-700">${fmtMoney(orderBalance(o))}</p></div>` : ''}
            </div>`;
            return `<div class="space-y-4">
                <div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 flex flex-wrap items-center justify-between gap-3">

                    ${card('الجدولة', 'fa-calendar-days', schedBody)}
                    ${card('الوسيلة والنقل', 'fa-truck', transportBody)}
                    ${canOrd('payment') ? card('الدفع', 'fa-wallet', payBody) : ''}
                </div>
                ${card('مراحل الطلبية', 'fa-route', stagesBody)}
                ${card('صور الطلبية', 'fa-image', '<div id="ordDetailImgs" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 text-sm text-slate-500">جاري تحميل الصور...</div>')}

            </div>`;
        }

        // ---- print: the order, a loading slip (إذن تحميل), the list, reports ----
        function orderPrintShell(title, body) {
            return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title>

        // ---- reports (tab): by status, by party, by product ----
        function ordersReportRows() {
            const f = ordersRepFilter;

        function groupRows(rows, keyOf, labelOf) {
            const map = new Map();
            rows.forEach(o => {
                const k = keyOf(o);
                if (!map.has(k)) map.set(k, { label: labelOf(o, k), count: 0, m2: 0, boxes: 0, net: 0 });
                const g = map.get(k), t = orderTotals(o);
                g.count++; g.m2 = r2(g.m2 + t.m2); g.boxes = r2(g.boxes + t.boxes); g.net = r2(g.net + t.net);

        function reportTables(rows) {

        // ---- Excel ----
        function orderExportRow(o) {
            const t = orderTotals(o), s = o.schedule || {};

                'الرقم': orderNoLabel(o), 'النوع': ORDER_KIND[o.kind] || '', 'المصنع': o.factoryName || '', 'العميل': o.customerName || '',
                'تاريخ الجدولة': s.plannedDate || '', 'من': s.timeFrom || '', 'إلى': s.timeTo || '', 'تاريخ الوصول': s.arrivalDate || '',
                'الوسيلة': o.transport && o.transport.type ? ORDER_TRANSPORT[o.transport.type] : '', 'الحالة': ORDER_STATUS[o.status] || '',
                'م²': t.m2, 'كرتونة': t.boxes, 'قطعة': t.pieces

        function writeXlsx(sheets, fileName) {

        function exportOrdersReportXlsx() {
            if (!canOrd('export')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');

            writeXlsx([
                ['الطلبيات', rows.map(orderExportRow)],
                ['حسب الحالة', sheet(groupRows(rows, o => o.status, (o, k) => ORDER_STATUS[k] || k), 'الحالة')],
                ['حسب الطرف', sheet(groupRows(rows, o => (o.kind === 'supply' ? 'f:' + (o.factoryName || '—') : 'c:' + (o.customerName || '—')), (o, k) => k.slice(2)), 'المصنع / العميل')],
                ['حسب الصنف', sheet(groupRows(rows.flatMap(o => (o.items || []).map(it => ({ ...o, items: [it], prices: { [it.id]: priceOf(o, it.id) } }))), o => o.items[0].product, (o, k) => k), 'الصنف')]
            ], `تقرير-الطلبيات-${f.from || 'من-البداية'}`);

        // ---- storage: one database node per part of the order, so each part has its own permission ----
        // orders/{id}            header: no, kind, parties, notes (orders.edit)
        // orderStatus/{id}       { status } (orders.confirm / orders.execute)
        // orderItems/{id}        { items }  (orders.edit)
        // orderPrices/{id}       { prices } (orders.prices)
        // orderSchedule/{id}     { schedule } (orders.schedule)
        // orderPayment/{id}      { payment } (orders.payment)
        // orderHistory/{id}      { history } (anyone who can view)
        // orderTransport/{type}/{id}  { transport } (orders.transport_<type>)
        // A part is written only if its listener has loaded (ready) and the user may write it, so a partial load or
        // a missing permission can never overwrite or delete data the user did not see.
        const ORD_GROUPS = [
            ['orders', 'orders.view'], ['orderStatus', 'orders.view'], ['orderItems', 'orders.view'], ['orderSchedule', 'orders.view'],
            ['orderHistory', 'orders.view'], ['orderPrices', 'orders.prices'], ['orderPayment', 'orders.payment'],
            ['orderTransport/truck', 'orders.transport_truck'], ['orderTransport/car', 'orders.transport_car'], ['orderTransport/other', 'orders.transport_other']
        ];
        function orderDocsFor(list, out) {
            const ready = coll => !!(fbCache && fbCache.ord && fbCache.ord[coll] !== undefined);
            const usable = (coll, perm) => ready(coll) && can(perm);
            const nz = obj => Object.keys(obj || {}).some(k => obj[k] !== '' && obj[k] !== null && obj[k] !== undefined && obj[k] !== 0 && obj[k] !== false);
            list.forEach(o => {
                if (usable('orders', 'orders.view')) out.set('orders/' + o.id, {
                    id: o.id, no: o.no, kind: o.kind, factoryId: o.factoryId || '', factoryName: o.factoryName || '',
                    customerName: o.customerName || '', customerPhone: o.customerPhone || '', customerAddress: o.customerAddress || '',
                    ref: o.ref || '', notes: o.notes || '', createdAt: o.createdAt || '', createdBy: o.createdBy || '',
                    ...(o.priceBasis ? { priceBasis: o.priceBasis } : {})
                });
                if (usable('orderStatus', 'orders.view')) out.set('orderStatus/' + o.id, { status: o.status, stages: o.stages || {} });
                if (usable('orderItems', 'orders.view') && (o.items || []).length) out.set('orderItems/' + o.id, { items: o.items });
                if (usable('orderHistory', 'orders.view') && (o.history || []).length) out.set('orderHistory/' + o.id, { history: o.history });
                if (usable('orderPrices', 'orders.prices') && nz(o.prices)) out.set('orderPrices/' + o.id, { prices: o.prices });
                if (usable('orderSchedule', 'orders.schedule') && nz(o.schedule)) out.set('orderSchedule/' + o.id, { schedule: o.schedule });
                if (usable('orderPayment', 'orders.payment') && nz(o.payment)) out.set('orderPayment/' + o.id, { payment: o.payment });
                const t = o.transport || {};
                if (t.type && usable('orderTransport/' + t.type, ORDER_PERM[t.type])) out.set(`orderTransport/${t.type}/${o.id}`, { transport: t });
            });
        }
        // rebuild the in-memory orders from the parts that have loaded
        function buildOrdersFromCache(c) {
            const ord = c.ord || {};
            const part = (coll, key) => { const m = {}; Object.values(ord[coll] || {}).forEach(d => { m[d.id] = d[key]; }); return m; };
            const headers = Object.values(ord.orders || {});
            const status = part('orderStatus', 'status'), stagesOf = part('orderStatus', 'stages'), items = part('orderItems', 'items'), prices = part('orderPrices', 'prices'),
                sched = part('orderSchedule', 'schedule'), pay = part('orderPayment', 'payment'), hist = part('orderHistory', 'history');
            const transport = {};
            ['truck', 'car', 'other'].forEach(tp => Object.values(ord['orderTransport/' + tp] || {}).forEach(d => { transport[d.id] = d.transport; }));
            return headers.map(h => {
                const { pos, ...rest } = h;
                return {
                    ...rest, status: status[h.id], stages: stagesOf[h.id] || {}, items: items[h.id] || [], prices: prices[h.id] || {}, schedule: sched[h.id] || {},
                    payment: pay[h.id] || {}, history: hist[h.id] || [], transport: transport[h.id] || { type: 'truck' }
                };
            });
        }

        // Permission-gated listeners. Nothing is subscribed without its permission (a denied listener would sign the user out).
        const fbOrdErr = new Map();          // collection -> 'perm' or 'net': its listener failed and has not delivered since
        let ordRetryTimer = null;
        let ordRetryDelay = 3000;
        function scheduleOrdersRetry() {
            if (ordRetryTimer || !fbUser) return;
            ordRetryTimer = setTimeout(() => { ordRetryTimer = null; syncOrdersListener(); }, ordRetryDelay);
            ordRetryDelay = Math.min(ordRetryDelay * 2, 60000);
        }
        // the reason shown when an order cannot be saved yet
        function ordersBlockReason() {
            const kinds = [...fbOrdErr.values()];
            if (kinds.includes('perm')) return 'ليس لديك صلاحية قراءة الطلبيات من السيرفر. راجع صلاحياتك في صفحة الأدوار، ولو الصلاحيات تمام يبقى قواعد قاعدة البيانات مش منشورة';
            if (kinds.length) return 'تعذر تحميل الطلبيات من السيرفر، والمحاولة هتتكرر تلقائياً';
            return 'الطلبيات لسه بتتحمل من السيرفر. جرّب بعد ثانية';
        }
        function syncOrdersListener() {
            if (!fbCache || !fbUser) return;
            let changed = false;
            ORD_GROUPS.forEach(([coll, perm]) => {
                const want = can(perm), live = fbOrdLive.has(coll);
                if (want && !live) {
                    const unsub = fbDb.collection(coll).onSnapshot(snap => {
                        if (!fbCache) return;
                        fbCache.ord = fbCache.ord || {};
                        fbCache.ord[coll] = mapDocs(snap);
                        fbOrdErr.delete(coll);
                        ordRetryDelay = 3000;
                        onCacheChanged();
                    }, err => {
                        // a failed listener is closed by Firebase: forget it so it is opened again
                        if (fbOrdLive.get(coll) !== unsub) return;   // an older session
                        console.error('orders listener ' + coll, err);
                        fbOrdLive.delete(coll);
                        fbOrdErr.set(coll, err && err.code === 'permission-denied' ? 'perm' : 'net');
                        scheduleOrdersRetry();
                        render();
                    });
                    fbOrdLive.set(coll, unsub);
                } else if (!want && live) {
                    try { fbOrdLive.get(coll)(); } catch (e) { /* already closed */ }
                    fbOrdLive.delete(coll);
                    fbOrdErr.delete(coll);
                    if (fbCache && fbCache.ord) delete fbCache.ord[coll];
                    fbBaseline.forEach((b, key) => { if (key.startsWith(coll + '/')) fbBaseline.delete(key); });
                    changed = true;
                }
            });
            if (changed) onCacheChanged();
        }

        // ============ CUSTOMER ORDERS (طلبيات العملاء) ============
        // A section inside the orders page. Stored in custOrders/{id}; sales reps in custReps/{id}.
        // Permissions: custorders.view (see and print), custorders.manage (add, edit, reps), custorders.delete (remove).
        const CUST_PERM = { view: 'custorders.view', manage: 'custorders.manage', delete: 'custorders.delete' };
        const canCust = key => can(CUST_PERM[key]);
        const CUST_CATEGORIES = ['سيراميك', 'صحي', 'أبواب'];
        const CUST_COMPLETENESS = ['كاملة', 'ناقصة'];
        const CUST_DELIVERY = ['لم تُسلم', 'تم التسليم', 'مؤجل', 'ملغي', 'مرتجع'];
        const CUST_DELIVERY_CLS = {
            'لم تُسلم': 'bg-slate-100 text-slate-700', 'تم التسليم': 'bg-emerald-100 text-emerald-800', 'مؤجل': 'bg-amber-100 text-amber-800',
            'ملغي': 'bg-rose-100 text-rose-800', 'مرتجع': 'bg-violet-100 text-violet-800'
        };
        const CUST_FILTER_DEFAULT = { q: '', rep: '', category: '', delivery: 'all', from: '', to: '' };
        let custFilter = { ...CUST_FILTER_DEFAULT };

        const custNoLabel = c => String(c.no || 0).padStart(4, '0');
        const custRemaining = c => r2(numOr0(c.amount) - numOr0(c.paid));
        const custSorted = list => [...list].sort((a, b) => (b.no || 0) - (a.no || 0));
        function nextCustNo() { return Math.max(0, ...appData.custOrders.map(c => Number(c.no) || 0)) + 1; }

        // Listens only when the user may see the section (a denied listener would sign the user out).
        // A full viewer listens to every order. A sales rep listens only to his own orders and his own rep record;
        // the database rules refuse anything else.
        function syncCustListener() {
            if (!fbCache || !fbUser || !appData || !currentUser()) return;
            const canSee = canCust('view');
            if (canSee && !fbCustUnsubs.length) {
                const onErr = err => console.error('customer orders listener', err);
                const myRep = currentRepId();
                const ordersRef = myRep ? fbDb.collection('custOrders').where('repId', '==', myRep) : fbDb.collection('custOrders');
                fbCustUnsubs.push(ordersRef.onSnapshot(snap => {
                    if (!fbCache) return;
                    fbCache.custOrders = mapDocs(snap);
                    onCacheChanged();
                }, onErr));
                if (myRep) {
                    fbCustUnsubs.push(fbDb.collection('custReps').doc(myRep).onSnapshot(snap => {
                        if (!fbCache) return;
                        fbCache.custReps = snap.exists ? { [myRep]: { id: myRep, ...snap.data() } } : {};
                        onCacheChanged();
                    }, onErr));
                } else {
                    fbCustUnsubs.push(fbDb.collection('custReps').onSnapshot(snap => {
                        if (!fbCache) return;
                        fbCache.custReps = mapDocs(snap);
                        onCacheChanged();
                    }, onErr));
                }
            } else if (!canSee && fbCustUnsubs.length) {
                fbCustUnsubs.forEach(u => { try { u(); } catch (e) { /* already closed */ } });
                fbCustUnsubs = [];
                if (fbCache) { fbCache.custOrders = {}; fbCache.custReps = {}; }
                if (appData) { appData.custOrders = []; appData.custReps = []; }
                fbBaseline.forEach((b, key) => { if (/^(custOrders|custReps)\//.test(key)) fbBaseline.delete(key); });
            }
        }

        // the rep whose orders are open after his PIN was checked on the server ('' = none chosen)
        let custRepView = '';
        function repBannerHtml() {
            if (!custRepView) return '';
            const r = appData.custReps.find(x => x.id === custRepView);
            return `<div class="flex flex-wrap items-center justify-between gap-2 rounded-2xl border-2 border-brand-300 bg-brand-50 p-3">
                <p class="font-bold text-brand-800"><i class="fa-solid fa-user-check me-1"></i> طلبيات المندوب: ${esc(r ? r.name : '')}</p>
                ${btn('clearRepView()', 'إلغاء الاختيار', 'fa-xmark', BTN_SECONDARY)}
            </div>`;
        }
        function clearRepView() { custRepView = ''; render(); }

        function filteredCustOrders() {
            const f = custFilter, q = f.q.trim().toLowerCase();
            return custSorted(appData.custOrders.filter(c => {
                if (custRepView && c.repId !== custRepView) return false;
                if (f.rep && c.repId !== f.rep) return false;
                if (f.category && c.category !== f.category) return false;
                if (f.delivery !== 'all' && c.delivery !== f.delivery) return false;
                if (f.from && (!c.date || c.date < f.from)) return false;
                if (f.to && (!c.date || c.date > f.to)) return false;
                if (q && !`${custNoLabel(c)} ${c.customer} ${c.repName} ${c.booking} ${c.notes}`.toLowerCase().includes(q)) return false;
                return true;
            }));
        }

        function custSummaryCards(rows) {
            const sum = k => r2(rows.reduce((s, c) => s + numOr0(c[k]), 0));
            const card = (label, value, cls = 'text-slate-800') => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-3">
                <p class="text-xs font-bold text-slate-600">${label}</p><p class="text-base font-bold ${cls} whitespace-nowrap">${value}</p></div>`;
            return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                ${card('عدد الطلبيات', rows.length)}
                ${card('إجمالي الطلبيات', fmtMoney(sum('amount')), 'text-brand-700')}
                ${card('المدفوع', fmtMoney(sum('paid')), 'text-emerald-700')}
                ${card('الباقي', fmtMoney(r2(sum('amount') - sum('paid'))), 'text-rose-700')}
            </div>`;
        }

        const custDeliveryBadge = c => `<span class="px-2 py-0.5 rounded-full text-xs font-bold whitespace-nowrap ${CUST_DELIVERY_CLS[c.delivery] || ''}">${esc(c.delivery || '—')}</span>`;

        function custActionsHtml(c) {
            const id = esc(c.id);
            return `<div class="flex items-center justify-center gap-1">
                <button type="button" onclick="openCustDetail('${id}')" title="عرض التفاصيل" aria-label="عرض التفاصيل" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-eye"></i></button>
                <button type="button" onclick="printCustOrder('${id}')" title="طباعة" aria-label="طباعة" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-print"></i></button>
                ${canCust('manage') ? `<button type="button" onclick="openCustModal('${id}')" title="تعديل" aria-label="تعديل" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-pen-to-square"></i></button>` : ''}
                ${canCust('delete') ? `<button type="button" onclick="deleteCustOrder('${id}')" title="حذف" aria-label="حذف" class="${BTN_ICON} text-slate-500 hover:text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>` : ''}
            </div>`;
        }

        function custTableHtml(rows) {
            if (!rows.length) return '<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-6 text-center text-slate-600 font-bold">مفيش طلبيات مطابقة للفلاتر</div>';
            return `<div class="hidden md:block bg-white rounded-2xl border-2 border-slate-300 shadow-lg overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 text-slate-700 font-bold border-b-2 border-slate-300"><tr>
                        <th class="py-3 px-3 text-start">الرقم</th><th class="py-3 px-3 text-start">التاريخ</th><th class="py-3 px-3 text-start">العميل</th>
                        <th class="py-3 px-3 text-start">المندوب</th><th class="py-3 px-3 text-start">الصنف</th><th class="py-3 px-3 text-start">الحالة</th>
                        <th class="py-3 px-3 text-start">المبلغ</th><th class="py-3 px-3 text-start">المدفوع</th><th class="py-3 px-3 text-start">الباقي</th>
                        <th class="py-3 px-3 text-start">مدة الطلبية</th><th class="py-3 px-3 text-start">التسليم</th><th class="py-3 px-3 text-start">موعد الحجز</th>
                        <th class="py-3 px-3 text-center">إجراءات</th></tr></thead>
                    <tbody class="divide-y divide-slate-200">${rows.map(c => `<tr class="hover:bg-slate-50">
                        <td class="py-3 px-3 font-mono font-bold">${custNoLabel(c)}</td>
                        <td class="py-3 px-3 whitespace-nowrap">${esc(fmtDateAr(c.date) || '—')}</td>
                        <td class="py-3 px-3 font-semibold">${esc(c.customer)}</td>
                        <td class="py-3 px-3">${esc(c.repName || '—')}</td>
                        <td class="py-3 px-3">${esc(c.category || '—')}</td>
                        <td class="py-3 px-3">${esc(c.completeness || '—')}</td>
                        <td class="py-3 px-3 whitespace-nowrap">${fmtMoney(numOr0(c.amount))}</td>
                        <td class="py-3 px-3 whitespace-nowrap">${fmtMoney(numOr0(c.paid))}</td>
                        <td class="py-3 px-3 whitespace-nowrap font-bold ${custRemaining(c) > 0 ? 'text-rose-700' : ''}">${fmtMoney(custRemaining(c))}</td>
                        <td class="py-3 px-3 whitespace-nowrap">${esc(fmtDateAr(c.validUntil) || '—')}</td>
                        <td class="py-3 px-3">${custDeliveryBadge(c)}</td>
                        <td class="py-3 px-3 whitespace-nowrap">${esc(fmtDateAr(c.booking) || '—')}</td>
                        <td class="py-3 px-3">${custActionsHtml(c)}</td>
                    </tr>`).join('')}</tbody>
                </table>
            </div>
            <div class="md:hidden space-y-3">
                ${rows.map(c => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 space-y-1">
                    <div class="flex items-start justify-between gap-2"><p class="font-bold text-slate-800">${esc(c.customer)}</p>${custDeliveryBadge(c)}</div>
                    <p class="text-sm font-mono">${custNoLabel(c)} · ${esc(fmtDateAr(c.date) || '—')}</p>
                    <p class="text-sm">المندوب: ${esc(c.repName || '—')} · ${esc(c.category || '—')} · ${esc(c.completeness || '—')}</p>
                    <p class="text-sm">المبلغ ${fmtMoney(numOr0(c.amount))} · المدفوع ${fmtMoney(numOr0(c.paid))} · <b class="${custRemaining(c) > 0 ? 'text-rose-700' : ''}">الباقي ${fmtMoney(custRemaining(c))}</b></p>
                    ${c.validUntil ? `<p class="text-sm">مدة الطلبية حتى ${esc(fmtDateAr(c.validUntil))}</p>` : ''}
                    ${c.booking ? `<p class="text-sm">موعد الحجز: ${esc(fmtDateAr(c.booking))}</p>` : ''}
                    <div class="flex justify-end">${custActionsHtml(c)}</div>
                </div>`).join('')}
            </div>`;
        }

        function custBodyHtml() {
            if (!appData.custOrders.length) {
                return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-8 text-center">
                    <i class="fa-solid fa-user-tie text-4xl text-slate-300 mb-3"></i>
                    <p class="text-slate-700 font-bold mb-4">مفيش طلبيات عملاء لسه</p>
                    ${canCust('manage') ? btn('openCustModal()', 'طلبية عميل جديدة', 'fa-plus') : ''}
                </div>`;
            }
            const rows = filteredCustOrders();
            return `${custSummaryCards(rows)}${custTableHtml(rows)}`;
        }

        function updateCustBody() {
            const body = el('custBody');
            if (body) body.innerHTML = custTabBody();
        }

        function custFilterBar() {
            const f = custFilter;
            const opt = (cur, v, l) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(l)}</option>`;
            const reps = [...appData.custReps].sort((a, b) => a.name.localeCompare(b.name, 'ar')).map(r => opt(f.rep, r.id, r.name)).join('');
            const cats = CUST_CATEGORIES.map(c => opt(f.category, c, c)).join('');
            const dels = CUST_DELIVERY.map(d => opt(f.delivery, d, d)).join('');
            return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div class="sm:col-span-2">${field('بحث', `<input type="search" value="${esc(f.q)}" oninput="custFilter.q = this.value; updateCustBody()" placeholder="اسم العميل، رقم الطلب، المندوب، الحجز" class="${INPUT_CLS}">`)}</div>
                    ${currentRepId() ? '' : field('المندوب', `<select onchange="custFilter.rep = this.value; updateCustBody()" class="${INPUT_CLS}"><option value="">كل المندوبين</option>${reps}</select>`)}
                    ${field('الصنف', `<select onchange="custFilter.category = this.value; updateCustBody()" class="${INPUT_CLS}"><option value="">كل الأصناف</option>${cats}</select>`)}
                    ${field('حالة التسليم', `<select onchange="custFilter.delivery = this.value; updateCustBody()" class="${INPUT_CLS}"><option value="all" ${f.delivery === 'all' ? 'selected' : ''}>الكل</option>${dels}</select>`)}
                    ${field('التاريخ (من - إلى)', `<div class="grid grid-cols-2 gap-2 min-w-0"><input type="date" value="${esc(f.from)}" onchange="custFilter.from = this.value; updateCustBody()" class="${INPUT_CLS}"><input type="date" value="${esc(f.to)}" onchange="custFilter.to = this.value; updateCustBody()" class="${INPUT_CLS}"></div>`)}
                </div>
                <div class="flex flex-wrap gap-2 justify-end">
                    ${btn('clearCustFilter()', 'مسح الفلاتر', 'fa-filter-circle-xmark', BTN_SECONDARY)}
                    ${canCust('view') ? btn('printCustList()', 'طباعة القائمة', 'fa-print', BTN_SECONDARY) : ''}
                </div>
            </div>`;
        }

        function clearCustFilter() {
            custFilter = { ...CUST_FILTER_DEFAULT };
            render();
        }

        // customer orders has its own dashboard: list, schedule (by delivery status) and reports
        let custTab = 'list';
        function custTabsBar() {
            const tabBtn = (route, label, icon, key) => `<button type="button" onclick="navigate('${route}')" class="px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 ${custTab === key ? 'bg-brand-600 text-white' : 'bg-white text-slate-700 border-2 border-slate-300 hover:bg-slate-50'}"><i class="fa-solid ${icon}"></i>${label}</button>`;
            return `<div class="flex flex-wrap gap-2">
                ${tabBtn('customers', 'الطلبيات', 'fa-list', 'list')}
                ${tabBtn('customers/schedule', 'لوحة الجدولة', 'fa-calendar-days', 'schedule')}
                ${tabBtn('customers/reports', 'التقارير', 'fa-chart-column', 'reports')}
            </div>`;
        }

        function custTabBody() {
            if (custTab === 'schedule') return custScheduleHtml();
            if (custTab === 'reports') return custReportsHtml();
            return custBodyHtml();
        }

        // one column per delivery status; each column lists its orders and their total
        function custScheduleHtml() {
            const rows = filteredCustOrders();
            const cols = CUST_DELIVERY.map(d => {
                const list = rows.filter(c => c.delivery === d);
                const total = r2(list.reduce((s, c) => s + numOr0(c.amount), 0));
                const items = list.length ? list.map(c => `<div class="rounded-xl border border-slate-200 p-2 text-sm">
                        <p class="font-bold">${custNoLabel(c)} · ${esc(c.customer)}</p>
                        <p class="text-xs text-slate-600">${esc(c.repName || '—')} · ${esc(c.category || '—')} · ${fmtMoney(numOr0(c.amount))}</p>
                    </div>`).join('') : '<p class="text-xs text-slate-400 text-center py-4">لا توجد طلبيات</p>';
                return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-3 flex flex-col gap-2 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                        <span class="px-2 py-0.5 rounded-full text-xs font-bold ${CUST_DELIVERY_CLS[d]}">${esc(d)}</span>
                        <span class="text-xs font-bold text-slate-600">${list.length} طلبية</span>
                    </div>
                    <p class="text-sm font-bold text-slate-800 whitespace-nowrap">${fmtMoney(total)}</p>
                    <div class="space-y-2 max-h-[60vh] overflow-y-auto">${items}</div>
                </div>`;
            }).join('');
            return `<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-3">${cols}</div>`;
        }

        const CUST_REPORT_HEAD = ['الرقم', 'التاريخ', 'العميل', 'المندوب', 'الصنف', 'الحالة', 'المبلغ', 'المدفوع', 'الباقي', 'مدة الطلبية', 'التسليم', 'موعد الحجز'];

        function custReportsHtml() {
            const rows = filteredCustOrders();
            const sumOf = (list, k) => r2(list.reduce((s, c) => s + numOr0(c[k]), 0));
            const statRow = (label, list) => {
                const rem = r2(sumOf(list, 'amount') - sumOf(list, 'paid'));
                return `<tr class="hover:bg-slate-50">
                    <td class="py-2 px-3 font-semibold">${esc(label)}</td>
                    <td class="py-2 px-3">${list.length}</td>
                    <td class="py-2 px-3 whitespace-nowrap">${fmtMoney(sumOf(list, 'amount'))}</td>
                    <td class="py-2 px-3 whitespace-nowrap">${fmtMoney(sumOf(list, 'paid'))}</td>
                    <td class="py-2 px-3 whitespace-nowrap font-bold ${rem > 0 ? 'text-rose-700' : ''}">${fmtMoney(rem)}</td>
                </tr>`;
            };
            const table = (title, body) => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow overflow-x-auto">
                <h3 class="px-4 pt-4 font-bold text-slate-800">${title}</h3>
                <table class="w-full text-sm mt-2">
                    <thead class="bg-slate-50 text-slate-700 font-bold border-b-2 border-slate-300"><tr>
                        <th class="py-2 px-3 text-start">البند</th><th class="py-2 px-3 text-start">عدد الطلبيات</th>
                        <th class="py-2 px-3 text-start">الإجمالي</th><th class="py-2 px-3 text-start">المدفوع</th><th class="py-2 px-3 text-start">الباقي</th></tr></thead>
                    <tbody class="divide-y divide-slate-200">${body}</tbody>
                </table></div>`;
            const byCat = CUST_CATEGORIES.map(c => statRow(c, rows.filter(r => r.category === c))).join('')
                + statRow('بدون صنف', rows.filter(r => !r.category));
            const byRep = [...appData.custReps].sort((a, b) => a.name.localeCompare(b.name, 'ar'))
                .map(r => statRow(r.name, rows.filter(c => c.repId === r.id))).join('')
                + statRow('بدون مندوب', rows.filter(c => !c.repId));
            const byDel = CUST_DELIVERY.map(d => statRow(d, rows.filter(c => c.delivery === d))).join('');
            return `<div class="space-y-4">
                <div class="flex flex-wrap gap-2 justify-end">
                    ${canCust('view') ? btn('printCustReport()', 'طباعة التقرير', 'fa-print', BTN_SECONDARY) : ''}
                    ${canCust('view') ? btn('exportCustReport()', 'تصدير Excel', 'fa-file-excel', BTN_SECONDARY) : ''}
                </div>
                ${custSummaryCards(rows)}
                ${table('حسب الصنف', byCat)}
                ${table('حسب المندوب', byRep)}
                ${table('حسب حالة التسليم', byDel)}
            </div>`;
        }

        function printCustReport() {
            if (!canCust('view')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            printHtml(custPrintHtml(filteredCustOrders(), 'تقرير طلبيات العملاء', 'تقرير مفلتر'));
        }

        function exportCustReport() {
            if (!canCust('view')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const rows = filteredCustOrders();
            const data = [CUST_REPORT_HEAD, ...rows.map(c => [
                custNoLabel(c), fmtDateAr(c.date), c.customer, c.repName || '', c.category || '', c.completeness || '',
                numOr0(c.amount), numOr0(c.paid), custRemaining(c), fmtDateAr(c.validUntil) || '', c.delivery || '', fmtDateAr(c.booking) || ''
            ])];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), 'طلبيات العملاء');
            XLSX.writeFile(wb, `طلبيات-العملاء-${todayISO()}.xlsx`);
        }

        function viewCustomerOrders(param = '') {
            if (!canCust('view')) return { title: 'طلبيات العملاء', html: noOrderAccessHtml() };
            custTab = param === 'schedule' || param === 'reports' ? param : 'list';
            const tools = `<div class="flex flex-wrap gap-2 justify-end">
                ${canCust('manage') ? btn('openCustModal()', 'طلبية عميل جديدة', 'fa-plus') : ''}
                ${canCust('manage') ? btn('openCustRepsModal()', 'إدارة المندوبين', 'fa-user-tie', BTN_SECONDARY) : ''}
                ${currentRepId() ? btn('openRepPinModal()', 'تغيير الرقم السري', 'fa-key', BTN_SECONDARY) : ''}
                ${currentRepId() ? '' : btn('openRepPicker()', custRepView ? 'اختار مندوب آخر' : 'اختار المندوب', 'fa-user-check', BTN_SECONDARY)}
            </div>`;
            return {
                title: 'طلبيات العملاء',
                actions: '',
                html: `<div class="space-y-4">${custTabsBar()}${tools}${repBannerHtml()}${custFilterBar()}<div id="custBody" class="space-y-4">${custTabBody()}</div></div>`
            };
        }

        // ---- add / edit (modal) ----
        function custRemainingPreview() {
            const f = el('modalForm'), box = el('custRemainPreview');
            if (!f || !box || !f.elements.amount) return;
            const rem = r2(numOr0(f.elements.amount.value) - numOr0(f.elements.paid.value));
            box.textContent = fmtMoney(rem);
            box.classList.toggle('text-rose-700', rem > 0);
        }

        function openCustModal(id = null) {
            if (!canCust('manage')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const c = id ? appData.custOrders.find(x => x.id === id) : null;
            if (id && !c) return;
            const reps = [...appData.custReps].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            const repOpts = [['', '— اختر المندوب —'], ...reps.map(r => [r.id, r.name])];
            // a rep removed from the list stays selectable on the orders he was given
            if (c && c.repId && !reps.some(r => r.id === c.repId)) repOpts.push([c.repId, c.repName || 'مندوب محذوف']);
            const sel = (name, label, options, value) => field(label, `<select name="${name}" class="${INPUT_CLS}">${options.map(o => {
                const [v, l] = Array.isArray(o) ? o : [o, o];
                return `<option value="${esc(v)}" ${String(value ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`;
            }).join('')}</select>`);
            openModal({
                title: c ? `تعديل طلبية العميل ${custNoLabel(c)}` : 'طلبية عميل جديدة',
                size: 'lg',
                submitText: c ? 'حفظ التعديلات' : 'إضافة الطلبية',
                body: `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${field('التاريخ *', `<input name="date" type="date" required value="${esc(c ? c.date : todayISO())}" class="${INPUT_CLS}">`)}
                        ${field('اسم العميل *', `<input name="customer" required value="${esc(c?.customer)}" class="${INPUT_CLS}">`)}
                        ${field('تليفون العميل', `<input name="customerPhone" type="tel" value="${esc(c?.customerPhone)}" dir="ltr" class="${INPUT_CLS} font-mono">`, 'رقم الموبايل اللي في الفاتورة')}

        function saveCustFromForm(fd, c) {
            if (!canCust('manage')) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return false; }
            const date = String(fd.get('date') || '');
            const customer = String(fd.get('customer') || '').trim();
            const amount = r2(Number(fd.get('amount')));
            const paid = r2(Number(fd.get('paid') || 0));
            const validUntil = String(fd.get('validUntil') || '');
            const repId = String(fd.get('repId') || '');
            const category = String(fd.get('category') || '');
            const completeness = String(fd.get('completeness') || '');
            const delivery = String(fd.get('delivery') || '');
            if (!date || !customer) return toast('اكتب التاريخ واسم العميل', 'error'), false;
            if (!(amount >= 0) || amount > 999999999999.99) return toast('اكتب مبلغ الطلبية', 'error'), false;
            if (!(paid >= 0)) return toast('المدفوع مش ممكن يكون سالب', 'error'), false;
            if (paid > amount) return toast('المدفوع أكبر من مبلغ الطلبية', 'error'), false;
            if (validUntil && validUntil < date) return toast('مدة الطلبية لازم تكون بعد التاريخ', 'error'), false;
            const booking = String(fd.get('booking') || '').trim();
            if (booking && !/^\d{4}-\d{2}-\d{2}$/.test(booking)) return toast('اختار موعد الحجز من التقويم', 'error'), false;
            if (category && !CUST_CATEGORIES.includes(category)) return toast('اختر الصنف من القائمة', 'error'), false;
            if (!CUST_COMPLETENESS.includes(completeness)) return toast('اختر حالة الطلبية', 'error'), false;
            if (!CUST_DELIVERY.includes(delivery)) return toast('اختر حالة التسليم', 'error'), false;
            const no = Number(fd.get('no'));
            if (!Number.isInteger(no) || no < 1 || no > 999999999) return toast('اكتب رقم طلب صحيح (1 أو أكتر)', 'error'), false;
            if (appData.custOrders.some(x => Number(x.no) === no && (!c || x.id !== c.id))) return toast('رقم الطلب ده مستخدم قبل كده', 'error'), false;
            const rep = appData.custReps.find(r => r.id === repId);
            const keepOld = !rep && c && c.repId && c.repId === repId;
            const data = {
                no, date, customer, category, completeness, amount, paid, validUntil, delivery,
                repId: rep ? rep.id : (keepOld ? repId : ''),
                repName: rep ? rep.name : (keepOld ? c.repName : ''),
                booking,
                customerPhone: String(fd.get('customerPhone') || '').trim(),
                notes: String(fd.get('notes') || '').trim()
            };
            if (c) {
                Object.assign(c, data, { updatedAt: new Date().toISOString(), updatedBy: orderUserName() });
                log('تعديل طلبية عميل', `${custNoLabel(c)} — ${customer}`);
                toast('تم حفظ التعديلات', 'success');
            } else {
                const n = { id: uid('CUST-'), no: nextCustNo(), ...data, createdAt: new Date().toISOString(), createdBy: orderUserName(), updatedAt: '', updatedBy: '' };
                appData.custOrders.push(n);
                log('إضافة طلبية عميل', `${custNoLabel(n)} — ${customer}`);
                toast('تمت إضافة الطلبية', 'success');
            }
            const savedId = c ? c.id : appData.custOrders[appData.custOrders.length - 1].id;
            saveState();
            render();
            shipAfterInvoiceSaved(savedId);
            return true;
        }

        // soft delete with undo (same as the other sections)
        function deleteCustOrder(id) {
            if (!canCust('delete')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const idx = appData.custOrders.findIndex(c => c.id === id);
            if (idx < 0) return;
            finalizePendingUndo();
            const c = appData.custOrders[idx];
            appData.custOrders.splice(idx, 1);
            log('حذف طلبية عميل', `${custNoLabel(c)} — ${c.customer}`);
            render();
            scheduleUndo(`تم حذف طلبية العميل ${c.customer}`, () => {
                appData.custOrders.splice(Math.min(idx, appData.custOrders.length), 0, c);
                log('استعادة طلبية عميل', `${custNoLabel(c)} — ${c.customer}`);
                render();
            }, () => {});
        }
