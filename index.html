        // ============ GENERAL HELPERS ============
        const el = id => document.getElementById(id);

        function uid(prefix) {
            return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7).toUpperCase();
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        function toISODate(d) {
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function todayISO() { return toISODate(new Date()); }

        function parseISODate(str, endOfDay) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str || ''));
            if (!m) return null;
            const y = +m[1], mo = +m[2] - 1, d = +m[3];
            return endOfDay ? new Date(y, mo, d, 23, 59, 59, 999) : new Date(y, mo, d, 0, 0, 0, 0);
        }

        function addDays(isoStr, days) {
            const d = parseISODate(isoStr, false);
            if (!d) return null;
            d.setDate(d.getDate() + days);
            return toISODate(d);
        }

        function daysBetween(a, b) {
            const s = parseISODate(a), e = parseISODate(b);
            if (!s || !e) return null;
            return Math.round((e - s) / 864e5);
        }

        function fmtDateTime(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return '-';
            return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function expiryDays() {
            return parseInt(appData.settings.expiryDays, 10) || 30;
        }

        function isListActive(startStr, endStr) {
            const start = parseISODate(startStr, false);
            const end = parseISODate(endStr, true);
            if (!start || !end) return false;
            const now = new Date();
            return now >= start && now <= end;
        }

        function daysUntilEnd(list) {
            const end = parseISODate(list.endDate, false);
            const today = parseISODate(todayISO(), false);
            if (!end || !today) return null;
            return Math.round((end - today) / 864e5);
        }

        function listState(list) {
            const active = isListActive(list.startDate, list.endDate);
            const days = daysUntilEnd(list);
            return { active, days, expiring: active && days !== null && days <= expiryDays() };
        }

        function statusLabel(state) {
            if (!state.active) return 'منتهية';
            if (state.expiring) return state.days === 0 ? 'تنتهي اليوم' : `تنتهي خلال ${state.days} يوم`;
            return 'نشطة';
        }

        function calculateEffectiveDiscount(d1 = 0, d2 = 0, d3 = 0) {
            const factor = [d1, d2, d3].reduce((acc, d) => acc * (1 - (parseFloat(d) || 0) / 100), 1);
            return ((1 - factor) * 100).toFixed(2);
        }

        function effValue(list) {
            return parseFloat(calculateEffectiveDiscount(list.discount1, list.discount2, list.discount3));
        }

        function pct(value) {
            const n = parseFloat(value);
            return n ? `${n}%` : '-';
        }

        function fmtMoney(n) { return `${n.toFixed(2)} ج.م`; }

        function initials(name) {
            return Array.from(String(name || '?').trim()).slice(0, 2).join('') || '?';
        }

        const AVATAR_COLORS = ['bg-sky-500', 'bg-emerald-500', 'bg-violet-500', 'bg-amber-500', 'bg-rose-500', 'bg-teal-500', 'bg-indigo-500', 'bg-fuchsia-500'];
        function colorFor(text) {
            let h = 0;
            for (const ch of String(text)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            return AVATAR_COLORS[h % AVATAR_COLORS.length];
        }

        // Company logo (image) or coloured initials as fallback
        function companyLogoHtml(c, cls = 'w-10 h-10 text-sm') {
            if (c.logo) {
                return `<img src="${esc(c.logo)}" alt="شعار ${esc(c.name)}" class="${cls} rounded-xl object-contain bg-white border border-slate-100 shrink-0">`;
            }
            return `<span class="${cls} rounded-xl shrink-0 flex items-center justify-center font-bold text-white ${colorFor(c.name)}">${esc(initials(c.name))}</span>`;
        }

        function findCompany(id) {
            return appData.companies.find(c => c.id === id) || null;
        }

        function findList(listId) {
            for (const c of appData.companies) {
                const l = c.lists.find(x => x.id === listId);
                if (l) return { c, l };
            }
            return null;
        }

        function field(label, input, hint = '') {
            return `<label class="block">
                        <span class="block text-xs font-bold text-slate-700 mb-1">${label}</span>

                        ${hint ? `<span class="block text-[11px] text-slate-400 mt-1">${hint}</span>` : ''}
                    </label>`;
        }

        // ============ TOASTS ============
        function toast(message, type = 'info', action = null, duration = 3500) {
            const host = el('toastHost');
            const colors = { info: 'bg-slate-900', success: 'bg-emerald-600', error: 'bg-rose-600' };
            const node = document.createElement('div');
            node.className = `${colors[type] || colors.info} text-white text-sm rounded-xl shadow-lg px-4 py-3 flex items-center gap-3 pointer-events-auto transition-all duration-300 toast-enter`;
            node.setAttribute('role', 'status');

            const text = document.createElement('span');
            text.className = 'flex-1 whitespace-pre-line leading-relaxed';
            text.textContent = message;
            node.appendChild(text);

            const remove = () => {
                node.style.opacity = '0';
                node.style.transform = 'translateY(8px)';
                setTimeout(() => node.remove(), 300);
            };

            if (action) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'font-bold underline underline-offset-2 shrink-0 px-2 py-1';
                btn.textContent = action.label;
                btn.onclick = () => { action.onClick(); remove(); };
                node.appendChild(btn);
            }

            host.appendChild(node);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                node.style.opacity = '1';
                node.style.transform = 'translateY(0)';
            }));
            setTimeout(remove, duration);
        }

        // ============ UNDO (soft delete) ============
        function scheduleUndo(message, undo, commit) {
            finalizePendingUndo();
            const entry = { undo, commit, timer: null };
            entry.timer = setTimeout(finalizePendingUndo, UNDO_MS);
            pendingUndo = entry;
            toast(message, 'info', {
                label: 'تراجع',
                onClick: () => {
                    if (pendingUndo !== entry) return;
                    clearTimeout(entry.timer);
                    pendingUndo = null;
                    entry.undo();
                }
            }, UNDO_MS);
        }

        function finalizePendingUndo() {
            const entry = pendingUndo;
            if (!entry) return;
            pendingUndo = null;
            clearTimeout(entry.timer);
            entry.commit();
        }

                    id: "FAC-3", name: "مصنع الأمل للبلاستيك", agent: "مؤسسة الأمل التجارية", notes: "خراطيم ومواسير كهربائية", logo: "",
                    lists: [
                        { id: "LST-301", name: "خصومات الربع الرابع", discount1: 25, discount2: 5, discount3: 5, startDate: "2026-10-01", endDate: "2026-12-31", pdfFile: "", hasPdf: false }
                    ]
                }
            ];
        }

        function defaultData() {
            return {
                version: 4,
                settings: { systemName: 'منظومة لستات المصانع', logo: '', expiryDays: 30 },
                roles: defaultRoles(),
                users: [],
                companies: sampleCompanies(),
                logs: []
            };
        }

        function normalizeData(d) {
            const base = defaultData();
            d.settings = Object.assign(base.settings, d.settings || {});
            d.settings.expiryDays = parseInt(d.settings.expiryDays, 10) || 30;
            d.settings.systemName = String(d.settings.systemName || base.settings.systemName);
            d.settings.logo = String(d.settings.logo || '');

            // Roles: saved roles are kept as they are (deleted default roles stay deleted).
            // The admin role is always locked and always has every permission.
            const roles = (d.roles && typeof d.roles === 'object' && Object.keys(d.roles).length) ? d.roles : defaultRoles();
            if (!roles.admin) roles.admin = defaultRoles().admin;
            Object.values(roles).forEach(r => {
                r.id = r.id || uid('role-');
                r.name = String(r.name || 'دور بدون اسم');
                r.permissions = Array.isArray(r.permissions) ? r.permissions.filter(p => ALL_PERMS.includes(p)) : [];
            });
            roles.admin.locked = true;
            roles.admin.permissions = [...ALL_PERMS];
            d.roles = roles;

            // Users are profiles only. Passwords live in Firebase Authentication.
            d.users = (Array.isArray(d.users) ? d.users : [])
                .filter(u => u && typeof u === 'object' && u.id)
                .map(u => ({
                    id: String(u.id),
                    name: String(u.name || ''),
                    email: String(u.email || '').trim().toLowerCase(),
                    roleId: roles[u.roleId] ? u.roleId : 'viewer',
                    active: u.active !== false,
                    createdAt: u.createdAt || new Date().toISOString(),
                    lastLoginAt: u.lastLoginAt || null
                }));

            d.companies = (Array.isArray(d.companies) ? d.companies : []).filter(c => c && typeof c === 'object').map(c => ({
                id: c.id || uid('FAC-'),
                name: String(c.name || ''),
                agent: String(c.agent || ''),
                notes: String(c.notes || ''),
                logo: String(c.logo || ''),
                lists: (Array.isArray(c.lists) ? c.lists : []).filter(l => l && typeof l === 'object').map(l => ({
                    id: l.id || uid('LST-'),
                    name: String(l.name || ''),
                    discount1: parseFloat(l.discount1) || 0,
                    discount2: parseFloat(l.discount2) || 0,
                    discount3: parseFloat(l.discount3) || 0,
                    startDate: String(l.startDate || ''),
                    endDate: String(l.endDate || ''),
                    pdfFile: String(l.pdfFile || ''),
                    hasPdf: !!l.hasPdf
                }))
            }));

            d.logs = (Array.isArray(d.logs) ? d.logs : []).slice(0, LOG_LIMIT);
            return d;
        }

        // ============ FIREBASE SYNC ============
        // appData is the in-memory copy the whole UI works on. It is kept in sync with the database:
        //  - incoming: real-time listeners rebuild appData whenever the server data changes
        //  - outgoing: saveState() writes only the documents that changed (batched)
        let fbApp = null, fbAuth = null, fbDb = null, rtdb = null;

        // ============ DATABASE LAYER (Firebase Realtime Database) ============
        // The app talks to the database through the small API below: collection / doc / batch / get / set / delete / onSnapshot.
        // Paths in the database:
        //   system/init, settings/main, users/{uid}, roles/{id}, companies/{id}, lists/{id}, logs/{id}, pdfs/{listId}
        // batch.commit() is one multi-path update(), so a whole batch is written atomically.
        const DB_CODEC = {
            // rules check roles/{id}/permissions/{perm} as a map; '_' replaces '.' because RTDB keys cannot contain '.'
            roles: {
                encode: d => ({ ...d, permissions: Object.fromEntries((d.permissions || []).map(p => [p.replace(/\./g, '_'), true])) }),
                decode: d => ({ ...d, permissions: Object.keys(d.permissions || {}).filter(k => d.permissions[k] === true).map(k => k.replace(/_/g, '.')).sort() })
            }
        };
        const dbClean = v => JSON.parse(JSON.stringify(v)); // drops undefined; RTDB treats null as "no value"
        const dbEncode = (path, data) => {
            const plain = dbClean(data);
            const c = DB_CODEC[path.split('/')[0]];
            return c ? c.encode(plain) : plain;
        };
        const dbDecode = (path, val) => {
            const c = DB_CODEC[path.split('/')[0]];
            return c ? c.decode(val) : val;
        };
        // RTDB reports rule denials as "permission_denied"; the app checks err.code === 'permission-denied'
        function dbError(err) {
            if (err && /permission_denied/i.test(String(err.message || err))) {
                const e = new Error('permission denied');
                e.code = 'permission-denied';
                return e;
            }
            return err;
        }

        class DbDoc {
            constructor(path) { this.path = path; this.id = path.split('/').pop(); }
            _ref() { return rtdb.ref(this.path); }
            get() {
                return this._ref().once('value').then(s => new DbSnap(this.path, s.val()), e => { throw dbError(e); });
            }
            set(data) {
                return this._ref().set(dbEncode(this.path, data)).catch(e => { throw dbError(e); });
            }
            update(fields) {
                return this._ref().update(dbClean(fields)).catch(e => { throw dbError(e); });
            }
            delete() {
                return this._ref().remove().catch(e => { throw dbError(e); });
            }
            onSnapshot(next, error) {
                const r = this._ref();
                const fn = s => next(new DbSnap(this.path, s.val()));
                r.on('value', fn, e => { if (error) error(dbError(e)); });
                return () => r.off('value', fn);
            }
        }

        class DbSnap {
            constructor(path, val) {
                this.ref = new DbDoc(path);
                this.id = this.ref.id;
                this.exists = val !== null && val !== undefined;
                this._path = path;
                this._val = val;
            }
            data() { return this.exists ? dbDecode(this._path, this._val) : undefined; }
        }

        class DbCollection {
            constructor(name, q = {}) { this.name = name; this.q = q; }
            doc(id) { return new DbDoc(this.name + '/' + id); }
            orderBy(field, dir = 'asc') { return new DbCollection(this.name, { ...this.q, order: field, dir }); }
            limit(n) { return new DbCollection(this.name, { ...this.q, limit: n }); }
            _ref() {
                let r = rtdb.ref(this.name);
                if (this.q.order) r = r.orderByChild(this.q.order);
                if (this.q.limit) r = this.q.order ? r.limitToLast(this.q.limit) : r.limitToFirst(this.q.limit);
                return r;
            }
            _snap(s) {
                const docs = [];
                s.forEach(c => { docs.push(new DbSnap(this.name + '/' + c.key, c.val())); });
                if (this.q.dir === 'desc') docs.reverse();
                return { size: docs.length, empty: docs.length === 0, docs, forEach: fn => docs.forEach(fn) };
            }
            get() {
                return this._ref().once('value').then(s => this._snap(s), e => { throw dbError(e); });
            }
            onSnapshot(next, error) {
                const r = this._ref();
                const fn = s => next(this._snap(s));
                r.on('value', fn, e => { if (error) error(dbError(e)); });
                return () => r.off('value', fn);
            }
        }

        class DbBatch {
            constructor() { this.updates = {}; }
            set(ref, data) { this.updates[ref.path] = dbEncode(ref.path, data); return this; }
            delete(ref) { this.updates[ref.path] = null; return this; }
            commit() {
                if (!Object.keys(this.updates).length) return Promise.resolve();
                return rtdb.ref().update(this.updates).catch(e => { throw dbError(e); });
            }
        }

        const fbDbApi = {
            collection: name => new DbCollection(name),
            doc: path => new DbDoc(path),
            batch: () => new DbBatch()
        };
        let fbUser = null;                 // signed-in Firebase user (null when signed out)
        let fbSynced = false;              // true once every collection delivered its first snapshot
        let fbBaseline = new Map();        // key -> { data, sig }: what the server is known to hold
        let fbCache = null;                // raw snapshot data per collection
        let fbLoaded = {};
        let fbUnsubs = [];
        let fbLogsUnsub = null;
        let fbBusy = false;                // login/setup in progress: the auth-state handler waits
        let appEntered = false;
        let pendingLoginLog = false;
        let signingOut = false;
        let initExists = null;             // does system/init exist? (null = unknown)
        let serverChecked = false;         // true once the public server check has finished (or timed out)
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function firebaseReady() {
            return typeof firebase !== 'undefined' && !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE_');
        }

        // stable JSON (sorted keys) so two equal documents always produce the same signature
        function canon(v) {
            if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
            if (v && typeof v === 'object') {
                // null and undefined are the same here: the database keeps neither (a null field is simply absent)
                return '{' + Object.keys(v).filter(k => v[k] !== undefined && v[k] !== null).sort()
                    .map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
            }
            return v === undefined ? 'null' : JSON.stringify(v);
        }

        // Documents that should exist on the server for the given state. Key = "collection/id".
        // Lists are stored in their own collection (with companyId), so a single list can change without rewriting its company.
        function desiredDocs(d) {
            const out = new Map();
            d.companies.forEach((c, ci) => {
                const { lists, ...rest } = c;
                out.set('companies/' + c.id, { ...rest, pos: ci });
                lists.forEach((l, li) => out.set('lists/' + l.id, { ...l, companyId: c.id, pos: li }));
            });
            d.users.forEach(u => out.set('users/' + u.id, {
                name: u.name, email: u.email, roleId: u.roleId, active: u.active,
                createdAt: u.createdAt, lastLoginAt: u.lastLoginAt || null
            }));
            Object.values(d.roles).forEach(r => out.set('roles/' + r.id, {
                name: r.name, permissions: [...(r.permissions || [])].sort(), locked: !!r.locked
            }));
            out.set('settings/main', {
                systemName: d.settings.systemName, logo: d.settings.logo, expiryDays: d.settings.expiryDays
            });
            return out;
        }

        function refFor(key) {
            const [coll, id] = key.split('/');
            return fbDb.collection(coll).doc(id);
        }

        async function commitChunks(ops) {
            for (let i = 0; i < ops.length; i += 400) {
                const batch = fbDb.batch();
                ops.slice(i, i + 400).forEach(op => {
                    const ref = refFor(op.key);
                    if (op.del) batch.delete(ref);
                    else batch.set(ref, JSON.parse(JSON.stringify(op.data)));
                });
                await batch.commit();
            }
        }

        // Write only what changed since the last known server state.
        function saveState() {
            if (!fbDb || !fbSynced || !appData) return;
            const desired = desiredDocs(appData);
            const ops = [];
            desired.forEach((data, key) => {
                const sig = canon(data);
                const prev = fbBaseline.get(key);
                if (!prev || prev.sig !== sig) ops.push({ key, data, sig, isNew: !prev, prevData: prev ? prev.data : null });
            });
            fbBaseline.forEach((b, key) => { if (!desired.has(key)) ops.push({ key, del: true, prevData: b.data }); });
            if (!ops.length) return;
            ops.forEach(op => {
                if (op.del) fbBaseline.delete(op.key);
                else fbBaseline.set(op.key, { data: op.data, sig: op.sig });
            });
            const note = fbUser ? notificationFor(ops) : null;
            const batchOps = note ? [...ops, { key: 'notifications/' + note.id, data: note }] : ops;
            commitChunks(batchOps).catch(err => {
                console.error(err);
                const denied = err && err.code === 'permission-denied';
                toast(denied ? 'ليس لديك صلاحية لهذا التعديل. تم التراجع عنه' : 'تعذر حفظ التعديل على السيرفر', 'error', null, 6000);
                rebuildFromCache();
                render();
            });
        }

        // ============ NOTIFICATIONS (bell) ============
        // One entry is written for every saved change (and every PDF change), by the user who made it.
        // Everyone else who is signed in sees it in the bell. The activity log (logs) stays limited to logs.view.
        const NOTIF_LIMIT = 50;
        const NOTIF_KIND = { companies: 'شركة', lists: 'لستة', users: 'مستخدم', roles: 'دور صلاحيات', settings: 'إعدادات النظام' };
        const NOTIF_VERB = { add: 'أضاف', edit: 'عدّل', del: 'حذف' };
        let notifs = [];                 // newest first, as the database sends them (all users)
        let notifUnsub = null;
        let notifOpen = false;
        let notifHighlightAfter = null;  // while the panel is open, items newer than this are shown as new

        // the login time stamp is not a change worth a notification
        const withoutLogin = d => ({ ...(d || {}), lastLoginAt: undefined });

        function describeChanges(ops) {
            const real = ops.filter(o => !(o.key.startsWith('users/') && !o.del && o.prevData &&
                canon(withoutLogin(o.prevData)) === canon(withoutLogin(o.data))));
            if (!real.length) return null;
            const verbs = [...new Set(real.map(o => o.del ? 'del' : (o.isNew ? 'add' : 'edit')))];
            const kinds = [...new Set(real.map(o => NOTIF_KIND[o.key.split('/')[0]] || 'بيانات'))];
            const names = [...new Set(real.map(o => o.key === 'settings/main'
                ? 'إعدادات النظام'
                : (o.data?.name || o.prevData?.name || o.key.split('/')[1])))];
            return {
                verb: NOTIF_VERB[verbs.length === 1 ? verbs[0] : 'edit'],
                kind: kinds.join('، '),
                detail: names.slice(0, 2).join('، ') + (names.length > 2 ? ` و${names.length - 2} غيرها` : '')
            };
        }

        function newNotification(info) {
            return {
                id: uid('NTF-'), t: new Date().toISOString(), uid: fbUser.uid,
                user: currentUser()?.name || 'مستخدم', verb: info.verb, kind: info.kind, detail: info.detail
            };
        }

        // the notification of a batch of changes (written in the same atomic update as the changes)
        function notificationFor(ops) {
            const info = describeChanges(ops);
            return info ? newNotification(info) : null;
        }

        // a change that is written on its own (PDF upload or removal)
        function notifyDirect(verb, kind, detail) {
            if (!fbDb || !fbUser) return;
            const n = newNotification({ verb, kind, detail });
            fbDb.collection('notifications').doc(n.id).set(n).catch(err => console.warn('notification not saved:', err && err.code));
        }

        function listNameById(id) {
            for (const c of appData?.companies || []) {
                const l = (c.lists || []).find(x => x.id === id);
                if (l) return l.name;
            }
            return id;
        }

        function startNotifSync() {
            stopNotifSync();
            notifUnsub = fbDb.collection('notifications').orderBy('t', 'desc').limit(NOTIF_LIMIT).onSnapshot(snap => {
                notifs = snap.docs.map(d => d.data());
                renderNotifs();
            }, err => console.error('notifications listener', err));
        }

        function stopNotifSync() {
            if (notifUnsub) { try { notifUnsub(); } catch (e) { /* already closed */ } }
            notifUnsub = null;
            notifs = [];
            closeNotifPanel();
        }

        function notifKey() { return 'notifSeen:' + (fbUser?.uid || 'anon'); }

        // when the user last opened the bell (on this browser). The first visit does not count old entries as new.
        function notifSeenAt() {
            let v = null;
            try { v = localStorage.getItem(notifKey()); } catch (e) { /* storage blocked */ }
            if (!v) {
                v = new Date().toISOString();
                try { localStorage.setItem(notifKey(), v); } catch (e) { /* storage blocked */ }
            }
            return v;
        }

        function markNotifsSeen() {
            try { localStorage.setItem(notifKey(), new Date().toISOString()); } catch (e) { /* storage blocked */ }
            renderNotifs();
        }

        // everyone's entries except the user's own changes
        function visibleNotifs() {
            const me = fbUser?.uid;
            return notifs.filter(n => n.uid !== me);
        }

        function renderNotifs() {
            const badge = el('notifBadge');
            const list = el('notifList');
            if (!badge || !list) return;
            const seen = notifSeenAt();
            const items = visibleNotifs();
            const unread = items.filter(n => n.t > seen).length;
            badge.textContent = unread > 9 ? '9+' : String(unread);
            badge.classList.toggle('hidden', unread === 0);
            const fresh = notifHighlightAfter || seen;
            list.innerHTML = items.length
                ? items.map(n => `
                    <div class="px-4 py-3 ${n.t > fresh ? 'bg-brand-50' : ''}">
                        <p class="text-sm text-slate-800"><b class="text-brand-700">${esc(n.user)}</b> ${esc(n.verb)} <b>${esc(n.kind)}</b></p>
                        ${n.detail ? `<p class="text-sm text-slate-600 mt-0.5 break-words">${esc(n.detail)}</p>` : ''}
                        <p class="text-xs text-slate-500 mt-1">${esc(timeAgo(n.t))}</p>
                    </div>`).join('')
                : '<p class="px-4 py-8 text-center text-sm text-slate-500">لا توجد إشعارات بعد</p>';
        }

        function toggleNotifPanel(e) {
            if (e) e.stopPropagation();
            if (notifOpen) return closeNotifPanel();
            notifOpen = true;
            notifHighlightAfter = notifSeenAt();   // what was new when the panel opened stays highlighted
            el('notifPanel').classList.remove('hidden');
            markNotifsSeen();
        }

        function closeNotifPanel() {
            notifOpen = false;
            notifHighlightAfter = null;
            el('notifPanel')?.classList.add('hidden');
            renderNotifs();
        }

        document.addEventListener('click', e => {
            if (notifOpen && !el('notifHost')?.contains(e.target)) closeNotifPanel();
        });

        function timeAgo(iso) {
            const sec = (Date.now() - new Date(iso).getTime()) / 1000;
            if (!(sec >= 60)) return 'الآن';
            if (sec < 3600) return `منذ ${Math.floor(sec / 60)} دقيقة`;
            if (sec < 86400) return `منذ ${Math.floor(sec / 3600)} ساعة`;
            return new Date(iso).toLocaleString('ar-EG', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
        }

        function log(action, detail = '') {
            const entry = { id: uid('LOG-'), t: new Date().toISOString(), user: currentUser()?.name || 'النظام', action, detail };
            appData.logs.unshift(entry);
            if (appData.logs.length > LOG_LIMIT) appData.logs.length = LOG_LIMIT;
            // The data change goes out first. The database fires its listeners synchronously on a local write,
            // so the logs listener must not rebuild the state before the change itself is in the local cache.
            saveState();
            if (fbDb && fbUser) {
                fbDb.collection('logs').doc(entry.id).set(entry).catch(err => console.warn('log not saved:', err && err.code));
            }
        }

        function mapDocs(snap) {
            const out = {};
            snap.forEach(d => { out[d.id] = { id: d.id, ...d.data() }; });
            return out;
        }

        // Rebuild appData from the raw collections and remember what the server holds.
        function buildFromCache() {
            const c = fbCache;
            const byPos = (a, b) => (a.pos || 0) - (b.pos || 0);
            const listsByCompany = {};
            Object.values(c.lists).sort(byPos).forEach(({ companyId, pos, ...l }) => {
                (listsByCompany[companyId] = listsByCompany[companyId] || []).push(l);
            });
            const companies = Object.values(c.companies).sort(byPos)
                .map(({ pos, ...co }) => ({ ...co, lists: listsByCompany[co.id] || [] }));
            const roles = {};
            Object.values(c.roles).forEach(r => { roles[r.id] = r; });
            appData = normalizeData({
                settings: c.settings || {},
                roles,
                users: Object.values(c.users),
                companies,
                logs: c.logs || []
            });
            fbBaseline = new Map();
            desiredDocs(appData).forEach((data, key) => fbBaseline.set(key, { data, sig: canon(data) }));
        }

        function rebuildFromCache() {
            if (fbCache) buildFromCache();
        }

        function startSync(uid) {
            stopSync();
            fbCache = { users: {}, roles: {}, companies: {}, lists: {}, settings: null, logs: [] };
            fbLoaded = {};
            fbSynced = false;
            const listen = (name, ref, apply) => {
                fbUnsubs.push(ref.onSnapshot(snap => {
                    if (!fbCache) return;
                    apply(snap);
                    fbLoaded[name] = true;
                    onCacheChanged();
                }, err => onListenError(name, err)));
            };
            listen('users', fbDb.collection('users'), s => { fbCache.users = mapDocs(s); });
            listen('roles', fbDb.collection('roles'), s => { fbCache.roles = mapDocs(s); });
            listen('companies', fbDb.collection('companies'), s => { fbCache.companies = mapDocs(s); });
            listen('lists', fbDb.collection('lists'), s => { fbCache.lists = mapDocs(s); });
            listen('settings', fbDb.collection('settings').doc('main'), s => { fbCache.settings = s.exists ? s.data() : null; });
            startNotifSync();
        }

        function stopSync() {
            fbUnsubs.forEach(u => { try { u(); } catch (e) { /* already closed */ } });
            fbUnsubs = [];
            if (fbLogsUnsub) { try { fbLogsUnsub(); } catch (e) { /* already closed */ } }
            fbLogsUnsub = null;
            stopNotifSync();
            fbCache = null;
            fbLoaded = {};
            fbSynced = false;
        }

        // the activity log is only readable by users with logs.view, so listen only for them
        function syncLogsListener() {
            const canSee = can('logs.view');
            if (canSee && !fbLogsUnsub) {
                fbLogsUnsub = fbDb.collection('logs').orderBy('t', 'desc').limit(LOG_LIMIT).onSnapshot(snap => {
                    if (!fbCache) return;
                    fbCache.logs = snap.docs.map(d => d.data());
                    onCacheChanged();
                }, err => console.error('logs listener', err));
            } else if (!canSee && fbLogsUnsub) {
                fbLogsUnsub();
                fbLogsUnsub = null;
                if (fbCache) fbCache.logs = [];
            }
        }

        function onListenError(name, err) {
            // a listener from a session that already ended can still report an error
            if (!fbUser || !fbCache) return;
            console.error('listener ' + name, err);
            if (err && err.code === 'permission-denied') {
                handleAccessLost('حسابك غير مفعّل أو ليس لديك صلاحية الوصول. تواصل مع مدير النظام');
            } else {
                toast('تعذر تحميل البيانات من السيرفر', 'error', null, 5000);
            }
        }

        async function handleAccessLost(message) {
            if (signingOut) return;
            signingOut = true;
            stopSync();
            toast(message, 'error', null, 6000);
            try { await fbAuth.signOut(); } catch (err) { console.error(err); }
            signingOut = false;
        }

        function onCacheChanged() {
            if (!fbUser || !fbCache) return;
            if (!['users', 'roles', 'companies', 'lists', 'settings'].every(k => fbLoaded[k])) return;
            const sigOf = () => canon([...desiredDocs(appData).entries(), appData.logs.map(l => l.id)]);
            const before = appData ? sigOf() : '';
            const previous = appData;
            buildFromCache();
            // Realtime Database can report a value again with the same content. Then keep the same objects:
            // an open dialog (company, list, user) holds references to them and would save into stale copies.
            // Only the logs are taken from the new build.
            const contentOf = d => canon([...desiredDocs(d).entries()]);

            syncLogsListener();
            if (!appEntered) {
                appEntered = true;
                if (pendingLoginLog) {
                    pendingLoginLog = false;
                    me.lastLoginAt = new Date().toISOString();

        // Local data saved in this browser by earlier versions (v4 or v3). Used once, on first setup.
        function readLocalSeed() {
            let raw = null;
            try { raw = localStorage.getItem(KEY_V4) || localStorage.getItem(KEY_V3); } catch (err) { return null; }
            if (!raw) return null;
            let src = null;
            try { src = JSON.parse(raw); } catch (err) { return null; }
            if (!src || typeof src !== 'object') return null;
            const companies = Array.isArray(src.companies) ? src.companies : (Array.isArray(src.factories) ? src.factories : null);
            if (!companies) return null;
            const localPdfIds = [];
            companies.forEach(c => (c.lists || []).forEach(l => {
                if (l && l.id && (l.hasLocalPdf || l.hasPdf)) localPdfIds.push(l.id);
            }));
            const seed = normalizeData({ settings: src.settings, roles: src.roles, users: [], companies, logs: [] });
            seed.localPdfIds = localPdfIds;
            return seed;
        }

        // PDF blobs saved in this browser's IndexedDB (v4 local storage). Read-only, used once during setup.
        function readLocalPdf(listId) {
            return new Promise(resolve => {
                if (!window.indexedDB) return resolve(null);
                const req = indexedDB.open('factoryListsPdfs');
                req.onsuccess = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains('pdfs')) { db.close(); return resolve(null); }
                    const get = db.transaction('pdfs').objectStore('pdfs').get(listId);
                    get.onsuccess = () => { db.close(); resolve(get.result || null); };
                    get.onerror = () => { db.close(); resolve(null); };
                };
                req.onerror = () => resolve(null);
            });
        }

        // ============ PDF FILES (stored in Realtime Database: pdfs/{listId} = { total, chunks: [base64, ...] }) ============
        // Each chunk keeps 512 KB of the file (about 700 KB as base64). The limit is 8 MB per PDF (16 chunks).
        // The PDF has its own node, so the list screens never download it.
        const PDF_CHUNK_BYTES = 512 * 1024;
        const PDF_MAX_BYTES = 8 * 1024 * 1024;

        function readBytes(file) {
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(new Uint8Array(fr.result));
                fr.onerror = () => reject(fr.error);
                fr.readAsArrayBuffer(file);
            });
        }

        function bytesToBase64(bytes) {
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(bin);
        }

        function base64ToBytes(b64) {
            const bin = atob(b64);
            const out = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        // ===GS-COMPRESS-BEGIN===
        // ضغط الـ PDF جوه المتصفح بـ Ghostscript (WebAssembly). الملف مش بيتبعت لأي سيرفر.
        // المكتبة بتتحمّل من CDN أول مرة بس. بنجرب Web Worker الأول، ولو اتقفل (زي داخل الـ preview) بنشغّلها على الصفحة نفسها.
        const GS_BASES = [
            'https://cdn.jsdelivr.net/npm/@jspawn/ghostscript-wasm@0.0.2/',
            'https://unpkg.com/@jspawn/ghostscript-wasm@0.0.2/'
        ];
        const PDF_COMPRESS_MAX_BYTES = 100 * 1024 * 1024;   // أكبر ملف نقبله للضغط
        const GS_WORKER_SRC = `
            import createModule from '${GS_BASES[0]}gs.mjs';
            self.onmessage = async (e) => {
                const logs = [];
                try {
                    const mod = await createModule({
                        thisProgram: 'gs',
                        noInitialRun: true,
                        locateFile: (p) => '${GS_BASES[0]}' + p,
                        print: (t) => logs.push(t),
                        printErr: (t) => logs.push(t)
                    });
                    mod.FS.writeFile('/in.pdf', e.data.bytes);
                    try {
                        mod.callMain(['-sDEVICE=pdfwrite', '-dCompatibilityLevel=1.4', '-dPDFSETTINGS=/' + e.data.preset,
                                      '-dNOPAUSE', '-dQUIET', '-dBATCH', '-sOutputFile=/out.pdf', '/in.pdf']);
                    } catch (err) {
                        if (!(err && err.status === 0)) throw err;
                    }
                    if (!mod.FS.readdir('/').includes('out.pdf')) throw new Error(logs.join(' ').slice(-300) || 'no output');
                    const out = mod.FS.readFile('/out.pdf').slice();
                    self.postMessage({ ok: true, bytes: out }, [out.buffer]);
                } catch (err) {
                    self.postMessage({ ok: false, error: String((err && err.message) || err) });
                }
            };
        `;
        let gsWorkerUrl = null;
        let gsLoaded = null;   // { base, createModule } once the library is loaded on the page

        function gsRunArgs(preset) {
            return ['-sDEVICE=pdfwrite', '-dCompatibilityLevel=1.4', '-dPDFSETTINGS=/' + preset,
                    '-dNOPAUSE', '-dQUIET', '-dBATCH', '-sOutputFile=/out.pdf', '/in.pdf'];
        }

        function runGsWorker(bytes, preset) {
            return new Promise((resolve, reject) => {
                let worker;
                const finish = (fn, val) => { clearTimeout(timer); if (worker) worker.terminate(); fn(val); };
                const timer = setTimeout(() => finish(reject, new Error('timeout')), 300000);
                try {
                    if (!gsWorkerUrl) gsWorkerUrl = URL.createObjectURL(new Blob([GS_WORKER_SRC], { type: 'text/javascript' }));
                    worker = new Worker(gsWorkerUrl, { type: 'module' });
                } catch (e) {
                    return finish(reject, Object.assign(new Error('worker unavailable'), { fallback: true }));
                }
                worker.onmessage = (e) => e.data.ok
                    ? finish(resolve, new Uint8Array(e.data.bytes))
                    : finish(reject, new Error(e.data.error));
                worker.onerror = () => finish(reject, Object.assign(new Error('worker failed to start'), { fallback: true }));
                const copy = bytes.slice();
                worker.postMessage({ bytes: copy, preset }, [copy.buffer]);
            });
        }

        async function loadGsOnPage() {
            if (gsLoaded) return gsLoaded;
            const errors = [];
            for (const base of GS_BASES) {
                try {
                    const mod = await import(base + 'gs.mjs');
                    gsLoaded = { base, createModule: mod.default };
                    return gsLoaded;
                } catch (e) { errors.push(base.split('/')[2] + ': ' + ((e && e.message) || e)); }
            }
            throw new Error('library download failed (' + errors.join('; ') + ')');
        }

        async function runGsOnPage(bytes, preset) {
            const gs = await loadGsOnPage();
            await new Promise(r => setTimeout(r, 30));   // let the status text paint first
            const logs = [];
            const mod = await gs.createModule({
                thisProgram: 'gs',
                noInitialRun: true,
                locateFile: (p) => gs.base + p,
                print: (t) => logs.push(t),
                printErr: (t) => logs.push(t)
            });
            mod.FS.writeFile('/in.pdf', bytes);
            try {
                mod.callMain(gsRunArgs(preset));
            } catch (err) {
                if (!(err && err.status === 0)) throw err;
            }
            if (!mod.FS.readdir('/').includes('out.pdf')) throw new Error(logs.join(' ').slice(-300) || 'no output');
            return mod.FS.readFile('/out.pdf').slice();
        }

        async function runGsPreset(bytes, preset) {
            try {
                return await runGsWorker(bytes, preset);
            } catch (err) {
                if (!err.fallback) throw err;
                console.warn('Ghostscript worker unavailable, running on the page:', err.message);
                return await runGsOnPage(bytes, preset);
            }
        }

        // يجرب /ebook (جودة كويسة) الأول، ولو لسه كبير يجرب /screen (أصغر وجودته أقل)
        async function compressPdfFile(file, onStatus) {
            const bytes = await readBytes(file);
            let best = null, bestPreset = '';
            for (const preset of ['ebook', 'screen']) {
                onStatus(preset === 'ebook' ? 'جارٍ ضغط الملف... ممكن ياخد دقيقة' : 'لسه كبير، بنجرب ضغط أقوى...');
                const out = await runGsPreset(bytes, preset);
                if (out.length < 5 || String.fromCharCode(...out.subarray(0, 5)) !== '%PDF-') throw new Error('bad output');
                if (!best || out.length < best.length) { best = out; bestPreset = preset; }
                if (best.length <= PDF_MAX_BYTES) break;
            }
            return { bytes: best, preset: bestPreset };
        }
        // ===GS-COMPRESS-END===

        // replaces the list's PDF in one write: the whole pdfs/{listId} node is set at once
        async function pdfUpload(listId, file) {
            if (file.size > PDF_MAX_BYTES) throw new Error('pdf too large');
            const bytes = await readBytes(file);
            if (!bytes.length) throw new Error('pdf empty');
            const chunks = [];
            for (let i = 0; i < bytes.length; i += PDF_CHUNK_BYTES) {
                chunks.push(bytesToBase64(bytes.subarray(i, i + PDF_CHUNK_BYTES)));
            }
            await rtdb.ref('pdfs/' + listId).set({ total: chunks.length, chunks });
            notifyDirect('أضاف', 'ملف PDF', listNameById(listId));
        }

        async function pdfRemove(listId) {
            try {
                await rtdb.ref('pdfs/' + listId).remove();
                notifyDirect('حذف', 'ملف PDF', listNameById(listId));
            } catch (err) { console.error(err); }
        }

        // downloads the list's PDF (all parts) and joins them into one file
        async function pdfBlob(listId) {
            const v = (await rtdb.ref('pdfs/' + listId).once('value')).val();
            if (!v || !v.chunks) throw new Error('pdf missing');
            const parts = Array.isArray(v.chunks)
                ? v.chunks
                : Object.keys(v.chunks).sort((a, b) => a - b).map(k => v.chunks[k]);
            if (!parts.length || parts.length !== v.total) throw new Error('pdf incomplete');
            return new Blob(parts.map(base64ToBytes), { type: 'application/pdf' });
        }

        // ============ IMAGES (logos) ============
        // Resizes an image to max `max` px and returns a PNG data URL (keeps logos small for storage)
        function processImage(file, max = 256) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const longest = Math.max(img.naturalWidth || max, img.naturalHeight || max);
                        const scale = Math.min(1, max / longest);
                        const w = Math.max(1, Math.round((img.naturalWidth || max) * scale));
                        const h = Math.max(1, Math.round((img.naturalHeight || max) * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => reject(new Error('تعذر قراءة الصورة'));
                    img.src = reader.result;
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        // ============ AUTH & PERMISSIONS ============
        function currentUser() {

        function roleHas(roleId, perm) {
            const r = appData.roles[roleId];
            return !!r && (r.locked || r.permissions.includes(perm));
        }

        function can(perm) {
            const u = currentUser();
            return !!u && u.active && roleHas(u.roleId, perm);
        }

        function countUsersWithPerm(users, roles, perm) {
            return users.filter(u => u.active && roles[u.roleId] && (roles[u.roleId].locked || roles[u.roleId].permissions.includes(perm))).length;
        }

        function canAccessRoute(name) {
            if (name === 'settings') return can('settings.manage') || can('backup.manage');

        async function handleAuth(e) {

        async function runLogin(email, password) {
            fbBusy = true;
            try {
                const cred = await fbAuth.signInWithEmailAndPassword(email, password);
                const snap = await fbDb.collection('users').doc(cred.user.uid).get();
                if (!snap.exists) {
                    await fbAuth.signOut();
                    throw userError('حسابك غير مفعّل داخل النظام. تواصل مع مدير النظام');
                }
                if (snap.data().active === false) {
                    await fbAuth.signOut();
                    throw userError('هذا الحساب موقوف. تواصل مع مدير النظام');
                }
                fbUser = cred.user;
                pendingLoginLog = true;
            } finally {
                fbBusy = false;
            }

        }

        // First run: creates the admin account, the roles and settings, then uploads the local data (if any)
        async function runSetup(fd, email, password) {
            const name = String(fd.get('name') || '').trim();
            if (!name) throw userError('اكتب الاسم الكامل');
            if (!EMAIL_RE.test(email)) throw userError('اكتب بريد إلكتروني صحيح');
            if (password.length < 6) throw userError('كلمة المرور لازم تكون 6 أحرف على الأقل');
            if (password !== String(fd.get('password2') || '')) throw userError('كلمتا المرور غير متطابقتين');

            fbBusy = true;
            let cred = null;
            try {
                cred = await fbAuth.createUserWithEmailAndPassword(email, password);
                fbUser = cred.user;
                const uid = cred.user.uid;
                const now = new Date().toISOString();

                const local = readLocalSeed();
                const seed = local || normalizeData(defaultData());
                const docs = [...desiredDocs(seed).entries()].map(([key, data]) => ({ key, data }));

                // step 1: the marker, the admin profile, roles and settings (allowed only while bootstrapping)
                await commitChunks([
                    { key: 'system/init', data: { createdAt: now, createdBy: uid } },
                    { key: 'users/' + uid, data: { name, email, roleId: 'admin', active: true, createdAt: now, lastLoginAt: now } },
                    ...docs.filter(o => o.key.startsWith('roles/') || o.key === 'settings/main')
                ]);
                initExists = true;

                // step 2: local PDFs go to Realtime Database (pdfs/{listId}), then the companies and lists
                for (const id of seed.localPdfIds || []) {
                    const blob = await readLocalPdf(id);
                    if (!blob) continue;
                    try {
                        await pdfUpload(id, blob);
                        seed.companies.forEach(c => c.lists.forEach(l => { if (l.id === id) l.hasPdf = true; }));
                    } catch (err) { console.error('pdf upload', id, err); }
                }
                await commitChunks([...desiredDocs(seed).entries()]
                    .filter(([key]) => key.startsWith('companies/') || key.startsWith('lists/'))
                    .map(([key, data]) => ({ key, data })));

                const logId = 'LOG-' + Date.now().toString(36);
                await fbDb.collection('logs').doc(logId).set({
                    id: logId, t: now, user: name, action: 'إنشاء حساب مدير النظام',
                    detail: local ? 'مع نقل البيانات من المتصفح' : ''
                });

                fbBusy = false;
                startSync(uid);
                toast(local ? 'تم إنشاء الحساب ونقل البيانات إلى Firebase' : 'تم إنشاء حساب مدير النظام', 'success', null, 5000);
            } catch (err) {
                // roll back a half-created account so setup can be retried
                if (cred && cred.user) { try { await cred.user.delete(); } catch (e) { console.error(e); } }
                if (fbAuth.currentUser) { try { await fbAuth.signOut(); } catch (e) { console.error(e); } }
                throw err;
            } finally {
                fbBusy = false;
            }
        }

        async function logout(silent = false) {
            if (!silent && currentUser()) log('تسجيل خروج');
            // stop listeners first: signing out makes them fail with permission-denied,
            // which must not be reported as "account not activated"
            fbUser = null;
            stopSync();
            try { await fbAuth.signOut(); } catch (err) { console.error(err); }
            if (silent) toast('انتهت الجلسة. سجّل الدخول من جديد', 'info');
        }

                        <div class="min-w-0">

                    ${field('تأكيد الجديدة', `<input name="new2" type="password" required minlength="6" autocomplete="new-password" class="${INPUT_CLS}">`)}`,
                onSubmit: async fd => {

        // ============ MODAL SYSTEM ============
        function openModal({ title, body, submitText = 'حفظ', onSubmit = null, danger = false, size = 'md', onOpen = null }) {

            el('modalHost').innerHTML = `

                          ${onSubmit ? 'onsubmit="submitModal(event)"' : 'onsubmit="event.preventDefault()"'}>
                        <div class="flex justify-between items-center px-5 sm:px-6 py-4 border-b border-slate-100">
                            <h3 class="text-lg font-bold text-slate-800">${title}</h3>

                            </button>

        function closeModal() {
            el('modalHost').innerHTML = '';

        async function submitModal(e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type=submit]');
            if (btn) btn.disabled = true;
            try {
                const result = await modalSubmit(new FormData(form), form);
                if (result !== false) closeModal();
            } catch (err) {
                console.error(err);
                toast('حدث خطأ غير متوقع: ' + err.message, 'error', null, 5000);

        // ============ ROUTER & SHELL ============
        function parseRoute() {
            const h = location.hash.replace(/^#\/?/, '');
            const [name, ...rest] = h.split('/');
            return { name: name || 'dashboard', param: rest.join('/') || null };
        }

        function navigate(route) {
            const target = '#/' + route;
            if (location.hash === target) render();
            else location.hash = target;
        }

        function render() {
            if (!sessionUserId) return;
            const user = currentUser();
            if (!user || !user.active) {
                logout(true);
                return;
            }
            let { name, param } = parseRoute();

            if (!ROUTES[name]) name = 'dashboard';
            if (!canAccessRoute(name)) {
                const first = firstAllowedRoute();
                if (first) return navigate(first);
                renderNoAccess();
                return;
            }
            if (name === 'companies' && param && !findCompany(param)) return navigate('companies');

            const view = VIEWS[name](param);
            el('pageTitle').textContent = view.title;
            el('topActions').innerHTML = view.actions || '';
            el('content').innerHTML = view.html;
            renderChrome(name);
            if (view.after) view.after();
            closeRowMenu();
            toggleSidebar(false);
        }

        function renderNoAccess() {
            el('pageTitle').textContent = 'لا توجد صلاحيات';
            el('topActions').innerHTML = '';

        function computeStats() {
            const s = { companies: appData.companies.length, totalLists: 0, active: 0, activeOnly: 0, expiring: 0, expired: 0, avgEff: 0, expItems: [], perCompany: [] };
            let effSum = 0, effCount = 0;
            appData.companies.forEach(c => c.lists.forEach(l => {
                s.totalLists++;
                const st = listState(l);
                if (!st.active) s.expired++;
                else {
                    s.active++;
                    effSum += effValue(l);
                    effCount++;
                    if (st.expiring) { s.expiring++; s.expItems.push({ c, l, days: st.days }); }
                    else s.activeOnly++;
                }
            }));
            s.avgEff = effCount ? effSum / effCount : 0;
            s.expItems.sort((a, b) => a.days - b.days);
            s.perCompany = appData.companies.map(c => {
                const total = c.lists.length;
                const active = c.lists.filter(l => listState(l).active).length;
                const eff = total ? c.lists.reduce((a, l) => a + effValue(l), 0) / total : 0;
                return { c, total, active, eff };
            }).sort((a, b) => b.total - a.total || a.c.name.localeCompare(b.c.name, 'ar'));
            return s;
        }

                         class="group bg-white rounded-2xl border-2 border-slate-300 p-4 sm:p-5 shadow-lg shadow-slate-300/60 hover:shadow-xl hover:border-brand-500 cursor-pointer transition-all flex flex-col gap-4">
