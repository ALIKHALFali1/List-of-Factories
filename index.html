            ] },

                ['logs.view', 'عرض سجل النشاط'],

        ];
        const ALL_PERMS = PERMISSION_GROUPS.flatMap(g => g.items.map(i => i[0]));
        const PERM_LABELS = Object.fromEntries(PERMISSION_GROUPS.flatMap(g => g.items));

        const ROUTES = {
            dashboard: { title: 'لوحة التحكم', icon: 'fa-gauge-high', perm: 'dashboard.view' },
            companies: { title: 'المصانع / الشركات', icon: 'fa-industry', perm: 'companies.view' },
            lists: { title: 'كل اللستات', icon: 'fa-file-invoice-dollar', perm: 'lists.view' },
            checks: { title: 'الشيكات', icon: 'fa-money-check-dollar', perm: 'checks.view' },
            orders: { title: 'الطلبيات', icon: 'fa-truck-ramp-box', perm: 'orders.view' },
            users: { title: 'المستخدمون والصلاحيات', icon: 'fa-users-gear', perm: 'users.manage' },
            logs: { title: 'سجل النشاط', icon: 'fa-clock-rotate-left', perm: 'logs.view' },
            settings: { title: 'الإعدادات', icon: 'fa-gear', perm: 'settings.manage', alt: 'backup.manage' }
        };
        const ROUTE_ORDER = ['dashboard', 'companies', 'lists', 'checks', 'orders', 'logs', 'users', 'settings'];

        // ============ STATE ============
        let appData = null;
        let sessionUserId = null;
        let modalSubmit = null;
        let usersTab = 'users';
        let editingListId = null;
        let editingCompanyId = null;
        let editingUserId = null;
        let pendingPdfFile = null;
        let pendingBigPdf = null;          // PDF over 8 MB waiting for compression
        let pendingRemovePdf = false;
        let pendingLogo = undefined;      // company logo: undefined = unchanged, null = removed, string = new
        let pendingSysLogo = undefined;   // system logo, same meaning
        let calcListId = null;
        let pendingUndo = null;

        // ============ GENERAL HELPERS ============
        const el = id => document.getElementById(id);

        function uid(prefix) {
            return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7).toUpperCase();
        }

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function pad2(n) { return String(n).padStart(2, '0'); }

        function toISODate(d) {
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function todayISO() { return toISODate(new Date()); }

        function parseISODate(str, endOfDay) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str || ''));
            if (!m) return null;
            const y = +m[1], mo = +m[2] - 1, d = +m[3];
            return endOfDay ? new Date(y, mo, d, 23, 59, 59, 999) : new Date(y, mo, d, 0, 0, 0, 0);
        }

        function addDays(isoStr, days) {
            const d = parseISODate(isoStr, false);
            if (!d) return null;
            d.setDate(d.getDate() + days);
            return toISODate(d);
        }

        function daysBetween(a, b) {
            const s = parseISODate(a), e = parseISODate(b);
            if (!s || !e) return null;
            return Math.round((e - s) / 864e5);
        }

        function fmtDateTime(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return '-';
            return d.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function expiryDays() {
            return parseInt(appData.settings.expiryDays, 10) || 30;
        }

        function isListActive(startStr, endStr) {
            const start = parseISODate(startStr, false);
            if (!start) return false;
            const now = new Date();
            if (!String(endStr || '').trim()) return now >= start; // no end date = open-ended
            const end = parseISODate(endStr, true);
            if (!end) return false;
            return now >= start && now <= end;
        }

        // shown in tables/cards when a list has no end date
        function listEndText(l) {
            return l.endDate ? esc(l.endDate) : '<span class="font-sans font-semibold text-slate-400">بدون تاريخ انتهاء</span>';
        }

        function daysUntilEnd(list) {
            const end = parseISODate(list.endDate, false);
            const today = parseISODate(todayISO(), false);
            if (!end || !today) return null;
            return Math.round((end - today) / 864e5);
        }

        function listState(list) {
            const active = isListActive(list.startDate, list.endDate);
            const days = daysUntilEnd(list);
            return { active, days, expiring: active && days !== null && days <= expiryDays() };
        }

        function statusLabel(state) {
            if (!state.active) return 'منتهية';
            if (state.expiring) return state.days === 0 ? 'تنتهي اليوم' : `تنتهي خلال ${state.days} يوم`;
            return 'نشطة';
        }

        function calculateEffectiveDiscount(d1 = 0, d2 = 0, d3 = 0, d4 = 0) {
            const factor = [d1, d2, d3, d4].reduce((acc, d) => acc * (1 - (parseFloat(d) || 0) / 100), 1);
            return ((1 - factor) * 100).toFixed(2);
        }

        function effValue(list) {
            return parseFloat(calculateEffectiveDiscount(list.discount1, list.discount2, list.discount3, list.flatDiscount));
        }

        function pct(value) {
            const n = parseFloat(value);
            return n ? `${n}%` : '-';
        }

        function fmtMoney(n) { return `${n.toFixed(2)} ج.م`; }

        function initials(name) {
            return Array.from(String(name || '?').trim()).slice(0, 2).join('') || '?';
        }

        const AVATAR_COLORS = ['bg-sky-500', 'bg-emerald-500', 'bg-violet-500', 'bg-amber-500', 'bg-rose-500', 'bg-teal-500', 'bg-indigo-500', 'bg-fuchsia-500'];
        function colorFor(text) {
            let h = 0;
            for (const ch of String(text)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
            return AVATAR_COLORS[h % AVATAR_COLORS.length];
        }

        // Company logo (image) or coloured initials as fallback
        function companyLogoHtml(c, cls = 'w-10 h-10 text-sm') {
            if (c.logo) {
                return `<img src="${esc(c.logo)}" alt="شعار ${esc(c.name)}" class="${cls} rounded-xl object-contain bg-white border border-slate-100 shrink-0">`;
            }
            return `<span class="${cls} rounded-xl shrink-0 flex items-center justify-center font-bold text-white ${colorFor(c.name)}">${esc(initials(c.name))}</span>`;
        }

        function findCompany(id) {
            return appData.companies.find(c => c.id === id) || null;
        }

        function findList(listId) {
            for (const c of appData.companies) {
                const l = c.lists.find(x => x.id === listId);
                if (l) return { c, l };
            }
            return null;
        }

        function field(label, input, hint = '') {
            return `<label class="block">
                        <span class="block text-xs font-bold text-slate-700 mb-1">${label}</span>
                        ${input}
                        ${hint ? `<span class="block text-[11px] text-slate-400 mt-1">${hint}</span>` : ''}
                    </label>`;
        }

        // ============ TOASTS ============
        function toast(message, type = 'info', action = null, duration = 3500) {
            const host = el('toastHost');
            const colors = { info: 'bg-slate-900', success: 'bg-emerald-600', error: 'bg-rose-600' };
            const node = document.createElement('div');
            node.className = `${colors[type] || colors.info} text-white text-sm rounded-xl shadow-lg px-4 py-3 flex items-center gap-3 pointer-events-auto transition-all duration-300 toast-enter`;
            node.setAttribute('role', 'status');

            const text = document.createElement('span');
            text.className = 'flex-1 whitespace-pre-line leading-relaxed';
            text.textContent = message;
            node.appendChild(text);

            const remove = () => {
                node.style.opacity = '0';
                node.style.transform = 'translateY(8px)';
                setTimeout(() => node.remove(), 300);
            };

            if (action) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'font-bold underline underline-offset-2 shrink-0 px-2 py-1';
                btn.textContent = action.label;
                btn.onclick = () => { action.onClick(); remove(); };
                node.appendChild(btn);
            }

            host.appendChild(node);
            requestAnimationFrame(() => requestAnimationFrame(() => {
                node.style.opacity = '1';
                node.style.transform = 'translateY(0)';
            }));
            setTimeout(remove, duration);
        }

        // ============ UNDO (soft delete) ============
        function scheduleUndo(message, undo, commit) {
            finalizePendingUndo();
            const entry = { undo, commit, timer: null };
            entry.timer = setTimeout(finalizePendingUndo, UNDO_MS);
            pendingUndo = entry;
            toast(message, 'info', {

                    if (pendingUndo !== entry) return;
                    clearTimeout(entry.timer);
                    pendingUndo = null;
                    entry.undo();
                }
            }, UNDO_MS);
        }

        function finalizePendingUndo() {
            const entry = pendingUndo;
            if (!entry) return;
            pendingUndo = null;
            clearTimeout(entry.timer);
            entry.commit();
        }

        // ============ DATA: defaults, normalize, load, save ============

        function defaultData() {

        function normalizeData(d) {
            const base = defaultData();
            d.settings = Object.assign(base.settings, d.settings || {});
            d.settings.expiryDays = parseInt(d.settings.expiryDays, 10) || 30;
            d.settings.systemName = String(d.settings.systemName || base.settings.systemName);
            d.settings.logo = String(d.settings.logo || '');

            // Roles: saved roles are kept as they are (deleted default roles stay deleted).
            // The admin role is always locked and always has every permission.
            const roles = (d.roles && typeof d.roles === 'object' && Object.keys(d.roles).length) ? d.roles : defaultRoles();
            if (!roles.admin) roles.admin = defaultRoles().admin;
            Object.values(roles).forEach(r => {
                r.id = r.id || uid('role-');
                r.name = String(r.name || 'دور بدون اسم');
                r.permissions = Array.isArray(r.permissions) ? r.permissions.filter(p => ALL_PERMS.includes(p)) : [];
            });

            roles.admin.permissions = [...ALL_PERMS];
            d.roles = roles;

            // Partners (payees) and checks. A check keeps the payee name it was written with.
            d.partners = (Array.isArray(d.partners) ? d.partners : [])
                .filter(p => p && typeof p === 'object' && p.id)
                .map(p => ({ id: String(p.id), name: String(p.name || '').trim(), notes: String(p.notes || ''), limit: Math.max(0, Number(p.limit) || 0) }));
            d.checks = (Array.isArray(d.checks) ? d.checks : [])
                .filter(c => c && typeof c === 'object' && c.id)
                .map(c => ({
                    id: String(c.id), number: String(c.number || ''), bank: String(c.bank || ''),
                    amount: Number(c.amount) || 0, dueDate: String(c.dueDate || ''),
                    payeeId: String(c.payeeId || ''), payeeName: String(c.payeeName || ''), cashed: c.cashed === true
                }));

            // Orders: lists that the database may return as objects (keys 0, 1, ...) are turned back into arrays.
            const asArr = v => (Array.isArray(v) ? v : Object.values(v || {}));
            d.orders = asArr(d.orders)
                .filter(o => o && typeof o === 'object' && o.id)
                .map(o => ({
                    ...o, id: String(o.id), no: Number(o.no) || 0,
                    kind: o.kind === 'delivery' ? 'delivery' : 'supply',
                    status: ORDER_STATUS[o.status] ? o.status : 'draft',
                    factoryId: String(o.factoryId || ''), factoryName: String(o.factoryName || ''),
                    items: asArr(o.items).filter(it => it && typeof it === 'object'),
                    prices: (o.prices && typeof o.prices === 'object') ? o.prices : {},
                    schedule: o.schedule || {}, transport: o.transport || { type: 'truck' },
                    payment: o.payment || { terms: 'نقدي', paid: 0, dueDate: '' },
                    history: asArr(o.history)
                }));

            // Users are profiles only. Passwords live in Firebase Authentication.
            d.users = (Array.isArray(d.users) ? d.users : [])
                .filter(u => u && typeof u === 'object' && u.id)
                .map(u => ({
                    id: String(u.id),
                    name: String(u.name || ''),
                    email: String(u.email || '').trim().toLowerCase(),
                    roleId: roles[u.roleId] ? u.roleId : 'viewer',
                    active: u.active !== false,
                    createdAt: u.createdAt || new Date().toISOString(),
                    lastLoginAt: u.lastLoginAt || null
                }));

            d.companies = (Array.isArray(d.companies) ? d.companies : []).filter(c => c && typeof c === 'object').map(c => ({
                id: c.id || uid('FAC-'),
                name: String(c.name || ''),
                agent: String(c.agent || ''),
                notes: String(c.notes || ''),
                kind: c.kind === 'supplier' ? 'supplier' : 'factory',
                logo: String(c.logo || ''),
                lists: (Array.isArray(c.lists) ? c.lists : []).filter(l => l && typeof l === 'object').map(l => ({
                    id: l.id || uid('LST-'),
                    name: String(l.name || ''),
                    discount1: parseFloat(l.discount1) || 0,
                    discount2: parseFloat(l.discount2) || 0,
                    discount3: parseFloat(l.discount3) || 0,
                    flatDiscount: parseFloat(l.flatDiscount) || 0,
                    startDate: String(l.startDate || ''),
                    endDate: String(l.endDate || ''),
                    pdfFile: String(l.pdfFile || ''),
                    hasPdf: !!l.hasPdf
                }))
            }));

            d.logs = (Array.isArray(d.logs) ? d.logs : []).slice(0, LOG_LIMIT);
            return d;
        }

        // ============ FIREBASE SYNC ============
        // appData is the in-memory copy the whole UI works on. It is kept in sync with the database:
        //  - incoming: real-time listeners rebuild appData whenever the server data changes
        //  - outgoing: saveState() writes only the documents that changed (batched)
        let fbApp = null, fbAuth = null, fbDb = null, rtdb = null;

        // ============ DATABASE LAYER (Firebase Realtime Database) ============
        // The app talks to the database through the small API below: collection / doc / batch / get / set / delete / onSnapshot.
        // Paths in the database:
        //   system/init, settings/main, users/{uid}, roles/{id}, companies/{id}, lists/{id}, logs/{id}, pdfs/{listId}
        // batch.commit() is one multi-path update(), so a whole batch is written atomically.
        const DB_CODEC = {
            // rules check roles/{id}/permissions/{perm} as a map; '_' replaces '.' because RTDB keys cannot contain '.'
            roles: {
                encode: d => ({ ...d, permissions: Object.fromEntries((d.permissions || []).map(p => [p.replace(/\./g, '_'), true])) }),
                decode: d => ({ ...d, permissions: Object.keys(d.permissions || {}).filter(k => d.permissions[k] === true).map(k => k.replace(/_/g, '.')).sort() })
            }
        };
        const dbClean = v => JSON.parse(JSON.stringify(v)); // drops undefined; RTDB treats null as "no value"
        const dbEncode = (path, data) => {
            const plain = dbClean(data);
            const c = DB_CODEC[path.split('/')[0]];
            return c ? c.encode(plain) : plain;
        };
        const dbDecode = (path, val) => {
            const c = DB_CODEC[path.split('/')[0]];
            return c ? c.decode(val) : val;
        };
        // RTDB reports rule denials as "permission_denied"; the app checks err.code === 'permission-denied'
        function dbError(err) {
            if (err && /permission_denied/i.test(String(err.message || err))) {
                const e = new Error('permission denied');
                e.code = 'permission-denied';
                return e;
            }
            return err;
        }

        class DbDoc {
            constructor(path) { this.path = path; this.id = path.split('/').pop(); }
            _ref() { return rtdb.ref(this.path); }
            get() {
                return this._ref().once('value').then(s => new DbSnap(this.path, s.val()), e => { throw dbError(e); });
            }
            set(data) {
                return this._ref().set(dbEncode(this.path, data)).catch(e => { throw dbError(e); });
            }
            update(fields) {
                return this._ref().update(dbClean(fields)).catch(e => { throw dbError(e); });
            }
            delete() {
                return this._ref().remove().catch(e => { throw dbError(e); });
            }
            onSnapshot(next, error) {
                const r = this._ref();
                const fn = s => next(new DbSnap(this.path, s.val()));
                r.on('value', fn, e => { if (error) error(dbError(e)); });
                return () => r.off('value', fn);
            }
        }

        class DbSnap {
            constructor(path, val) {
                this.ref = new DbDoc(path);
                this.id = this.ref.id;
                this.exists = val !== null && val !== undefined;
                this._path = path;
                this._val = val;
            }
            data() { return this.exists ? dbDecode(this._path, this._val) : undefined; }
        }

        class DbCollection {
            constructor(name, q = {}) { this.name = name; this.q = q; }
            doc(id) { return new DbDoc(this.name + '/' + id); }
            orderBy(field, dir = 'asc') { return new DbCollection(this.name, { ...this.q, order: field, dir }); }
            limit(n) { return new DbCollection(this.name, { ...this.q, limit: n }); }
            _ref() {
                let r = rtdb.ref(this.name);
                if (this.q.order) r = r.orderByChild(this.q.order);
                if (this.q.limit) r = this.q.order ? r.limitToLast(this.q.limit) : r.limitToFirst(this.q.limit);
                return r;
            }
            _snap(s) {
                const docs = [];
                s.forEach(c => { docs.push(new DbSnap(this.name + '/' + c.key, c.val())); });
                if (this.q.dir === 'desc') docs.reverse();
                return { size: docs.length, empty: docs.length === 0, docs, forEach: fn => docs.forEach(fn) };
            }
            get() {
                return this._ref().once('value').then(s => this._snap(s), e => { throw dbError(e); });
            }
            onSnapshot(next, error) {
                const r = this._ref();
                const fn = s => next(this._snap(s));
                r.on('value', fn, e => { if (error) error(dbError(e)); });
                return () => r.off('value', fn);
            }
        }

        class DbBatch {
            constructor() { this.updates = {}; }
            set(ref, data) { this.updates[ref.path] = dbEncode(ref.path, data); return this; }
            delete(ref) { this.updates[ref.path] = null; return this; }
            commit() {
                if (!Object.keys(this.updates).length) return Promise.resolve();
                return rtdb.ref().update(this.updates).catch(e => { throw dbError(e); });
            }
        }

        const fbDbApi = {
            collection: name => new DbCollection(name),
            doc: path => new DbDoc(path),
            batch: () => new DbBatch()
        };
        let fbUser = null;                 // signed-in Firebase user (null when signed out)
        let fbSynced = false;              // true once every collection delivered its first snapshot
        let fbBaseline = new Map();        // key -> { data, sig }: what the server is known to hold
        let fbCache = null;                // raw snapshot data per collection
        let fbLoaded = {};
        let fbUnsubs = [];
        let fbLogsUnsub = null;
        let fbChecksUnsubs = [];           // partners + checks listeners (checks.view only)
        let fbBusy = false;                // login/setup in progress: the auth-state handler waits
        let appEntered = false;
        let pendingLoginLog = false;
        let signingOut = false;
        let initExists = null;             // does system/init exist? (null = unknown)
        let serverChecked = false;         // true once the public server check has finished (or timed out)
        const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function firebaseReady() {
            return typeof firebase !== 'undefined' && !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE_');
        }

        // stable JSON (sorted keys) so two equal documents always produce the same signature
        function canon(v) {
            if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
            if (v && typeof v === 'object') {
                // null and undefined are the same here: the database keeps neither (a null field is simply absent)
                return '{' + Object.keys(v).filter(k => v[k] !== undefined && v[k] !== null).sort()
                    .map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
            }
            return v === undefined ? 'null' : JSON.stringify(v);
        }

        // Documents that should exist on the server for the given state. Key = "collection/id".
        // Lists are stored in their own collection (with companyId), so a single list can change without rewriting its company.
        function desiredDocs(d) {
            const out = new Map();
            d.companies.forEach((c, ci) => {
                const { lists, ...rest } = c;
                out.set('companies/' + c.id, { ...rest, pos: ci });
                lists.forEach((l, li) => out.set('lists/' + l.id, { ...l, companyId: c.id, pos: li }));
            });
            (d.partners || []).forEach(p => out.set('partners/' + p.id, { ...p }));
            (d.checks || []).forEach(c => out.set('checks/' + c.id, { ...c }));
            orderDocsFor(d.orders || [], out);
            d.users.forEach(u => out.set('users/' + u.id, {
                name: u.name, email: u.email, roleId: u.roleId, active: u.active,
                createdAt: u.createdAt, lastLoginAt: u.lastLoginAt || null
            }));
            Object.values(d.roles).forEach(r => out.set('roles/' + r.id, {
                name: r.name, permissions: [...(r.permissions || [])].sort(), locked: !!r.locked
            }));
            out.set('settings/main', {
                systemName: d.settings.systemName, logo: d.settings.logo, expiryDays: d.settings.expiryDays
            });
            return out;
        }

        function refFor(key) {
            // split at the first slash: "orderTransport/truck/{id}" = collection "orderTransport", document "truck/{id}"
            const i = key.indexOf('/');
            return fbDb.collection(key.slice(0, i)).doc(key.slice(i + 1));
        }

        async function commitChunks(ops) {
            for (let i = 0; i < ops.length; i += 400) {
                const batch = fbDb.batch();
                ops.slice(i, i + 400).forEach(op => {
                    const ref = refFor(op.key);
                    if (op.del) batch.delete(ref);
                    else batch.set(ref, JSON.parse(JSON.stringify(op.data)));
                });
                await batch.commit();
            }
        }

        // Write only what changed since the last known server state.
        function saveState() {
            if (!fbDb || !fbSynced || !appData) return;
            const desired = desiredDocs(appData);
            const ops = [];
            desired.forEach((data, key) => {
                const sig = canon(data);
                const prev = fbBaseline.get(key);
                if (!prev || prev.sig !== sig) ops.push({ key, data, sig, isNew: !prev, prevData: prev ? prev.data : null });
            });
            fbBaseline.forEach((b, key) => { if (!desired.has(key)) ops.push({ key, del: true, prevData: b.data }); });
            if (!ops.length) return;
            ops.forEach(op => {
                if (op.del) fbBaseline.delete(op.key);
                else fbBaseline.set(op.key, { data: op.data, sig: op.sig });
            });
            const note = fbUser ? notificationFor(ops) : null;
            const batchOps = note ? [...ops, { key: 'notifications/' + note.id, data: note }] : ops;
            commitChunks(batchOps).catch(err => {
                console.error(err);
                const denied = err && err.code === 'permission-denied';
                toast(denied ? 'ليس لديك صلاحية لهذا التعديل. تم التراجع عنه' : 'تعذر حفظ التعديل على السيرفر', 'error', null, 6000);
                rebuildFromCache();
                render();
            });
        }

        // ============ NOTIFICATIONS (bell) ============
        // One entry is written for every saved change (and every PDF change), by the user who made it.
        // Everyone else who is signed in sees it in the bell. The activity log (logs) stays limited to logs.view.
        const NOTIF_LIMIT = 50;
        const NOTIF_KIND = { companies: 'شركة', lists: 'لستة', partners: 'مستفيد', checks: 'شيك', orders: 'طلبية', users: 'مستخدم', roles: 'دور صلاحيات', settings: 'إعدادات النظام' };
        const NOTIF_VERB = { add: 'أضاف', edit: 'عدّل', del: 'حذف' };
        let notifs = [];                 // newest first, as the database sends them (all users)
        let notifUnsub = null;
        let notifOpen = false;
        let notifHighlightAfter = null;  // while the panel is open, items newer than this are shown as new

        // the login time stamp is not a change worth a notification
        const withoutLogin = d => ({ ...(d || {}), lastLoginAt: undefined });

        function describeChanges(ops) {
            const real = ops.filter(o => !(o.key.startsWith('users/') && !o.del && o.prevData &&
                canon(withoutLogin(o.prevData)) === canon(withoutLogin(o.data))));
            if (!real.length) return null;
            const verbs = [...new Set(real.map(o => o.del ? 'del' : (o.isNew ? 'add' : 'edit')))];
            const kinds = [...new Set(real.map(o => NOTIF_KIND[o.key.split('/')[0]] || 'بيانات'))];
            const names = [...new Set(real.map(o => o.key === 'settings/main'
                ? 'إعدادات النظام'
                : (o.data?.name || o.prevData?.name
                    || (o.data?.number || o.prevData?.number ? 'شيك رقم ' + (o.data?.number || o.prevData?.number) : ((o.data?.no || o.prevData?.no) ? 'طلبية ' + String(o.data?.no || o.prevData?.no).padStart(4, '0') : o.key.split('/')[1])))))];
            return {
                verb: NOTIF_VERB[verbs.length === 1 ? verbs[0] : 'edit'],
                kind: kinds.join('، '),
                detail: names.slice(0, 2).join('، ') + (names.length > 2 ? ` و${names.length - 2} غيرها` : '')
            };
        }

        function newNotification(info) {
            return {
                id: uid('NTF-'), t: new Date().toISOString(), uid: fbUser.uid,
                user: currentUser()?.name || 'مستخدم', verb: info.verb, kind: info.kind, detail: info.detail
            };
        }

        // the notification of a batch of changes (written in the same atomic update as the changes)
        function notificationFor(ops) {
            const info = describeChanges(ops);
            return info ? newNotification(info) : null;
        }

        // a change that is written on its own (PDF upload or removal)
        function notifyDirect(verb, kind, detail) {
            if (!fbDb || !fbUser) return;
            const n = newNotification({ verb, kind, detail });
            fbDb.collection('notifications').doc(n.id).set(n).catch(err => console.warn('notification not saved:', err && err.code));
        }

        function listNameById(id) {
            for (const c of appData?.companies || []) {
                const l = (c.lists || []).find(x => x.id === id);
                if (l) return l.name;
            }
            return id;
        }

        function startNotifSync() {
            stopNotifSync();
            notifUnsub = fbDb.collection('notifications').orderBy('t', 'desc').limit(NOTIF_LIMIT).onSnapshot(snap => {
                notifs = snap.docs.map(d => d.data());
                renderNotifs();
            }, err => console.error('notifications listener', err));
        }

        function stopNotifSync() {
            if (notifUnsub) { try { notifUnsub(); } catch (e) { /* already closed */ } }
            notifUnsub = null;
            notifs = [];
            closeNotifPanel();
        }

        function notifKey() { return 'notifSeen:' + (fbUser?.uid || 'anon'); }

        // when the user last opened the bell (on this browser). The first visit does not count old entries as new.
        function notifSeenAt() {
            let v = null;
            try { v = localStorage.getItem(notifKey()); } catch (e) { /* storage blocked */ }
            if (!v) {
                v = new Date().toISOString();
                try { localStorage.setItem(notifKey(), v); } catch (e) { /* storage blocked */ }
            }
            return v;
        }

        function markNotifsSeen() {
            try { localStorage.setItem(notifKey(), new Date().toISOString()); } catch (e) { /* storage blocked */ }
            renderNotifs();
        }

        // everyone's entries except the user's own changes
        function visibleNotifs() {
            const me = fbUser?.uid;
            return notifs.filter(n => n.uid !== me);
        }

        function renderNotifs() {
            const badge = el('notifBadge');
            const list = el('notifList');
            if (!badge || !list) return;
            const seen = notifSeenAt();
            const items = visibleNotifs();
            const unread = items.filter(n => n.t > seen).length;
            badge.textContent = unread > 9 ? '9+' : String(unread);
            badge.classList.toggle('hidden', unread === 0);
            const fresh = notifHighlightAfter || seen;
            list.innerHTML = items.length
                ? items.map(n => `
                    <div class="px-4 py-3 ${n.t > fresh ? 'bg-brand-50' : ''}">
                        <p class="text-sm text-slate-800"><b class="text-brand-700">${esc(n.user)}</b> ${esc(n.verb)} <b>${esc(n.kind)}</b></p>
                        ${n.detail ? `<p class="text-sm text-slate-600 mt-0.5 break-words">${esc(n.detail)}</p>` : ''}
                        <p class="text-xs text-slate-500 mt-1">${esc(timeAgo(n.t))}</p>
                    </div>`).join('')
                : '<p class="px-4 py-8 text-center text-sm text-slate-500">لا توجد إشعارات بعد</p>';
        }

        function toggleNotifPanel(e) {
            if (e) e.stopPropagation();
            if (notifOpen) return closeNotifPanel();
            notifOpen = true;
            notifHighlightAfter = notifSeenAt();   // what was new when the panel opened stays highlighted
            el('notifPanel').classList.remove('hidden');
            markNotifsSeen();
        }

        function closeNotifPanel() {
            notifOpen = false;
            notifHighlightAfter = null;
            el('notifPanel')?.classList.add('hidden');
            renderNotifs();
        }

        document.addEventListener('click', e => {
            if (notifOpen && !el('notifHost')?.contains(e.target)) closeNotifPanel();
        });

        function timeAgo(iso) {
            const sec = (Date.now() - new Date(iso).getTime()) / 1000;
            if (!(sec >= 60)) return 'الآن';
            if (sec < 3600) return `منذ ${Math.floor(sec / 60)} دقيقة`;
            if (sec < 86400) return `منذ ${Math.floor(sec / 3600)} ساعة`;
            return new Date(iso).toLocaleString('ar-EG', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
        }

        function log(action, detail = '') {
            const entry = { id: uid('LOG-'), t: new Date().toISOString(), user: currentUser()?.name || 'النظام', action, detail };
            appData.logs.unshift(entry);
            if (appData.logs.length > LOG_LIMIT) appData.logs.length = LOG_LIMIT;
            // The data change goes out first. The database fires its listeners synchronously on a local write,
            // so the logs listener must not rebuild the state before the change itself is in the local cache.
            saveState();
            if (fbDb && fbUser) {
                fbDb.collection('logs').doc(entry.id).set(entry).catch(err => console.warn('log not saved:', err && err.code));
            }
        }

        function mapDocs(snap) {
            const out = {};
            snap.forEach(d => { out[d.id] = { id: d.id, ...d.data() }; });
            return out;
        }

        // Rebuild appData from the raw collections and remember what the server holds.
        function buildFromCache() {
            const c = fbCache;
            const byPos = (a, b) => (a.pos || 0) - (b.pos || 0);
            const listsByCompany = {};
            Object.values(c.lists).sort(byPos).forEach(({ companyId, pos, ...l }) => {
                (listsByCompany[companyId] = listsByCompany[companyId] || []).push(l);
            });
            const companies = Object.values(c.companies).sort(byPos)
                .map(({ pos, ...co }) => ({ ...co, lists: listsByCompany[co.id] || [] }));
            const roles = {};
            Object.values(c.roles).forEach(r => { roles[r.id] = r; });
            appData = normalizeData({
                settings: c.settings || {},
                roles,
                users: Object.values(c.users),
                companies,
                partners: Object.values(c.partners || {}),
                checks: Object.values(c.checks || {}),
                orders: buildOrdersFromCache(c),
                logs: c.logs || []
            });
            fbBaseline = new Map();
            desiredDocs(appData).forEach((data, key) => fbBaseline.set(key, { data, sig: canon(data) }));
        }

        function rebuildFromCache() {
            if (fbCache) buildFromCache();
        }

        function startSync(uid) {
            stopSync();
            fbCache = { users: {}, roles: {}, companies: {}, lists: {}, partners: {}, checks: {}, ord: {}, settings: null, logs: [] };
            fbLoaded = {};
            fbSynced = false;
            const listen = (name, ref, apply) => {
                fbUnsubs.push(ref.onSnapshot(snap => {
                    if (!fbCache) return;
                    apply(snap);
                    fbLoaded[name] = true;
                    onCacheChanged();
                }, err => onListenError(name, err)));
            };
            listen('users', fbDb.collection('users'), s => { fbCache.users = mapDocs(s); });
            listen('roles', fbDb.collection('roles'), s => { fbCache.roles = mapDocs(s); });
            listen('companies', fbDb.collection('companies'), s => { fbCache.companies = mapDocs(s); });
            listen('lists', fbDb.collection('lists'), s => { fbCache.lists = mapDocs(s); });
            listen('settings', fbDb.collection('settings').doc('main'), s => { fbCache.settings = s.exists ? s.data() : null; });
            startNotifSync();
        }

        function stopSync() {
            fbUnsubs.forEach(u => { try { u(); } catch (e) { /* already closed */ } });
            fbUnsubs = [];
            fbChecksUnsubs.forEach(u => { try { u(); } catch (e) { /* already closed */ } });
            fbChecksUnsubs = [];
            fbOrdLive.forEach(u => { try { u(); } catch (e) { /* already closed */ } });
            fbOrdLive.clear();
            if (fbLogsUnsub) { try { fbLogsUnsub(); } catch (e) { /* already closed */ } }
            fbLogsUnsub = null;
            stopNotifSync();
            fbCache = null;
            fbLoaded = {};
            fbSynced = false;
        }

        // the activity log is only readable by users with logs.view, so listen only for them
        function syncLogsListener() {
            const canSee = can('logs.view');
            if (canSee && !fbLogsUnsub) {
                fbLogsUnsub = fbDb.collection('logs').orderBy('t', 'desc').limit(LOG_LIMIT).onSnapshot(snap => {
                    if (!fbCache) return;
                    fbCache.logs = snap.docs.map(d => d.data());
                    onCacheChanged();
                }, err => console.error('logs listener', err));
            } else if (!canSee && fbLogsUnsub) {
                fbLogsUnsub();
                fbLogsUnsub = null;
                if (fbCache) fbCache.logs = [];
            }
        }

        // Partners and checks are readable only with checks.view. Listen only for them, so a user
        // without the permission never gets a denied listener (which would sign them out).
        // Called on a timer: the database can fire a listener synchronously from its cache.
        function syncChecksListener() {
            if (!fbCache || !fbUser) return;
            const canSee = can('checks.view');
            if (canSee && !fbChecksUnsubs.length) {
                const onErr = err => console.error('checks listener', err);
                fbChecksUnsubs.push(fbDb.collection('partners').onSnapshot(snap => {
                    if (!fbCache) return;
                    fbCache.partners = mapDocs(snap);
                    onCacheChanged();
                }, onErr));
                fbChecksUnsubs.push(fbDb.collection('checks').onSnapshot(snap => {
                    if (!fbCache) return;
                    fbCache.checks = mapDocs(snap);
                    onCacheChanged();
                }, onErr));
            } else if (!canSee && fbChecksUnsubs.length) {
                fbChecksUnsubs.forEach(u => { try { u(); } catch (e) { /* already closed */ } });
                fbChecksUnsubs = [];
                if (fbCache) { fbCache.partners = {}; fbCache.checks = {}; }
                if (appData) { appData.partners = []; appData.checks = []; }
                // these docs are no longer known: never delete them on the server from here
                fbBaseline.forEach((b, key) => { if (/^(partners|checks)\//.test(key)) fbBaseline.delete(key); });
            }
        }

        function onListenError(name, err) {
            // a listener from a session that already ended can still report an error
            if (!fbUser || !fbCache) return;
            console.error('listener ' + name, err);
            if (err && err.code === 'permission-denied') {
                handleAccessLost('حسابك غير مفعّل أو ليس لديك صلاحية الوصول. تواصل مع مدير النظام');
            } else {
                toast('تعذر تحميل البيانات من السيرفر', 'error', null, 5000);
            }
        }

        async function handleAccessLost(message) {
            if (signingOut) return;
            signingOut = true;
            stopSync();
            toast(message, 'error', null, 6000);
            try { await fbAuth.signOut(); } catch (err) { console.error(err); }
            signingOut = false;
        }

        function onCacheChanged() {
            if (!fbUser || !fbCache) return;
            if (!['users', 'roles', 'companies', 'lists', 'settings'].every(k => fbLoaded[k])) return;
            const sigOf = () => canon([...desiredDocs(appData).entries(), appData.logs.map(l => l.id)]);
            const before = appData ? sigOf() : '';
            const previous = appData;
            buildFromCache();
            // Realtime Database can report a value again with the same content. Then keep the same objects:
            // an open dialog (company, list, user) holds references to them and would save into stale copies.
            // Only the logs are taken from the new build.
            const contentOf = d => canon([...desiredDocs(d).entries()]);
            if (previous && contentOf(previous) === contentOf(appData)) {
                previous.logs = appData.logs;
                appData = previous;
            }
            fbSynced = true;
            const me = appData.users.find(u => u.id === fbUser.uid);
            if (!me) return handleAccessLost('حسابك غير مفعّل داخل النظام. تواصل مع مدير النظام');
            if (!me.active) return handleAccessLost('هذا الحساب موقوف. تواصل مع مدير النظام');
            sessionUserId = me.id;
            syncLogsListener();
            setTimeout(syncChecksListener, 0);
            setTimeout(syncOrdersListener, 0);
            if (!appEntered) {
                appEntered = true;
                if (pendingLoginLog) {
                    pendingLoginLog = false;
                    me.lastLoginAt = new Date().toISOString();
                    log('تسجيل دخول');
                }
                enterApp();
                return;
            }
            if (sigOf() !== before) render();
        }

                if (!serverChecked) return;

        // Local data saved in this browser by earlier versions (v4 or v3). Used once, on first setup.
        function readLocalSeed() {
            let raw = null;
            try { raw = localStorage.getItem(KEY_V4) || localStorage.getItem(KEY_V3); } catch (err) { return null; }
            if (!raw) return null;
            let src = null;
            try { src = JSON.parse(raw); } catch (err) { return null; }
            if (!src || typeof src !== 'object') return null;
            const companies = Array.isArray(src.companies) ? src.companies : (Array.isArray(src.factories) ? src.factories : null);
            if (!companies) return null;
            const localPdfIds = [];
            companies.forEach(c => (c.lists || []).forEach(l => {
                if (l && l.id && (l.hasLocalPdf || l.hasPdf)) localPdfIds.push(l.id);
            }));
            const seed = normalizeData({ settings: src.settings, roles: src.roles, users: [], companies, logs: [] });
            seed.localPdfIds = localPdfIds;
            return seed;
        }

        // PDF blobs saved in this browser's IndexedDB (v4 local storage). Read-only, used once during setup.
        function readLocalPdf(listId) {
            return new Promise(resolve => {
                if (!window.indexedDB) return resolve(null);
                const req = indexedDB.open('factoryListsPdfs');
                req.onsuccess = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains('pdfs')) { db.close(); return resolve(null); }
                    const get = db.transaction('pdfs').objectStore('pdfs').get(listId);
                    get.onsuccess = () => { db.close(); resolve(get.result || null); };
                    get.onerror = () => { db.close(); resolve(null); };
                };
                req.onerror = () => resolve(null);
            });
        }

        // ============ PDF FILES (stored in Realtime Database: pdfs/{listId} = { total, chunks: [base64, ...] }) ============
        // Each chunk keeps 512 KB of the file (about 700 KB as base64). The limit is 8 MB per PDF (16 chunks).
        // The PDF has its own node, so the list screens never download it.
        const PDF_CHUNK_BYTES = 512 * 1024;
        const PDF_MAX_BYTES = 8 * 1024 * 1024;

        function readBytes(file) {
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(new Uint8Array(fr.result));
                fr.onerror = () => reject(fr.error);
                fr.readAsArrayBuffer(file);
            });
        }

        function bytesToBase64(bytes) {
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(bin);
        }

        function base64ToBytes(b64) {
            const bin = atob(b64);
            const out = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        // ===GS-COMPRESS-BEGIN===
        // ضغط الـ PDF جوه المتصفح بـ Ghostscript (WebAssembly). الملف مش بيتبعت لأي سيرفر.
        // المكتبة بتتحمّل من CDN أول مرة بس. بنجرب Web Worker الأول، ولو اتقفل (زي داخل الـ preview) بنشغّلها على الصفحة نفسها.
        const GS_BASES = [
            'https://cdn.jsdelivr.net/npm/@jspawn/ghostscript-wasm@0.0.2/',
            'https://unpkg.com/@jspawn/ghostscript-wasm@0.0.2/'
        ];
        const PDF_COMPRESS_MAX_BYTES = 100 * 1024 * 1024;   // أكبر ملف نقبله للضغط
        const GS_WORKER_SRC = `
            import createModule from '${GS_BASES[0]}gs.mjs';
            self.onmessage = async (e) => {
                const logs = [];
                try {
                    const mod = await createModule({
                        thisProgram: 'gs',
                        noInitialRun: true,
                        locateFile: (p) => '${GS_BASES[0]}' + p,
                        print: (t) => logs.push(t),
                        printErr: (t) => logs.push(t)
                    });
                    mod.FS.writeFile('/in.pdf', e.data.bytes);
                    try {
                        mod.callMain(['-sDEVICE=pdfwrite', '-dCompatibilityLevel=1.4', '-dPDFSETTINGS=/' + e.data.preset,
                                      '-dNOPAUSE', '-dQUIET', '-dBATCH', '-sOutputFile=/out.pdf', '/in.pdf']);
                    } catch (err) {
                        if (!(err && err.status === 0)) throw err;
                    }
                    if (!mod.FS.readdir('/').includes('out.pdf')) throw new Error(logs.join(' ').slice(-300) || 'no output');
                    const out = mod.FS.readFile('/out.pdf').slice();
                    self.postMessage({ ok: true, bytes: out }, [out.buffer]);
                } catch (err) {
                    self.postMessage({ ok: false, error: String((err && err.message) || err) });
                }
            };
        `;
        let gsWorkerUrl = null;
        let gsLoaded = null;   // { base, createModule } once the library is loaded on the page

        function gsRunArgs(preset) {
            return ['-sDEVICE=pdfwrite', '-dCompatibilityLevel=1.4', '-dPDFSETTINGS=/' + preset,
                    '-dNOPAUSE', '-dQUIET', '-dBATCH', '-sOutputFile=/out.pdf', '/in.pdf'];
        }

        function runGsWorker(bytes, preset) {
            return new Promise((resolve, reject) => {
                let worker;
                const finish = (fn, val) => { clearTimeout(timer); if (worker) worker.terminate(); fn(val); };
                const timer = setTimeout(() => finish(reject, new Error('timeout')), 300000);
                try {
                    if (!gsWorkerUrl) gsWorkerUrl = URL.createObjectURL(new Blob([GS_WORKER_SRC], { type: 'text/javascript' }));
                    worker = new Worker(gsWorkerUrl, { type: 'module' });
                } catch (e) {
                    return finish(reject, Object.assign(new Error('worker unavailable'), { fallback: true }));
                }
                worker.onmessage = (e) => e.data.ok
                    ? finish(resolve, new Uint8Array(e.data.bytes))
                    : finish(reject, new Error(e.data.error));
                worker.onerror = () => finish(reject, Object.assign(new Error('worker failed to start'), { fallback: true }));
                const copy = bytes.slice();
                worker.postMessage({ bytes: copy, preset }, [copy.buffer]);
            });
        }

        async function loadGsOnPage() {
            if (gsLoaded) return gsLoaded;
            const errors = [];
            for (const base of GS_BASES) {
                try {
                    const mod = await import(base + 'gs.mjs');
                    gsLoaded = { base, createModule: mod.default };
                    return gsLoaded;
                } catch (e) { errors.push(base.split('/')[2] + ': ' + ((e && e.message) || e)); }
            }
            throw new Error('library download failed (' + errors.join('; ') + ')');
        }

        async function runGsOnPage(bytes, preset) {
            const gs = await loadGsOnPage();
            await new Promise(r => setTimeout(r, 30));   // let the status text paint first
            const logs = [];
            const mod = await gs.createModule({
                thisProgram: 'gs',
                noInitialRun: true,
                locateFile: (p) => gs.base + p,
                print: (t) => logs.push(t),
                printErr: (t) => logs.push(t)
            });
            mod.FS.writeFile('/in.pdf', bytes);
            try {
                mod.callMain(gsRunArgs(preset));
            } catch (err) {
                if (!(err && err.status === 0)) throw err;
            }
            if (!mod.FS.readdir('/').includes('out.pdf')) throw new Error(logs.join(' ').slice(-300) || 'no output');
            return mod.FS.readFile('/out.pdf').slice();
        }

        async function runGsPreset(bytes, preset) {
            try {
                return await runGsWorker(bytes, preset);
            } catch (err) {
                if (!err.fallback) throw err;
                console.warn('Ghostscript worker unavailable, running on the page:', err.message);
                return await runGsOnPage(bytes, preset);
            }
        }

        // يجرب /ebook (جودة كويسة) الأول، ولو لسه كبير يجرب /screen (أصغر وجودته أقل)
        async function compressPdfFile(file, onStatus) {
            const bytes = await readBytes(file);
            let best = null, bestPreset = '';
            for (const preset of ['ebook', 'screen']) {
                onStatus(preset === 'ebook' ? 'جارٍ ضغط الملف... ممكن ياخد دقيقة' : 'لسه كبير، بنجرب ضغط أقوى...');
                const out = await runGsPreset(bytes, preset);
                if (out.length < 5 || String.fromCharCode(...out.subarray(0, 5)) !== '%PDF-') throw new Error('bad output');
                if (!best || out.length < best.length) { best = out; bestPreset = preset; }
                if (best.length <= PDF_MAX_BYTES) break;
            }
            return { bytes: best, preset: bestPreset };
        }
        // ===GS-COMPRESS-END===

        // replaces the list's PDF in one write: the whole pdfs/{listId} node is set at once
        async function pdfUpload(listId, file) {
            if (file.size > PDF_MAX_BYTES) throw new Error('pdf too large');
            const bytes = await readBytes(file);
            if (!bytes.length) throw new Error('pdf empty');
            const chunks = [];
            for (let i = 0; i < bytes.length; i += PDF_CHUNK_BYTES) {
                chunks.push(bytesToBase64(bytes.subarray(i, i + PDF_CHUNK_BYTES)));
            }
            await rtdb.ref('pdfs/' + listId).set({ total: chunks.length, chunks });
            notifyDirect('أضاف', 'ملف PDF', listNameById(listId));
        }

        async function pdfRemove(listId) {
            try {
                await rtdb.ref('pdfs/' + listId).remove();
                notifyDirect('حذف', 'ملف PDF', listNameById(listId));
            } catch (err) { console.error(err); }
        }

        // downloads the list's PDF (all parts) and joins them into one file
        async function pdfBlob(listId) {
            const v = (await rtdb.ref('pdfs/' + listId).once('value')).val();
            if (!v || !v.chunks) throw new Error('pdf missing');
            const parts = Array.isArray(v.chunks)
                ? v.chunks
                : Object.keys(v.chunks).sort((a, b) => a - b).map(k => v.chunks[k]);
            if (!parts.length || parts.length !== v.total) throw new Error('pdf incomplete');
            return new Blob(parts.map(base64ToBytes), { type: 'application/pdf' });
        }

        // ============ IMAGES (logos) ============
        // Resizes an image to max `max` px and returns a PNG data URL (keeps logos small for storage)
        function processImage(file, max = 256) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const longest = Math.max(img.naturalWidth || max, img.naturalHeight || max);
                        const scale = Math.min(1, max / longest);
                        const w = Math.max(1, Math.round((img.naturalWidth || max) * scale));
                        const h = Math.max(1, Math.round((img.naturalHeight || max) * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = () => reject(new Error('تعذر قراءة الصورة'));
                    img.src = reader.result;
                };
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        async function onImagePicked(input, target) {

                if (target === 'company') pendingLogo = dataUrl;
                if (target === 'system') pendingSysLogo = dataUrl;

            input.value = '';
        }

        function removeLogo(target) {
            if (target === 'company') pendingLogo = null;
            if (target === 'system') pendingSysLogo = null;
            el(target === 'company' ? 'logoPreview' : 'sysLogoPreview').classList.add('hidden');
            el(target === 'company' ? 'logoEmpty' : 'sysLogoEmpty')?.classList.remove('hidden');
        }

        // ============ CHECKS (الشيكات والمستفيدون والتقارير) ============
        // Tabs: الشيكات · الجدول الشهري (+ تنبيهات) · التقارير · المستفيدون · كشف المستفيد.
        // A check is "open" until it is cashed (تم الصرف). A partner limit (الحد) is compared with the open amount.
        // Permissions: checks.view (see, print, export), checks.manage (add, edit, delete, cash, set limits).
        let checksQuery = '';
        let partnersQuery = '';
        let scheduleDays = 7;                       // alert window in days
        let reportFilter = { from: '', to: '', partnerId: '', status: 'all' };
        let checkModalId = null;
        let checksFilter = { status: 'all', payee: '', from: '', to: '', sort: 'due' };
        let checkSelection = new Set();      // ids of checks ticked in the list
        let lastVisibleCheckIds = [];        // ids shown in the last list (for select-all)
        const CHECK_MAX_AMOUNT = 999999999999.99;

        const AR_ONES = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة'];
        const AR_TEENS = ['عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
        const AR_TENS = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
        const AR_HUNDREDS = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];
        const AR_THOUSANDS = { one: 'ألف', two: 'ألفان', plural: 'آلاف', sing: 'ألف', acc: 'ألفاً' };
        const AR_MILLIONS = { one: 'مليون', two: 'مليونان', plural: 'ملايين', sing: 'مليون', acc: 'مليوناً' };
        const AR_BILLIONS = { one: 'مليار', two: 'ملياران', plural: 'مليارات', sing: 'مليار', acc: 'ملياراً' };
        const AR_PIASTERS = { one: 'قرش', two: 'قرشان', plural: 'قروش', sing: 'قرش', acc: 'قرشاً' };

        // 1..999 in words
        function arabicUnder1000(n) {
            const h = Math.floor(n / 100), r = n % 100;
            const parts = [];
            if (h) parts.push(AR_HUNDREDS[h]);
            if (r) {
                if (r < 10) parts.push(AR_ONES[r]);
                else if (r < 20) parts.push(AR_TEENS[r - 10]);
                else if (r % 10 === 0) parts.push(AR_TENS[r / 10]);
                else parts.push(AR_ONES[r % 10] + ' و' + AR_TENS[Math.floor(r / 10)]);
            }
            return parts.join(' و');
        }

        // a count with its unit (ألف / مليون / قرش ...), c = 1..999
        function arabicScaled(c, s) {
            if (c === 1) return s.one;
            if (c === 2) return s.two;
            const r = c % 100;
            const noun = (r >= 3 && r <= 10) ? s.plural : (c < 100 ? s.acc : s.sing);
            return arabicUnder1000(c) + ' ' + noun;
        }

        // whole number in Arabic words, 0 .. 999,999,999,999
        function arabicInteger(n) {
            if (n === 0) return 'صفر';
            const groups = [[1e9, AR_BILLIONS], [1e6, AR_MILLIONS], [1e3, AR_THOUSANDS]];
            const parts = [];
            let rest = n;
            groups.forEach(([size, unit]) => {
                const c = Math.floor(rest / size);
                if (c) parts.push(arabicScaled(c, unit));
                rest %= size;
            });
            if (rest) parts.push(arabicUnder1000(rest));
            return parts.reduce((acc, p) => acc === '' ? p : acc + ' و' + p, '');
        }

        // 1250.5 -> "ألف ومائتان وخمسون جنيه مصري وخمسون قرشاً"
        function amountToArabicWords(amount) {
            const cents = Math.round(Number(amount) * 100);
            if (!(cents >= 0)) return '';
            const pounds = Math.floor(cents / 100), piasters = cents % 100;
            let text = arabicInteger(pounds) + ' جنيه مصري';
            if (piasters) text += ' و' + arabicScaled(piasters, AR_PIASTERS);
            return text;
        }

        function fmtDateAr(iso) {
            const [y, m, d] = String(iso || '').split('-');
            return (y && m && d) ? `${d}/${m}/${y}` : '';
        }

        function fmtDigits(n) {
            return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function updateAmountWords(value) {
            const box = document.getElementById('amountWords');
            if (!box) return;
            const n = Number(value);
            box.textContent = (n > 0 && n <= CHECK_MAX_AMOUNT)
                ? 'بالحروف: فقط ' + amountToArabicWords(n) + ' لا غير'
                : 'اكتب المبلغ عشان يظهر بالحروف';
        }

        const MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        const r2 = n => Math.round(n * 100) / 100;
        const sumAmt = rows => r2(rows.reduce((s, c) => s + (Number(c.amount) || 0), 0));
        const byDue = (a, b) => (a.dueDate || '').localeCompare(b.dueDate || '') || String(a.number).localeCompare(String(b.number));
        const isOpen = c => !c.cashed;
        const isOverdue = c => !c.cashed && !!c.dueDate && c.dueDate < todayISO();

        function monthLabel(ym) {
            const [y, m] = String(ym || '').split('-');
            return (y && m && MONTHS_AR[Number(m) - 1]) ? `${MONTHS_AR[Number(m) - 1]} ${y}` : 'بدون تاريخ';
        }

        function addDaysISO(iso, n) {
            const d = new Date(iso + 'T00:00:00');
            d.setDate(d.getDate() + n);
            return toISODate(d);
        }

        // open amount of one partner (cashed checks do not count); exceptId leaves one check out
        function partnerOpenTotal(partnerId, exceptId = null) {
            return r2(appData.checks
                .filter(c => c.payeeId === partnerId && !c.cashed && c.id !== exceptId)
                .reduce((s, c) => s + (Number(c.amount) || 0), 0));
        }
        function partnerOver(p) {
            return !!p && p.limit > 0 && partnerOpenTotal(p.id) > p.limit + 1e-9;
        }

        function alertsSummary() {
            const today = todayISO(), upto = addDaysISO(today, scheduleDays);
            const open = appData.checks.filter(isOpen);
            return {
                overdue: open.filter(c => c.dueDate && c.dueDate < today).sort(byDue),
                soon: open.filter(c => c.dueDate >= today && c.dueDate <= upto).sort(byDue)
            };
        }

        function alertBanner() {
            const { overdue, soon } = alertsSummary();
            if (!overdue.length && !soon.length) return '';
            return `<div class="rounded-2xl border-2 border-amber-300 bg-amber-50 p-4 flex flex-wrap items-center justify-between gap-2">
                <p class="font-bold text-amber-900"><i class="fa-solid fa-bell"></i> ${overdue.length} شيك متأخر، و${soon.length} شيك قرب ميعاده</p>
                <a href="#/checks/schedule" class="text-sm font-bold text-brand-700 underline">عرض التنبيهات</a>
            </div>`;
        }

        function statusBadge(c) {
            if (c.cashed) return '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 whitespace-nowrap">مصروف</span>';
            if (isOverdue(c)) return '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 whitespace-nowrap">متأخر</span>';
            return '<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-100 text-amber-800 whitespace-nowrap">مفتوح</span>';
        }

        // limit cell: open amount against the limit, with a bar; red when over
        function limitCell(p) {
            if (!(p.limit > 0)) return '<span class="text-sm text-slate-500">بدون حد</span>';
            const open = partnerOpenTotal(p.id);
            const pct = Math.min(100, Math.round(open / p.limit * 100));
            const over = open > p.limit + 1e-9;
            return `<div class="min-w-[160px]">
                <div class="text-xs font-bold ${over ? 'text-rose-700' : 'text-slate-700'}">${fmtMoney(open)} من ${fmtMoney(p.limit)}${over ? ' — تجاوز الحد' : ''}</div>
                <div class="h-2 rounded-full bg-slate-200 mt-1 overflow-hidden"><div class="h-full ${over ? 'bg-rose-600' : (pct >= 80 ? 'bg-amber-500' : 'bg-brand-600')}" style="width:${pct}%"></div></div>
            </div>`;
        }

        function checksTab(route, label, icon, active) {
            return `<button type="button" onclick="navigate('${route}')" class="px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border-2 ${active ? 'bg-brand-600 text-white border-brand-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'}"><i class="fa-solid ${icon}"></i>${label}</button>`;

                        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="search" value="${esc(isP ? partnersQuery : checksQuery)}"
                               oninput="${isP ? 'partnersQuery' : 'checksQuery'} = this.value; updateChecksBody()"
                               placeholder="${isP ? 'ابحث باسم المستفيد' : 'ابحث برقم الشيك أو البنك أو المستفيد'}"

        function updateChecksBody() {

        }

        function checksBodyFor(tab) {
            if (tab === 'partners') return partnersBodyHtml();

        }

        function checkRowActions(c) {
            const manage = can('checks.manage');
            const id = esc(c.id);
            return `<button type="button" onclick="printCheck('${id}')" title="طباعة الشيك" aria-label="طباعة الشيك" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-print"></i></button>`
                + (manage ? `<button type="button" onclick="toggleCashed('${id}')" title="${c.cashed ? 'إلغاء الصرف' : 'تم الصرف'}" aria-label="${c.cashed ? 'إلغاء الصرف' : 'تم الصرف'}" class="${BTN_ICON} ${c.cashed ? 'text-emerald-600 hover:bg-emerald-50' : 'text-slate-500 hover:text-emerald-600 hover:bg-emerald-50'}"><i class="fa-solid ${c.cashed ? 'fa-rotate-left' : 'fa-circle-check'}"></i></button>`
                    + `<button type="button" onclick="openCheckModal('${id}', { copy: true })" title="نسخ كشيك جديد" aria-label="نسخ كشيك جديد" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-copy"></i></button>`
                    + `<button type="button" onclick="openCheckModal('${id}')" title="تعديل" aria-label="تعديل" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-pen-to-square"></i></button>`
                    + `<button type="button" onclick="deleteCheck('${id}')" title="حذف" aria-label="حذف" class="${BTN_ICON} text-slate-400 hover:text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>` : '');

        // one table (desktop) or cards (phone) for any list of checks; select = show checkboxes
        function checksTableHtml(rows, select = false) {
            if (!rows.length) return '<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-6 text-center text-slate-600 font-bold">مفيش شيكات</div>';

                ? `<input type="checkbox" aria-label="تحديد الشيك ${esc(c.number)}" ${checkSelection.has(c.id) ? 'checked' : ''} onchange="toggleCheckSel('${esc(c.id)}', this.checked)" class="w-4 h-4 accent-brand-600">`
                : '';
            const allChecked = rows.every(c => checkSelection.has(c.id));
            return `<div class="hidden md:block bg-white rounded-2xl border-2 border-slate-300 shadow-lg overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 text-slate-700 font-bold border-b-2 border-slate-300">
                        <tr>
                            ${select ? `<th class="py-3 px-4"><input type="checkbox" aria-label="تحديد الكل" ${allChecked ? 'checked' : ''} onchange="toggleAllCheckSel(this.checked)" class="w-4 h-4 accent-brand-600"></th>` : ''}
                            <th class="py-3 px-4 text-start">رقم الشيك</th>
                            <th class="py-3 px-4 text-start">البنك</th>

                            <th class="py-3 px-4 text-start">الحالة</th>
                            <th class="py-3 px-4 text-center">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                        ${rows.map(c => `<tr class="hover:bg-slate-50 ${checkSelection.has(c.id) ? 'bg-brand-50/60' : ''}">
                            ${select ? `<td class="py-3 px-4">${box(c)}</td>` : ''}
                            <td class="py-3 px-4 font-mono font-bold">${esc(c.number)}</td>
                            <td class="py-3 px-4 font-semibold">${esc(c.bank)}</td>
                            <td class="py-3 px-4 font-semibold">${esc(c.payeeName)}</td>
                            <td class="py-3 px-4 font-bold whitespace-nowrap">${fmtMoney(c.amount)}</td>
                            <td class="py-3 px-4 whitespace-nowrap">${esc(fmtDateAr(c.dueDate))}</td>
                            <td class="py-3 px-4">${statusBadge(c)}</td>
                            <td class="py-3 px-4"><div class="flex justify-center gap-1">${checkRowActions(c)}</div></td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
            <div class="md:hidden space-y-3">
                ${rows.map(c => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 ${checkSelection.has(c.id) ? 'ring-2 ring-brand-400' : ''}">

                        <div class="flex items-start gap-2 min-w-0">
                            ${box(c)}
                            <div class="min-w-0">
                                <p class="font-mono font-bold text-slate-800">${esc(c.number)}</p>
                                <p class="font-semibold text-slate-700 truncate">${esc(c.bank)}</p>
                            </div>
                        </div>
                        <div class="text-end">
                            <p class="font-bold text-brand-700 whitespace-nowrap">${fmtMoney(c.amount)}</p>
                            ${statusBadge(c)}

                    </div>
                    <p class="text-sm text-slate-700 mt-2"><span class="font-bold">المستفيد:</span> ${esc(c.payeeName)}</p>
                    <p class="text-sm text-slate-700"><span class="font-bold">تاريخ الاستحقاق:</span> ${esc(fmtDateAr(c.dueDate))}</p>
                    <div class="flex justify-end gap-1 mt-2">${checkRowActions(c)}</div>
                </div>`).join('')}
            </div>`;
        }

        // ---- list filters, sorting and summary (الشيكات tab) ----
        const CHECKS_FILTER_DEFAULT = { status: 'all', payee: '', from: '', to: '', sort: 'due' };

        function filteredChecksList() {
            const q = checksQuery.trim().toLowerCase(), f = checksFilter;
            const rows = appData.checks.filter(c => {
                if (q && !`${c.number} ${c.bank} ${c.payeeName}`.toLowerCase().includes(q)) return false;
                if (f.status === 'open' && c.cashed) return false;
                if (f.status === 'cashed' && !c.cashed) return false;
                if (f.status === 'overdue' && !isOverdue(c)) return false;
                if (f.payee && c.payeeId !== f.payee) return false;
                if (f.from && c.dueDate < f.from) return false;
                if (f.to && c.dueDate > f.to) return false;
                return true;
            });
            const amt = c => Number(c.amount) || 0;
            const sorters = {
                due: byDue,
                due_desc: (a, b) => -byDue(a, b),
                amount_desc: (a, b) => amt(b) - amt(a) || byDue(a, b),
                amount_asc: (a, b) => amt(a) - amt(b) || byDue(a, b),
                payee: (a, b) => String(a.payeeName).localeCompare(String(b.payeeName), 'ar') || byDue(a, b)
            };
            return rows.sort(sorters[f.sort] || byDue);
        }

        function checksFilterDescription() {
            const f = checksFilter;
            const status = { all: 'الكل', open: 'مفتوح', overdue: 'متأخر', cashed: 'مصروف' };
            const parts = ['الحالة: ' + (status[f.status] || 'الكل')];
            if (f.from || f.to) parts.push(`الاستحقاق من ${f.from || 'البداية'} إلى ${f.to || 'النهاية'}`);
            if (f.payee) { const p = appData.partners.find(x => x.id === f.payee); if (p) parts.push('المستفيد: ' + p.name); }
            return parts.join(' — ');
        }

        function checksFilterBar() {
            const f = checksFilter;
            const payees = [...appData.partners].sort((a, b) => a.name.localeCompare(b.name, 'ar'))
                .map(p => `<option value="${esc(p.id)}" ${f.payee === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
            const opt = (cur, v, l) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`;
            return `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow-lg p-4 space-y-3">
                <div class="grid grid-cols-2 lg:grid-cols-5 gap-3">
                    ${field('الحالة', `<select onchange="setChecksFilter('status', this.value)" class="${INPUT_CLS}">${opt(f.status, 'all', 'الكل')}${opt(f.status, 'open', 'مفتوح')}${opt(f.status, 'overdue', 'متأخر')}${opt(f.status, 'cashed', 'مصروف')}</select>`)}
                    ${field('المستفيد', `<select onchange="setChecksFilter('payee', this.value)" class="${INPUT_CLS}"><option value="">كل المستفيدين</option>${payees}</select>`)}
                    ${field('استحقاق من', `<input type="date" value="${esc(f.from)}" onchange="setChecksFilter('from', this.value)" class="${INPUT_CLS}">`)}
                    ${field('استحقاق إلى', `<input type="date" value="${esc(f.to)}" onchange="setChecksFilter('to', this.value)" class="${INPUT_CLS}">`)}
                    ${field('الترتيب', `<select onchange="setChecksFilter('sort', this.value)" class="${INPUT_CLS}">${opt(f.sort, 'due', 'الأقرب استحقاقاً')}${opt(f.sort, 'due_desc', 'الأبعد استحقاقاً')}${opt(f.sort, 'amount_desc', 'المبلغ الأكبر')}${opt(f.sort, 'amount_asc', 'المبلغ الأصغر')}${opt(f.sort, 'payee', 'اسم المستفيد')}</select>`)}
                </div>
                <div class="flex flex-wrap gap-2 justify-end">
                    ${btn('clearChecksFilter()', 'مسح الفلاتر', 'fa-filter-circle-xmark', BTN_SECONDARY)}
                    ${btn('printChecksList()', 'طباعة القائمة', 'fa-print', BTN_SECONDARY)}
                    ${btn('exportChecksList()', 'تصدير Excel', 'fa-file-excel', BTN_SECONDARY)}
                </div>
            </div>`;
        }

        function checksSummaryCards(rows) {
            const today = todayISO(), upto = addDaysISO(today, 7);
            const open = rows.filter(isOpen), overdue = rows.filter(isOverdue);
            const soon = open.filter(c => c.dueDate >= today && c.dueDate <= upto);
            const cashedRows = rows.filter(c => !isOpen(c));
            const card = (label, value, cls) => `<div class="bg-white rounded-2xl border-2 border-slate-300 shadow p-3">
                <p class="text-xs font-bold text-slate-600">${label}</p><p class="text-base font-bold ${cls} whitespace-nowrap">${value}</p></div>`;
            return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                ${card('المفتوح', `${open.length} شيك — ${fmtMoney(sumAmt(open))}`, 'text-amber-700')}
                ${card('متأخر', `${overdue.length} شيك — ${fmtMoney(sumAmt(overdue))}`, 'text-rose-700')}
                ${card('يستحق خلال 7 أيام', `${soon.length} شيك — ${fmtMoney(sumAmt(soon))}`, 'text-brand-700')}
                ${card('المصروف', `${cashedRows.length} شيك — ${fmtMoney(sumAmt(cashedRows))}`, 'text-emerald-700')}
            </div>`;

        function checksBulkBar() {

        // ---- periodic checks report (التقرير الدوري): settings are kept on this browser ----
        const CHECK_REPORT_KEY = 'factoryChecksReportSchedule';
        const WEEKDAYS_AR = [['السبت', 6], ['الأحد', 0], ['الاثنين', 1], ['الثلاثاء', 2], ['الأربعاء', 3], ['الخميس', 4], ['الجمعة', 5]];

        function loadCheckReport() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(CHECK_REPORT_KEY) || '{}') || {}; } catch (e) { saved = {}; }
            return Object.assign({ enabled: false, frequency: 'weekly', weekdays: [4], dayOfMonth: 1, everyDays: 14, windowDays: 7, includeOverdue: true, nextRun: '', dismissedOn: '' }, saved);
        }

        function saveCheckReport(s) {
            try { localStorage.setItem(CHECK_REPORT_KEY, JSON.stringify(s)); }
            catch (e) { toast('تعذر حفظ إعدادات التقرير على المتصفح', 'error'); }
        }

        // the given day of a month (day clamped to 1..28 so every month has it)
        function monthlyDate(iso, dom) {
            const [y, m] = iso.split('-').map(Number);
            return toISODate(new Date(y, m - 1, Math.min(Math.max(Number(dom) || 1, 1), 28)));
        }

        // first run on or after fromISO
        function checkReportFirstRun(s, fromISO) {
            if (s.frequency === 'weekly') {
                const days = (s.weekdays && s.weekdays.length) ? s.weekdays : [4];
                let d = fromISO;
                for (let i = 0; i < 7; i++) {
                    if (days.includes(new Date(d + 'T00:00:00').getDay())) return d;
                    d = addDaysISO(d, 1);
                }
                return fromISO;
            }
            if (s.frequency === 'monthly') {
                const cand = monthlyDate(fromISO, s.dayOfMonth);
                if (cand >= fromISO) return cand;
                const [y, m] = fromISO.split('-').map(Number);
                return monthlyDate(toISODate(new Date(y, m, 1)), s.dayOfMonth);
            }
            return fromISO;
        }

        // the run that comes after runISO
        function checkReportAdvance(s, runISO) {
            if (s.frequency === 'weekly') return checkReportFirstRun(s, addDaysISO(runISO, 1));
            if (s.frequency === 'monthly') {
                const [y, m] = runISO.split('-').map(Number);
                return monthlyDate(toISODate(new Date(y, m, 1)), s.dayOfMonth);
            }
            return addDaysISO(runISO, Math.max(1, Number(s.everyDays) || 14));
        }

        // after a report is marked done: the next run strictly after today (missed runs are skipped)
        function checkReportSkipTo(s, fromISO) {
            let next = checkReportAdvance(s, fromISO), guard = 0;
            while (next <= todayISO() && guard++ < 1000) next = checkReportAdvance(s, next);
            return next;
        }

        function checkReportDue(s) {
            return !!s.enabled && !!s.nextRun && todayISO() >= s.nextRun;
        }

        function periodicReportRows(s) {
            const today = todayISO(), upto = addDaysISO(today, Number(s.windowDays) || 7);
            return appData.checks
                .filter(c => !c.cashed && c.dueDate && c.dueDate <= upto
                    && (c.dueDate >= today || (s.includeOverdue && c.dueDate < today)))
                .sort(byDue);
        }

        function periodicReportMeta(s) {
            return `الشيكات خلال ${s.windowDays} يوم${s.includeOverdue ? ' + المتأخرة' : ''}`;
        }

        // banner shown on every page when a report is due (only for users who can see checks)

                    ${field('تاريخ أول تقرير', `<input type="date" id="prStart" value="${esc(s.nextRun || todayISO())}" class="${INPUT_CLS}">`)}
