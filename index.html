        // ============ الشحن والنقل ============
        // جدول 15 عربية × مواعيد. كل خانة فيها شحنة فاتورة واحدة: shipping/<التاريخ>/<الخانة>.
        // الخانة بتحفظ نسخة من بيانات الفاتورة، والعرض بياخد الاسم والرقم من طلبيات العملاء لو متاحة.
        // المواعيد في shippingConfig/slots/<id> (الوقت بنظام ٢٤ ساعة داخلياً)، وإعدادات العرض في shippingConfig/display.
        const SHIP_CARS = 15;
        const SHIP_STAGES = [
            ['waiting', 'في الانتظار', 'slate'],
            ['loaded', 'تم التحميل', 'amber'],
            ['transit', 'في الطريق', 'sky'],
            ['arrived', 'وصلت', 'violet'],
            ['delivered', 'تم التوصيل', 'emerald']
        ];
        const SHIP_CLS = {
            slate: 'bg-slate-100 border-slate-300 text-slate-800',
            amber: 'bg-amber-100 border-amber-300 text-amber-900',
            sky: 'bg-sky-100 border-sky-300 text-sky-900',
            violet: 'bg-violet-100 border-violet-300 text-violet-900',
            emerald: 'bg-emerald-100 border-emerald-300 text-emerald-900'
        };
        const SHIP_DEFAULT_SLOTS = ['08:00', '10:00', '12:00', '14:00', '16:00'];
        const SHIP_CARGO_SUGGEST = ['كراتين', 'أدوات صحية', 'أبواب', 'سيراميك', 'أخرى'];
        const SHIP_MIN_STEPS = [1, 5, 10, 15];
        const SHIP_DEFAULT_CFG = { clock: '12', minuteStep: 5, showPhone: true, showCargo: true, showRoad: true };
        let shipCfg = { ...SHIP_DEFAULT_CFG };
        let shipDate = '';            // اليوم اللي على الجدول ('' = النهارده)
        let shipCells = {};           // خانات اليوم المعروض
        let shipSlots = [];           // المواعيد بالترتيب
        let shipSubs = [];            // دوال إلغاء الاشتراك
        let shipSubKey = '';
        let shipCellsLoaded = false;
        let shipAnimSeen = new Set(); // الشحنات اللي اتعرض أنيميشن توصيلها (يوم|خانة)
        let shipAnimQueue = [];
        let shipSeeding = false;
        let shipReturn = null;        // فاتورة اتفتحت من خانة شحن: بنرجع للخانة بعد الحفظ
        let shipFxBusy = false, shipFxToken = 0;

        const shipDay = () => shipDate || todayISO();
        // the server refused the write: say why, and keep the details in the console
        function shipSaveFailed(err, what) {
            console.error('shipping ' + what + ' refused', err);
            const denied = err && (err.code === 'permission-denied' || /permission/i.test(String(err.message || '')));
            toast(denied
                ? 'السيرفر رفض الحفظ: الصلاحية مش متسجلة في السيرفر أو قواعد الحماية مش محدّثة'
                : 'ماتسجلتش ' + what + '، جرّب تاني', 'error', null, 7000);
        }
        const shipStage = k => SHIP_STAGES.find(s => s[0] === k) || SHIP_STAGES[0];
        const shipCellKey = (car, slotId) => 'c' + String(car).padStart(2, '0') + '_' + slotId;
        const shipCarOf = key => Number(key.slice(1, 3));
        const shipPath = (day, key) => 'shipping/' + day + '/' + key;
        const shipCanManage = () => can('shipping.manage');

        // ---- الوقت ----
        function shipHm(t) {
            const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ''));
            return m ? { h: Number(m[1]), m: Number(m[2]) } : { h: 8, m: 0 };
        }
        function shipFmtTime(t) {
            const { h, m } = shipHm(t);
            const mm = String(m).padStart(2, '0');
            if (shipCfg.clock === '24') return `${String(h).padStart(2, '0')}:${mm}`;
            return `${h % 12 || 12}:${mm} ${h < 12 ? 'صباحاً' : 'مساءً'}`;
        }
        function shipSelect(name, options, value, required = true) {
            return `<select name="${name}" ${required ? 'required' : ''} class="${INPUT_CLS}">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(value ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
        }

        // بيانات الخانة مع أحدث بيانات الفاتورة (لو الفاتورة متاحة عندك)
        function shipView(cell) {
            if (!cell) return null;
            const c = appData.custOrders.find(x => x.id === cell.custId);
            if (!c) return cell;
            return {
                ...cell,
                customer: c.customer || cell.customer || '',
                phone: c.customerPhone !== undefined ? (c.customerPhone || '') : (cell.phone || ''),
                no: custNoLabel(c)
            };
        }

        function shipUnsubAll() {
            shipSubs.forEach(u => { try { u(); } catch (e) { /* already closed */ } });
            shipSubs = [];
        }

        function shipEnsureSubs() {
            if (!fbDb || !fbUser || !can('shipping.view')) return;
            const day = shipDay();
            if (shipSubKey === day && shipSubs.length) return;
            shipUnsubAll();
            shipSubKey = day;
            shipCells = {};
            shipCellsLoaded = false;
            shipAnimSeen = new Set();
            shipAnimQueue = [];
            const onErr = err => console.error('shipping listener', err);
            shipSubs.push(fbDb.doc('shipping/' + day).onSnapshot(snap => {
                const v = snap.exists ? (snap.data() || {}) : {};
                shipCells = v;
                const doneKeys = Object.keys(v).filter(k => v[k] && v[k].stage === 'delivered');
                // the first load only remembers what is already delivered; later changes start the animation
                if (!shipCellsLoaded) doneKeys.forEach(k => shipAnimSeen.add(day + '|' + k));
                else doneKeys.forEach(k => {
                    const id = day + '|' + k;
                    if (shipAnimSeen.has(id)) return;
                    shipAnimSeen.add(id);
                    if (parseRoute().param === 'screen') {
                        const vv = shipView(v[k]);
                        shipAnimQueue.push({ no: vv.no, customer: vv.customer || '' });
                    }
                });
                [...shipAnimSeen].filter(id => id.startsWith(day + '|') && !doneKeys.includes(id.slice(day.length + 1)))
                    .forEach(id => shipAnimSeen.delete(id));
                shipCellsLoaded = true;
                shipRunAnim();
                shipLiveUpdate();
            }, onErr));
            shipSubs.push(fbDb.doc('shippingConfig/slots').onSnapshot(snap => {
                const v = snap.exists ? (snap.data() || {}) : {};
                shipSlots = Object.keys(v)
                    .map(id => ({ id, time: String(v[id].time || ''), order: Number(v[id].order) || 0, label: String(v[id].label || '') }))
                    .sort((x, y) => x.order - y.order || x.time.localeCompare(y.time));
                if (!shipSlots.length && shipCanManage() && !shipSeeding) shipSeedSlots();
                shipLiveUpdate();
            }, onErr));
            shipSubs.push(fbDb.doc('shippingConfig/cars').onSnapshot(snap => {
                shipCars = snap.exists ? (snap.data() || {}) : {};
                shipLiveUpdate();
            }, onErr));
            shipSubs.push(fbDb.doc('shippingConfig/display').onSnapshot(snap => {
                const v = snap.exists ? (snap.data() || {}) : {};
                shipCfg = {
                    clock: v.clock === '24' ? '24' : '12',
                    minuteStep: SHIP_MIN_STEPS.includes(Number(v.minuteStep)) ? Number(v.minuteStep) : 5,
                    showPhone: v.showPhone !== false,
                    showCargo: v.showCargo !== false,
                    showRoad: v.showRoad !== false
                };
                shipLiveUpdate();
            }, onErr));
        }

        // first use: the five default times (fixed ids, so two admins writing at once end up the same)
        function shipSeedSlots() {
            shipSeeding = true;
            const b = fbDb.batch();
            SHIP_DEFAULT_SLOTS.forEach((t, i) => b.set(fbDb.doc('shippingConfig/slots/s' + (i + 1)), { time: t, order: i + 1 }));
            b.commit().then(() => { shipSeeding = false; }, err => { shipSeeding = false; shipSaveFailed(err, 'المواعيد الافتراضية'); });
        }

        function shipLiveUpdate() {
            if (parseRoute().name === 'shipping') render();
        }

        function shipSetDay(v) {
            shipDate = /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : '';
            render();
        }
        function shipShiftDay(n) { shipSetDay(addDaysISO(shipDay(), n)); }

                body.ship-screen-on.ship-nav-open .ship-nav-btn .ship-i-open { display:none; }

        function shipCellHtml(key, cell, edit, big) {
            const click = edit ? `onclick="openShipCell('${key}')"` : '';
            if (!cell) {
                return edit
                    ? `<button type="button" ${click} class="ship-cell ship-cell-empty border-dashed border-slate-300 text-slate-400 hover:border-brand-400 hover:text-brand-600 transition"><i class="fa-solid fa-plus"></i></button>`
                    : `<div class="ship-cell-empty"></div>`;
            }
            const v = shipView(cell);
            const [, label, col] = shipStage(v.stage);
            const cargo = [v.cargoType, v.cargoText].filter(Boolean).join(' — ');
            const showPhone = !big || shipCfg.showPhone;
            const showCargo = !big || shipCfg.showCargo;
            return `<button type="button" ${click} class="ship-cell ${big ? 'ship-cell-tv' : ''} ${SHIP_CLS[col]} ${v.stage === 'delivered' ? 'ship-done' : ''} ${edit ? 'hover:shadow-md' : 'cursor-default'}">
                <span class="ship-cell-stage">${label}</span>
                <span class="ship-cell-name">${esc(v.customer || '')}</span>
                <span class="ship-cell-inv">فاتورة رقم ${esc(v.no || '')}</span>
                ${showPhone && v.phone ? `<span class="ship-cell-phone" dir="ltr">${esc(v.phone)}</span>` : ''}
                ${showCargo && cargo ? `<span class="ship-cell-cargo">${esc(cargo)}</span>` : ''}
            </button>`;
        }

        // the board table (scrolls sideways on small screens)
        function shipGridHtml(edit) {
            const cars = [...Array(SHIP_CARS).keys()].map(i => i + 1);
            const head = `<tr><th class="sticky right-0 z-10 bg-slate-100 p-2 text-xs font-bold text-slate-700 border border-slate-200 min-w-[9rem]">الموعد</th>${cars.map(c => `<th class="bg-slate-100 p-2 text-xs font-bold text-slate-700 border border-slate-200 min-w-[10rem]">${shipCarHeadHtml(c, false)}</th>`).join('')}</tr>`;
            const rows = shipSlots.map((sl, i) => `<tr>
                    <th class="sticky right-0 z-10 bg-white p-2 border border-slate-200 align-middle">
                        <div class="font-mono font-black text-lg" dir="ltr">${esc(shipFmtTime(sl.time))}</div>
                        ${sl.label ? `<div class="text-xs font-bold text-slate-600">${esc(sl.label)}</div>` : ''}
                        ${edit ? `<div class="mt-1 flex flex-wrap items-center gap-1">
                            <button type="button" onclick="openShipSlot('${sl.id}')" class="text-xs font-bold text-brand-700 underline">تعديل</button>
                            ${i > 0 ? `<button type="button" onclick="shipMoveSlot('${sl.id}', -1)" class="text-xs text-slate-500 hover:text-brand-600" aria-label="فوق"><i class="fa-solid fa-arrow-up"></i></button>` : ''}
                            ${i < shipSlots.length - 1 ? `<button type="button" onclick="shipMoveSlot('${sl.id}', 1)" class="text-xs text-slate-500 hover:text-brand-600" aria-label="تحت"><i class="fa-solid fa-arrow-down"></i></button>` : ''}
                        </div>` : ''}
                    </th>
                    ${cars.map(c => { const key = shipCellKey(c, sl.id); return `<td class="p-1.5 border border-slate-200 align-top">${shipCellHtml(key, shipCells[key], edit, false)}</td>`; }).join('')}
                </tr>`).join('');
            const empty = shipSlots.length ? '' : `<tr><td colspan="${SHIP_CARS + 1}" class="p-6 text-center text-slate-500">مفيش مواعيد لسه.${edit ? ' اضغط "إضافة موعد" عشان تبدأ.' : ''}</td></tr>`;
            return `<div class="overflow-x-auto rounded-2xl border-2 border-slate-300 bg-white"><table class="border-collapse w-max">
                <thead>${head}</thead><tbody>${rows}${empty}</tbody></table></div>`;
        }

        // the display table: all 15 cars and all times fit on the screen (no scrolling)
        function shipTvHtml() {
            const cars = [...Array(SHIP_CARS).keys()].map(i => i + 1);
            const n = Math.max(shipSlots.length, 1);
            const head = `<div class="ship-tv-corner">الموعد</div>${cars.map(c => `<div class="ship-tv-head">${shipCarHeadHtml(c, true)}</div>`).join('')}`;
            const body = shipSlots.map(sl => `<div class="ship-tv-time" dir="ltr"><span>${esc(shipFmtTime(sl.time))}</span>${sl.label ? `<small>${esc(sl.label)}</small>` : ''}</div>${cars.map(c => {
                const key = shipCellKey(c, sl.id);
                return shipCellHtml(key, shipCells[key], false, true);
            }).join('')}`).join('');
            const empty = shipSlots.length ? '' : '<p class="p-10 text-3xl text-slate-400">مفيش مواعيد لسه</p>';
            return `<div class="ship-tv" style="grid-template-rows: 8vh repeat(${n}, minmax(0,1fr))">${head}${body}</div>${empty}`;
        }

        // ---- أسماء العربيات: رقم اللوحة أو الكود، واسم السواق ----
        let shipCars = {};   // shippingConfig/cars: { c01: { plate, driver }, ... }
        function shipCarInfo(c) {
            const v = shipCars['c' + String(c).padStart(2, '0')] || {};
            return { plate: String(v.plate || ''), driver: String(v.driver || '') };
        }
        function shipCarTitle(c) { return shipCarInfo(c).plate || ('عربية ' + c); }
        // header of a car column: the board (light) or the display (dark)
        function shipCarHeadHtml(c, tv) {
            const { plate, driver } = shipCarInfo(c);
            if (tv) return `<b>${esc(plate || 'عربية ' + c)}</b>${driver ? `<small>${esc(driver)}</small>` : ''}`;
            return `<div>${esc(plate || 'عربية ' + c)}</div>${plate ? `<div class="text-[11px] font-normal text-slate-500">عربية ${c}</div>` : ''}${driver ? `<div class="text-[11px] font-normal text-slate-600">${esc(driver)}</div>` : ''}`;
        }

        // the truck with its code painted on the side
        function shipTruckSvg(plate) {
            return `<svg viewBox="0 0 120 60" aria-hidden="true"><rect x="4" y="12" width="72" height="34" rx="5" fill="#10b981"/><path d="M80 22h20l16 16v8H80z" fill="#34d399"/><rect x="88" y="26" width="18" height="10" rx="2" fill="#0f172a" opacity=".5"/>${plate ? `<text x="40" y="34" text-anchor="middle" font-size="10" font-weight="900" fill="#052e1f" textLength="60" lengthAdjust="spacingAndGlyphs">${esc(plate)}</text>` : ''}<circle class="ship-wheel" cx="26" cy="50" r="8" fill="#0f172a" stroke="#e2e8f0" stroke-width="3"/><circle class="ship-wheel" cx="94" cy="50" r="8" fill="#0f172a" stroke="#e2e8f0" stroke-width="3"/></svg>`;
        }

        // the city behind the road: buildings with lit windows and street lamps (colours come from the period)
        function shipCityBackdrop() {
            let seed = 11;
            const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
            let x = 0, out = '';
            while (x < 1600) {
                const w = 70 + Math.floor(rnd() * 80), h = 35 + Math.floor(rnd() * 50), top = 100 - h;
                out += `<rect x="${x}" y="${top}" width="${w - 8}" height="${h}" style="fill:var(--bld)"/>`;
                for (let wy = top + 7; wy < 92; wy += 11) {
                    for (let wx = x + 7; wx < x + w - 14; wx += 12) {
                        if (rnd() > 0.4) out += `<rect x="${wx}" y="${wy}" width="5" height="6" style="fill:var(--win)"/>`;
                    }
                }
                x += w;
            }
            for (let lx = 30; lx < 1600; lx += 200) {
                out += `<rect x="${lx}" y="50" width="2.4" height="46" style="fill:var(--lamp)"/><rect x="${lx - 4}" y="46" width="10" height="3" rx="1.5" style="fill:var(--lamp)"/>`;
            }
            return out;
        }

        // the road: a city street. Moving trucks = cars on the way; parked trucks = cars that have arrived.
        function shipRoadHtml() {
            const carsAt = st => Object.keys(shipCells).filter(k => shipCells[k] && shipCells[k].stage === st)
                .map(k => shipCarOf(k)).filter((v, i, a) => a.indexOf(v) === i).sort((x, y) => x - y);
            const moving = carsAt('transit').slice(0, 6);
            const parked = carsAt('arrived').slice(0, 4);
            const city = shipCityBackdrop();
            const ambient = [0, 1].map(i => `<div class="ship-truck ship-truck-amb" style="animation-delay:${-i * 9}s;animation-duration:24s">${shipTruckSvg('')}</div>`).join('');
            const trucks = moving.map((c, i) => `<div class="ship-truck" style="animation-delay:${-i * 4.5}s"><span class="ship-truck-tag">${esc(shipCarTitle(c))}</span>${shipTruckSvg(shipCarInfo(c).plate)}</div>`).join('');
            const park = parked.map((c, i) => `<div class="ship-park" style="right:${1 + i * 7.6}vw"><span class="ship-park-badge"><i class="fa-solid fa-check"></i> وصلت</span>${shipTruckSvg(shipCarInfo(c).plate)}</div>`).join('');
            return `<div class="ship-road" aria-hidden="true">
                <div class="ship-city"><svg viewBox="0 0 1600 100" preserveAspectRatio="none">${city}</svg><svg viewBox="0 0 1600 100" preserveAspectRatio="none">${city}</svg></div>
                <div class="ship-walk"></div>
                <div class="ship-asph"></div>
                <div class="ship-road-line"></div>
                ${ambient}${trucks}${park}
                <div class="ship-road-count"><i class="fa-solid fa-truck-fast"></i> في الطريق: ${moving.length}</div>
            </div>`;
        }

        function viewShipping() {
            shipEnsureSubs();
            shipInjectStyles();
            const day = shipDay();
            const edit = shipCanManage();
            const actions = `<div class="flex flex-wrap items-center gap-2 mb-4">
                    <input type="date" value="${esc(day)}" onchange="shipSetDay(this.value)" class="${INPUT_CLS} max-w-[11rem]">
                    ${btn('shipShiftDay(-1)', 'السابق', 'fa-chevron-right', BTN_SECONDARY)}
                    ${btn('shipShiftDay(1)', 'التالي', 'fa-chevron-left', BTN_SECONDARY)}
                    ${btn('shipSetDay(todayISO())', 'النهارده', 'fa-calendar-day', BTN_SECONDARY)}
                    ${edit ? btn('openShipSlot()', 'إضافة موعد', 'fa-plus', BTN_PRIMARY) : ''}
                    ${edit ? btn('openShipDisplaySettings()', 'إعدادات العرض', 'fa-sliders', BTN_SECONDARY) : ''}
                    ${edit ? btn('openShipCars()', 'أسماء العربيات', 'fa-id-card', BTN_SECONDARY) : ''}
                    ${btn(`window.open(location.pathname + '#/shipping/screen', '_blank')`, 'شاشة العرض للعملاء', 'fa-tv', BTN_SECONDARY)}
                </div>`;
            const legend = `<div class="flex flex-wrap gap-2 mb-4">${SHIP_STAGES.map(([, l, c]) => `<span class="text-xs font-bold px-2.5 py-1 rounded-lg border ${SHIP_CLS[c]}">${l}</span>`).join('')}</div>`;
            return {
                title: 'الشحن والنقل',
                actions: '',
                html: `<div>${actions}${legend}${shipGridHtml(edit)}</div>`
            };
        }

        // the sun or the moon in the top-right corner: it rises low, climbs at noon and sets low, on the same clock as the home screen
        function shipSkyPos(date = new Date()) {
            const p = homeSkyPos(date);
            const lift = Math.max(0, Math.min(1, (34 - p.top) / 26));
            return { moon: p.icon === 'fa-moon', top: (1.5 + (1 - lift) * 10).toFixed(1) };
        }

        // شاشة العرض: صفحة كاملة للتليفزيون. القايمة الجانبية مخفية، وزرار السهم بيظهرها ويخفيها.

        // Fit: the cells use the largest text size that still shows every line (no cut text).
        let shipResizeBound = false;
        function shipFitSoon() { requestAnimationFrame(shipFitTv); }
        function shipFitTv() {
            const screen = document.getElementById('shipScreen');
            if (!screen) return;
            const over = () => [...screen.querySelectorAll('.ship-cell-tv')].some(c => c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1);
            let k = 1;
            screen.style.setProperty('--tvk', k);
            for (let i = 0; i < 14 && over(); i++) {
                k = Math.round((k - 0.05) * 100) / 100;
                screen.style.setProperty('--tvk', k);

        // The arrival card lives in its own layer on the page body, so a re-render of the content
        // does not remove it. It goes away when its animation ends (it waits while the tab is hidden).
        function shipRunAnim() {
            if (shipFxBusy || !shipAnimQueue.length) return;
            if (parseRoute().param !== 'screen') { shipAnimQueue = []; return; }
            let fx = document.getElementById('shipFx');
            if (!fx) {
                fx = document.createElement('div');
                fx.id = 'shipFx';
                fx.className = 'fixed inset-0 z-[90] pointer-events-none flex items-center justify-center';
                document.body.appendChild(fx);
            }
            const next = shipAnimQueue.shift();
            const token = ++shipFxToken;
            shipFxBusy = true;
            const box = document.createElement('div');
            box.className = 'ship-anim text-center bg-emerald-600 text-white rounded-3xl px-10 py-8 shadow-2xl';
            box.innerHTML = `<div class="ship-ring mx-auto w-20 h-20 rounded-full bg-white text-emerald-600 flex items-center justify-center text-4xl mb-4"><i class="fa-solid fa-check"></i></div>
                <p class="text-3xl font-black">تم توصيل فاتورة رقم ${esc(next.no)}</p>
                <p class="text-xl mt-2 opacity-90">${esc(next.customer)}</p>`;
            fx.appendChild(box);
            const finish = () => {
                if (token !== shipFxToken) return;   // the screen was left meanwhile
                box.remove();
                shipFxBusy = false;
                shipRunAnim();
            };
            box.addEventListener('animationend', e => { if (e.target === box) finish(); });
            // fallback when animations are off (reduced motion)
            setTimeout(() => { if (!document.hidden) finish(); }, 12000);
        }

            shipFxToken++;

        function saveShipCell(key, fd) {
            if (!shipCanManage()) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return false; }
            const inv = appData.custOrders.find(c => c.id === String(fd.get('inv') || ''));
            const stage = String(fd.get('stage') || '');
            if (!inv) { toast('اختر الفاتورة من القايمة', 'error'); return false; }
            if (!SHIP_STAGES.some(s => s[0] === stage)) { toast('اختر المرحلة', 'error'); return false; }
            const day = shipDay();
            const cell = {
                custId: inv.id, no: custNoLabel(inv), customer: inv.customer || '', phone: inv.customerPhone || '',
                stage,
                cargoType: String(fd.get('cargoType') || '').trim().slice(0, 60),
                cargoText: String(fd.get('cargoText') || '').trim().slice(0, 200),
                note: String(fd.get('note') || '').trim().slice(0, 500),
                at: new Date().toISOString(), by: orderUserName()
            };
            const seq = modalSeq;
            const b = fbDb.batch();
            b.set(fbDb.doc(shipPath(day, key)), cell);
            // the same invoice sits on one cell only: it moves from its old cell
            Object.keys(shipCells).forEach(k => {
                if (k !== key && shipCells[k] && shipCells[k].custId === inv.id) b.delete(fbDb.doc(shipPath(day, k)));
            });
            b.commit().then(() => {
                log('تعديل الشحن والنقل', `عربية ${shipCarOf(key)} — ${cell.no} — ${shipStage(stage)[1]}`);
                if (stage === 'delivered') shipMarkDelivered(inv);
                toast('تم حفظ الشحنة', 'success');
                if (seq === modalSeq) closeModal();
            }, err => shipSaveFailed(err, 'الشحنة'));
            return false;   // the modal closes only after the server confirms
        }

            if (!canCust('manage')) return;

            const step = shipCfg.minuteStep || 5;
            const minSet = new Set([...Array(60).keys()].filter(x => x % step === 0));
            minSet.add(m);
            const minOpts = [...minSet].sort((x, y) => x - y).map(x => [String(x), String(x).padStart(2, '0')]);
            const hourOpts = [...Array(12).keys()].map(i => [String(i + 1), String(i + 1)]);
            openModal({
                title: sl ? 'تعديل الموعد' : 'موعد جديد',
                size: 'md',
                submitText: sl ? 'حفظ' : 'إضافة',

                body: `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    ${field('اسم الموعد (اختياري)', `<input name="label" maxlength="60" value="${esc(sl ? sl.label : '')}" class="${INPUT_CLS}" placeholder="مثال: الشيفت الأول">`)}
                    ${field('الفترة *', shipSelect('period', [['am', 'صباحاً'], ['pm', 'مساءً']], h < 12 ? 'am' : 'pm'))}
                    ${field('الساعة *', shipSelect('hour', hourOpts, String(h % 12 || 12)))}
                    ${field('الدقايق *', shipSelect('minute', minOpts, String(m)))}

                ${sl ? `<div class="flex justify-start mt-3"><button type="button" onclick="deleteShipSlot('${sl.id}')" class="${BTN_SECONDARY} text-rose-700"><i class="fa-solid fa-trash-can"></i> شيل الموعد</button></div>` : ''}`
            });
        }

        function saveShipSlot(sl, fd) {
            if (!shipCanManage()) { toast('ليس لديك صلاحية لهذا الإجراء', 'error'); return false; }
            const h12 = Number(fd.get('hour')), mm = Number(fd.get('minute'));
            const pm = String(fd.get('period')) === 'pm';
            if (!(h12 >= 1 && h12 <= 12) || !(mm >= 0 && mm <= 59)) { toast('اختار الساعة والدقايق', 'error'); return false; }
            const h24 = (h12 % 12) + (pm ? 12 : 0);
            const time = String(h24).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
            if (shipSlots.some(x => x.time === time && (!sl || x.id !== sl.id))) { toast('فيه موعد بنفس الساعة قبل كده', 'error'); return false; }
            const label = String(fd.get('label') || '').trim().slice(0, 60);
            const id = sl ? sl.id : uid('slot-');
            const order = sl ? sl.order : shipSlots.reduce((mx, x) => Math.max(mx, x.order), 0) + 1;
            const seq = modalSeq;
            fbDb.doc('shippingConfig/slots/' + id).set({ time, order, label }).then(() => {
                log('تعديل مواعيد الشحن', shipFmtTime(time));
                toast('تم حفظ الموعد', 'success');
                if (seq === modalSeq) closeModal();
            }, err => shipSaveFailed(err, 'الموعد'));
            return false;
        }

            const seq = modalSeq;

        // تحريك الموعد فوق أو تحت: بنكتب الترتيب الجديد لكل المواعيد
        function shipMoveSlot(id, dir) {
            if (!shipCanManage()) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const i = shipSlots.findIndex(x => x.id === id), j = i + dir;
            if (i < 0 || j < 0 || j >= shipSlots.length) return;
            const list = [...shipSlots];
            [list[i], list[j]] = [list[j], list[i]];
            const b = fbDb.batch();
            list.forEach((sl, idx) => b.set(fbDb.doc('shippingConfig/slots/' + sl.id), { time: sl.time, order: idx + 1, label: sl.label || '' }));
            b.commit().then(() => {}, err => shipSaveFailed(err, 'ترتيب المواعيد'));
        }

        function computeStats() {
            const s = { companies: appData.companies.length, totalLists: 0, active: 0, activeOnly: 0, expiring: 0, expired: 0, avgEff: 0, expItems: [], perCompany: [] };
            let effSum = 0, effCount = 0;
            appData.companies.forEach(c => c.lists.forEach(l => {
                s.totalLists++;
                const st = listState(l);
                if (!st.active) s.expired++;
                else {
                    s.active++;
                    effSum += effValue(l);
                    effCount++;
                    if (st.expiring) { s.expiring++; s.expItems.push({ c, l, days: st.days }); }
                    else s.activeOnly++;
                }
            }));
            s.avgEff = effCount ? effSum / effCount : 0;
            s.expItems.sort((a, b) => a.days - b.days);
            s.perCompany = appData.companies.map(c => {
                const total = c.lists.length;
                const active = c.lists.filter(l => listState(l).active).length;
                const eff = total ? c.lists.reduce((a, l) => a + effValue(l), 0) / total : 0;
                return { c, total, active, eff };
            }).sort((a, b) => b.total - a.total || a.c.name.localeCompare(b.c.name, 'ar'));
            return s;
        }

            orders: 'طلبيات التوريد والتسليم',
            customers: 'طلبيات العملاء والجدولة والتقارير',
            users: 'المستخدمين والأدوار والمندوبين',
            logs: 'سجل كل الأنشطة',
            shipping: 'جدول العربيات والمواعيد وشاشة حركة النقل',
            settings: 'إعدادات النظام والنسخ الاحتياطي'
        };
        // ============ HOME: greeting card (time-of-day look, sun/moon arc, orders ticker) ============
        const HOME_CFG_KEY = 'factoryHomeSettings';
        const HOME_DEFAULT = { timeColors: true, sunArc: true, ticker: true, alertUndelivered: true, alertIncomplete: true, alertLists: true, alertLogs: true, alertUsers: true, soundOn: false, vibrateOn: false, speed: 6 };
        let homeCfg = { ...HOME_DEFAULT };
        function homeCfgClean(o) {
            const out = {};
            if (!o || typeof o !== 'object') return out;
            for (const k of Object.keys(HOME_DEFAULT)) if (k !== 'speed' && typeof o[k] === 'boolean') out[k] = o[k];
            if ([4, 6, 10].includes(Number(o.speed))) out.speed = Number(o.speed);
            return out;
        }
        function homeCfgLoad() {
            try { homeCfg = { ...HOME_DEFAULT, ...homeCfgClean(JSON.parse(localStorage.getItem(HOME_CFG_KEY) || 'null')) }; }
            catch (e) { homeCfg = { ...HOME_DEFAULT }; }
        }
        function homeSet(key, value) {
            const patch = homeCfgClean({ [key]: key === 'speed' ? Number(value) : value });
            if (!(key in patch)) return;
            homeCfg = { ...homeCfg, ...patch };
            try { localStorage.setItem(HOME_CFG_KEY, JSON.stringify(homeCfg)); } catch (e) { /* storage blocked */ }
            render();
        }

        // 06:00-10:59 morning, 11:00-15:59 day, 16:00-18:59 dusk, 19:00-04:59 night
        function homePeriod(hour) {
            if (hour >= 5 && hour <= 10) return 'morning';
            if (hour >= 11 && hour <= 15) return 'day';
            if (hour >= 16 && hour <= 18) return 'dusk';
            return 'night';
        }
        // the sun rises at 06:00 and sets at 18:00 on an arc; the moon follows the same arc at night
        function homeSkyPos(date = new Date()) {
            const m = date.getHours() * 60 + date.getMinutes();
            const day = m >= 360 && m < 1080;
            const t = Math.min(1, Math.max(0, day ? (m - 360) / 720 : ((m >= 1080 ? m - 1080 : m + 1440 - 1080) / 720)));
            const lift = Math.sin(Math.PI * t);
            // the sun goes from the right edge (sunrise) to the left edge (sunset); the moon starts where the sun set
            return { icon: day ? 'fa-sun' : 'fa-moon', right: day ? 6 + 88 * t : 94 - 88 * t, top: 34 - lift * 26 };
        }
        function placeSun(el, pos) {
            el.style.right = pos.right + '%';
            el.style.top = pos.top + 'px';
            el.innerHTML = `<i class="fa-solid ${pos.icon}"></i>`;
        }

        // every alert this user may see: customer orders, lists, system (deletes), and users (reps)
        const DAY_MS = 864e5;
        function homeAlerts() {
            const out = [];
            const now = Date.now();
            if (canCust('view')) {
                for (const c of appData.custOrders) {
                    const reasons = [];
                    if (homeCfg.alertUndelivered && c.delivery === 'لم تُسلم') reasons.push('لم تُسلم');
                    if (homeCfg.alertIncomplete && c.completeness === 'ناقصة') reasons.push('ناقصة');
                    if (reasons.length) out.push({ id: 'cust:' + c.id, open: c.id, no: Number(c.no) || 0, type: 'طلبيات', prio: 2, route: 'customers', text: `${reasons.join(' · ')} — رقم الفاتورة ${custNoLabel(c)} — ${c.customer || ''}` });
                }
                out.sort((x, y) => (x.prio - y.prio) || (y.no - x.no));
            }
            if (homeCfg.alertLists && canAccessRoute('lists')) {
                for (const co of appData.companies) for (const l of co.lists) {
                    const st = listState(l);
                    if (st.expiring) {
                        const when = st.days <= 0 ? 'النهارده' : `خلال ${st.days} يوم`;
                        out.push({ id: 'list:' + l.id + ':exp', type: 'لستات', prio: st.days !== null && st.days <= 7 ? 1 : 2, route: 'lists', text: `لستة "${l.name}" (${co.name}) تنتهي ${when}` });
                    } else if (st.active && !numOr0(l.discount1) && !numOr0(l.discount2) && !numOr0(l.discount3) && !l.hasPdf) {
                        out.push({ id: 'list:' + l.id + ':empty', type: 'لستات', prio: 3, route: 'lists', text: `لستة "${l.name}" (${co.name}) مفيهاش خصومات ولا ملف` });
                    }
                }
            }
            if (homeCfg.alertLogs && canAccessRoute('logs')) {
                const recent = appData.logs.filter(l => String(l.action || '').startsWith('حذف') && now - Date.parse(l.t) < 10 * 60000);
                if (recent.length >= 5) out.push({ id: 'logs:bulk:' + recent.length, type: 'تنبيه نظام', prio: 1, route: 'logs', text: `${recent.length} عمليات حذف في آخر ١٠ دقايق — آخر واحدة من ${recent[0].user || '—'}` });
            }
            if (homeCfg.alertUsers && canAccessRoute('users')) {
                for (const u of appData.users) {
                    if (!u.repId) continue;
                    const last = Date.parse(u.lastLoginAt || u.createdAt || '');
                    if (last && now - last > 30 * DAY_MS) out.push({ id: 'user:' + u.id + ':idle', type: 'مستخدمين', prio: 2, route: 'users', text: `المندوب ${u.name} مدخلش النظام من ٣٠ يوم` });
                }
                const linked = new Set(appData.users.map(u => u.repId).filter(Boolean));
                for (const r of appData.custReps) if (!linked.has(r.id)) out.push({ id: 'rep:' + r.id + ':nologin', type: 'مستخدمين', prio: 2, route: 'users', text: `المندوب ${r.name} مالوش حساب دخول` });
            }
            return out.sort((x, y) => x.prio - y.prio);
        }
        const homeAlertItems = homeAlerts;   // older name, same list
        let homeTickerIdx = 0, homePaused = false, homeTouchX = null, homeSeen = null, homeAudio = null;
        const HOME_PRIO_CLS = { 1: 'home-ticker-p1', 2: 'home-ticker-p2', 3: 'home-ticker-p3' };
        const homeTickerItemHtml = (it, i, n) => `<button type="button" class="home-ticker-item ${HOME_PRIO_CLS[it.prio] || ''}" onclick="${it.open ? `openCustDetail('${esc(it.open)}')` : `navigate('${esc(it.route)}')`}">
                <span class="home-ticker-count">${i + 1} / ${n}</span><span class="home-ticker-chip">${esc(it.type)}</span><span class="home-ticker-text">${esc(it.text)}</span></button>`;
        function homeCanSeeAlerts() { return canCust('view') || canAccessRoute('lists') || canAccessRoute('logs') || canAccessRoute('users'); }
        function homeTickerHtml() {
            if (!homeCfg.ticker || !homeCanSeeAlerts()) return '';
            const items = homeAlerts();
            const body = items.length
                ? homeTickerItemHtml(items[homeTickerIdx % items.length], homeTickerIdx % items.length, items.length)
                : '<span class="home-ticker-ok"><i class="fa-solid fa-circle-check"></i> كل حاجة تمام، مفيش تنبيهات دلوقتي</span>';
            const nav = items.length > 1 ? `<span class="home-ticker-nav">
                    <button type="button" onclick="homeGo(-1)" aria-label="التنبيه اللي قبله"><i class="fa-solid fa-arrow-right"></i></button>
                    <button type="button" onclick="homeGo(1)" aria-label="التنبيه اللي بعده"><i class="fa-solid fa-arrow-left"></i></button></span>` : '';
            return `<div class="home-ticker" onmouseenter="homePause(true)" onmouseleave="homePause(false)" ontouchstart="homeTouchStart(event)" ontouchend="homeTouchEnd(event)">
                <div class="home-ticker-head"><span class="home-ticker-title"><i class="fa-solid fa-bell"></i> تنبيهات للمتابعة</span>${nav}</div>
                <div id="homeTickerBox" class="home-ticker-box">${body}</div></div>`;
        }
        // swipe left/right or use the arrows; the ticker pauses while the pointer or finger is on it
        function homePause(on) { homePaused = !!on; }
        function homeTouchStart(e) { homePaused = true; homeTouchX = e.touches[0].clientX; }
        function homeTouchEnd(e) {
            const x = e.changedTouches[0].clientX;
            const dx = x - (homeTouchX === null ? x : homeTouchX);
            homeTouchX = null;
            if (Math.abs(dx) > 40) homeGo(dx < 0 ? 1 : -1);
            homePaused = false;
        }
        function homeGo(delta) {
            const items = homeAlerts();
            if (!items.length) return;
            homeTickerIdx = ((homeTickerIdx + delta) % items.length + items.length) % items.length;
            const box = document.getElementById('homeTickerBox');
            if (!box) return;
            const show = () => { box.innerHTML = homeTickerItemHtml(items[homeTickerIdx], homeTickerIdx, items.length); };
            if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { show(); return; }
            box.classList.add('is-out');
            setTimeout(() => { show(); box.classList.remove('is-out'); }, 300);
        }
        // new alerts: a short sound and/or vibration (both off by default; set in الإعدادات)
        function homeBeep() {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                const ctx = homeAudio || (homeAudio = new AC());
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.frequency.value = 880;
                g.gain.setValueAtTime(0.0001, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
                o.connect(g); g.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime + 0.4);
            } catch (e) { /* audio blocked by the browser */ }
        }
        function homeCheckNew() {
            const ids = homeAlerts().map(it => it.id);
            if (homeSeen === null) { homeSeen = new Set(ids); return; }   // first look: nothing is "new" yet
            const fresh = ids.filter(id => !homeSeen.has(id));
            ids.forEach(id => homeSeen.add(id));
            if (!fresh.length) return;
            if (homeCfg.soundOn) homeBeep();
            if (homeCfg.vibrateOn && navigator.vibrate) { try { navigator.vibrate([120, 80, 120]); } catch (e) { /* not supported */ } }
        }

        let homeTimer = null, homeSecs = 0;
        function homeStartTicker() {
            clearInterval(homeTimer);
            homeSecs = 0;
            homeCheckNew();
            homeTimer = setInterval(homeTick, 1000);
        }
        function homeTick() {
            if (!document.querySelector('.home-hero') || parseRoute().name !== 'home') { clearInterval(homeTimer); homeTimer = null; return; }
            homeSecs++;
            if (homeSecs % 60 === 0) { const sun = document.getElementById('homeSun'); if (sun) placeSun(sun, homeSkyPos()); }
            if (homeSecs % 5 === 0) homeCheckNew();
            if (!homePaused && homeSecs % homeCfg.speed === 0) homeGo(1);
        }

        function homeSettingsHtml() {
            const c = homeCfg;
            const chk = (key, label) => `<label class="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" class="w-4 h-4" ${c[key] ? 'checked' : ''} onchange="homeSet('${key}', this.checked)"> ${label}</label>`;
            return `<section class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-sm">

                <div class="grid gap-3">

                    ${chk('ticker', 'شريط التنبيهات')}
                    <p class="text-xs font-bold text-slate-600 mt-2">أنواع التنبيهات</p>
                    ${chk('alertUndelivered', 'طلبيات لم تُسلم')}
                    ${chk('alertIncomplete', 'طلبيات ناقصة')}
                    ${chk('alertLists', 'لستات قربت تنتهي أو مفيهاش خصومات (حسب صلاحيتك)')}
                    ${chk('alertLogs', 'حذف كتير في سجل النشاط (للأدمن)')}
                    ${chk('alertUsers', 'مندوب مدخلش من ٣٠ يوم أو مالوش حساب (للأدمن)')}
                    <p class="text-xs font-bold text-slate-600 mt-2">لما يظهر تنبيه جديد</p>
                    ${chk('soundOn', 'صوت قصير')}
                    ${chk('vibrateOn', 'اهتزاز (على الموبايل)')}
                    <label class="block mt-1"><span class="block text-xs font-bold text-slate-700 mb-1">سرعة تبديل التنبيهات</span>
                        <select onchange="homeSet('speed', this.value)" class="${INPUT_CLS}">${[[4, '4 ثواني'], [6, '6 ثواني'], [10, '10 ثواني']].map(([v, l]) => `<option value="${v}" ${c.speed === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
                </div>
            </section>`;
        }

        function viewHome() {
            const u = currentUser();
            const cards = ROUTE_ORDER.filter(n => n !== 'home' && canAccessRoute(n)).map(n => {
                const r = ROUTES[n];
                return `<a href="#/${n}" class="home-card">
                        <span class="home-card-icon"><i class="fa-solid ${r.icon}"></i></span>
                        <span class="home-card-title">${esc(r.title)}</span>
                        <span class="home-card-desc">${esc(HOME_DESC[n] || '')}</span>
                    </a>`;
            }).join('');
            const period = homeCfg.timeColors ? homePeriod(new Date().getHours()) : '';
            const sky = homeCfg.sunArc ? homeSkyPos() : null;
            const style = `<style>
                .home-hero { position: relative; overflow: hidden; border-radius: 18px; padding: 46px 20px 14px; text-align: center; background: linear-gradient(135deg, rgb(var(--surface)) 0%, rgb(var(--page-bg)) 100%); border: 1px solid rgb(var(--accent)); box-shadow: 0 2px 0 rgb(var(--accent) / .3), 0 10px 22px -14px rgb(var(--brand-900) / .45); --hero-ink: rgb(var(--brand-800)); --hero-sub: #475569; color: var(--hero-ink); }
                .home-hero::before { content: ''; position: absolute; inset: 6px; border: 1px solid rgb(var(--accent) / .35); border-radius: 13px; pointer-events: none; }
                .home-hero[data-period="morning"] { background: linear-gradient(135deg, #fff8e6, #f5dd9a); --hero-ink: #6b4e0a; --hero-sub: #7c5e12; }
                .home-hero[data-period="day"] { background: linear-gradient(135deg, #f0f9ff, #bae6fd); --hero-ink: #0c4a6e; --hero-sub: #075985; }
                .home-hero[data-period="dusk"] { background: linear-gradient(135deg, #ffedd5, #e9d5ff 60%, #c4b5fd); --hero-ink: #4c1d95; --hero-sub: #5b21b6; }
                .home-hero[data-period="night"] { background: linear-gradient(160deg, #0b1220, #1e3a5f); --hero-ink: #f8fafc; --hero-sub: #cbd5e1; border-color: rgb(var(--accent) / .6); }
                .home-hero-body { position: relative; z-index: 1; }
                .home-pill { display: inline-block; padding: 3px 14px; border-radius: 999px; border: 1px solid rgb(var(--accent)); background: rgb(var(--accent) / .18); color: var(--hero-ink); font-size: 12px; font-weight: 700; }
                .home-hero-name { font-family: var(--font-heading); font-weight: 700; font-size: 22px; color: var(--hero-ink); margin: 6px 0 2px; }
                .home-hero-date { font-size: 12px; color: var(--hero-sub); }
                .home-rule { height: 2px; margin: 10px auto 0; width: 50%; background: linear-gradient(90deg, transparent, rgb(var(--accent)), transparent); }
                .home-sun { position: absolute; z-index: 0; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #b45309; background: radial-gradient(circle, #fff7cc 0%, #fbbf24 60%, rgba(251, 191, 36, .3) 100%); box-shadow: 0 0 18px 4px rgba(251, 191, 36, .45); transition: right 1.2s ease, top 1.2s ease; pointer-events: none; }
                .home-hero[data-period="night"] .home-sun { color: #334155; background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1 70%); box-shadow: 0 0 14px 2px rgba(226, 232, 240, .35); }
                .home-stars { position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 30% 70%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 30%, #fff, transparent), radial-gradient(1px 1px at 88% 65%, #fff, transparent), radial-gradient(1px 1px at 52% 85%, #fff, transparent); animation: homeTwinkle 3s ease-in-out infinite alternate; }
                @keyframes homeTwinkle { from { opacity: .35; } to { opacity: 1; } }
                .home-ticker { margin-top: 12px; padding: 8px 12px; border-radius: 12px; background: rgba(255, 255, 255, .55); border: 1px dashed rgb(var(--accent)); }
                .home-hero[data-period="night"] .home-ticker { background: rgba(255, 255, 255, .08); }
                .home-ticker-title { display: block; font-size: 11px; font-weight: 700; color: var(--hero-sub); margin-bottom: 4px; }
                .home-ticker-box { min-height: 28px; transition: opacity .4s ease, transform .4s ease; }

                .home-card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; min-height: 176px; padding: 26px 18px 22px; background: rgb(var(--surface)); border: 1px solid rgb(var(--accent)); border-radius: 16px; box-shadow: 0 1px 0 rgb(var(--accent) / .3), 0 10px 20px -14px rgb(var(--brand-900) / .45); color: rgb(var(--brand-800)); text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }

                .home-card-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; background: linear-gradient(145deg, rgb(var(--brand-600)), rgb(var(--brand-800))); box-shadow: 0 0 0 3px rgb(var(--surface)), 0 0 0 4px rgb(var(--accent)); }
                .home-card-title { font-family: var(--font-heading); font-weight: 700; font-size: 21px; color: rgb(var(--brand-800)); }
                .home-card-desc { font-size: 13px; line-height: 1.7; color: #475569; }

                @media (prefers-reduced-motion: reduce) { .home-sun, .home-ticker-box, .home-stars { transition: none !important; animation: none !important; } }
            </style>`;
            return {
                title: 'الرئيسية',
                after: homeStartTicker,
                html: `${style}<div class="space-y-6">
                    <div class="home-hero" ${period ? `data-period="${period}"` : ''}>
                        ${period === 'night' ? '<div class="home-stars"></div>' : ''}
                        ${sky ? `<span id="homeSun" class="home-sun" style="right:${sky.right}%; top:${sky.top}px"><i class="fa-solid ${sky.icon}"></i></span>` : ''}
                        <div class="home-hero-body">
                            <span class="home-pill">أهلاً بيك</span>
                            <h2 class="home-hero-name">${esc(u ? u.name : '')}</h2>
                            <p class="home-hero-date">${esc(fmtDateAr(todayISO()))}</p>

                    </div>

            };
        }

        function viewDashboard() {
            const s = computeStats();
            const u = currentUser();
            const tot = s.totalLists || 1;
            const p1 = (s.activeOnly / tot) * 100;
            const p2 = (s.expiring / tot) * 100;
            const donut = s.totalLists
                ? `conic-gradient(#10b981 0 ${p1}%, #f59e0b ${p1}% ${p1 + p2}%, #f43f5e ${p1 + p2}% 100%)`
                : 'conic-gradient(#e2e8f0 0 100%)';

            const kpi = (label, value, icon, color, sub = '') => `
                <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
                    <div class="flex items-start justify-between gap-2">
                        <p class="text-xs text-slate-500 leading-snug">${label}</p>
                        <span class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${color}"><i class="fa-solid ${icon}"></i></span>

                    ${sub ? `<p class="text-[11px] text-slate-400 mt-1">${sub}</p>` : ''}
                </div>`;

            const maxTotal = Math.max(1, ...s.perCompany.map(x => x.total));
            const companyBars = s.perCompany.slice(0, 8).map(x => `
                <div class="flex items-center gap-3">
                    ${companyLogoHtml(x.c, 'w-9 h-9 text-xs')}
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between text-xs mb-1 gap-2">
                            <span class="font-semibold truncate">${esc(x.c.name)}</span>

                        </div>
                    </div>
                </div>`).join('') || '<p class="text-sm text-slate-400 text-center py-6">لا توجد شركات بعد</p>';

            const effCompanies = s.perCompany.filter(x => x.total > 0).sort((a, b) => b.eff - a.eff).slice(0, 8);
            const effBars = effCompanies.map(x => `
                <div class="flex items-center gap-3">
                    ${companyLogoHtml(x.c, 'w-9 h-9 text-xs')}
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between text-xs mb-1 gap-2">
                            <span class="font-semibold truncate">${esc(x.c.name)}</span>
                            <span class="font-bold text-emerald-600 whitespace-nowrap">${x.eff.toFixed(2)}%</span>
                        </div>
                        <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full bg-emerald-500 rounded-full" style="width:${Math.min(100, x.eff)}%"></div>
                        </div>
                    </div>
                </div>`).join('') || '<p class="text-sm text-slate-400 text-center py-6">لا توجد بيانات خصومات بعد</p>';

            const expRows = s.expItems.slice(0, 8).map(({ c, l, days }) => `
                <button type="button" onclick="navigate('companies/${esc(c.id)}')" class="w-full flex items-center justify-between gap-3 px-3 py-2.5 rounded-lg hover:bg-amber-50 text-start">
                    <span class="min-w-0 flex items-center gap-3">
                        ${companyLogoHtml(c, 'w-8 h-8 text-xs')}
                        <span class="min-w-0">
                            <span class="block text-sm font-bold truncate">${esc(l.name)}</span>
                            <span class="block text-xs text-slate-500 truncate">${esc(c.name)}</span>
                        </span>
                    </span>
                    <span class="text-xs font-semibold text-amber-700 whitespace-nowrap">${days === 0 ? 'تنتهي اليوم' : `خلال ${days} يوم`}</span>
                </button>`).join('') || '<p class="text-sm text-slate-400 text-center py-6">لا توجد لستات قريبة الانتهاء</p>';

            const logRows = appData.logs.slice(0, 8).map(lg => `
                <li class="flex gap-3 py-2 border-b border-slate-100 last:border-0">
                    <span class="w-2 h-2 rounded-full bg-brand-500 mt-2 shrink-0"></span>
                    <div class="min-w-0">
                        <p class="text-sm"><span class="font-semibold">${esc(lg.user)}</span> · ${esc(lg.action)}${lg.detail ? ` <span class="text-slate-500">(${esc(lg.detail)})</span>` : ''}</p>
                        <p class="text-[11px] text-slate-400">${fmtDateTime(lg.t)}</p>
                    </div>
                </li>`).join('') || '<p class="text-sm text-slate-400 text-center py-6">لا يوجد نشاط بعد</p>';

            const quick = [
                can('companies.manage') ? btn("openCompanyModal()", 'إضافة شركة', 'fa-plus') : '',
                can('lists.manage') ? btn("openListModal({})", 'إضافة لستة', 'fa-file-circle-plus', BTN_SECONDARY) : '',
                can('lists.import') ? btn("el('excelFileInput').click()", 'استيراد إكسيل', 'fa-file-import', BTN_SECONDARY) : '',
                can('lists.export') ? btn("exportAll()", 'تصدير الكل', 'fa-file-excel', BTN_SECONDARY) : '',
                can('users.manage') ? btn("navigate('users')", 'المستخدمون', 'fa-users-gear', BTN_SECONDARY) : ''
            ].filter(Boolean).join('');

            return {
                title: 'لوحة التحكم',
                actions: '',
                html: `
                    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2">
                        <div>
                            <h1 class="text-xl sm:text-2xl font-extrabold">مرحباً، ${esc(u?.name || '')}</h1>
                            <p class="text-sm text-slate-500">نظرة سريعة على الشركات واللستات والخصومات · ${new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
                        </div>
                    </div>

                    ${quick ? `<div class="flex flex-wrap gap-2">${quick}</div>` : ''}

                    <div class="grid gap-4 lg:grid-cols-3">
                        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                            <h3 class="font-bold mb-4">حالة اللستات</h3>
                            <div class="flex items-center gap-5">
                                <div class="w-32 h-32 shrink-0 rounded-full relative" style="background:${donut}">
                                    <div class="absolute inset-4 bg-white rounded-full flex flex-col items-center justify-center">
                                        <span class="text-2xl font-extrabold">${s.totalLists}</span>
                                        <span class="text-[11px] text-slate-500">لستة</span>
                                    </div>
                                </div>
                                <ul class="space-y-2 text-sm min-w-0">
                                    <li class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm bg-emerald-500"></span> نشطة: <b>${s.activeOnly}</b></li>
                                    <li class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm bg-amber-500"></span> قريبة الانتهاء: <b>${s.expiring}</b></li>
                                    <li class="flex items-center gap-2"><span class="w-3 h-3 rounded-sm bg-rose-500"></span> منتهية: <b>${s.expired}</b></li>
                                </ul>
                            </div>
                        </section>

                        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm lg:col-span-2">
                            <h3 class="font-bold mb-4">اللستات لكل شركة</h3>
                            <div class="space-y-3">${companyBars}</div>
                        </section>
                    </div>

                    <div class="grid gap-4 lg:grid-cols-2">
                        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="font-bold">لستات قريبة الانتهاء</h3>
                                <span class="text-xs text-slate-500">${s.expItems.length} لستة</span>
                            </div>
                            <div class="divide-y divide-slate-100">${expRows}</div>
                        </section>

                        <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                            <h3 class="font-bold mb-4">متوسط الخصم الفعلي لكل شركة</h3>
                            <div class="space-y-3">${effBars}</div>
                        </section>
                    </div>

                    ${can('logs.view') ? `
                    <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="font-bold">آخر النشاطات</h3>
                            <a href="#/logs" class="text-xs text-brand-600 font-semibold">عرض الكل</a>
                        </div>
                        <ul>${logRows}</ul>
                    </section>` : ''}
                `
            };
        }

        // ---------- Companies ----------
        function viewCompanyList() {
            return {
                title: 'المصانع / الشركات',
                actions: can('companies.manage') ? btn('openCompanyModal()', 'إضافة شركة', 'fa-plus', BTN_PRIMARY) : '',
                html: `
                    <div class="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 flex flex-col sm:flex-row gap-3 sm:items-center">
                        <div class="relative w-full sm:w-96">
                            <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            <input type="search" id="compSearch" oninput="renderCompanyGrid()" placeholder="ابحث باسم الشركة أو الوكيل..." class="${INPUT_CLS} pr-9">
                        </div>
                        <p id="compCount" class="text-xs text-slate-500 sm:ms-auto"></p>
                    </div>
                    <div id="companyGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4"></div>
                    <div id="companyEmpty" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
                        <i class="fa-solid fa-industry text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500">لا توجد شركات تطابق البحث</p>
                    </div>`,
                after: renderCompanyGrid
            };
        }

        function renderCompanyGrid() {
            const grid = el('companyGrid');
            if (!grid) return;
            const q = (el('compSearch')?.value || '').trim().toLowerCase();
            const list = appData.companies.filter(c => c.name.toLowerCase().includes(q) || c.agent.toLowerCase().includes(q));
            el('compCount').textContent = `${list.length} من ${appData.companies.length} شركة`;
            el('companyEmpty').classList.toggle('hidden', list.length > 0);

            grid.innerHTML = list.map(c => {
                const active = c.lists.filter(l => listState(l).active).length;
                const expiring = c.lists.filter(l => listState(l).expiring).length;
                return `
                <article onclick="navigate('companies/${esc(c.id)}')" role="button" tabindex="0"
                         class="group bg-white rounded-2xl border-2 border-slate-300 p-4 sm:p-5 shadow-lg shadow-slate-300/60 hover:shadow-xl hover:border-brand-500 cursor-pointer transition-all flex flex-col gap-4">
                    <div class="flex items-start gap-3">
                        ${companyLogoHtml(c, 'w-14 h-14 text-lg')}
                        <div class="min-w-0 flex-1">
                            <h3 class="font-bold text-lg leading-snug break-words group-hover:text-brand-600">${esc(c.name)}</h3>
                            <p class="text-xs text-slate-500 truncate"><i class="fa-solid fa-briefcase text-slate-400 me-1"></i>${esc(c.agent) || '-'}</p>
                        </div>
                        <div class="flex shrink-0">
                            ${can('companies.manage') ? `<button type="button" onclick="event.stopPropagation(); openCompanyModal('${esc(c.id)}')" title="تعديل" aria-label="تعديل" class="${BTN_ICON} text-slate-400 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-pen-to-square"></i></button>` : ''}
                            ${can('companies.delete') ? `<button type="button" onclick="event.stopPropagation(); deleteCompany('${esc(c.id)}')" title="حذف" aria-label="حذف" class="${BTN_ICON} text-slate-400 hover:text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                        </div>
                    </div>
                    ${c.notes ? `<p class="text-xs text-slate-500 line-clamp-2 bg-slate-50 p-2 rounded-lg border border-slate-100">${esc(c.notes)}</p>` : ''}
                    <div class="pt-3 border-t border-slate-100 flex flex-wrap items-center gap-2 text-xs">
                        <span class="text-slate-500">اللستات: <b class="text-slate-800">${c.lists.length}</b></span>
                        <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 font-semibold">${active} نشطة</span>
                        ${expiring ? `<span class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 font-semibold">${expiring} تنتهي قريباً</span>` : ''}
                    </div>
                </article>`;
            }).join('');
        }

        function viewCompanyDetail(id) {
            const c = findCompany(id);
            const active = c.lists.filter(l => listState(l).active).length;
            const expiring = c.lists.filter(l => listState(l).expiring).length;
            const companyActions = [
                can('companies.manage') ? btn(`openCompanyModal('${esc(c.id)}')`, 'تعديل البيانات والشعار', 'fa-pen-to-square', BTN_SECONDARY) : '',
                can('companies.delete') ? btn(`deleteCompany('${esc(c.id)}')`, 'حذف', 'fa-trash-can', 'px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-sm font-bold flex items-center gap-2') : ''
            ].join('');
            return {
                title: c.name,
                actions: '',
                html: `
                    <a href="#/companies" class="inline-flex items-center gap-2 text-sm text-slate-600 hover:text-brand-600 font-medium">
                        <i class="fa-solid fa-arrow-right"></i> العودة للشركات
                    </a>

                    <section class="bg-white rounded-2xl border-2 border-slate-300 p-4 sm:p-6 shadow-lg shadow-slate-300/60 flex flex-col md:flex-row gap-4 md:items-start">
                        <div class="flex flex-col items-start gap-3 shrink-0">
                            ${companyActions ? `<div class="flex flex-wrap gap-2">${companyActions}</div>` : ''}
                            ${companyLogoHtml(c, 'w-20 h-20 text-2xl')}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h1 class="text-xl sm:text-2xl font-extrabold break-words">${esc(c.name)}</h1>
                            <p class="text-sm text-slate-500">الوكيل / التاجر: <b class="text-slate-700">${esc(c.agent) || '-'}</b></p>
                            ${c.notes ? `<p class="text-sm text-slate-500 mt-1">${esc(c.notes)}</p>` : ''}
                        </div>
                    </section>

                    <div class="grid grid-cols-3 gap-2 sm:gap-4">
                        <div class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4 text-center"><p class="text-xs text-slate-500">إجمالي اللستات</p><p class="text-xl sm:text-2xl font-extrabold">${c.lists.length}</p></div>
                        <div class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4 text-center"><p class="text-xs text-slate-500">نشطة</p><p class="text-xl sm:text-2xl font-extrabold text-emerald-600">${active}</p></div>
                        <div class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4 text-center"><p class="text-xs text-slate-500">تنتهي قريباً</p><p class="text-xl sm:text-2xl font-extrabold text-amber-600">${expiring}</p></div>
                    </div>

                    ${listToolbar('cd', { companyFilter: false, addAction: can('lists.manage') ? 'openListModal({ companyId: currentCompanyId() })' : null })}
                    ${listContainers('cd', false)}`,
                after: () => renderListsFor('cd')
            };
        }

        function currentCompanyId() {
            const p = parseRoute();
            return p.name === 'companies' ? p.param : null;
        }

        // ---------- Lists (shared by company page and all-lists page) ----------
        function listToolbar(scope, { companyFilter = false, addAction = null, extra = '' } = {}) {
            const companyOpts = companyFilter
                ? `<select id="${scope}Company" onchange="renderListsFor('${scope}')" aria-label="فلترة حسب الشركة" class="text-sm border border-slate-200 rounded-lg px-3 py-2.5 sm:py-2 bg-white">
                       <option value="">كل الشركات</option>
                       ${appData.companies.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
                   </select>` : '';
            return `
                <div class="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:justify-between">
                        <div class="grid grid-cols-2 sm:flex gap-2">
                            <select id="${scope}Status" onchange="renderListsFor('${scope}')" aria-label="الحالة" class="text-sm border border-slate-200 rounded-lg px-3 py-2.5 sm:py-2 bg-white">
                            <option value="ALL">كل الحالات</option>
                            <option value="ACTIVE">النشطة</option>
                            <option value="EXPIRING">تنتهي قريباً</option>
                            <option value="EXPIRED">المنتهية</option>
                        </select>
                            <select id="${scope}Sort" onchange="renderListsFor('${scope}')" aria-label="ترتيب" class="text-sm border border-slate-200 rounded-lg px-3 py-2.5 sm:py-2 bg-white">
                            <option value="default">ترتيب: الأحدث إضافةً</option>
                            <option value="startDesc">الأحدث بداية</option>
                            <option value="startAsc">الأقدم بداية</option>
                            <option value="endAsc">الأقرب انتهاءً</option>
                            <option value="discountDesc">أعلى صافي خصم</option>
                            <option value="nameAsc">الاسم (أ - ي)</option>
                        </select>
                        </div>
                        <div class="flex gap-2 justify-end">
                            ${can('lists.export') ? `<button type="button" onclick="exportScope('${scope}')" class="text-sm bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-file-excel"></i> تصدير</button>` : ''}
                            ${extra}
                            ${addAction ? `<button type="button" onclick="${addAction}" class="${BTN_PRIMARY} whitespace-nowrap"><i class="fa-solid fa-plus"></i> إضافة لستة</button>` : ''}
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <div class="relative flex-1 min-w-0">
                            <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                            <input type="search" id="${scope}Search" oninput="renderListsFor('${scope}')" placeholder="بحث باسم اللستة أو رقمها..." class="${INPUT_CLS} pr-9">
                        </div>
                        ${companyOpts}
                    </div>
                </div>`;
        }

        function listContainers(scope, showCompany) {
            return `
                <div id="${scope}Wrap">
                    <div class="hidden lg:block bg-white rounded-2xl shadow-lg shadow-slate-300/60 border-2 border-slate-300 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-right border-collapse">
                                <thead id="${scope}Thead" class="bg-slate-50 text-slate-600 text-xs font-bold border-b border-slate-200"></thead>
                                <tbody id="${scope}Tbody" class="divide-y-2 divide-slate-200 text-sm"></tbody>
                            </table>
                        </div>
                    </div>
                    <div id="${scope}Cards" class="lg:hidden space-y-3"></div>
                </div>
                <div id="${scope}Empty" class="hidden text-center py-10 px-4 bg-white rounded-2xl border border-dashed border-slate-300">
                    <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
                    <p class="text-slate-500 text-sm">لا توجد لستات مطابقة</p>
                </div>`;
        }

        function viewLists() {
            return {
                title: 'كل اللستات',
                actions: '',
                html: listToolbar('ls', {
                    companyFilter: true,
                    addAction: can('lists.manage') ? 'openListModal({})' : null,
                    extra: can('lists.import') ? `<button type="button" onclick="el('excelFileInput').click()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 px-3 py-2 rounded-lg flex items-center justify-center gap-1.5 whitespace-nowrap"><i class="fa-solid fa-file-import"></i> استيراد</button>` : ''
                }) + listContainers('ls', true),
                after: () => renderListsFor('ls')
            };
        }

        function filteredItems(scope) {
            const isAll = scope === 'ls';
            const pool = isAll ? appData.companies : [findCompany(currentCompanyId())].filter(Boolean);
            let items = [];
            pool.forEach(c => c.lists.forEach(l => items.push({ c, l })));

            const companySel = isAll ? el('lsCompany')?.value : '';
            if (companySel) items = items.filter(x => x.c.id === companySel);

            const q = (el(scope + 'Search')?.value || '').trim().toLowerCase();
            if (q) {
                items = items.filter(({ c, l }) => l.name.toLowerCase().includes(q)
                    || l.id.toLowerCase().includes(q)
                    || (isAll && c.name.toLowerCase().includes(q)));
            }

            const status = el(scope + 'Status')?.value || 'ALL';
            items = items.filter(({ l }) => {
                const s = listState(l);
                return status === 'ALL'
                    || (status === 'ACTIVE' && s.active)
                    || (status === 'EXPIRING' && s.expiring)
                    || (status === 'EXPIRED' && !s.active);
            });

            const sorter = SORTERS[el(scope + 'Sort')?.value || 'default'];
            if (sorter) items.sort((a, b) => sorter(a.l, b.l));
            return items;
        }

        const SORTERS = {
            default: null,
            startDesc: (a, b) => String(b.startDate).localeCompare(String(a.startDate)),
            startAsc: (a, b) => String(a.startDate).localeCompare(String(b.startDate)),
            endAsc: (a, b) => (a.endDate ? 0 : 1) - (b.endDate ? 0 : 1) || String(a.endDate || '').localeCompare(String(b.endDate || '')),
            discountDesc: (a, b) => effValue(b) - effValue(a),
            nameAsc: (a, b) => a.name.localeCompare(b.name, 'ar')
        };

        function listActionsHtml(listId) {
            const id = esc(listId);
            return `<div class="flex items-center justify-center gap-1 shrink-0">
                ${can('lists.manage') ? `<button type="button" onclick="openListModal({ listId: '${id}' })" title="تعديل" aria-label="تعديل" class="${BTN_ICON} text-slate-500 hover:text-brand-600 hover:bg-brand-50"><i class="fa-solid fa-pen-to-square"></i></button>` : ''}
                <button type="button" data-menu-btn onclick="openRowMenu(this, '${id}')" title="المزيد" aria-label="المزيد" class="${BTN_ICON} text-slate-500 hover:text-slate-800 hover:bg-slate-100"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>`;
        }

        function pdfButtonHtml(l, block) {
            if (!l.pdfFile && !l.hasPdf) return `<span class="text-xs text-slate-300">لا يوجد</span>`;
            const label = esc(l.pdfFile || 'ملف مرفق');
            return `<button type="button" onclick="openPdfFile('${esc(l.id)}')" title="${label}"
                        class="text-xs bg-slate-100 hover:bg-brand-50 text-slate-700 hover:text-brand-600 border border-slate-200 px-2.5 py-2 rounded-lg inline-flex items-center gap-1.5 transition-colors min-w-0 max-w-full ${block ? 'w-full' : ''}">
                        <i class="fa-solid fa-file-pdf text-rose-500 shrink-0"></i>
                        <span class="truncate-name ${block ? 'flex-1 text-start' : 'max-w-[130px]'}">${label}</span>
                    </button>`;
        }

        function statusBadgeHtml(state) {
            if (!state.active) return `<span class="inline-flex items-center text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 font-medium whitespace-nowrap">منتهية</span>`;
            if (state.expiring) return `<span class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 font-semibold whitespace-nowrap"><i class="fa-solid fa-hourglass-half text-[10px]"></i> ${statusLabel(state)}</span>`;
            return `<span class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 font-semibold whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> نشطة</span>`;
        }

        function renderListsFor(scope) {
            const items = filteredItems(scope);
            const showCompany = scope === 'ls';

            el(scope + 'Thead').innerHTML = `<tr>
                <th class="py-3.5 px-4">م</th>
                ${showCompany ? '<th class="py-3.5 px-4">الشركة</th>' : ''}
                <th class="py-3.5 px-4">اسم اللستة</th>
                <th class="py-3.5 px-4 text-center">خصم 1</th>
                <th class="py-3.5 px-4 text-center">خصم 2</th>
                <th class="py-3.5 px-4 text-center">خصم 3</th>

        // Signs the rep's own account in on a throw-away app and signs it out again.
        // Resolves to the account's uid when the PIN is right, or '' when it is wrong (or the server is unreachable).
        async function verifyRepPin(email, pin) {
            const app3 = firebase.initializeApp(FIREBASE_CONFIG, 'rep-check-' + Date.now());
            try {
                const a3 = app3.auth();
                if (FIREBASE_EMULATORS) a3.useEmulator(FIREBASE_EMULATORS.auth);
                await a3.setPersistence(firebase.auth.Auth.Persistence.NONE);
                const cred = await a3.signInWithEmailAndPassword(email, pin);
                await a3.signOut();
                return cred.user.uid;
            } catch (err) {
                console.warn('rep pin check failed', err && err.code);
                return '';
            } finally {
                await app3.delete();
            }
        }

        function openRepPinPrompt(repId) {
            const rep = appData.custReps.find(x => x.id === repId);

            if (!rep) return toast('المندوب ده مش موجود', 'error'), false;

            openModal({
                title: `الرقم السري للمندوب: ${rep.name}`,
                submitText: 'فتح الطلبيات',

        async function addRepFromForm(e) {
            e.preventDefault();
            if (!can('users.manage')) return toast('ليس لديك صلاحية لهذا الإجراء', 'error');
            const f = e.target;
            const submitBtn = f.querySelector('button[type=submit]');
            const name = String(f.elements.repName.value || '').trim();
            const login = repLoginNormalize(f.elements.loginName.value);
            const pin = String(f.elements.pin.value || '');
            const pin2 = String(f.elements.pin2.value || '');
            const email = loginAddressFor(login);
            if (!name) return toast('اكتب اسم المندوب', 'error');
            if (name.length > 100) return toast('الاسم طويل قوي', 'error');
            if (appData.custReps.some(r => r.name === name)) return toast('اسم المندوب ده موجود قبل كده', 'error');
            if (!repLoginValid(login)) return toast('اسم الدخول: إنجليزي (حروف وأرقام و . _ - من 3 لـ 30) أو عربي (حروف عربية من 3 لـ 15)', 'error');
            if (appData.users.some(u => u.email === email)) return toast('اسم الدخول ده مستخدم قبل كده', 'error');
            if (!REP_PIN_RE.test(pin)) return toast('الرقم السري لازم يكون 6 أرقام على الأقل', 'error');
            if (pin !== pin2) return toast('الرقمين مش متطابقين', 'error');
            if (submitBtn) submitBtn.disabled = true;
            try {
                const authUid = await createAuthAccount(email, pin);
                const repId = uid('REP-');
                const roleId = uid('rep-');
                const now = new Date().toISOString();
                appData.custReps.push({ id: repId, name });
                appData.roles[roleId] = { id: roleId, name: 'مندوب: ' + name, locked: false, permissions: ['custorders.view', 'home.personal'], repRole: true };
                appData.users.push({ id: authUid, name, email, roleId, active: true, createdAt: now, lastLoginAt: null, repId });
                log('إضافة مندوب', name);
                saveState();
                toast('تم إنشاء المندوب وحسابه', 'success');
                render();
            } catch (err) {
                console.error(err);
                toast(authErrorMessage(err), 'error', null, 5000);
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        }
